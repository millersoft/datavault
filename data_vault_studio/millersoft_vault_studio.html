/* Programmatic model builders, shared by AI import */
function addHubProgrammatic(entity, tableName, pkColumnName, statusSat){
  entity = sqlNamePart(entity);
  const table = findIncludedTableByName(tableName);
  if (!table) return { ok:false, reason:`included table "${tableName}" not found` };
  const names = (Array.isArray(pkColumnName) ? pkColumnName : [pkColumnName]).filter(Boolean);
  const cols = names.map(name=>stagedColumns(table).find(c=>c.name===name));
  if (!names.length || cols.some(c=>!c)) return { ok:false, reason:`business-key column(s) "${names.join(', ')}" not found on "${tableName}"` };
  if (state.hubs.some(h=>h.entity===entity)) return { ok:false, reason:`hub "${entity}" already exists` };
  ensureKeyDerivation(table, entity, names, 'both');
  const hub = { id: uid('hub'), entity, description:'', tableId: table.id, pkColId: cols[0].id, keyColIds: cols.map(c=>c.id), statusSat: statusSat!==false };
  state.hubs.push(hub);
  return { ok:true, hub };
}
function addLinkProgrammatic(entity, tableName, hubColPairs){
  entity = sqlNamePart(entity);
  const table = findIncludedTableByName(tableName);
  if (!table) return { ok:false, reason:`included table "${tableName}" not found` };
  const rows = [];
  for (const p of hubColPairs){
    const hub = state.hubs.find(h=>h.entity===p.hub);
    const names = (Array.isArray(p.columns) && p.columns.length ? p.columns : [p.column]).filter(Boolean);
    const cols = names.map(name=>stagedColumns(table).find(c=>c.name===name));
    if (!hub || !names.length || cols.some(c=>!c)) return { ok:false, reason:`link "${entity}": hub "${p.hub}" or column(s) "${names.join(', ')}" not found` };
    rows.push({ hubId: hub.id, colId: cols[0].id, colIds:cols.map(c=>c.id), role:p.role||'' });
  }
  if (rows.length<2) return { ok:false, reason:`link "${entity}" needs 2+ resolvable hubs` };
  if (state.links.some(l=>l.entity===entity)) return { ok:false, reason:`link "${entity}" already exists` };
  const issue = linkHubRowsIssue(entity, table, rows);
  if (issue) return { ok:false, reason:issue };
  const normalizedRows = normalizeLinkHubRows(table, rows);
  const link = { id: uid('lnk'), entity, description:'', tableId: table.id, hubs: normalizedRows };
  normalizedRows.forEach(r=>{
    const cols = linkHubCols(table, r);
    ensureKeyDerivation(table, linkHubDerivationEntity(link, r), cols.map(c=>c.name), 'hash', r.role || linkHubRoleFromSource(table,r));
  });
  state.links.push(link);
  return { ok:true, link };
}
function stagedSourceColumnsForHub(table, hub){
  if(!table||!hub) return [];
  const hubTable=findTable(hub.tableId);
  const hubKeys=hubKeyCols(hub);
  if(table.id===hub.tableId) return hubKeyColIds(hub).map(id=>findStagedColumn(table,id)).filter(Boolean);
  if(!hubTable||!hubKeys.length) return [];
  const groups=groupForeignKeysForTable(table,effectiveForeignKeys()).filter(g=>g.refTable===hubTable.name);
  const keyNames=hubKeys.map(c=>c.name);
  const exact=groups.find(g=>g.refColumns.length===keyNames.length&&g.refColumns.every((name,i)=>!name||name===keyNames[i]));
  if(exact){
    const cols=exact.columns.map(name=>stagedColumns(table).find(c=>c.name===name));
    if(cols.every(Boolean)) return cols;
  }
  // One-to-one extension tables often repeat the parent key names but omit
  // FK constraints. An explicit satellite-to-Hub choice makes this mapping
  // unambiguous, so use exact matching staged names as a safe fallback.
  const direct=keyNames.map(name=>stagedColumns(table).find(c=>c.name===name));
  return direct.every(Boolean)?direct:[];
}
function stagedSourceColumnForHub(table, hub){
  return stagedSourceColumnsForHub(table, hub)[0] || null;
}
function repairAllSatelliteParentDerivations(){
  let repaired = 0;
  state.hubSats.forEach(s=>{
    const table = findTable(s.tableId);
    const hub = findHub(s.hubId);
    const sourceCols = stagedSourceColumnsForHub(table, hub);
    if (!table || !hub || !sourceCols.length) return;
    const names = sourceCols.map(c=>c.name);
    const exact = tableHasHashForColumns(table,hub.entity,names,hub.entity);
    if (exact) return;
    const before = JSON.stringify(table.derivations);
    ensureKeyDerivation(table, hub.entity, names, 'hash');
    if (before!==JSON.stringify(table.derivations)) repaired++;
  });
  return repaired;
}
function addHubSatProgrammatic(entity, concern, tableName, hubEntity, attributes){
  entity = sqlNamePart(entity); concern = concern ? sqlNamePart(concern) : '';
  const table = findIncludedTableByName(tableName);
  const hub = state.hubs.find(h=>h.entity===hubEntity);
  if (!table || !hub) return { ok:false, reason:`hub satellite "${entity}": table or hub not found` };
  const normalizedConcern = concern || '';
  if (state.hubSats.some(s=>s.hubId===hub.id && (s.concern||'')===normalizedConcern)) {
    return { ok:false, reason:`hub satellite for "${hubEntity}"${normalizedConcern?` (concern "${normalizedConcern}")`:''} already exists` };
  }
  const parentSourceCols = stagedSourceColumnsForHub(table, hub);
  if (!parentSourceCols.length) return { ok:false, reason:`hub satellite "${entity}": no staged source column(s) on "${tableName}" can identify hub "${hubEntity}"` };
  ensureKeyDerivation(table, hub.entity, parentSourceCols.map(c=>c.name), 'hash');
  const attrs = attributes.map(a=>{
    const col = stagedColumns(table).find(c=>c.name===a.column);
    return col ? { colId: col.id, target: targetIdentifierBase(a.target || targetColumnName(col)) } : null;
  }).filter(Boolean);
  if (attrs.length===0) return { ok:false, reason:`hub satellite "${entity}" has no resolvable attributes` };
  const attrDup = findDuplicateHubSatByAttrs(hub.id, table.id, attrs);
  if (attrDup) return { ok:false, reason:`hub satellite for "${hubEntity}" already covers attribute(s) ${satAttrLabel(table.id, attrs)} in "${satName(attrDup.entity, attrDup.concern)}"` };
  state.hubSats.push({ id: uid('sat'), entity, concern: normalizedConcern, description:'', hubId: hub.id, tableId: table.id, attrs });
  return { ok:true };
}
function addLinkSatProgrammatic(entity, concern, tableName, linkEntity, attributes){
  entity = sqlNamePart(entity); concern = concern ? sqlNamePart(concern) : '';
  const table = findIncludedTableByName(tableName);
  const link = state.links.find(l=>l.entity===linkEntity);
  if (!table || !link) return { ok:false, reason:`link satellite "${entity}": table or link not found` };
  const normalizedConcern = concern || '';
  if (state.linkSats.some(s=>s.linkId===link.id && (s.concern||'')===normalizedConcern)) {
    return { ok:false, reason:`link satellite for "${linkEntity}"${normalizedConcern?` (concern "${normalizedConcern}")`:''} already exists` };
  }
  const attrs = attributes.map(a=>{
    const col = stagedColumns(table).find(c=>c.name===a.column);
    return col ? { colId: col.id, target: targetIdentifierBase(a.target || targetColumnName(col)) } : null;
  }).filter(Boolean);
  if (attrs.length===0) return { ok:false, reason:`link satellite "${entity}" has no resolvable attributes` };
  const attrDup = findDuplicateLinkSatByAttrs(link.id, table.id, attrs);
  if (attrDup) return { ok:false, reason:`link satellite for "${linkEntity}" already covers attribute(s) ${satAttrLabel(table.id, attrs)} in "${lsatName(attrDup.entity, attrDup.concern)}"` };
  state.linkSats.push({ id: uid('lsat'), entity, concern: normalizedConcern, description:'', linkId: link.id, tableId: table.id, attrs });
  return { ok:true };
}

function applyAiStaging(json){
  const skipped = [], adjusted = [];
  let derivations=0, incremental=0;
  (json.tableDerivations||[]).forEach(entry=>{
    const table = state.tables.find(t=>t.name===entry.table);
    if (!table){ skipped.push(`table "${entry.table}" not found`); return; }
    repairJunctionDerivations(table);
    repairForeignKeyDerivations(table);
    (entry.derivations||[]).forEach(d=>{
      const normalized = normalizeAiStagingDerivation(table, d);
      if (!normalized.ok){ skipped.push(normalized.reason); return; }
      if (normalized.adjusted) adjusted.push(normalized.adjusted);
      const n = normalized.value;
      const applied = ensureKeyDerivationWithoutCollision(table, n.entity, n.columns||[n.column], n.kind, n.role||'');
      if (!applied.ok){
        skipped.push(`"${entry.table}"."${(n.columns||[n.column]).join(' + ')}" ${applied.reason}`);
        return;
      }
      if (applied.changed) derivations++;
    });
  });
  if (FEATURE_INCREMENTAL) (json.incremental||[]).forEach(entry=>{
    const table = state.tables.find(t=>t.name===entry.table);
    if (!table){ skipped.push(`table "${entry.table}" not found`); return; }
    const col = stagedColumns(table).find(c=>c.name===entry.column);
    if (!col){ skipped.push(`"${entry.table}"."${entry.column}" not found`); return; }
    table.incremental = true; table.incrementCol = col.name;
    incremental++;
  });
  const reconciled=repairAllForeignKeyDerivations();
  if(reconciled) adjusted.push(`Reconciled ${reconciled} duplicate or role-labelled foreign-key derivation(s).`);
  const completed=ensureStagingKeyCoverage();
  derivations += completed.derivations;
  skipped.push(...completed.skipped);
  return { derivations, incremental, skipped, adjusted, autoDerivations:completed.derivations };
}

function vaultEligibleAttributeColumns(table){
  if (!table) return [];
  const fkCols = new Set(effectiveForeignKeys().filter(f=>f.table===table.name).map(f=>f.column));
  const derivCols = new Set((table.derivations||[]).flatMap(d=>derivationSourceColumns(d)));
  return stagedColumns(table).filter(c=> !c.pk && !fkCols.has(c.name) && !derivCols.has(c.name));
}
function satelliteCoveredColumnIds(table){
  const covered = new Set();
  state.hubSats.concat(state.linkSats).filter(s=>s.tableId===table.id).forEach(s=>
    (s.attrs||[]).forEach(a=>{ if (findStagedColumn(table, a.colId)) covered.add(a.colId); })
  );
  return covered;
}
// AI decides grouping and names, but it is not allowed to decide that staged
// data disappears. Any eligible staged column omitted by the proposal is
// deterministically appended to an existing satellite, or placed in a
// default satellite when no group exists yet.
function ensureVaultAttributeCoverage(){
  let attrsAdded = 0, satsCreated = 0;
  const skipped = [];
  includedTables().forEach(table=>{
    const plan = tableRelationshipPlan(table);
    const covered = satelliteCoveredColumnIds(table);
    const missing = vaultEligibleAttributeColumns(table).filter(c=>!covered.has(c.id));
    if (!missing.length) return;
    const attrs = missing.map(c=>({ column:c.name, target:targetColumnName(c) }));
    if (plan.type==='relationship'){
      const link = plan.groups.length ? findLinkForRelationshipGroup(table, plan.groups[0]) : null;
      if (!link){ skipped.push(`"${table.name}": ${missing.length} staged attribute(s) need a link before they can be placed`); return; }
      let sat = state.linkSats.find(x=>x.linkId===link.id && x.tableId===table.id);
      if (!sat){
        const r = addLinkSatProgrammatic(link.entity, '', table.name, link.entity, attrs);
        if (r.ok){ satsCreated++; attrsAdded += missing.length; } else skipped.push(r.reason);
        return;
      }
      missing.forEach(c=>sat.attrs.push({ colId:c.id, target:targetColumnName(c) }));
      attrsAdded += missing.length;
      return;
    }
    let sat = state.hubSats.find(x=>x.tableId===table.id);
    if (sat){
      missing.forEach(c=>sat.attrs.push({ colId:c.id, target:targetColumnName(c) }));
      attrsAdded += missing.length;
      return;
    }
    const hub = state.hubs.find(h=>h.tableId===table.id) || state.hubs.find(h=>h.entity===entityForTable(table.name));
    if (!hub){ skipped.push(`"${table.name}": ${missing.length} staged attribute(s) need a hub before they can be placed`); return; }
    const r = addHubSatProgrammatic(hub.entity, '', table.name, hub.entity, attrs);
    if (r.ok){ satsCreated++; attrsAdded += missing.length; } else skipped.push(r.reason);
  });
  return { attrsAdded, satsCreated, skipped };
}

function applyAiModel(json){
  const skipped = [];
  let hubs=0, links=0, hubSats=0, linkSats=0;
  if (aiScope.hubs !== false) (json.hubs||[]).forEach(h=>{
    const r = addHubProgrammatic(h.entity, h.table, h.pkColumns||h.pkColumn, h.statusSat);
    if (r.ok) hubs++; else skipped.push(r.reason);
  });
  if (aiScope.links !== false) (json.links||[]).forEach(l=>{
    const allowed = aiLinkMatchesRelationshipPlan(l);
    if (!allowed.ok){ skipped.push(allowed.reason); return; }
    const r = addLinkProgrammatic(l.entity, l.table, l.hubs||[]);
    if (r.ok) links++; else skipped.push(r.reason);
  });
  const structure = ensurePlannedVaultStructure();
  skipped.push(...structure.skipped);
  if (aiScope.hubSats !== false) (json.hubSatellites||[]).forEach(s=>{
    const r = addHubSatProgrammatic(s.entity, s.concern, s.table, s.hub, s.attributes||[]);
    if (r.ok) hubSats++; else skipped.push(r.reason);
  });
  if (FEATURE_LINK_SATELLITES && aiScope.linkSats !== false) (json.linkSatellites||[]).forEach(s=>{
    const r = addLinkSatProgrammatic(s.entity, s.concern, s.table, s.link, s.attributes||[]);
    if (r.ok) linkSats++; else skipped.push(r.reason);
  });
  const coverage = ensureVaultAttributeCoverage();
  skipped.push(...coverage.skipped);
  return {
    hubs,
    links,
    hubSats,
    linkSats,
    autoHubs:structure.hubsAdded,
    autoLinks:structure.linksAdded,
    autoCovered:coverage.attrsAdded,
    autoSats:coverage.satsCreated,
    skipped,
  };
}

/* =========================================================================
   SUGGEST FROM KEYS — deterministic Data Vault proposal driven by the
   source's own primary/foreign keys (captured during introspection), with
   a naming-convention fallback ("customer_id" → table "customers") when no
   real FK constraints exist. No API key, no network call, fully repeatable.
   ========================================================================= */
function singularizeTableName(name){
  const n = String(name||'');
  if (/ies$/i.test(n) && n.length>4) return n.replace(/ies$/i,'y');
  if (/(ss|us|is)es$/i.test(n)) return n.replace(/es$/i,'');
  if (/(ches|shes|xes|zes|ses)$/i.test(n)) return n.replace(/es$/i,'');
  if (/s$/i.test(n) && !/ss$/i.test(n)) return n.replace(/s$/i,'');
  return n;
}
function entityForTable(name){
  return singularizeTableName(name).toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
}
// FK list per table — real constraints first, then a name-based fallback
// (<singular>_id or <table>_id matching another included table).
function effectiveForeignKeys(){
  const declared = (state.sourceMeta && state.sourceMeta.foreignKeys) || [];
  const tables = includedTables();
  const byName = {}; tables.forEach(t=>{ byName[t.name] = t; });
  const result = [];
  const seen = new Set();
  // Keep a declared composite FK only when every source component is
  // selected for staging. Treating one remaining component as the full FK
  // would create a different relationship and a different hash.
  const declaredGroups = new Map();
  declared.forEach((fk,index)=>{
    if (!byName[fk.table] || !byName[fk.refTable]) return;
    const groupKey = fk.constraintName
      ? `${fk.table}:${fk.constraintName}`
      : `${fk.table}:column:${fk.column}:${index}`;
    if (!declaredGroups.has(groupKey)) declaredGroups.set(groupKey, []);
    declaredGroups.get(groupKey).push(fk);
  });
  declaredGroups.forEach(rows=>{
    const table = byName[rows[0].table];
    if (!rows.every(fk=>stagedColumns(table).some(c=>c.name===fk.column))) return;
    rows.forEach(fk=>{
      const key = `${fk.table}.${fk.column}`;
      if (seen.has(key)) return;
      seen.add(key);
      result.push({
        table:fk.table,
        column:fk.column,
        refTable:fk.refTable,
        refColumn:fk.refColumn||'',
        constraintName:fk.constraintName||'',
        ordinalPosition:fk.ordinalPosition==null?null:Number(fk.ordinalPosition),
      });
    });
  });
  // Fallback inference by column name, only for columns not already covered.
  tables.forEach(t=>{
    stagedColumns(t).forEach(c=>{
      const key = `${t.name}.${c.name}`;
      if (seen.has(key)) return;
      const m = c.name.match(/^(.*)_id$/i);
      if (!m || !m[1]) return;
      if (c.pk && stagedColumns(t).filter(x=>x.pk).length===1) return;
      const base = m[1].toLowerCase();
      const target = tables.find(x=> x.name!==t.name && (x.name.toLowerCase()===base || entityForTable(x.name)===base));
      if (target){
        const targetPk = stagedColumns(target).find(x=>x.pk);
        seen.add(key);
        result.push({ table:t.name, column:c.name, refTable:target.name, refColumn:targetPk?targetPk.name:'', constraintName:`inferred:${c.name}`, ordinalPosition:1 });
      }
    });
  });
  return result;
}
const AUDIT_COLUMN_RE = /^(created?_(at|on|date|by)|updated?_(at|on|date|by)|modified_(at|on|date|by)|last_update[d]?(_at)?|deleted_(at|on)|row_version|etl_.*)$/i;
const INCREMENTAL_COLUMN_RE = /^(updated?_(at|on)|modified_(at|on)|last_update[d]?(_at)?|last_modified(_at)?|modification_date)$/i;

function foreignKeyRoleName(fk){
  const refEntity = entityForTable(fk && fk.refTable);
  const col = sqlNamePart(fk && fk.column);
  const role = col.endsWith('_id') ? col.slice(0, -3) : col;
  return role || refEntity || 'related';
}
function foreignKeyGroupRole(columns, refEntity){
  const stems=(columns||[]).map(name=>sqlNamePart(name).replace(/_id$/,''));
  if(stems.length<=1) return stems[0]||refEntity||'related';
  const tokenLists=stems.map(s=>s.split('_'));
  const common=[];
  for(let i=0;;i++){
    const token=tokenLists[0][i];
    if(!token||!tokenLists.every(parts=>parts[i]===token)) break;
    common.push(token);
  }
  return common.join('_')||refEntity||stems[0];
}
function groupForeignKeysForTable(table, allForeignKeys){
  const rows=(allForeignKeys||effectiveForeignKeys()).filter(f=>f.table===table.name);
  const groups=new Map();
  rows.forEach((f,index)=>{
    const key=f.constraintName ? `${f.refTable}:${f.constraintName}` : `${f.refTable}:column:${f.column}:${index}`;
    if(!groups.has(key)) groups.set(key,[]);
    groups.get(key).push(f);
  });
  return Array.from(groups.values()).map(rows=>{
    rows.sort((a,b)=>(a.ordinalPosition||0)-(b.ordinalPosition||0));
    const first=rows[0];
    return {
      table:table.name,
      columns:rows.map(r=>r.column),
      refTable:first.refTable,
      refColumns:rows.map(r=>r.refColumn||''),
      refEntity:entityForTable(first.refTable),
      role:foreignKeyGroupRole(rows.map(r=>r.column),entityForTable(first.refTable)),
      constraintName:first.constraintName||'',
      rows,
    };
  });
}

function binaryRelationshipEntity(ownEntity, refEntity, role){
  const own = sqlNamePart(ownEntity);
  const ref = sqlNamePart(refEntity);
  const r = sqlNamePart(role || ref);
  if (own===ref) return `${own}_${r===own?'related':r}`;
  return `${own}_${r!==ref?r:ref}`;
}

// Central relationship planner used by deterministic suggestions, AI
// normalisation and coverage checks. It separates entity tables from tables
// whose key is made entirely from two or more foreign-key roles. Descriptive
// columns on a relationship table are assigned to a Link Satellite.
function tableRelationshipPlan(t, allForeignKeys){
  const allFks = allForeignKeys || effectiveForeignKeys();
  const foreignKeys = allFks.filter(f=>f.table===t.name).map(f=>({
    table:f.table,
    column:f.column,
    refTable:f.refTable,
    refColumn:f.refColumn||'',
    constraintName:f.constraintName||'',
    ordinalPosition:f.ordinalPosition==null?null:f.ordinalPosition,
    refEntity:entityForTable(f.refTable),
    role:foreignKeyRoleName(f),
  }));
  const foreignKeyGroups=groupForeignKeysForTable(t,allFks);
  const allPrimaryKeyColumns=(t.columns||[]).filter(c=>c.pk);
  const selectedPrimaryKeyColumns=allPrimaryKeyColumns.filter(isColumnStaged);
  const primaryKeyComplete=allPrimaryKeyColumns.length===selectedPrimaryKeyColumns.length;
  const primaryKeyColumns=primaryKeyComplete?selectedPrimaryKeyColumns:[];
  const fkColumns=new Set(foreignKeyGroups.flatMap(g=>g.columns));
  const primaryKeyIsRelationship=primaryKeyColumns.length>0&&primaryKeyColumns.every(c=>fkColumns.has(c.name));
  const relationshipTable=foreignKeyGroups.length>=2&&(allPrimaryKeyColumns.length===0||primaryKeyIsRelationship);
  const ownKeyColumns=relationshipTable?[]:primaryKeyColumns.slice();
  const ownKey=ownKeyColumns.length===1?ownKeyColumns[0]:null;
  const type=relationshipTable?'relationship':(foreignKeyGroups.length?'entity_with_relationships':'entity');
  const attributes=stagedColumns(t).filter(c=>!c.pk&&!fkColumns.has(c.name));
  const groups=[];
  const ownEntity=entityForTable(t.name);

  if(relationshipTable){
    groups.push({
      kind:'relationship_table',
      entity:ownEntity||foreignKeyGroups.map(f=>f.refEntity).join('_'),
      pairs:foreignKeyGroups.map(f=>({
        hub:f.refEntity,
        column:f.columns[0],
        columns:f.columns.slice(),
        role:f.role,
        refTable:f.refTable,
        refColumns:f.refColumns.slice(),
      })),
      attributes,
    });
  } else if(ownKeyColumns.length){
    foreignKeyGroups.forEach(f=>groups.push({
      kind:'foreign_key',
      entity:binaryRelationshipEntity(ownEntity,f.refEntity,f.role),
      pairs:[
        {hub:ownEntity,column:ownKeyColumns[0].name,columns:ownKeyColumns.map(c=>c.name),role:ownEntity,refTable:t.name,own:true},
        {hub:f.refEntity,column:f.columns[0],columns:f.columns.slice(),role:f.role,refTable:f.refTable,refColumns:f.refColumns.slice()},
      ],
      attributes:[],
      foreignKey:f,
    }));
  }
  return {table:t,type,ownEntity,ownKey,ownKeyColumns,primaryKeyColumns,allPrimaryKeyColumns,primaryKeyComplete,foreignKeys,foreignKeyGroups,attributes,groups};
}

// Kept as an internal compatibility alias for saved-project repair code and
// older tests. "Relationship table" is the user-facing concept.
function tableIsJunction(t){
  return tableRelationshipPlan(t).type==='relationship';
}

function relationshipPairSignature(pairs){
  return (pairs||[]).flatMap(p=>Array.isArray(p.columns)&&p.columns.length?p.columns:[p.column])
    .map(String).filter(Boolean).sort().join('|');
}
function linkRelationshipSignature(link){
  const table = link && findTable(link.tableId);
  if (!table) return '';
  return relationshipPairSignature((link.hubs||[]).map(h=>{
    const col = findCol(table, h.colId);
    return { columns:linkHubCols(table,h).map(c=>c.name), column:col ? col.name : '' };
  }));
}
function findLinkForRelationshipGroup(table, group){
  const signature = relationshipPairSignature(group && group.pairs);
  return state.links.find(l=>l.tableId===table.id && linkRelationshipSignature(l)===signature) || null;
}
function aiLinkMatchesRelationshipPlan(proposal){
  const table = findIncludedTableByName(proposal && proposal.table);
  if (!table) return { ok:false, reason:`included table "${proposal&&proposal.table}" not found` };
  const plan = tableRelationshipPlan(table);
  const signature = relationshipPairSignature((proposal.hubs||[]).map(h=>({ column:h.column, columns:h.columns })));
  const group = plan.groups.find(g=>relationshipPairSignature(g.pairs)===signature);
  if (!group){
    if (plan.type==='entity_with_relationships'){
      return { ok:false, reason:`link "${proposal.entity}" combines unrelated foreign-key relationships on "${table.name}"; one binary link is required per foreign key` };
    }
    if (plan.type==='relationship'){
      return { ok:false, reason:`link "${proposal.entity}" does not contain the complete set of relationship roles for "${table.name}"` };
    }
    return { ok:false, reason:`table "${table.name}" has no planned foreign-key relationship for link "${proposal.entity}"` };
  }
  return { ok:true, group };
}
function hubForSourceTable(tableName){
  return state.hubs.find(h=>{
    const source = findTable(h.tableId);
    return source && source.name===tableName;
  }) || null;
}
function uniqueLinkEntity(base){
  let candidate = sqlNamePart(base);
  let n = 2;
  while (state.links.some(l=>l.entity===candidate)) candidate = `${sqlNamePart(base)}_${n++}`;
  return candidate;
}
function hubMatchesPlan(hub, plan){
  return !!(hub && plan && hub.tableId===plan.table.id && sameColumnList(hubKeyColIds(hub), plan.ownKeyColumns.map(c=>c.id)));
}
function hubForPlan(plan){ return state.hubs.find(h=>hubMatchesPlan(h,plan)) || null; }

// Deterministically completes the structural part of a proposal. AI may
// suggest names and satellite grouping, but it may not omit an entity Hub,
// collapse self-references, or merge independent FKs into one Link.
function ensurePlannedVaultStructure(){
  const skipped = [];
  let hubsAdded = 0, linksAdded = 0;
  const plans = includedTables().map(t=>tableRelationshipPlan(t));

  plans.forEach(plan=>{
    if (!plan.ownKeyColumns.length || plan.type==='relationship') return;
    if (hubForPlan(plan)) return;
    const r = addHubProgrammatic(plan.ownEntity, plan.table.name, plan.ownKeyColumns.map(c=>c.name), true);
    if (r.ok) hubsAdded++; else if (!/already exists/.test(r.reason)) skipped.push(r.reason);
  });

  plans.forEach(plan=>{
    plan.groups.forEach(group=>{
      if (findLinkForRelationshipGroup(plan.table, group)) return;
      const pairs = [];
      for (const pair of group.pairs){
        const hub = pair.own ? hubForPlan(plan) : hubForSourceTable(pair.refTable);
        if (!hub){
          skipped.push(`"${plan.table.name}": no Hub is available for relationship role "${pair.role}"`);
          return;
        }
        pairs.push({ hub:hub.entity, column:pair.column, columns:pair.columns||[pair.column], role:pair.role });
      }
      const baseEntity = group.kind==='relationship_table'
        ? group.entity
        : binaryRelationshipEntity(pairs[0].hub, pairs[1].hub, group.foreignKey && group.foreignKey.role);
      const r = addLinkProgrammatic(uniqueLinkEntity(baseEntity), plan.table.name, pairs);
      if (r.ok) linksAdded++; else skipped.push(r.reason);
    });
  });
  return { hubsAdded, linksAdded, skipped };
}

function repairJunctionDerivations(table){
  const plan=table&&tableRelationshipPlan(table);
  if(!table||!plan||plan.type!=='relationship') return 0;
  const expected=plan.groups[0].pairs.map(p=>({entity:p.hub,role:p.role||p.hub,columns:(p.columns||[p.column]).filter(Boolean)}));
  const repaired=[];
  let changes=0;
  (table.derivations||[]).forEach(d=>{
    const names=derivationSourceColumns(d);
    let match=expected.find(x=>sameColumnList(x.columns,names));
    if(!match&&names.length===1) match=expected.find(x=>x.columns.includes(names[0]));
    if(match){
      if(match.columns.length>1&&names.length===1){ changes++; return; }
      const existing=repaired.find(x=>x.entity===match.entity&&(x.role||x.entity)===match.role&&sameColumnList(derivationSourceColumns(x),match.columns));
      if(!existing) repaired.push(Object.assign({},d,{entity:match.entity,role:match.role,column:match.columns[0],columns:match.columns.length>1?match.columns.slice():undefined,kind:'hash'}));
      if(d.entity!==match.entity||(d.role||'')!==match.role||d.kind!=='hash'||!sameColumnList(names,match.columns)||existing) changes++;
      return;
    }
    if(d.kind==='bk'){changes++;return;}
    if(d.kind==='both'){repaired.push(Object.assign({},d,{kind:'hash'}));changes++;return;}
    repaired.push(d);
  });
  // Ensure every relationship role has exactly one hash derivation.
  expected.forEach(x=>{
    if(!repaired.some(d=>d.entity===x.entity&&(d.role||d.entity)===x.role&&sameColumnList(derivationSourceColumns(d),x.columns)&&(d.kind==='hash'||d.kind==='both'))){
      repaired.push({id:uid('drv'),entity:x.entity,role:x.role,column:x.columns[0],columns:x.columns.length>1?x.columns.slice():undefined,kind:'hash'});
      changes++;
    }
  });
  if(changes) table.derivations=repaired;
  return changes;
}
function repairAllJunctionDerivations(){
  return (state.tables||[]).reduce((sum,t)=>sum+repairJunctionDerivations(t), 0);
}

function repairForeignKeyDerivations(table){
  if(!table||!(table.derivations||[]).length) return 0;
  const repaired=[];
  let changes=0;
  (table.derivations||[]).forEach(d=>{
    const normalized=normaliseDerivationRecord(table,d);
    const spec=derivationCanonicalSpec(table,normalized);
    const sameIdentity=repaired.find(x=>sameDerivationIdentity(table,x,spec));
    // Two rows over the same source key that emit the same physical hash are
    // always duplicates, even when the source import did not include FK
    // constraints. Keep distinct aliases (valid alternate relationship roles),
    // but merge exact physical duplicates immediately.
    const samePhysical=!sameIdentity&&(spec.kind==='hash'||spec.kind==='both')
      ? repaired.find(x=>{
          const current=derivationCanonicalSpec(table,x);
          return sameColumnList(current.columns,spec.columns)&&
            (current.kind==='hash'||current.kind==='both')&&
            current.targetAlias===spec.targetAlias;
        })
      : null;
    const existing=sameIdentity||samePhysical;
    if(existing){
      const merged=mergeDerivationKind(existing.kind,normalized.kind);
      const existingScore=derivationPreferenceScore(table,existing);
      const normalizedScore=derivationPreferenceScore(table,normalized);
      if(normalizedScore>existingScore){
        existing.entity=normalized.entity;
        existing.role=normalized.role;
        existing.column=normalized.column;
        if(normalized.columns&&normalized.columns.length>1) existing.columns=normalized.columns.slice();
        else delete existing.columns;
      }
      existing.kind=merged;
      changes++;
      return;
    }
    if(JSON.stringify([d.entity,d.role||'',derivationSourceColumns(d),d.kind])!==JSON.stringify([normalized.entity,normalized.role||'',derivationSourceColumns(normalized),normalized.kind])) changes++;
    repaired.push(normalized);
  });
  if(changes) table.derivations=repaired;
  return changes;
}
function repairAllForeignKeyDerivations(){
  return (state.tables||[]).reduce((sum,t)=>sum+repairForeignKeyDerivations(t),0);
}

function normalizeAiStagingDerivation(table, proposal){
  const names=(Array.isArray(proposal.columns)&&proposal.columns.length?proposal.columns:[proposal.column]).filter(Boolean);
  const cols=names.map(name=>stagedColumns(table).find(c=>c.name===name));
  if(!names.length||cols.some(c=>!c)) return {ok:false,reason:`"${table.name}": source key column(s) "${names.join(', ')}" not found`};
  const requestedKind=['hash','bk','both'].includes(proposal.kind)?proposal.kind:'hash';
  const proposedEntity=(proposal.targetEntity||proposal.entity) ? sqlNamePart(proposal.targetEntity||proposal.entity) : '';
  const proposedRole=proposal.role ? sqlNamePart(proposal.role) : '';
  const plan=tableRelationshipPlan(table);
  const relationshipPair=plan.groups.flatMap(g=>g.pairs).find(p=>sameColumnList((p.columns||[p.column]),names));
  const fk=plan.foreignKeyGroups.find(g=>sameColumnList(g.columns,names));

  if(plan.type==='relationship'){
    if(!relationshipPair) return {ok:false,reason:`"${table.name}": "${names.join(' + ')}" is not a complete relationship key`};
    const normalized={columns:names,column:names[0],entity:relationshipPair.hub,role:relationshipPair.role,kind:'hash'};
    const changed=requestedKind!=='hash'||proposedEntity!==normalized.entity||proposedRole!==normalized.role;
    const adjusted=changed?`"${table.name}"."${names.join(' + ')}" used the source relationship target ${normalized.entity} with role ${normalized.role}`:'';
    return {ok:true,value:normalized,adjusted};
  }

  const ownNames=plan.ownKeyColumns.map(c=>c.name);
  if(sameColumnList(names,ownNames)){
    const normalized={columns:names,column:names[0],entity:plan.ownEntity,role:plan.ownEntity,kind:requestedKind==='hash'?'hash':'both'};
    const changes=[];
    if(requestedKind==='bk') changes.push('business keys also require their hash, so kind was changed to both');
    if(proposedEntity&&proposedEntity!==normalized.entity) changes.push(`target entity was changed to ${normalized.entity}`);
    if(proposedRole&&proposedRole!==normalized.role) changes.push(`role was changed to ${normalized.role}`);
    return {ok:true,value:normalized,adjusted:changes.length?`"${table.name}"."${names.join(' + ')}": ${changes.join('; ')}`:''};
  }
  if(ownNames.length>1&&names.some(name=>ownNames.includes(name))){
    return {ok:false,reason:`"${table.name}": composite business key columns must be supplied together in source order (${ownNames.join(' + ')})`};
  }

  if(fk){
    const normalized={columns:names,column:names[0],entity:fk.refEntity,role:fk.role,kind:'hash'};
    const changes=[];
    if(requestedKind!=='hash') changes.push('foreign keys are hash-only');
    if(proposedEntity&&proposedEntity!==fk.refEntity) changes.push(`target Hub "${proposedEntity}" was replaced by the source relationship target "${fk.refEntity}"`);
    if(proposedRole&&proposedRole!==fk.role) changes.push(`role "${proposedRole}" was replaced by the source role "${fk.role}"`);
    return {ok:true,value:normalized,adjusted:changes.length?`"${table.name}"."${names.join(' + ')}": ${changes.join('; ')}`:''};
  }

  if(names.length===1){
    const entity=proposedEntity||plan.ownEntity;
    const role=proposedRole||entity;
    return {ok:true,value:{columns:names,column:names[0],entity,role,kind:requestedKind},adjusted:''};
  }
  return {ok:false,reason:`"${table.name}": "${names.join(' + ')}" is not a recognised complete business or foreign key`};
}

function ensureStagingKeyCoverage(){
  let derivations=0;
  const skipped=[];
  includedTables().map(t=>tableRelationshipPlan(t)).forEach(plan=>{
    repairForeignKeyDerivations(plan.table);
    if(plan.type!=='relationship'&&plan.ownKeyColumns.length){
      const ownNames=plan.ownKeyColumns.map(c=>c.name);
      if(ownNames.length>1){
        const beforeCount=plan.table.derivations.length;
        plan.table.derivations=plan.table.derivations.filter(d=>{
          const names=derivationSourceColumns(d);
          const partial=names.some(name=>ownNames.includes(name))&&!sameColumnList(names,ownNames);
          return !(partial&&(d.kind==='bk'||d.kind==='both')&&d.entity===plan.ownEntity);
        });
        derivations += beforeCount-plan.table.derivations.length;
      }
      const before=JSON.stringify(plan.table.derivations.map(d=>[d.entity,derivationSourceColumns(d),d.kind]));
      ensureKeyDerivation(plan.table,plan.ownEntity,ownNames,'both');
      if(before!==JSON.stringify(plan.table.derivations.map(d=>[d.entity,derivationSourceColumns(d),d.kind]))) derivations++;
    }
    plan.groups.forEach(group=>group.pairs.forEach(pair=>{
      if(pair.own) return;
      const names=(pair.columns||[pair.column]).filter(Boolean);
      const before=JSON.stringify(plan.table.derivations.map(d=>[d.entity,derivationSourceColumns(d),d.kind]));
      ensureKeyDerivation(plan.table,pair.hub,names,'hash',pair.role||pair.hub);
      if(before!==JSON.stringify(plan.table.derivations.map(d=>[d.entity,derivationSourceColumns(d),d.kind]))) derivations++;
    }));
  });
  return {derivations,skipped};
}

// Staging-page suggestion is deliberately scoped to staging only. It adds
// key derivations (and, when the feature is enabled, incremental columns)
// but never creates or changes hubs, links, or satellites.
function suggestStagingFromKeys(){
  const completed=ensureStagingKeyCoverage();
  let incremental=0;
  if(FEATURE_INCREMENTAL) includedTables().forEach(t=>{
    if(t.incremental) return;
    const col=stagedColumns(t).find(c=>INCREMENTAL_COLUMN_RE.test(c.name));
    if(col){t.incremental=true;t.incrementCol=col.name;incremental++;}
  });
  return {derivations:completed.derivations,incremental,skipped:completed.skipped,usedDeclaredFks:((state.sourceMeta&&state.sourceMeta.foreignKeys)||[]).length>0};
}

// Builds the proposal AND applies it via the same programmatic builders the
// AI path uses (so duplicate/consistency guards all apply). Returns counts +
// skipped reasons. Call pushUndo() before this if you want it reversible.
function suggestModelFromKeys(){
  pruneDownstreamModel({ dropExcluded:true });
  const skipped = [];
  let hubs=0, links=0, hubSats=0, linkSats=0, incremental=0, satAttrsAdded=0;
  const tables = includedTables();
  const fks = effectiveForeignKeys();
  const plans = tables.map(t=>tableRelationshipPlan(t, fks));

  // --- Hubs --- relationship tables do not become Hubs. Ordinary entity
  // tables keep their own Hub even when they also carry several independent
  // foreign-key relationships.
  plans.forEach(plan=>{
    if (plan.type==='relationship'||!plan.ownKeyColumns.length) return;
    const r=addHubProgrammatic(plan.ownEntity,plan.table.name,plan.ownKeyColumns.map(c=>c.name),true);
    if(r.ok) hubs++; else if(!/already exists/.test(r.reason)) skipped.push(r.reason);
  });

  // --- Links --- each planned group is independent. A relationship table
  // produces one multi-role Link; an entity table produces one binary Link
  // per FK. Self-references retain their source-column roles.
  plans.forEach(plan=>{
    plan.groups.forEach(group=>{
      if (findLinkForRelationshipGroup(plan.table, group)) return;
      const pairs = [];
      for (const pair of group.pairs){
        const hub = pair.own ? hubForPlan(plan) : hubForSourceTable(pair.refTable);
        if (!hub){ skipped.push(`"${plan.table.name}": no Hub is available for relationship role "${pair.role}"`); return; }
        pairs.push({ hub:hub.entity, column:pair.column, columns:pair.columns||[pair.column], role:pair.role });
      }
      const baseEntity = group.kind==='relationship_table'
        ? group.entity
        : binaryRelationshipEntity(pairs[0].hub, pairs[1].hub, group.foreignKey && group.foreignKey.role);
      const r = addLinkProgrammatic(uniqueLinkEntity(baseEntity), plan.table.name, pairs);
      if (r.ok) links++; else skipped.push(r.reason);
    });
  });

  // --- Satellites --- every selected non-key/non-FK column is carried. On a
  // relationship table it belongs to a Link Satellite; on an entity table it
  // belongs to the table's Hub Satellite. Existing default satellites are
  // extended when schema drift adds columns.
  const extendSatWithNewAttrs = (sat, t, attrs) => {
    const covered = new Set();
    state.hubSats.concat(state.linkSats)
      .filter(s=> s.tableId===t.id && ((sat.hubId && s.hubId===sat.hubId) || (sat.linkId && s.linkId===sat.linkId)))
      .forEach(s=> s.attrs.forEach(a=> covered.add(a.colId)));
    let added = 0;
    attrs.forEach(a=>{
      const col = stagedColumns(t).find(c=>c.name===a.column);
      if (!col || covered.has(col.id)) return;
      sat.attrs.push({ colId: col.id, target:targetIdentifierBase(a.target || targetColumnName(col)) });
      covered.add(col.id);
      added++;
    });
    return added;
  };

  plans.forEach(plan=>{
    const attrs = plan.attributes.map(c=>({ column:c.name, target:targetColumnName(c) }));
    if (!attrs.length) return;
    if (plan.type==='relationship'){
      if (!FEATURE_LINK_SATELLITES || !plan.groups.length) return;
      const link = findLinkForRelationshipGroup(plan.table, plan.groups[0]);
      if (!link){ skipped.push(`"${plan.table.name}": relationship attributes could not be placed because its Link is missing`); return; }
      const existing = state.linkSats.find(s=>s.linkId===link.id && s.tableId===plan.table.id && (s.concern||'')==='');
      if (existing){ satAttrsAdded += extendSatWithNewAttrs(existing, plan.table, attrs); return; }
      const r = addLinkSatProgrammatic(link.entity, '', plan.table.name, link.entity, attrs);
      if (r.ok) linkSats++; else skipped.push(r.reason);
      return;
    }
    const hub = hubForPlan(plan);
    if (!hub) return;
    const existing = state.hubSats.find(s=>s.hubId===hub.id && s.tableId===plan.table.id && (s.concern||'')==='');
    if (existing){ satAttrsAdded += extendSatWithNewAttrs(existing, plan.table, attrs); return; }
    const r = addHubSatProgrammatic(hub.entity, '', plan.table.name, hub.entity, attrs);
    if (r.ok) hubSats++; else skipped.push(r.reason);
  });

  if (FEATURE_INCREMENTAL) tables.forEach(t=>{
    if (t.incremental) return;
    const col = stagedColumns(t).find(c=>INCREMENTAL_COLUMN_RE.test(c.name));
    if (col){ t.incremental = true; t.incrementCol = col.name; incremental++; }
  });

  return { hubs, links, hubSats, linkSats, incremental, satAttrsAdded, skipped, usedDeclaredFks: ((state.sourceMeta&&state.sourceMeta.foreignKeys)||[]).length>0 };
}

function runSuggestFromKeys(targetTab){
  if (includedTables().length===0){ toast('Include at least one table first.','err'); return; }
  const stagingOnly = targetTab === 'staging';
  pushUndo(stagingOnly ? 'detect staging hash keys' : 'detect vault tables');
  const summary = stagingOnly ? suggestStagingFromKeys() : suggestModelFromKeys();
  renderAll(); setActiveTabViewOnly(targetTab || 'vault');
  const src = summary.usedDeclaredFks ? 'declared foreign keys' : 'column-name conventions (no FK constraints found — run Detect Source Tables again to pick up declared FKs)';
  if (stagingOnly){
    toastUndo(`Detected hash keys from ${src}: ${summary.derivations} key derivation(s)${FEATURE_INCREMENTAL?`, ${summary.incremental} incremental column(s)`:''}. Vault hubs, links, and satellites were not changed.`);
  } else {
    const extended = summary.satAttrsAdded ? `, ${summary.satAttrsAdded} new attribute(s) added to existing satellites` : '';
    toastUndo(`Detected Vault tables from ${src}: ${summary.hubs} hub(s), ${summary.links} link(s), ${summary.hubSats + summary.linkSats} satellite(s)${FEATURE_INCREMENTAL?`, ${summary.incremental} incremental column(s)`:''}${extended}.`);
  }
  if (summary.skipped.length) console.info('Suggest-from-keys skipped:', summary.skipped);
}

/* =========================================================================
   MODEL COVERAGE — which parts of the Tables step haven't reached the
   Staging derivations or the Vault model yet. Drives the "unmodelled
   items" banners on the Staging and Vault steps, so a drift merge (new
   tables/columns) is visibly flagged until it's been modelled.
   ========================================================================= */
function stagingTablesMissingHashColumns(){
  return includedTables().filter(t=> !buildStagingColumns(t).some(c=>c.hashed));
}
function stagingHashColumnsReady(){
  return includedTables().length>0 && stagingTablesMissingHashColumns().length===0;
}
function stagingHashRequirementMessage(){
  const tables = includedTables();
  if (!tables.length) return 'Include at least one source table before continuing.';
  const missing = stagingTablesMissingHashColumns();
  if (!missing.length) return '';
  const names = missing.slice(0, 4).map(t=>t.name);
  const remainder = missing.length - names.length;
  const tableList = names.join(', ') + (remainder>0 ? ` and ${remainder} more` : '');
  return `Create hash columns for ${tableList} using Detect Hash Keys or AI Assist before continuing.`;
}
function stagingUncoveredTables(){
  return stagingTablesMissingHashColumns();
}
function vaultUncoveredTables(){
  const used = new Set();
  state.hubs.forEach(h=>used.add(h.tableId));
  state.links.forEach(l=>used.add(l.tableId));
  state.hubSats.concat(state.linkSats).forEach(s=>used.add(s.tableId));
  return includedTables().filter(t=> stagedColumns(t).length>0 && !used.has(t.id));
}
// Columns on modelled tables that no derivation and no satellite carries —
// exactly what a drift merge leaves behind until the model catches up.
function unmappedAttributeColumns(){
  const out = [];
  includedTables().forEach(t=>{
    const covered = satelliteCoveredColumnIds(t);
    vaultEligibleAttributeColumns(t).forEach(c=>{
      if (!covered.has(c.id)) out.push({ table:t.name, column:c.name });
    });
  });
  return out;
}
// On-demand gap check for the Staging and Vault steps — opens a modal
// listing what hasn't been modelled yet, with apply actions.
//
// Scope matters here, and the two tabs check DIFFERENT things:
// - Staging: tables with no key derivations. Column inclusion itself is an
//   explicit user choice in the selected staging columns; excluded columns
//   are intentionally absent from the DDL, override, AI payload and Vault.
//   What the staging key check still needs is hash/business-key derivations.
// - Vault: tables absent from the model, plus columns that no satellite
//   maps. Such columns still appear in the staging DDL/override — staging
//   carries everything — but their DATA never lands in any vault table.
function openCoverageModal(tab){
  const uncovered = tab==='staging' ? stagingUncoveredTables() : vaultUncoveredTables();
  const unmapped = tab==='vault' ? unmappedAttributeColumns() : [];
  if (!uncovered.length && !unmapped.length){
    toast(tab==='staging'
      ? 'Integrity check passed — every included table has key derivations.'
      : 'Integrity check passed — every included table is modelled and every column is carried by a satellite.', 'ok');
    return;
  }
  const wrap = document.createElement('div');
  wrap.id = 'coverage-modal-backdrop';
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal-card" style="max-height:85vh;overflow:auto;">
      <div class="flex-between" style="margin-bottom:4px;">
        <h3 style="font-family:var(--font-display);font-size:15px;margin:0;">Integrity Check — ${tab==='staging' ? 'staging' : 'vault model'}</h3>
        <button class="btn small ghost" id="coverage-close">&times;</button>
      </div>
      <p class="section-desc" style="margin-bottom:14px;">Not modelled yet — won't reach the DDL or spreadsheet until they are.</p>

      ${uncovered.length ? `
      <div class="panel" style="margin-bottom:12px;">
        <div class="panel-head" style="margin:-18px -20px 10px;"><h3>${tab==='staging' ? 'Tables with no key derivations' : 'Tables not in the vault model'} <span class="badge-count">&nbsp;·&nbsp;${uncovered.length}</span></h3></div>
        <p class="hint mb0">${uncovered.map(t=>`<span class="mono">${escapeHtml(t.name)}</span> (${t.columns.length} cols)`).join(' · ')}</p>
        ${tab==='staging' ? `<p class="hint mb0" style="margin-top:6px;">Staged, but without key derivations the load has no keys to build.</p>` : ''}
      </div>` : ''}
      ${unmapped.length ? `
      <div class="panel" style="margin-bottom:12px;">
        <div class="panel-head" style="margin:-18px -20px 10px;"><h3>Columns whose data never reaches the vault <span class="badge-count">&nbsp;·&nbsp;${unmapped.length}</span></h3></div>
        <p class="hint mb0">${unmapped.slice(0,40).map(u=>`<span class="mono">${escapeHtml(u.table)}.${escapeHtml(u.column)}</span>`).join(' · ')}${unmapped.length>40?' …':''}</p>
        <p class="hint mb0" style="margin-top:6px;">Included in staging, but not mapped to a satellite. To leave one out intentionally, untick it on the Staging page; otherwise add it to a satellite before export.</p>
      </div>` : ''}

      <div class="flex-between mt">
        <button class="btn ghost" id="coverage-cancel">Close</button>
        <div style="display:flex;gap:8px;">
          <button class="btn" id="coverage-ai">AI Assist</button>
          <button class="btn primary" id="coverage-suggest">${tab==='staging' ? 'Detect Hash Keys' : 'Detect Vault Tables'} — apply now</button>
        </div>
      </div>
      <p class="hint mt mb0">${tab==='staging' ? '"Detect Hash Keys" derives staging keys' : '"Detect Vault Tables" models Vault objects'} from the source's keys, with Undo. AI Assist uses an LLM instead.</p>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=>{ const m = document.getElementById('coverage-modal-backdrop'); if (m) m.remove(); };
  document.getElementById('coverage-close').addEventListener('click', close);
  document.getElementById('coverage-cancel').addEventListener('click', close);
  wrap.addEventListener('click', e=>{ if (e.target===wrap) close(); });
  document.getElementById('coverage-suggest').addEventListener('click', ()=>{ close(); runSuggestFromKeys(tab); });
  document.getElementById('coverage-ai').addEventListener('click', ()=>{ close(); openAiModal(tab==='staging' ? 'staging' : 'vault'); });
}
</script>

<script>
/* =========================================================================
   GENERATORS — staging DDL, data vault DDL, pdi_meta, xlsx workbook
   ========================================================================= */
function mapColumnType(col){
  const raw = String(col && col.type || '').trim();
  const lower = raw.toLowerCase().replace(/\s+/g,' ');
  if (isBooleanType(raw)) return 'VARCHAR(5)';
  // Preserve large/unbounded text rather than narrowing values such as
  // SQL Server XML, NTEXT, or VARCHAR/NVARCHAR(MAX).
  if (isJsonLikeType(raw) || isUnboundedTextType(raw)) return 'TEXT';
  if (state.vault.dialect === 'sqlserver'){
    let m = lower.match(/^n?varchar\((\d+)\)$/);
    if (m) return `VARCHAR(${m[1]})`;
    m = lower.match(/^n?char\((\d+)\)$/);
    if (m) return `CHAR(${m[1]})`;
    if (/^(?:binary|varbinary)(?:\(.*\))?$/.test(lower) || ['image','timestamp','rowversion'].includes(lower)) return 'BYTEA';
    if (lower === 'uniqueidentifier') return 'UUID';
    if (['datetime','datetime2','smalldatetime'].includes(lower)) return 'TIMESTAMP';
    if (lower === 'datetimeoffset') return 'TIMESTAMPTZ';
  }
  return raw.toUpperCase();
}

function satelliteAttributeType(sat, attr){
  const table = sat && findTable(sat.tableId);
  const sourceCol = table && findStagedColumn(table, attr && attr.colId);
  if (!sourceCol) return 'VARCHAR(256)';
  const mapped = mapColumnType(sourceCol);
  const upper = String(mapped||'').trim().toUpperCase();
  // Keep the historical 256-character default for ordinary descriptive
  // values, but never narrow source columns that can legitimately exceed it.
  if (upper === 'TEXT' || upper === 'BYTEA') return upper;
  const sized = upper.match(/^(?:VAR)?CHAR\((\d+)\)$/);
  if (sized && Number(sized[1]) > 256) return upper;
  return 'VARCHAR(256)';
}

function normalizedColumnProfile(col){
  const p = col && col.profile;
  if (!p || typeof p!=='object') return null;
  return {
    totalRows:Number(p.totalRows||0),
    distinctValues:p.distinctValues==null ? null : Number(p.distinctValues||0),
    nullValues:Number(p.nullValues||0),
    blankValues:Number(p.blankValues||0),
    profiledAt:p.profiledAt||'',
    source:p.source||'manual',
  };
}

function columnProfileIsUserRequested(col){
  const p = normalizedColumnProfile(col);
  return !!p && p.source!=='infer-schema';
}

function stagingColumnUsesNotNull(col){
  if (!col) return false;
  // Match the declared source constraint by default. Primary keys are
  // inherently non-null even when imported metadata is internally
  // inconsistent. Profiling is an exception layer: if live data contains a
  // SQL NULL or a blank/whitespace value that the engine can normalise to
  // NULL, make the staging landing column nullable so the row can load.
  const sourceRequiresNotNull = col.pk===true || col.nullable===false;
  if (!sourceRequiresNotNull) return false;
  const profile = normalizedColumnProfile(col);
  return !profile || (profile.nullValues===0 && profile.blankValues===0);
}

function columnProfileSummary(col){
  const p = normalizedColumnProfile(col);
  if (!p) return '';
  const hasDistinct = p.distinctValues!=null;
  const uniq = hasDistinct && p.totalRows>0 ? Math.round((p.distinctValues/p.totalRows)*100) : 0;
  const distinctText = hasDistinct
    ? `${p.distinctValues.toLocaleString()} distinct (${uniq}% unique)`
    : 'distinct not measured';
  const keyNote = hasDistinct && p.totalRows>0 && p.distinctValues===p.totalRows && p.nullValues===0 && p.blankValues===0
    ? ' · fully unique, strong business-key candidate' : '';
  const ddlNote = stagingColumnUsesNotNull(col)
    ? ' · staging NOT NULL'
    : ' · staging nullable';
  return `${col.name}: ${p.totalRows.toLocaleString()} rows · ${distinctText} · ${p.nullValues.toLocaleString()} null · ${p.blankValues.toLocaleString()} blank${ddlNote}${keyNote}`;
}

function buildStagingColumns(table){
  // Mirror source nullability in the initial CREATE TABLE. Source PK and NOT
  // NULL columns remain NOT NULL unless a live profile finds SQL NULLs or
  // blank/whitespace-only values (which the engine can normalise to NULL).
  // No follow-up ALTER TABLE nullability repair SQL is emitted.
  const cols = stagedColumns(table).map(c => ({
    name:targetColumnName(c),
    type:mapColumnType(c),
    notNull:stagingColumnUsesNotNull(c),
  }));
  const hubDerivs = table.derivations.filter(d=>d.kind==='both');
  const bkOnly = table.derivations.filter(d=>d.kind==='bk');
  const fkDerivs = table.derivations.filter(d=>d.kind==='hash');
  hubDerivs.forEach(d=> cols.push({ name:hashColumnNameForDerivation(table, d), type:hashSqlType(), notNull:false, hashed:true }));
  hubDerivs.concat(bkOnly).forEach(d=> cols.push({ name:businessKeyColumnName(derivationCanonicalSpec(table,d).entity), type:'TEXT', notNull:false }));
  fkDerivs.forEach(d=> cols.push({ name:hashColumnNameForDerivation(table, d), type:hashSqlType(), notNull:false, hashed:true }));
  cols.push({ name:'tenant_id', type:'VARCHAR(20)', notNull:false });
  // Defensive dedup: two derivations can end up targeting the same column
  // name (e.g. two different source columns both mapped to the same
  // entity name by mistake), which would otherwise produce invalid DDL —
  // Postgres rejects a CREATE TABLE with a duplicate column name outright.
  // Keep the first occurrence; validateModel() separately warns about the
  // underlying collision so it doesn't just silently disappear.
  const seen = new Set();
  return cols.filter(c => {
    if (seen.has(c.name)) return false;
    seen.add(c.name);
    return true;
  });
}

function ddlFromColumns(tableName, cols){
  const body = cols.map(c=>`  ${c.name} ${c.type}${c.notNull?' NOT NULL':''}`).join(',\n');
  return `CREATE TABLE IF NOT EXISTS ${tableName} (\n${body}\n);`;
}

function hashIndexName(tableName, columnName){
  const unqualifiedTable = String(tableName||'').split('.').pop();
  return targetIdentifierBase(`idx_${unqualifiedTable}_${columnName}`, 'hash_index');
}

function hashedColumnIndexStatements(tableName, cols){
  const seen = new Set();
  return (cols||[])
    .filter(c=>c.hashed && !seen.has(c.name) && seen.add(c.name))
    .map(c=>`CREATE INDEX IF NOT EXISTS ${hashIndexName(tableName, c.name)} ON ${tableName} (${c.name});`);
}

function ddlWithHashIndexes(tableName, cols){
  return [
    ddlFromColumns(tableName, cols),
    ...hashedColumnIndexStatements(tableName, cols),
  ].join('\n');
}

function ddlForeignTable(tableName, cols, keyColumnName){
  // jdbc_fdw supports no table-level OPTIONS at all — only a column-level
  // OPTIONS(key 'true') flag on the primary/hash key column. The foreign
  // table's name must match the remote table's name exactly; jdbc_fdw has
  // no schema_name/table_name remapping option like postgres_fdw does.
  const keyCol = keyColumnName || (cols[0] && cols[0].name);
  const body = cols.map(c=>{
    const opts = (c.name === keyCol) ? ` OPTIONS (key 'true')` : '';
    // PostgreSQL's CREATE FOREIGN TABLE grammar places column OPTIONS
    // immediately after the data type and before column constraints such as
    // NOT NULL. Emitting NOT NULL before OPTIONS produces a syntax error.
    return `  ${c.name} ${c.type}${opts}${c.notNull?' NOT NULL':''}`;
  }).join(',\n');
  const server = state.externalTables.serverName || '<server_name>';
  return `CREATE FOREIGN TABLE IF NOT EXISTS ${tableName} (\n${body}\n) SERVER ${server};`;
}

function buildFdwPreamble(){
  const ext = state.externalTables;
  const server = ext.serverName || '<server_name>';
  const sharedUser = String(ext.studioUser || ext.username || '');
  const sharedPassword = String(ext.studioPassword || ext.password || '');
  // The local data_vault and pdi_meta roles both map to the same account
  // used by the physical-target deployment. data_vault
  // reads and writes the core foreign tables; pdi_meta reads them from the
  // engine's logging procedures when it records row counts.
  ext.studioUser = sharedUser; ext.username = sharedUser;
  ext.studioPassword = sharedPassword; ext.password = sharedPassword;
  return [
    `-- jdbc_fdw setup — hub/link/satellite tables below are foreign tables via`,
    `-- this server. _err and pdi_meta tables stay native. jdbc_fdw is not a`,
    `-- packaged Postgres extension — it's built from source, needs Java and a`,
    `-- libjvm.so symlink on the server, plus the JDBC driver .jar referenced`,
    `-- below. The remote database needs a table with the exact same name as`,
    `-- each foreign table here — jdbc_fdw has no per-table name remapping.`,
    `CREATE EXTENSION IF NOT EXISTS jdbc_fdw;`,
    ``,
    `CREATE SERVER IF NOT EXISTS ${server} FOREIGN DATA WRAPPER jdbc_fdw`,
    `  OPTIONS (`,
    `    drivername '${sqlLiteral(ext.drivername || '<jdbc_driver_class>')}',`,
    `    url '${sqlLiteral(ext.url || '<jdbc_url>')}',`,
    `    querytimeout '${sqlLiteral(ext.querytimeout || '30')}',`,
    `    jarfile '${sqlLiteral(ext.jarfile || '<path_to_driver_jar>')}'${ext.maxheapsize ? `,\n    maxheapsize '${sqlLiteral(ext.maxheapsize)}'` : ''}`,
    `  );`,
    ``,
    `DROP USER MAPPING IF EXISTS FOR data_vault SERVER ${server};`,
    `CREATE USER MAPPING FOR data_vault SERVER ${server}`,
    `  OPTIONS (username '${sqlLiteral(sharedUser)}', password '${sqlLiteral(sharedPassword)}');`,
    ``,
    `DROP USER MAPPING IF EXISTS FOR pdi_meta SERVER ${server};`,
    `CREATE USER MAPPING FOR pdi_meta SERVER ${server}`,
    `  OPTIONS (username '${sqlLiteral(sharedUser)}', password '${sqlLiteral(sharedPassword)}');`,
    ``,
    `GRANT USAGE ON FOREIGN SERVER ${server} TO data_vault, pdi_meta;`,
  ].join('\n');
}

function mainTableDdl(tableName, cols, keyColumnName){
  return state.externalTables.enabled ? ddlForeignTable(tableName, cols, keyColumnName) : ddlFromColumns(tableName, cols);
}

function buildErrColumns(cols){
  return cols.map((c,i)=>{
    let type = 'TEXT';
    if (c.name==='load_dts') type='TIMESTAMP';
    else if (c.name==='record_source_id') type='INT';
    return { name:c.name, type, notNull:false };
  }).concat([
    { name:'etl_err_date', type:'TIMESTAMP', notNull:false },
    { name:'etl_id_run', type:'INT', notNull:false },
    { name:'etl_err_noe', type:'INT', notNull:false },
    { name:'etl_err_desc', type:'VARCHAR(512)', notNull:false },
    { name:'etl_err_col', type:'VARCHAR(256)', notNull:false },
    { name:'etl_err_cod', type:'VARCHAR(256)', notNull:false },
  ]);
}

// When the GUI created the target database, CREATE SCHEMA IF NOT EXISTS runs
// as the connecting user (e.g. dvuser) — so the schema starts out owned by
// them, and the database user the tables are created under (SET ROLE
// staging / data_vault) has NO rights on it: "permission denied for schema".
// This block hands the schema to its database user, but ONLY when the
// current user owns it — a no-op on databases prepared by the target setup, and it
// never errors on admin-owned schemas.
function schemaOwnershipFixSql(schema, role){
  return `DO $$
BEGIN
  IF EXISTS (SELECT 1 FROM pg_namespace n JOIN pg_roles r ON r.oid = n.nspowner
             WHERE n.nspname = '${schema}' AND r.rolname = current_user) THEN
    EXECUTE 'ALTER SCHEMA ${schema} OWNER TO ${role}';
  END IF;
END $$;`;
}

function buildStagingDdl(){
  const parts = [`-- =========================================================\n-- STAGING DDL — schema: staging\n-- Generated by Data Vault Studio\n-- =========================================================\n`];
  parts.push('CREATE SCHEMA IF NOT EXISTS staging;');
  parts.push(schemaOwnershipFixSql('staging', 'staging'));
  parts.push('');
  parts.push('SET ROLE staging;');
  parts.push('');
  includedTables().forEach(t=>{
    const tableName = `staging.${stagingTableName(t.name)}`;
    const cols = buildStagingColumns(t);
    parts.push(`-- ${t.name} -> ${stagingTableName(t.name)}`);
    parts.push(ddlFromColumns(tableName, cols));
    parts.push(`ALTER TABLE ${tableName} OWNER TO staging;`);
    parts.push(...hashedColumnIndexStatements(tableName, cols));
    parts.push('');
  });
  parts.push(crossRoleGrantsSql('staging', 'staging', ['pdi_meta', 'data_vault']));
  parts.push('RESET ROLE;');
  return parts.join('\n');
}

// The engine uses several logins (source/staging/datavault connections) and
// its instrumentation reads across schemas (e.g. row counts on vault tables
// over the staging/pdi_meta connection). The target setup process's ALTER DEFAULT
// PRIVILEGES only covers objects the ADMIN creates — these tables are
// created under SET ROLE, so the generated DDL must cross-grant its own
// objects and register defaults FOR the creating role. Without this,
// everything works internally (dvuser is superuser) and fails on the first
// real external target with "permission denied for table ...".
function crossRoleGrantsSql(schema, ownerRole, peers){
  const to = peers.join(', ');
  return [
    `-- Cross-role access — engine connections other than ${ownerRole} must read these`,
    `GRANT USAGE ON SCHEMA ${schema} TO ${to};`,
    `GRANT ALL ON ALL TABLES IN SCHEMA ${schema} TO ${to};`,
    `ALTER DEFAULT PRIVILEGES FOR ROLE ${ownerRole} IN SCHEMA ${schema} GRANT ALL ON TABLES TO ${to};`,
    '',
  ].join('\n');
}

function buildCombinedDdl(){
  // Matches the project's own db-init convention, where staging + data
  // vault DDL ship as a single combined file (their 03-ddls.sql). Uses
  // getExportSql() rather than the raw builders so an edited preview on
  // the Export step is reflected here too, not just in the individual
  // downloads.
  return [
    `-- =========================================================`,
    `-- COMBINED STAGING + DATA VAULT DDL`,
    `-- Generated by Data Vault Studio`,
    `-- =========================================================`,
    '',
    getExportSql('staging'),
    '',
    getExportSql('datavault'),
  ].join('\n');
}

function hubColumns(h){
  return [
    { name: hubKey(h.entity), type:hashSqlType(), notNull:true, hashed:true },
    { name: businessKeyColumnName(h.entity), type:'TEXT', notNull:false },
    { name: 'load_dts', type:'TIMESTAMP', notNull:false },
    { name: 'record_source_id', type:'INT', notNull:false },
    { name: 'tenant_id', type:'VARCHAR(20)', notNull:true },
  ];
}
function linkColumns(l){
  const cols = [{ name: linkKeyOf(l.entity), type:hashSqlType(), notNull:true, hashed:true }];
  l.hubs.forEach(h=>{
    const hub = findHub(h.hubId);

// Older Studio DDL incorrectly duplicated every parent Hub hash on a Link
// Satellite. The Hop loader uses those hashes to find the parent Link, then
// inserts only that Link's key into the satellite. Keeping the duplicated Hub
// columns as NOT NULL therefore rejects every row. Track the exact legacy
// columns so an already-deployed Studio schema can be repaired deliberately.
function legacyLinkSatHubColumns(s){
  const link = findLink(s.linkId);
  if (!link) return [];
  return link.hubs.map(h=>linkHubKeyColumnName(link, h)).filter(Boolean);

function buildDataVaultLocalSupportDdl(){
  const parts = [`-- =========================================================\n-- LOCAL DATA VAULT SUPPORT DDL — schema: data_vault\n-- Generated by Data Vault Studio\n-- Core hub/link/sat/lsat relations are created separately as foreign tables.\n-- =========================================================\n`];
  parts.push('CREATE SCHEMA IF NOT EXISTS data_vault;');
  parts.push(schemaOwnershipFixSql('data_vault', 'data_vault'));
  parts.push('');
  parts.push('SET ROLE data_vault;');
  parts.push('');
  externalCoreTableSpecs().forEach(spec=>{
    parts.push(`-- Local error table for ${spec.family}: ${spec.name}`);
    parts.push(ddlFromColumns(`data_vault.${spec.name}_err`, buildErrColumns(spec.columns)));
    parts.push(`ALTER TABLE data_vault.${spec.name}_err OWNER TO data_vault;`);
    parts.push('');
  });
  parts.push(`-- Verification view remains local PostgreSQL`);
  parts.push(`CREATE OR REPLACE VIEW data_vault.vw_information_schema_columns_data_vault AS\nSELECT table_name, table_schema, column_name, ordinal_position, is_nullable, data_type\nFROM information_schema.columns\nWHERE table_schema = 'data_vault';`);

}

  const parts = [`-- =========================================================\n-- DATA VAULT DDL — schema: data_vault\n-- Generated by Data Vault Studio\n-- =========================================================\n`];
  parts.push('CREATE SCHEMA IF NOT EXISTS data_vault;');
  parts.push(schemaOwnershipFixSql('data_vault', 'data_vault'));
  parts.push('');
  parts.push('SET ROLE data_vault;');
  parts.push('');

  externalCoreTableSpecs().forEach(spec=>{
    parts.push(`-- ${spec.family.toUpperCase()}: ${spec.name}`);
    parts.push(ddlFromColumns(`data_vault.${spec.name}`, spec.columns));
    parts.push(`ALTER TABLE data_vault.${spec.name} OWNER TO data_vault;`);
    parts.push(...hashedColumnIndexStatements(`data_vault.${spec.name}`, spec.columns));
    parts.push(ddlFromColumns(`data_vault.${spec.name}_err`, buildErrColumns(spec.columns)));
    parts.push(`ALTER TABLE data_vault.${spec.name}_err OWNER TO data_vault;`);
    parts.push('');
  });

  parts.push(`-- Verification view (create only if missing/wrong)`);
  parts.push(`CREATE OR REPLACE VIEW data_vault.vw_information_schema_columns_data_vault AS\nSELECT table_name, table_schema, column_name, ordinal_position, is_nullable, data_type\nFROM information_schema.columns\nWHERE table_schema = 'data_vault';`);
  parts.push(`ALTER VIEW data_vault.vw_information_schema_columns_data_vault OWNER TO data_vault;`);
  parts.push('');
  parts.push(crossRoleGrantsSql('data_vault', 'data_vault', ['pdi_meta', 'staging']));
  parts.push('RESET ROLE;');
  return parts.join('\n');
}

/* =========================================================================
   Remote table DDL — jdbc_fdw connects to ANY JDBC source, which may be a
   completely different SQL dialect than the local Postgres. This generates
   the CREATE TABLE statements to run on THAT remote database, with table
   names matching exactly what the local CREATE FOREIGN TABLE expects
   (jdbc_fdw has no per-table name remapping).
   ========================================================================= */
function remoteType(type, dialect){
  const upper=String(type||'').toUpperCase();
  if (dialect === 'oracle'){
    if (/^VARCHAR\(/i.test(type)) return type.replace(/^VARCHAR/i, 'VARCHAR2');
    if (upper === 'INT') return 'NUMBER(10)';
    if (upper === 'BYTEA') return 'RAW(32)';
    return type;
  }
  if (dialect === 'sqlserver'){
    if (upper === 'TIMESTAMP') return 'DATETIME2(6)';
    if (upper === 'BYTEA') return 'VARBINARY(32)';
    if (upper === 'TEXT') return 'NVARCHAR(MAX)';
    if (/^VARCHAR\(/i.test(type)) return type.replace(/^VARCHAR/i,'NVARCHAR');
    if (/^CHAR\(/i.test(type)) return type.replace(/^CHAR/i,'NCHAR');
    return type;
  }
  if (dialect === 'mysql'){
    if (upper === 'TIMESTAMP') return 'DATETIME(6)';
    if (upper === 'BYTEA') return 'VARBINARY(32)';
    // MySQL TEXT is limited to 64 KiB; LONGTEXT avoids narrowing large
    // XML/JSON/NTEXT values represented as PostgreSQL TEXT.
    if (upper === 'TEXT') return 'LONGTEXT';
    return type;
  }
  return type;
}
function remoteQuoteIdentifier(value,dialect){
  const text=String(value||'');
  if(dialect==='mysql') return '`'+text.replace(/`/g,'``')+'`';
  if(dialect==='sqlserver') return '['+text.replace(/]/g,']]')+']';
  return '"'+text.replace(/"/g,'""')+'"';
}
function remoteQualifiedName(tableName, dialect, database, schema){
  const table=remoteQuoteIdentifier(tableName,dialect);
  if (dialect === 'mysql') return database ? `${remoteQuoteIdentifier(database,dialect)}.${table}` : table;
  return schema ? `${remoteQuoteIdentifier(schema,dialect)}.${table}` : table;
}
function remoteCreateTable(tableName, cols, dialect, database, schema){
  const qname = remoteQualifiedName(tableName, dialect, database, schema);
  const body = cols.map(c=>`  ${remoteQuoteIdentifier(c.name,dialect)} ${remoteType(c.type, dialect)}${c.notNull?' NOT NULL':''}`).join(',\n');
  if (dialect==='postgresql' || dialect==='mysql') return `CREATE TABLE IF NOT EXISTS ${qname} (\n${body}\n);`;
  if (dialect==='sqlserver') return `IF OBJECT_ID(N'${sqlLiteral(qname)}', N'U') IS NULL\nBEGIN\n  CREATE TABLE ${qname} (\n${body}\n);\nEND;`;
  return `CREATE TABLE ${qname} (\n${body}\n);`;
}

function buildExternalTablesDdl(){
  const ext = state.externalTables;
  const dialect = ext.remoteDialect || 'postgresql';
  const database = ext.studioDatabase || ext.remoteDatabase;
  const schema = ext.studioSchema || ext.remoteSchema;
  const parts = [
    `-- =========================================================`,
    `-- REMOTE CORE DATA VAULT TABLE DDL`,
    `-- Run against ${database||'(database)'}${schema?'.'+schema:''}.`,
    `-- Only hub/link/sat/lsat physical tables belong here.`,
    `-- Views and *_err tables deliberately remain local PostgreSQL objects.`,
    `-- =========================================================`,
    '',
  ];
  externalCoreTableSpecs().forEach(spec=>{
    parts.push(`-- ${spec.family.toUpperCase()}: ${spec.name}`);
    parts.push(remoteCreateTable(spec.name, spec.columns, dialect, database, schema));
    parts.push('');
  });
  return parts.join('\n');
}

/* ---- Hop source connection metadata (metadata/rdbms/source.json) ----

   generates the right one for the selected source dialect so it can be
   deployed into <project-root>/metadata/rdbms/, overriding the default.

      attributes:{
        SUPPORTS_TIMESTAMP_DATA_TYPE:'Y', QUOTE_ALL_FIELDS:'N', SUPPORTS_BOOLEAN_DATA_TYPE:'Y',
        FORCE_IDENTIFIERS_TO_LOWERCASE:'N', PRESERVE_RESERVED_WORD_CASE:'N', SQL_CONNECT:'',

        'EXTRA_OPTION_MSSQLNATIVE.encrypt':'true',
        'EXTRA_OPTION_MSSQLNATIVE.trustServerCertificate':'true',
      },
    }) };
  }else{
    rdbms={ POSTGRESQL: Object.assign({}, common, {
      pluginId:'POSTGRESQL', pluginName:'PostgreSQL',

  }
  return JSON.stringify({ rdbms, name: 'source' }, null, 2);
}

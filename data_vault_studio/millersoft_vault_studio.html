      hashColumnNameForHub(table, h), businessKeyColumnName(h.entity), '', 1, 1, 0, h.statusSat?1:0, '' ];
  });

  rows.links = state.links.map(l=>{
    const table = findTable(l.tableId);
    const row = [ linkNameOf(l.entity), linkKeyOf(l.entity), l.description, 1, sourceConcat(table.name), 1 ];
    for (let i=0;i<10;i++){
      const h = l.hubs[i];
      if (h){
        const hub = findHub(h.hubId);
        const physicalKey = linkHubKeyColumnName(l, h);
        const explicitKey = hub && physicalKey !== hubKey(hub.entity) ? physicalKey : '';
        row.push(hubName(hub.entity), explicitKey, hashColumnNameForLinkHub(table, h, l));
      }
      else row.push('', '', '');
    }
    row.push('', '', 0, 0, '', '', '');
    return row;
  });

  rows.link_attributes = [];

  rows.hub_satellites = [];
  state.hubSats.forEach(s=>{
    const table = findTable(s.tableId); const hub = findHub(s.hubId);
    s.attrs.forEach((a,i)=>{
      const col = findCol(table, a.colId);
      if (i===0){
        rows.hub_satellites.push([ satName(s.entity,s.concern), 'sat_key', s.description, hubName(hub.entity), 1,
          sourceConcat(table.name), hashColumnNameForHub(table, hub), 1, col?targetColumnName(col):'', a.target, 0, '' ]);
      } else {
        rows.hub_satellites.push([ '', '', '', '', '', '', '', i+1, col?targetColumnName(col):'', a.target, 0, '' ]);
      }
    });
  });

  rows.link_satellites = [];
  state.linkSats.forEach(s=>{
    const table = findTable(s.tableId); const link = findLink(s.linkId);
    s.attrs.forEach((a,i)=>{
      const col = findCol(table, a.colId);
      if (i===0){
        const row = [ lsatName(s.entity,s.concern), 'sat_key', s.description, linkNameOf(link.entity), 1, sourceConcat(table.name) ];
        for (let j=0;j<10;j++){ const h=link.hubs[j]; row.push(h?hashColumnNameForLinkHub(table, h, link):''); }
        for (let j=0;j<5;j++) row.push('');
        row.push(1, col?targetColumnName(col):'', a.target, '');
        rows.link_satellites.push(row);
      } else {
        const row = ['', '', '', '', '', ''];
        for (let j=0;j<10;j++) row.push('');
        for (let j=0;j<5;j++) row.push('');
        row.push(i+1, col?targetColumnName(col):'', a.target, '');
        rows.link_satellites.push(row);
      }
    });
  });

  // Base template compatibility sheet. Kept empty apart from the header.
  rows.Sheet10 = [];

  return rows;
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime || 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function mappingWorkbookFilename(){
  // Enforced convention: <base>_1.xls — the base name is the only
  // adjustable part; "_1" and the .xls extension are always appended.
  const base = (state.vault.mappingBaseName || 'metadata_spreadsheet').trim() || 'metadata_spreadsheet';
  return `${base}_1.xls`;
}

function buildMappingWorkbook(){
  const rows = buildWorkbookRows();
  const wb = XLSX.utils.book_new();
  Object.keys(SHEET_HEADERS).forEach(sheet=>{
    const aoa = [SHEET_HEADERS[sheet], ...(rows[sheet]||[])];
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    XLSX.utils.book_append_sheet(wb, ws, sheet);
  });
  return wb;
}

function downloadWorkbook(){
  const wb = buildMappingWorkbook();
  // Genuine legacy .xls (bookType 'biff8') silently truncates any cell
  // string over 255 characters — confirmed directly, and it's exactly
  // what corrupted the payment/rental staging_sql_override values (both
  // have several FK-derived hash columns, making their override text
  // long enough to cross that limit). Writing modern xlsx content with a
  // .xls filename avoids that entirely; virtually everything that reads
  // Excel files (including Apache POI, which Hop's own Excel Input step
  // is built on) detects the real format from content, not the
  // extension, so this is safe in exchange for not silently losing data.
  XLSX.writeFile(wb, mappingWorkbookFilename(), { bookType: 'xlsx' });
}

/* ---- validation, mirrors scripts/validate_mapping_workbook.py at a structural level ---- */
function duplicatePhysicalColumn(cols){
  const seen=new Set();
  for(const c of cols||[]){const name=String(c.name||'').toLowerCase();if(seen.has(name)) return c.name;seen.add(name);} return '';
}
function validateModel(){
  pruneDownstreamModel({ dropExcluded:true });
  repairAllForeignKeyDerivations();
  const errors = [], warnings = [];
  const v = state.vault;
  const tables = includedTables();
  if (!v.name) errors.push('Vault short name (NAME) is not set.');
  else if (identifierIssue(v.name)) errors.push('Vault short name: ' + identifierIssue(v.name));
  if (!v.prefix) errors.push('Staging prefix is not set.');
  else if (identifierIssue(v.prefix)) errors.push('Staging prefix: ' + identifierIssue(v.prefix));
  if (!v.tenantId) errors.push('Tenant ID literal is not set.');
  if (!v.srcDescription) errors.push('Source system description is not set — this is the critical join key.');
  if (!v.vaultDbName) warnings.push('Target data vault database name is blank.');
  if (tables.length===0) errors.push('No included source tables defined.');
  if (state.hubs.length===0) warnings.push('No hubs defined yet.');
  const stagingTableCounts={};
  tables.forEach(t=>{const name=stagingTableName(t.name);stagingTableCounts[name]=(stagingTableCounts[name]||0)+1;});
  Object.entries(stagingTableCounts).filter(([,count])=>count>1).forEach(([name,count])=>errors.push(`${count} source tables resolve to the same staging table name "${name}". Set distinct source/target names before export.`));
  findDuplicateSatelliteGroups().forEach(group=>{
    const s = group[0];
    const kind = state.hubSats.includes(s) ? 'hub' : 'link';
    const label = group.map(x=>satelliteDisplayName(x, kind)).join(', ');
    errors.push(`${group.length} duplicate satellites for the same ${kind} source/attribute set (${label}) — this would generate duplicate spreadsheet metadata and may leave the sheet out of sync with DDL. Go to Vault → Satellites and use "Remove duplicates".`);
  });
  tables.forEach(t=>{
    if (t.columns.length===0) warnings.push(`Table "${t.name}" has no columns.`);
    if (t.columns.length>0 && stagedColumns(t).length===0) errors.push(`Table "${t.name}" is included but has no columns selected for staging. Select at least one column or exclude the table on the Tables page.`);
    const allPk=(t.columns||[]).filter(c=>c.pk);
    const selectedPk=allPk.filter(isColumnStaged);
    if (selectedPk.length>0 && selectedPk.length<allPk.length){
      const missing=allPk.filter(c=>!isColumnStaged(c)).map(c=>c.name);
      errors.push(`Table "${t.name}" has only part of its primary key selected for staging. Include ${missing.join(' + ')} or exclude the full key/table before modelling.`);
    }
    const declared=(state.sourceMeta&&state.sourceMeta.foreignKeys||[]).filter(f=>f.table===t.name&&f.constraintName);
    const fkGroups={}; declared.forEach(f=>{(fkGroups[f.constraintName]||(fkGroups[f.constraintName]=[])).push(f);});
    Object.entries(fkGroups).forEach(([constraint,rows])=>{
      const selected=rows.filter(f=>stagedColumns(t).some(c=>c.name===f.column));
      if(selected.length>0&&selected.length<rows.length){
        const missing=rows.filter(f=>!stagedColumns(t).some(c=>c.name===f.column)).map(f=>f.column);
        errors.push(`Table "${t.name}" has only part of foreign key "${constraint}" selected for staging. Include ${missing.join(' + ')} or exclude every column in that relationship.`);
      }
    });
    const targetCounts = {};
    stagedColumns(t).forEach(c=>{
      const target = targetColumnName(c);
      const issue = targetIdentifierIssue(target);
      if (issue) errors.push(`Table "${t.name}" column "${c.name}": ${issue}`);
      targetCounts[target] = (targetCounts[target]||0)+1;
    });
    Object.entries(targetCounts).filter(([,count])=>count>1).forEach(([name,count])=>{
      errors.push(`Table "${t.name}" has ${count} selected columns targeting staging name "${name}". Give each column a unique Staging name on the Tables page.`);
    });
    if (!t.columns.some(c=>c.pk) && !state.hubs.some(h=>h.tableId===t.id)) {
      // informational only
    }
    // Duplicate physical staging aliases are blocking: silently keeping the
    // first would make a key disappear from the generated SQL/workbook.
    duplicateDerivationTargets(t).forEach(({name,count})=>{
      errors.push(`Table "${t.name}" has ${count} derivations all targeting "${name}". Remove or correct the duplicate derivations before export.`);
    });
  });
  state.hubs.forEach(h=>{
    const table=findTable(h.tableId);
    if(!table){errors.push(`Hub "${h.entity}" references a missing table.`);return;}
    const keys=hubKeyCols(h);
    if(!keys.length) errors.push(`Hub "${h.entity}" has no business key columns.`);
    else if(!tableHasHashForColumns(table,h.entity,keys.map(c=>c.name),h.entity)) errors.push(`Hub "${h.entity}" has no complete hash/business-key derivation for "${keys.map(c=>c.name).join(' + ')}" on "${table.name}".`);
  });
  state.links.forEach(l=>{
    if (l.hubs.length<2) errors.push(`Link "${l.entity}" has fewer than 2 hubs.`);
    const table = findTable(l.tableId);
    const physicalCols = linkColumns(l).map(c=>c.name);
    const duplicatePhysical = physicalCols.find((name,i)=>physicalCols.indexOf(name)!==i);
    if (duplicatePhysical) errors.push(`Link "${l.entity}" generates duplicate physical column "${duplicatePhysical}". Assign distinct source-role columns before export.`);
    l.hubs.forEach(h=>{
      const hub = findHub(h.hubId);
      const cols = table ? linkHubCols(table, h) : [];
      if (!hub) { errors.push(`Link "${l.entity}" references a missing hub.`); return; }
      if (table && !tableHasLinkHubHash(table, h, l)) errors.push(`Link "${l.entity}" is missing a hash key for hub "${hub.entity}" using source column(s) "${cols.map(c=>c.name).join(' + ')||'?'}" on "${table.name}".`);
    });
  });
  state.hubSats.concat(state.linkSats).forEach(s=>{
    if(s.attrs.length===0) warnings.push(`Satellite "${s.entity}${s.concern?'_'+s.concern:''}" has no attributes.`);
    const physical=state.hubSats.includes(s)?hubSatColumns(s):linkSatColumns(s);
    const duplicate=duplicatePhysicalColumn(physical);
    if(duplicate) errors.push(`Satellite "${s.entity}${s.concern?'_'+s.concern:''}" generates duplicate physical column "${duplicate}".`);
    const counts={};
    s.attrs.forEach(a=>{
      const issue=targetIdentifierIssue(a.target);
      if(issue) errors.push(`Satellite "${s.entity}${s.concern?'_'+s.concern:''}" target "${a.target}": ${issue}`);
      if(RESERVED_TARGET_COLUMNS.has(a.target)) errors.push(`Satellite "${s.entity}${s.concern?'_'+s.concern:''}" cannot use reserved system column "${a.target}".`);
      counts[a.target]=(counts[a.target]||0)+1;
    });
    Object.entries(counts).filter(([,count])=>count>1).forEach(([name,count])=>errors.push(`Satellite "${s.entity}${s.concern?'_'+s.concern:''}" maps ${count} attributes to target column "${name}".`));
  });
  const unmapped = unmappedAttributeColumns();
  if (unmapped.length){
    const sample = unmapped.slice(0,20).map(x=>`${x.table}.${x.column}`).join(', ');
    errors.push(`${unmapped.length} staged column(s) are not mapped into a Vault satellite: ${sample}${unmapped.length>20?' …':''}. Map them, run Suggest/AI again, or explicitly exclude them on the Staging page.`);
  }
  const uncoveredTables = vaultUncoveredTables();
  if (uncoveredTables.length){
    const sample = uncoveredTables.slice(0,20).map(t=>t.name).join(', ');
    errors.push(`${uncoveredTables.length} included table(s) with staged columns are not represented in the Vault model: ${sample}${uncoveredTables.length>20?' …':''}. Add a Hub, Link or Satellite, or exclude the table.`);
  }
  if (state.externalTables.enabled){
    const ext = state.externalTables;
    if (state.vault.targetPreset !== 'internal') errors.push('JDBC FDW storage is available only with the internal PostgreSQL container.');
    if (!ext.serverName) errors.push('External storage is enabled but no server name is set.');
    if (!ext.drivername) errors.push('External storage is enabled but no JDBC driver class is set.');
    if (!ext.url) errors.push('External storage is enabled but no JDBC URL is set.');
    if (!ext.jarfile) warnings.push('External storage has no path set for the JDBC driver .jar file.');
    if (!ext.username) warnings.push('External storage user mapping has no username set.');
    if (!(ext.studioHost)) errors.push('External storage is enabled but the Studio-to-target host is missing.');
    if (!(ext.studioDatabase||ext.remoteDatabase)) errors.push('External storage is enabled but the remote database name is missing.');
    if (!(ext.studioUser||ext.username)) errors.push('External storage is enabled but the remote deployment username is missing.');
    if (ext.serverName && !externalIdentifierIsSafe(ext.serverName)) errors.push('External storage server name must be a plain SQL identifier.');
    if ((ext.studioDatabase||ext.remoteDatabase) && !externalIdentifierIsSafe(ext.studioDatabase||ext.remoteDatabase)) errors.push('External database name must be a plain identifier.');
    if ((ext.studioSchema||ext.remoteSchema) && !externalIdentifierIsSafe(ext.studioSchema||ext.remoteSchema)) errors.push('External schema name must be a plain identifier.');
    if (ext.remoteDialect!=='mysql' && !(ext.studioSchema||ext.remoteSchema)) warnings.push('Remote table DDL has no remote schema set (leave blank only if the login default is intentional).');
  }
  return { errors, warnings };
}


</script>

<script>
/* =========================================================================
   EXPORT TAB
   ========================================================================= */
let exportExpanded = { staging:false, datavault:false, pdimeta:false, remotetables:false };
let exportOverrides = { staging:null, datavault:null, pdimeta:null, remotetables:null };
const EXPORT_BUILDERS = {
  staging: buildStagingDdl,
  datavault: buildDataVaultDdl,
  pdimeta: buildPdiMetaSql,
  remotetables: () => buildExternalTablesDdl(),
};
const EXPORT_FILENAMES = {
  staging: () => `${state.vault.name||'vault'}_staging_ddl.sql`,
  datavault: () => `${state.vault.name||'vault'}_data_vault_ddl.sql`,
  pdimeta: () => `${state.vault.name||'vault'}_metadata.sql`,
  remotetables: () => `${state.vault.name||'vault'}_remote_table_ddl.sql`,
};
// Edited content (if any) is used in place of the freshly generated SQL for
// download/execute/preview, until explicitly reset — this is what makes the
// per-file preview below an actual editor rather than a read-only dump.
function getExportSql(key){
  return exportOverrides[key] != null ? exportOverrides[key] : EXPORT_BUILDERS[key]();
}
function exportFileRowHtml(key, label, hintHtml, canRun){
  const expanded = !!exportExpanded[key];
  const edited = exportOverrides[key] != null;
  return `
    <div class="export-file-row ${expanded?'expanded':''}">
      <div class="export-file-row-head">
        <button class="export-file-toggle" data-toggle="${key}" aria-expanded="${expanded}">
          <span class="export-file-caret">${expanded?'▾':'▸'}</span>
          <span class="export-file-label">${label}</span>
          <span class="hint">(${hintHtml})</span>
          ${edited ? `<span class="badge-count">edited</span>` : ''}
        </button>
        <div class="export-file-actions">
          <button class="btn small" data-dl="${key}">⬇ Download</button>
          ${canRun ? `<button class="btn small" data-run="${key}">Execute</button>` : ''}
        </div>
      </div>
      ${expanded ? `
      <div class="export-file-body">
        <textarea class="code-edit" data-editor="${key}" spellcheck="false" wrap="off">${escapeHtml(getExportSql(key))}</textarea>
        <div class="export-file-body-actions">
          <p class="hint mb0">${edited ? 'Edited — this version will be used for download and execute.' : 'Generated from the current model — edit above to override it.'}</p>
          ${edited ? `<button class="btn small ghost" data-reset="${key}">Reset to generated</button>` : ''}
        </div>
      </div>` : ''}
    </div>`;
}

/* =========================================================================
   DEPLOYMENT STATUS BOARD — no manifest, no local state: everything is
   derived live by probing the target database and the project's deployment files
   files, then compared against what the current design would generate.
   States: missing (not deployed) | stale (out of date) | current | unknown.
   ========================================================================= */
let deployStatus = null;      // { rows:[{key,label,state,detail,action}], probedAt, error, fingerprint }
let deployProbing = false;
let deployApplying = false;

// One busy flag for the whole board — no action can start while any other
// probe/apply is in flight (prevents double-fire and interleaved deploys).
function deployBusy(){
  return deployProbing || deployApplying ||
    !!(deployStatus && deployStatus.rows && deployStatus.rows.some(r=>r.state==='busy'));
}

// Guard 2: the board reflects the design as it was when status was checked. If the
// model changed since, applying from it would act on stale conclusions.
function deployBoardIsStale(){
  return !!(deployStatus && !deployStatus.error && deployStatus.fingerprint &&
            deployStatus.fingerprint !== designFingerprint());
}
let exportAdvancedOpen = false;

// Pure: derive the board row for a generated deployment FILE from the
// server's file-status info. JSON files compare content directly.
function deriveFileRow(key, label, info, generatedContent){
  const norm = s => String(s == null ? '' : s).trim();
  if (!info || !info.exists){
    return { key, label, state: 'missing', detail: 'not deployed yet' };
  }
  if (info.content != null && generatedContent != null && norm(info.content) !== norm(generatedContent)){
    return { key, label, state: 'stale', detail: 'deployed file differs from the current design' };
  }
  const when = info.mtimeMs ? new Date(info.mtimeMs).toLocaleString() : '';
  return { key, label, state: 'current', detail: when ? `written ${when}` : 'present' };
}

// Pure: derive the board row for a set of database objects (staging or
// data_vault) from expected objects, live columns and live single-column
// indexes. Indexes are compared by table + column, not by index name, so an
// equivalent existing index satisfies the requirement without duplication.
function deriveDbObjectsRow(key, label, expected, liveCols, liveIndexes, schema, liveRelations=null){
  const delta = computeTargetDelta(
    expected,
    liveCols.filter(r => String(r.table_schema).toLowerCase() === schema),
    liveIndexes == null ? null : liveIndexes.filter(r => String(r.table_schema).toLowerCase() === schema),
    liveRelations == null ? null : liveRelations.filter(r => String(r.table_schema).toLowerCase() === schema)
  );
  const present = expected.length - delta.missingTables.length;
  if (present === 0){
    return { key, label, state: 'missing', detail: `0 of ${expected.length} tables`, delta };
  }
  if (delta.missingTables.length || delta.missingColumns.length || delta.missingIndexes.length || delta.obsoleteColumns.length || delta.relationKindMismatches.length){
    return { key, label, state: 'stale',
      detail: `${present} of ${expected.length} tables · ${delta.missingTables.length} table(s), ${delta.missingColumns.length} column(s), ${delta.missingIndexes.length} hash index(es) to add, ${delta.relationKindMismatches.length} relation-kind collision(s), and ${delta.obsoleteColumns.length} obsolete Link Satellite column(s)`, delta };
  }
  const mm = delta.typeMismatches.length ? ` · ${delta.typeMismatches.length} type difference(s) — see Advanced` : '';
  return { key, label, state: 'current', detail: `${expected.length} of ${expected.length} tables${mm}`, delta };
}

async function probeDeploymentStatus(){
  if (deployProbing || deployApplying) return;
  const v = state.vault;
  if (!v.dvHost || !v.dvDatabase || !v.dvUser){
    deployStatus = { rows: [], error: 'Set the target connection (host, database, user) on the Connections step first.' };
    renderAll(); setActiveTabViewOnly('export');
    return;
  }
  deployProbing = true; renderAll(); setActiveTabViewOnly('export');
  const esc = s => String(s || '').replace(/'/g, "''");
  const rows = [];
  let externalWorkflowAssigned = false;
  const attachExternalWorkflow = row => {
    if (state.externalTables.enabled && !externalWorkflowAssigned && row && !['current','unknown'].includes(row.state)){
      row.apply = applyExternalStorageWorkflow;
      row.applyLabel = 'Deploy route';
      row.workflow = 'external-route';
      externalWorkflowAssigned = true;
    }
    return row;
  };
  try {
    await ensureLocalServerReachable();

    // 1 · target database
    const dbResp = await localFetch(`/api/db-status`, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ host: v.dvHost, port: v.dvPort, database: v.dvDatabase, user: v.dvUser, password: v.dvPassword }) }).then(r=>r.json());
    if (!dbResp.ok) throw new Error(dbResp.error || 'Could not check the target database.');
    const dbExists = dbResp.exists === true;
    const postgresDatabaseRole=state.externalTables.enabled?'gateway':'target';
    const gatewayDbRow = { key: 'database', label: `PostgreSQL ${postgresDatabaseRole} database "${v.dvDatabase}"`,
      state: dbExists ? 'current' : 'missing', detail: dbExists ? 'exists' : 'not created yet' };
    if (!dbExists){
      if (state.externalTables.enabled) attachExternalWorkflow(gatewayDbRow);
      else gatewayDbRow.apply = async ()=>{
        const r = await localFetch(`/api/create-database`, { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ host: v.dvHost, port: v.dvPort, database: v.dvDatabase, user: v.dvUser, password: v.dvPassword }) }).then(x=>x.json());
        if (!r.ok) throw new Error(r.error || 'Create failed.');
        const verify = await localFetch(`/api/db-status`, { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ host: v.dvHost, port: v.dvPort, database: v.dvDatabase, user: v.dvUser, password: v.dvPassword }) }).then(x=>x.json());
        if (!verify.ok || !verify.exists) throw new Error(verify.error || `Database "${v.dvDatabase}" was not visible after creation.`);
      };
    }
    rows.push(gatewayDbRow);

    // 2 · physical output database and core tables when FDW mode is enabled.
    // Only one row receives the ordered workflow action, so Apply all executes
    // the route once rather than re-running it for every derived status row.
    if (state.externalTables.enabled){
      const ext=state.externalTables;
      try {
        const remoteDb=await externalTargetDatabaseStatus();
        externalTargetConnStatus='ok'; externalTargetDbExists=!!remoteDb.exists; externalTargetConnError='';
        const dbRow=attachExternalWorkflow({
          key:'external-database',
          label:`Physical output database "${ext.studioDatabase||ext.remoteDatabase}"`,
          state:remoteDb.exists?'current':'missing',
          detail:remoteDb.exists
            ? `${(DIALECTS[ext.remoteDialect]||{}).label||ext.remoteDialect} database/schema exists${remoteDb.currentUser?` · ${remoteDb.serverHostname||ext.studioHost}:${remoteDb.serverPort||ext.studioPort} · ${remoteDb.currentUser}`:''}`
            : 'not created yet; ordered deployment creates and verifies it',
        });
        rows.push(dbRow);

        if (externalCoreTableCount()===0){
          rows.push({key:'external-core',label:'Physical Hub/Link/Sat/LSat tables',state:'missing',detail:'no core Data Vault tables exist in the model yet'});
        } else if (!remoteDb.exists){
          rows.push({key:'external-core',label:'Physical Hub/Link/Sat/LSat tables',state:'missing',detail:`waiting for ${ext.studioDatabase||ext.remoteDatabase}; created by the same ordered deployment`});
        } else {
          const payload=externalConnectionPayload(ext.studioDatabase||ext.remoteDatabase);
          const tableStatus=await externalApi('/api/external-table-status',{...payload,schema:ext.studioSchema||ext.remoteSchema,tables:externalCoreTableNames()});
          const missing=tableStatus.missing||[];
          rows.push(attachExternalWorkflow({
            key:'external-core',
            label:'Physical Hub/Link/Sat/LSat tables',
            state:missing.length?'stale':'current',
            detail:missing.length
              ? `${externalCoreTableCount()-missing.length} of ${externalCoreTableCount()} tables; missing ${missing.join(', ')}`
              : `${externalCoreTableCount()} of ${externalCoreTableCount()} tables`,
          }));
        }
      } catch(err){
        externalTargetConnStatus='error'; externalTargetConnError=err.message; externalTargetDbExists=null;
        rows.push({key:'external-database',label:'Physical output database',state:'unknown',detail:`could not check the selected target — ${err.message}`});
        rows.push({key:'external-core',label:'Physical Hub/Link/Sat/LSat tables',state:'unknown',detail:'physical database status is unknown'});
      }
    }

    // 3 · runtime secrets in the root .env. SOURCE_PASSWORD is always
    // synchronised from Connections. Native external PostgreSQL additionally
    // synchronises its bootstrap username/password and VAULT_PASSWORD. The
    // internal DB_* values remain administrator-controlled and untouched.
    const credentialProblem = runtimeCredentialValidationMessage();
    if (credentialProblem){
      rows.push({ key:'credentials', label:'Runtime secrets (.env)', state:'missing', detail:credentialProblem });
    } else {
      try {
        const payload=runtimeCredentialPayload();
        const c = await localFetch('/api/env-credentials/status', { method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload) }).then(r=>r.json());
        if (!c.ok) throw new Error(c.error || 'runtime secret check failed');
        const current = c.found && c.sourceMatches && (!payload.externalPostgres || (c.targetMatches && c.targetUserMatches));
        const row = { key:'credentials', label:'Runtime secrets (.env)',
          state: current ? 'current' : (c.found ? 'stale' : 'missing'),
          detail: current
            ? (payload.externalPostgres ? 'source and external PostgreSQL secrets match Connections' : 'source password matches Connections; internal PostgreSQL settings are unchanged')
            : (!c.found ? 'root .env not found' : 'runtime secrets differ from Connections') };
        if (!current) row.apply=async()=>{ await deployRuntimeCredentials({silent:true}); };
        row.reapply=async()=>{ await deployRuntimeCredentials(); };
        rows.push(row);
      } catch(err){
        rows.push({ key:'credentials', label:'Runtime secrets (.env)', state:'unknown', detail:`could not read .env — ${err.message}` });
      }
    }

    // 3 · local jdbc_fdw infrastructure. This is checked separately from
    // the foreign-table relations so a missing server or user mapping cannot
    // be reported as fully deployed.
    if (state.externalTables.enabled){
      let infrastructureRow;
      if (!dbExists){
        infrastructureRow={key:'fdw-infrastructure',label:'PostgreSQL FDW server and mapping',state:'missing',detail:'waiting for the PostgreSQL gateway database'};
      } else if (!state.externalTables.serverName){
        infrastructureRow={key:'fdw-infrastructure',label:'PostgreSQL FDW server and mapping',state:'missing',detail:'foreign server name is not configured'};
      } else {
        try{
          const infrastructure=await localFdwInfrastructureStatus();
          const missing=fdwInfrastructureMissing(infrastructure);
          infrastructureRow={
            key:'fdw-infrastructure',
            label:'PostgreSQL FDW server and mapping',
            state:missing.length?'stale':'current',
            detail:missing.length?`missing: ${missing.join(', ')}`:`${state.externalTables.serverName}; data_vault and pdi_meta mappings are ready`,
          };
        }catch(err){
          infrastructureRow={key:'fdw-infrastructure',label:'PostgreSQL FDW server and mapping',state:'unknown',detail:`could not inspect FDW infrastructure — ${err.message}`};
        }
      }
      attachExternalWorkflow(infrastructureRow);
      rows.push(infrastructureRow);
    }

    // 4+5 · staging / vault tables
    let liveCols = [];
    let liveIndexes = [];
    let liveRelations = [];
    let liveColsOk = !dbExists; // no DB yet -> "no tables" is a true fact, not a read failure
    if (dbExists){
      try {
        liveCols = await queryTarget(`SELECT table_schema, table_name, column_name, data_type,
          character_maximum_length, numeric_precision, numeric_scale, udt_name
          FROM information_schema.columns WHERE table_schema IN ('staging','data_vault')`);
        liveIndexes = await queryTarget(singleColumnIndexCatalogSql());
        liveRelations = await queryTarget(`SELECT n.nspname AS table_schema, c.relname AS table_name, c.relkind
          FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
          WHERE n.nspname IN ('staging','data_vault')`);
        liveColsOk = true;
      } catch(_){ liveCols = []; liveIndexes = []; liveRelations = []; liveColsOk = false; }
    }
    // Staging always remains an ordinary PostgreSQL schema.
    if (!liveColsOk){
      rows.push({ key:'staging', label:'Staging tables', state:'unknown', detail:'could not read the target schema — fix the connection, then re-check' });
    } else {
      const expected=parseGeneratedDdlObjects(getExportSql('staging'));
      const row=deriveDbObjectsRow('staging','Staging tables',expected,liveCols,liveIndexes,'staging',liveRelations);
      if (row.state==='missing') row.apply=async()=>{ await executeSqlAgainstTarget(getExportSql('staging')); };
      else if (row.state==='stale') row.apply=async()=>{ await executeSqlAgainstTarget(buildIncrementalSql(row.delta)); };
      rows.push(row);
    }

    if (state.externalTables.enabled){
      // External mode has two distinct PostgreSQL object groups. Do not merge
      // them into a misleading "98 Vault tables" count: the core relations are
      // foreign-table bindings, while only *_err tables and the view are local.
      if (!liveColsOk){
        rows.push({key:'vault-support',label:'PostgreSQL local Vault support objects',state:'unknown',detail:'could not read the data_vault schema — fix the connection, then re-check'});
        rows.push({key:'fdw-foreign-tables',label:'PostgreSQL foreign-table bindings',state:'unknown',detail:'could not read the data_vault schema — fix the connection, then re-check'});
      } else {
        const supportExpected=parseGeneratedDdlObjects(buildDataVaultLocalSupportDdl());
        const supportRow=deriveDbObjectsRow('vault-support','PostgreSQL local Vault support objects',supportExpected,liveCols,liveIndexes,'data_vault',liveRelations);
        const viewReady=liveRelations.some(r=>String(r.table_schema).toLowerCase()==='data_vault' && String(r.table_name).toLowerCase()==='vw_information_schema_columns_data_vault' && r.relkind==='v');
        if (!viewReady){
          if (supportRow.state==='current') supportRow.state='stale';
          supportRow.detail += ' · verification view missing';
        } else {
          supportRow.detail += ' · verification view present';
        }
        supportRow.detail += ' · these are local *_err tables, not a second copy of the core Vault';
        attachExternalWorkflow(supportRow);
        rows.push(supportRow);

        const foreignExpected=parseGeneratedDdlObjects(buildFdwForeignTablesDdl());
        const foreignRow=deriveDbObjectsRow('fdw-foreign-tables','PostgreSQL foreign-table bindings',foreignExpected,liveCols,liveIndexes,'data_vault',liveRelations);
        if(foreignRow.state==='current' && externalCoreTableNames().length){
          const smoke=externalCoreTableNames()[0];
          try{
            await queryTargetAsDataVault(`SELECT * FROM data_vault.${smoke} LIMIT 1`);
            await queryTargetAsPdiMeta(`SELECT * FROM data_vault.${smoke} LIMIT 1`);
            foreignRow.detail += ` · live route verified as data_vault and pdi_meta through ${smoke}`;
          }catch(err){
            foreignRow.state='stale';
            foreignRow.detail += ` · bindings exist but runtime access failed: ${err.message}`;
          }
        }else{
          foreignRow.detail += ' · created last, after the physical target tables and FDW server/mapping are verified';
        }
        attachExternalWorkflow(foreignRow);
        rows.push(foreignRow);
      }
    } else {
      // Non-external mode keeps the original native Vault deployment/status.
      if (!liveColsOk){
        rows.push({key:'vault',label:'Vault tables',state:'unknown',detail:'could not read the target schema — fix the connection, then re-check'});
      } else {
        const expected=parseGeneratedDdlObjects(getExportSql('datavault'));
        const row=deriveDbObjectsRow('vault','Vault tables',expected,liveCols,liveIndexes,'data_vault',liveRelations);
        if (row.state==='missing') row.apply=async()=>{ await executeSqlAgainstTarget(getExportSql('datavault')); };
        else if (row.state==='stale') row.apply=async()=>{ await executeSqlAgainstTarget(buildIncrementalSql(row.delta)); };
        rows.push(row);
      }
    }

    // 5 · pdi_meta reference rows for THIS vault
    let pdiRow = { key: 'pdimeta', label: 'Data Vault metadata', state: 'missing', detail: 'target database missing' };
    if (dbExists){
      try {
        const r = await queryTarget(`SELECT
          (SELECT COUNT(*) FROM pdi_meta.ref_connections WHERE name IN ('${esc(v.name)}_source','${esc(v.name)}_staging','${esc(v.name)}_datavault')) AS conns,
          (SELECT COUNT(*) FROM pdi_meta.ref_data_vaults WHERE data_vault_name = '${esc(v.vaultDbName)}') AS dv,
          (SELECT COUNT(*) FROM pdi_meta.ref_source_systems WHERE cod_srcsys = '${esc(v.srcCod)}') AS ss`);
        const c = r[0] || {};
        const total = Number(c.conns || 0) + Number(c.dv || 0) + Number(c.ss || 0);
        if (total >= 5) pdiRow = { key:'pdimeta', label:'Data Vault metadata', state:'current', detail:"settings for this vault are present" };
        else if (total === 0) pdiRow = { key:'pdimeta', label:'Data Vault metadata', state:'missing', detail:'settings for this vault have not been added yet' };
        else pdiRow = { key:'pdimeta', label:'Data Vault metadata', state:'stale', detail:`partly configured — ${total} of 5 required records` };
      } catch(_){
        // Schema read above succeeded -> the failure is almost certainly the
        // pdi_meta tables not existing yet. If even the schema read failed,
        // this is a connection problem: unknown, and nothing offered.
        pdiRow = liveColsOk
          ? { key:'pdimeta', label:'Data Vault metadata', state:'missing', detail:'metadata tables have not been set up yet', frameworkMissing:true }
          : { key:'pdimeta', label:'Data Vault metadata', state:'unknown', detail:'could not read the target — fix the connection, then check again' };
      }
    }
    if (pdiRow.frameworkMissing && v.targetPreset !== 'internal'){
      // The whole framework is absent on an external target — our vault-scoped
      // INSERT script has nothing to insert into. The packaged metadata setup process
      // container owns that job (markers, versioning, database creation).
      pdiRow.detail = 'metadata tables not found — set up the target metadata, then this vault\'s reference rows will be added in the same step. This uses the target username and password from the Connections step and does not start the data load.';
      pdiRow.applyLabel = 'Set up metadata';
      pdiRow.apply = async ()=>{
        // The metadata setup container reads its TARGET from hop/postgres-
        // environment.json on disk — deploy the current design's config
        // first so it can never run against a stale (e.g. internal) target.
        await deployRuntimeCredentials({ silent:true });
        await deployHopConfig({ silent:true });
        const r = await localFetch('/api/docker/bootstrap', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' }).then(x=>x.json());
        if (!r.ok) throw new Error(explainBootstrapError(r));
        // Metadata setup only creates the empty shared metadata structure. Registering this
        // vault's reference rows is always the next step — do it in the
        // same click instead of surfacing a second "missing" state that
        // needs another Deploy (the two-step deployment problem).
        await executeSqlAgainstTarget(getExportSql('pdimeta'));
      };
    }
    else if (pdiRow.state !== 'current' && pdiRow.state !== 'unknown') pdiRow.apply = async ()=>{ await executeSqlAgainstTarget(getExportSql('pdimeta')); };
    rows.push(pdiRow);

    // 6-8 · deployment files (workbook, engine config, source connection)
    const wbName = mappingWorkbookFilename();
    const fResp = await localFetch(`/api/file-status`, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ files: [
        { root:'mappings', name: wbName },
        { root:'hop', name: 'postgres-environment.json' },
        { root:'rdbms', name: 'source.json' },
      ] }) }).then(r=>r.json());
    if (!fResp.ok){
      const why = fResp.error ? String(fResp.error) : 'file check failed';
      [['workbook','Metadata spreadsheet'], ['engineconfig','Engine config (hop/)'],
       ['sourceconn', `Source connection (${DIALECTS[v.dialect].label})`]].forEach(([key,label])=>
        rows.push({ key, label, state:'unknown', detail: `could not check project files — ${why}` }));
    }
    if (fResp.ok){
      const by = {}; fResp.files.forEach(f=>{ by[f.root] = f; });
      const wbRow = deriveFileRow('workbook', 'Metadata spreadsheet', by.mappings, null);
      if (wbRow.state === 'current') wbRow.detail = `${wbName} · ${wbRow.detail}`;
      if (wbRow.state !== 'current') wbRow.apply = async ()=>{ await deployMappingWorkbook(); };
      wbRow.reapply = async ()=>{ await deployMappingWorkbook(); }; // Apply All also refreshes it every time
      rows.push(wbRow);
      const cfgRow = deriveFileRow('engineconfig', 'Engine config (hop/)', by.hop, buildHopEnvironmentJson());
      if (cfgRow.state !== 'current') cfgRow.apply = async ()=>{ await deployHopConfig({ silent:true }); };
      rows.push(cfgRow);
      const scRow = deriveFileRow('sourceconn', `Source connection (${DIALECTS[v.dialect].label})`, by.rdbms, buildHopSourceConnectionJson());
      if (scRow.state !== 'current') scRow.apply = async ()=>{ await deployHopSourceConnection(); };
      rows.push(scRow);
    }

    deployStatus = { rows, probedAt: new Date(), error: null, fingerprint: designFingerprint() };
  } catch(err){
    deployStatus = { rows: [], error: err.message };
  }
  deployProbing = false;
  renderAll(); setActiveTabViewOnly('export');
}

function deployChip(stateK){
  const m = {
    current: ['var(--ok)', 'Deployed ✓'],
    stale:   ['var(--hub)', 'Out of date'],
    missing: ['var(--err)', 'Not deployed'],
    unknown: ['var(--muted)', 'Unknown'],
    busy:    ['var(--brand)', 'Applying…'],
    fail:    ['var(--err)', 'Failed'],
  }[stateK] || ['var(--muted)', stateK];
  return `<span class="tag" style="border-color:${m[0]};color:${m[0]};white-space:nowrap;">${m[1]}</span>`;
}

function deployRowGroup(row){
  const key=String((row&&row.key)||'');
  if(state.externalTables.enabled){
    if(['external-database','external-core'].includes(key)) return '1 · Physical target';
    if(['database','fdw-infrastructure','vault-support','fdw-foreign-tables'].includes(key)) return '2 · PostgreSQL gateway';
    return '3 · Engine and project';
  }
  if(['database','staging','vault','pdimeta'].includes(key)) return '1 · Database';
  return '2 · Engine and project';
}

function deployStageDefinitions(){
  return state.externalTables.enabled
    ? [
        {id:'physical-target',label:'1 · Physical target'},
        {id:'postgres-gateway',label:'2 · PostgreSQL gateway'},
        {id:'engine-project',label:'3 · Engine and project'},
      ]
    : [
        {id:'database',label:'1 · Database'},
        {id:'engine-project',label:'2 · Engine and project'},
      ];
}

function deployStageState(stageRows){
  const priority={current:0,stale:1,missing:2,unknown:3,fail:4,busy:5};
  return (stageRows||[]).reduce((worst,row)=>
    (priority[row.state]||0)>(priority[worst]||0)?row.state:worst,'current');
}

function deployStageSummary(stage, stageRows){
  const byKey=Object.fromEntries((stageRows||[]).map(r=>[r.key,r]));
  const stateK=deployStageState(stageRows);
  if(stage.id==='physical-target'){
    const ext=state.externalTables;
    const engine=(DIALECTS[ext.remoteDialect]||{}).label||ext.remoteDialect||'Target';
    const name=ext.studioDatabase||ext.remoteDatabase||'target';
    const total=externalCoreTableCount();
    const dbReady=byKey['external-database']&&byKey['external-database'].state==='current';
    const coreReady=byKey['external-core']&&byKey['external-core'].state==='current';
    if(dbReady&&coreReady) return `${engine} ${name} · ${total}/${total} core Vault tables`;
    if(dbReady) return `Target database ready · core Vault tables need attention`;
    return `Target database or core Vault tables need attention`;
  }
  if(stage.id==='postgres-gateway'){
    const total=externalCoreTableCount();
    if(stateK==='current') return `FDW ready · ${total}/${total} bindings · local support ready`;
    const short={
      database:'gateway database',
      'fdw-infrastructure':'FDW connection and roles',
      'vault-support':'local support objects',
      'fdw-foreign-tables':'foreign-table bindings',
    };
    const pending=stageRows.filter(r=>r.state!=='current').map(r=>short[r.key]||r.label);
    return `${pending.join(', ') || 'Gateway checks'} ${pending.length===1?'needs':'need'} attention`;
  }
  if(stage.id==='engine-project'){
    if(stateK==='current') return `Staging, metadata and project files are current`;
    const pending=stageRows.filter(r=>r.state!=='current').length;
    const ready=stageRows.length-pending;
    return `${pending} check${pending===1?'':'s'} need attention · ${ready} ready`;
  }
  if(stage.id==='database'){
    if(stateK==='current') return `Database objects are current`;
    return `${stageRows.filter(r=>r.state!=='current').length} database check(s) need attention`;
  }
  return stateK==='current'?'Project files are current':'Project files need attention';
}

function deployMiniIcon(stateK){
  const marks={current:'✓',stale:'!',missing:'×',unknown:'?',busy:'…',fail:'×'};
  const labels={current:'Deployed',stale:'Out of date',missing:'Not deployed',unknown:'Unknown',busy:'Applying',fail:'Failed'};
  return `<span class="deploy-check-icon ${stateK}" title="${labels[stateK]||stateK}">${marks[stateK]||'?'}</span>`;
}

function deployBoardHtml(){
  if (deployProbing) return `<div class="ai-status busy mt"><span class="dot"></span>Checking the target database and project files…</div>`;
  if (!deployStatus) return `<p class="hint mt">Status has not been checked yet — press "Check status".</p>`;
  if (deployStatus.error) return `<div class="ai-status err mt">${escapeHtml(deployStatus.error)}</div>`;
  const stale = deployBoardIsStale();
  const busy = deployBusy();
  const pending = deployStatus.rows.filter(r=>r.apply).length;
  const grouped=new Map(deployStageDefinitions().map(stage=>[stage.label,{...stage,rows:[]} ]));
  deployStatus.rows.forEach(row=>{
    const label=deployRowGroup(row);
    if(!grouped.has(label)) grouped.set(label,{id:'other',label,rows:[]});
    grouped.get(label).rows.push(row);
  });
  const stages=[...grouped.values()].filter(stage=>stage.rows.length);
  const stageHtml=stages.map(stage=>{
    const stateK=deployStageState(stage.rows);
    const open=stateK!=='current';
    const children=stage.rows.map(r=>`<div class="deploy-check">
      ${deployMiniIcon(r.state)}
      <div class="deploy-check-label">${escapeHtml(r.label)}</div>
      <div class="deploy-check-detail">${escapeHtml(r.detail||'')}${r.error?` · <span class="deploy-check-error">${escapeHtml(r.error)}</span>`:''}</div>
      <div>${stale?'':(r.apply?`<button class="btn small primary" data-deploy-row="${r.key}" ${busy?'disabled':''}>${r.applyLabel||(r.state==='stale'?'Update':'Deploy')}</button>`:(r.reapply?`<button class="btn small ghost" data-deploy-row="${r.key}" ${busy?'disabled':''}>Re-deploy</button>`:''))}</div>
    </div>`).join('');
    return `<details class="deploy-stage" data-deploy-group="${stage.id}" ${open?'open':''}>
      <summary class="deploy-stage-summary">
        <span class="deploy-stage-caret">▶</span>
        <span class="deploy-stage-title">${escapeHtml(stage.label)}</span>
        <span class="deploy-stage-summary-text">${escapeHtml(deployStageSummary(stage,stage.rows))}</span>
        ${deployChip(stateK)}
      </summary>
      <div class="deploy-stage-body">${children}</div>
    </details>`;
  }).join('');
  return `
    ${stale ? `<div class="ai-status err mt">The design changed since this check — press "Check status" again before applying anything.</div>` : ''}
    <div class="deploy-stage-list mt">${stageHtml}</div>
    <p class="deploy-stage-note">Expand a stage for detailed checks and individual actions.</p>
    <p class="hint mt mb0">${pending ? `${pending} update(s) pending.` : 'Everything is deployed and current.'}${deployStatus.probedAt ? ` · checked ${deployStatus.probedAt.toLocaleTimeString()}` : ''} · checked directly against the target database and project files. Apply All always refreshes runtime secrets and the metadata spreadsheet.</p>`;
}

async function runDeployRow(key){
  if (deployBusy()) return;
  if (deployBoardIsStale()){ toast('The design changed since the last check — press "Check status" first.', 'err'); return; }
  const row = deployStatus && deployStatus.rows.find(r=>r.key===key);
  if (!row) return;
  const fn = row.apply || row.reapply;
  if (!fn) return;
  const obsolete = (row.delta && row.delta.obsoleteColumns) || [];
  if (obsolete.length && !confirm(
    `Remove ${obsolete.length} obsolete Link Satellite column(s)?\n\n` +
    obsolete.map(c=>'· '+c.schema+'.'+c.table+'.'+c.column).join('\n') +
    `\n\nThese columns were generated by an older Studio version but are never populated by the Link Satellite loader.`
  )) return;
  row.state = 'busy'; row.error = null;
  renderAll(); setActiveTabViewOnly('export');
  try {
    await fn();
    row.state = 'current'; // resolved — never leave a busy row behind
    toast(`${row.label}: applied.`, 'ok');
    await probeDeploymentStatus(); // re-derive truth rather than assume
  } catch(err){
    row.state = 'fail'; row.error = explainTargetSqlError(err.message);
    toast(`${row.label}: ${row.error}`, 'err');
    renderAll(); setActiveTabViewOnly('export');
  }
}

async function applyAllPending(){
  if (deployBusy() || !deployStatus) return;
  if (deployBoardIsStale()){ toast('The design changed since the last check — press "Check status" first.', 'err'); return; }
  const credentialProblem=runtimeCredentialValidationMessage();
  if(credentialProblem){ toast(credentialProblem,'err'); return; }
  const pending = deployStatus.rows.filter(r=>r.apply && !['credentials','workbook'].includes(r.key)).slice().sort((a,b)=>{
    const aRoute = a.workflow==='external-route' ? 0 : 1;
    const bRoute = b.workflow==='external-route' ? 0 : 1;
    return aRoute-bRoute;
  });
  const steps=[{label:'Runtime secrets (.env)'},...pending.map(r=>({label:r.label})),{label:'Metadata spreadsheet'}];
  const obsolete = pending.flatMap(r=>(r.delta && r.delta.obsoleteColumns)||[]);
  const repair = obsolete.length
    ? `\n\nThis includes removing ${obsolete.length} obsolete Link Satellite column(s) that the loader never populates:\n${obsolete.map(c=>'· '+c.schema+'.'+c.table+'.'+c.column).join('\n')}`
    : '';
  if (!confirm(`Apply ${steps.length} deployment step(s), in order?\n\n${steps.map(r=>'· '+r.label).join('\n')}${repair}\n\nThe root .env secrets are synchronised first and the mapping spreadsheet is regenerated last on every Apply All.`)) return;
  deployApplying = true;
  try {
    const credentialsRow=deployStatus.rows.find(r=>r.key==='credentials');
    if(credentialsRow) credentialsRow.state='busy';
    renderAll(); setActiveTabViewOnly('export');
    await deployRuntimeCredentials({silent:true});
    if(credentialsRow){ credentialsRow.state='current'; credentialsRow.apply=null; }

    for (const row of pending){
      row.state = 'busy'; renderAll(); setActiveTabViewOnly('export');
      try { await row.apply(); row.state = 'current'; row.apply = null; }
      catch(err){ row.state = 'fail'; row.error = explainTargetSqlError(err.message); throw new Error(`${row.label}: ${row.error}`); }
    }

    const workbookRow=deployStatus.rows.find(r=>r.key==='workbook');
    if(workbookRow) workbookRow.state='busy';
    renderAll(); setActiveTabViewOnly('export');
    await deployMappingWorkbook({silent:true});
    if(workbookRow){ workbookRow.state='current'; workbookRow.apply=null; }
    toast('Apply All completed. Runtime secrets and the mapping spreadsheet were refreshed.', 'ok');
  } catch(err){
    toast(err.message, 'err');
  } finally {
    deployApplying = false;
    await probeDeploymentStatus();
  }
}

// (The "run canonical Python validator" button was removed from the Export
// page by request. The server's /api/validate-workbook endpoint remains for
// CI or scripted use — POST { workbookBase64, filename }.)

/* =========================================================================
   TARGET SCHEMA DIFF — compares the generated staging/vault DDL against
   what actually exists on the target database and produces an INCREMENTAL
   script: CREATE TABLE for missing objects, ALTER TABLE ADD COLUMN for
   missing columns. This is how a drift merge (new tables/columns) reaches
   an already-deployed vault without re-running the full DDL. Type changes
   are reported as warnings only — never auto-altered.
   ========================================================================= */
// Parses the app's OWN generated DDL (format is under our control) into
// {schema, name, columns:[{name,type}], obsoleteColumns:[], createSql}
// objects. Pure, testable.
function parseGeneratedDdlObjects(sql){
  const objects = [];
  const idPattern = '(?:"(?:[^"]|"")*"|`(?:[^`]|``)*`|\\[(?:[^\\]]|\\]\\])*\\]|[A-Za-z_][A-Za-z0-9_]*)';
  const unquoteIdentifier = value => {
    const text=String(value||'');
    if(text.startsWith('"') && text.endsWith('"')) return text.slice(1,-1).replace(/""/g,'"');
    if(text.startsWith('`') && text.endsWith('`')) return text.slice(1,-1).replace(/``/g,'`');
    if(text.startsWith('[') && text.endsWith(']')) return text.slice(1,-1).replace(/]]/g,']');
    return text;
  };
  const parseMatches = re => {
    let m;
    while ((m = re.exec(sql))){
      const cols = [];
      m[3].split('\n').forEach(line=>{
        const t = line.trim().replace(/,\s*$/, '');
        if (!t || /^(PRIMARY|CONSTRAINT|UNIQUE|FOREIGN|CHECK)\b/i.test(t)) return;
        const cm = t.match(new RegExp(`^(${idPattern})\\s+(.+)$`, 'i'));
        if (cm){
          const type = cm[2]
            .replace(/\s+OPTIONS\s*\([^)]*\)/ig, '')
            .replace(/\s+NOT NULL\b/ig, '')
            .trim();
          cols.push({ name:unquoteIdentifier(cm[1]).toLowerCase(), type });
        }
      });
      const foreign = /^CREATE FOREIGN TABLE/i.test(m[0]);
      const schema=unquoteIdentifier(m[1]).toLowerCase();
      const name=unquoteIdentifier(m[2]).toLowerCase();
      if(objects.some(o=>o.schema===schema && o.name===name)) continue;
      objects.push({ schema, name, columns:cols, createSql:m[0], foreign, relationKind:foreign?'f':'r', indexes:[], obsoleteColumns:[] });
    }
  };
  parseMatches(new RegExp(`CREATE (?:FOREIGN )?TABLE IF NOT EXISTS\\s+(${idPattern})\\.(${idPattern})\\s*\\(([\\s\\S]*?)\\n\\)(?:\\s*SERVER\\s+\\S+)?;`, 'g'));
  // SQL Server has no CREATE TABLE IF NOT EXISTS syntax. Generated remote
  // DDL wraps a normal CREATE TABLE statement in an OBJECT_ID guard.
  parseMatches(new RegExp(`CREATE TABLE\\s+(${idPattern})\\.(${idPattern})\\s*\\(([\\s\\S]*?)\\n\\);`, 'g'));
  let m;
  const indexRe = /CREATE INDEX IF NOT EXISTS\s+(\w+)\s+ON\s+(\w+)\.(\w+)\s*\((\w+)\);/g;
  while ((m = indexRe.exec(sql))){
    const schema = m[2].toLowerCase();
    const table = m[3].toLowerCase();
    const column = m[4].toLowerCase();
    const object = objects.find(o=>o.schema===schema && o.name===table);
    if (!object) continue;
    const index = { name:m[1].toLowerCase(), column, createSql:m[0] };
    object.indexes.push(index);
    const col = object.columns.find(c=>c.name===column);
    if (col) col.indexSql = m[0];
  }
  // Repair metadata is intentionally not printed in the full/fresh DDL.
  // It belongs only to a live target diff: a new database must never show
  // the obsolete Hub columns in its Link Satellite definition at all.
  (state.linkSats||[]).forEach(s=>{
    const name = lsatName(s.entity, s.concern).toLowerCase();
    const obsoleteColumns = legacyLinkSatHubColumns(s).map(c=>c.toLowerCase());
    [name, `${name}_err`].forEach(tableName=>{
      const object = objects.find(o=>o.schema==='data_vault' && o.name===tableName);
      if (object) object.obsoleteColumns.push(...obsoleteColumns.filter(c=>!object.obsoleteColumns.includes(c)));
    });
  });
  return objects;
}
// Normalises an information_schema.columns row to the same vocabulary the
// generated DDL uses, so types can be compared meaningfully.
function normalizeCatalogType(row){
  const t = String(row.data_type||'').toLowerCase();
  if (t === 'character varying') return row.character_maximum_length ? `varchar(${row.character_maximum_length})` : 'varchar';
  if (t === 'character') return `char(${row.character_maximum_length||1})`;
  if (t === 'numeric' || t === 'decimal'){
    return (row.numeric_precision!=null && row.numeric_scale!=null) ? `numeric(${row.numeric_precision},${row.numeric_scale})` : 'numeric';
  }
  if (t === 'timestamp without time zone') return 'timestamp';
  if (t === 'timestamp with time zone') return 'timestamptz';
  if (t === 'array') return `${String(row.udt_name||'text').replace(/^_/,'')}[]`;
  return t;
}
function normalizeExpectedType(type){
  let t = String(type||'').toLowerCase().trim().replace(/\s+/g,' ');
  const alias = { 'int':'integer', 'int4':'integer', 'int8':'bigint', 'int2':'smallint', 'bool':'boolean', 'float':'double precision', 'float8':'double precision' };
  if (alias[t]) return alias[t];
  return t;
}

function singleColumnIndexCatalogSql(){
  return `
    SELECT ns.nspname AS table_schema,
           tbl.relname AS table_name,
           att.attname AS column_name,
           idx.relname AS index_name
    FROM pg_index ix
    JOIN pg_class tbl ON tbl.oid = ix.indrelid
    JOIN pg_namespace ns ON ns.oid = tbl.relnamespace
    JOIN pg_class idx ON idx.oid = ix.indexrelid
    JOIN LATERAL unnest(ix.indkey) WITH ORDINALITY AS key(attnum, ordinal_position)
      ON key.ordinal_position = 1
    JOIN pg_attribute att ON att.attrelid = tbl.oid AND att.attnum = key.attnum
    WHERE ns.nspname IN ('staging','data_vault')
      AND ix.indnkeyatts = 1
      AND ix.indexprs IS NULL
      AND ix.indpred IS NULL
    ORDER BY ns.nspname, tbl.relname, att.attname
  `;
}

// live rows: [{table_schema, table_name, column_name, data_type, ...}]
// liveIndexes: null skips index comparison; otherwise rows identify an
// equivalent single-column index by schema + table + column.
function computeTargetDelta(expectedObjects, liveRows, liveIndexes=null, liveRelations=null){
  const live = {};
  (liveRows||[]).forEach(r=>{
    const key = `${String(r.table_schema).toLowerCase()}.${String(r.table_name).toLowerCase()}`;
    (live[key] = live[key] || {})[String(r.column_name).toLowerCase()] = normalizeCatalogType(r);
  });
  const liveIndexKeys = liveIndexes == null ? null : new Set((liveIndexes||[]).map(r=>
    `${String(r.table_schema).toLowerCase()}.${String(r.table_name).toLowerCase()}.${String(r.column_name).toLowerCase()}`
  ));
  const liveRelationKinds = liveRelations == null ? null : new Map((liveRelations||[]).map(r=>[
    `${String(r.table_schema).toLowerCase()}.${String(r.table_name).toLowerCase()}`, String(r.relkind||'')
  ]));
  const delta = { missingTables: [], missingColumns: [], missingIndexes: [], obsoleteColumns: [], typeMismatches: [], relationKindMismatches: [], checkedTables: expectedObjects.length, expectedObjects };
  expectedObjects.forEach(obj=>{
    const key = `${obj.schema}.${obj.name}`;
    const liveCols = live[key];
    if (!liveCols){ delta.missingTables.push(obj); return; }
    if (liveRelationKinds && liveRelationKinds.has(key)){
      const actual=liveRelationKinds.get(key), expected=obj.foreign?'f':(obj.name==='vw_information_schema_columns_data_vault'?'v':'r');
      if (actual!==expected) delta.relationKindMismatches.push({schema:obj.schema,table:obj.name,live:actual,expected});
    }
    const missingColumnNames = new Set();
    obj.columns.forEach(c=>{
      const liveType = liveCols[c.name];
      if (liveType === undefined){
        const missing = { schema: obj.schema, table: obj.name, column: c.name, type: c.type };
        if (obj.foreign===true) missing.foreign = true;
        if (c.indexSql) missing.indexSql = c.indexSql;
        delta.missingColumns.push(missing);
        missingColumnNames.add(c.name);
      } else if (liveType !== normalizeExpectedType(c.type)){
        delta.typeMismatches.push({ schema: obj.schema, table: obj.name, column: c.name, live: liveType, expected: normalizeExpectedType(c.type) });
      }
    });
    (obj.obsoleteColumns||[]).forEach(column=>{
      if (liveCols[column] !== undefined){
        const obsolete = { schema:obj.schema, table:obj.name, column };
        if (obj.foreign===true) obsolete.foreign = true;
        delta.obsoleteColumns.push(obsolete);
      }
    });
    if (liveIndexKeys){
      (obj.indexes||[]).forEach(index=>{
        const indexKey = `${obj.schema}.${obj.name}.${index.column}`;
        if (!missingColumnNames.has(index.column) && !liveIndexKeys.has(indexKey)){
          delta.missingIndexes.push({
            schema:obj.schema, table:obj.name, column:index.column,
            name:index.name, createSql:index.createSql,
          });
        }
      });
    }
  });
  return delta;
}
function targetDeltaIsEmpty(delta){
  return !delta.missingTables.length && !delta.missingColumns.length
    && !(delta.missingIndexes||[]).length && !(delta.obsoleteColumns||[]).length
    && !(delta.relationKindMismatches||[]).length && !delta.typeMismatches.length;
}
function buildIncrementalSql(delta){
  const parts = [
    `-- =========================================================`,
    `-- INCREMENTAL DDL — required target schema updates`,
    `-- Generated by Data Vault Studio (Diff against target)`,
    `-- =========================================================`,
    ``,
  ];
  const ownerFor = schema => schema === 'staging' ? 'staging' : 'data_vault';
  delta.typeMismatches.forEach(x=>{
    parts.push(`-- WARNING: ${x.schema}.${x.table}.${x.column} is "${x.live}" on the target but "${x.expected}" in the generated DDL.`);
    parts.push(`--          Review manually — column types are never auto-altered by this script.`);
  });
  if (delta.typeMismatches.length) parts.push('');
  (delta.relationKindMismatches||[]).forEach(x=>{
    parts.push(`-- FATAL: ${x.schema}.${x.table} has relation kind "${x.live}" but the design requires "${x.expected}".`);
    parts.push(`--        Relation-kind collisions are never auto-repaired; remove or rename the conflicting local relation first.`);
  });
  if ((delta.relationKindMismatches||[]).length) parts.push('');
  const bySchema = {};
  const schemaItems = schema => (bySchema[schema] = bySchema[schema] || { tables:[], columns:[], indexes:[], obsoleteColumns:[] });
  delta.missingTables.forEach(t=>schemaItems(t.schema).tables.push(t));
  delta.missingColumns.forEach(c=>schemaItems(c.schema).columns.push(c));
  (delta.missingIndexes||[]).forEach(index=>schemaItems(index.schema).indexes.push(index));
  (delta.obsoleteColumns||[]).forEach(column=>schemaItems(column.schema).obsoleteColumns.push(column));
  Object.entries(bySchema).forEach(([schema, items])=>{
    parts.push(schemaOwnershipFixSql(schema, ownerFor(schema)));
    parts.push(`SET ROLE ${ownerFor(schema)};`);
    parts.push('');
    items.tables.forEach(t=>{
      parts.push(`-- New table: ${schema}.${t.name}`);
      parts.push(t.createSql);
      parts.push(`${t.foreign?'ALTER FOREIGN TABLE':'ALTER TABLE'} ${schema}.${t.name} OWNER TO ${ownerFor(schema)};`);
      (t.indexes||[]).forEach(index=>parts.push(index.createSql));
      parts.push('');
    });
    items.columns.forEach(c=>{
      const object = delta.missingTables.find(t=>t.schema===c.schema&&t.name===c.table) || null;
      const foreign = c.foreign === true || (delta.expectedObjects||[]).some(t=>t.schema===c.schema&&t.name===c.table&&t.foreign);
      parts.push(`${foreign?'ALTER FOREIGN TABLE':'ALTER TABLE'} ${c.schema}.${c.table} ADD COLUMN IF NOT EXISTS ${c.column} ${c.type};`);
      if (c.indexSql) parts.push(c.indexSql);
    });
    if (items.columns.length) parts.push('');
    items.indexes.forEach(index=>parts.push(index.createSql));
    if (items.indexes.length) parts.push('');
    items.obsoleteColumns.forEach(column=>{
      parts.push(`-- Remove a redundant Link Satellite Hub key from older Studio DDL.`);
      const foreign = column.foreign === true || (delta.expectedObjects||[]).some(t=>t.schema===column.schema&&t.name===column.table&&t.foreign);
      parts.push(`${foreign?'ALTER FOREIGN TABLE':'ALTER TABLE'} ${column.schema}.${column.table} DROP COLUMN IF EXISTS ${column.column};`);
    });
    if (items.obsoleteColumns.length) parts.push('');
    parts.push(crossRoleGrantsSql(schema, ownerFor(schema), schema === 'staging' ? ['pdi_meta', 'data_vault'] : ['pdi_meta', 'staging']));
    parts.push('RESET ROLE;');
    parts.push('');
  });
  return parts.join('\n');
}

let targetDelta = null;
let targetDeltaSql = '';

async function runTargetDiff(){
  const el = document.getElementById('target-diff-result');
  const v = state.vault;
  if (!v.dvHost || !v.dvDatabase || !v.dvUser){
    if (el) el.innerHTML = `<div class="ai-status err mt">Set the target connection (host, database, user) on the Connections step first.</div>`;
    return;
  }
  if (el) el.innerHTML = `<div class="ai-status busy mt"><span class="dot"></span>Reading the target's live schema…</div>`;
  try {
    const expected = parseGeneratedDdlObjects(getExportSql('staging'))
      .concat(parseGeneratedDdlObjects(getExportSql('datavault')));
    const rows = await queryTarget(`
      SELECT table_schema, table_name, column_name, data_type,
             character_maximum_length, numeric_precision, numeric_scale, udt_name
      FROM information_schema.columns
      WHERE table_schema IN ('staging','data_vault')
    `);
    const indexes = await queryTarget(singleColumnIndexCatalogSql());
    const relations = await queryTarget(`SELECT n.nspname AS table_schema, c.relname AS table_name, c.relkind
      FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
      WHERE n.nspname IN ('staging','data_vault')`);
    targetDelta = computeTargetDelta(expected, rows, indexes, relations);
    targetDeltaSql = targetDeltaIsEmpty(targetDelta) ? '' : buildIncrementalSql(targetDelta);
    renderTargetDiffResult(el);
  } catch(err){
    if (el) el.innerHTML = `<div class="ai-status err mt">${escapeHtml(err.message)}</div>`;
  }
}

function renderTargetDiffResult(el){
  if (!el || !targetDelta) return;
  const d = targetDelta;
  if (targetDeltaIsEmpty(d)){
    el.innerHTML = `<div class="ai-status ok mt">Target matches the generated DDL — all ${d.checkedTables} expected object(s) exist with all expected columns.</div>`;
    return;
  }
  el.innerHTML = `
    <div class="ai-status ${d.missingTables.length || d.missingColumns.length || d.missingIndexes.length || d.obsoleteColumns.length ? 'err' : 'busy'} mt" style="align-items:flex-start;">
      <span>
        ${d.missingTables.length ? `${d.missingTables.length} table(s) missing on the target: ${d.missingTables.slice(0,10).map(t=>`<span class="mono">${escapeHtml(t.schema+'.'+t.name)}</span>`).join(', ')}${d.missingTables.length>10?'…':''}<br>` : ''}
        ${d.missingColumns.length ? `${d.missingColumns.length} column(s) missing: ${d.missingColumns.slice(0,10).map(c=>`<span class="mono">${escapeHtml(c.schema+'.'+c.table+'.'+c.column)}</span>`).join(', ')}${d.missingColumns.length>10?'…':''}<br>` : ''}
        ${d.missingIndexes.length ? `${d.missingIndexes.length} hash index(es) missing: ${d.missingIndexes.slice(0,10).map(i=>`<span class="mono">${escapeHtml(i.schema+'.'+i.table+'.'+i.column)}</span>`).join(', ')}${d.missingIndexes.length>10?'…':''}<br>` : ''}
        ${d.obsoleteColumns.length ? `${d.obsoleteColumns.length} obsolete Link Satellite column(s) to remove: ${d.obsoleteColumns.slice(0,10).map(c=>`<span class="mono">${escapeHtml(c.schema+'.'+c.table+'.'+c.column)}</span>`).join(', ')}${d.obsoleteColumns.length>10?'…':''}<br>` : ''}
        ${d.typeMismatches.length ? `${d.typeMismatches.length} type mismatch(es) — see warnings in the script (never auto-altered).` : ''}
      </span>
    </div>
    <div class="field mt">
      <label>Incremental DDL <span class="hint">(only required schema changes; obsolete Link Satellite columns are clearly listed before removal)</span></label>
      <textarea class="code-edit" id="target-diff-sql" spellcheck="false" wrap="off" style="min-height:180px;">${escapeHtml(targetDeltaSql)}</textarea>
    </div>
    <div class="grid cols-2 mt">
      <button class="btn" id="btn-target-diff-dl">⬇ Download incremental DDL</button>
      <button class="btn primary" id="btn-target-diff-run">Execute against target</button>
    </div>`;
  const ta = document.getElementById('target-diff-sql');
  if (ta) ta.addEventListener('input', e=> targetDeltaSql = e.target.value);
  document.getElementById('btn-target-diff-dl').addEventListener('click', ()=>
    downloadBlob(targetDeltaSql, `${state.vault.name||'vault'}_incremental_ddl.sql`, 'text/plain'));
  document.getElementById('btn-target-diff-run').addEventListener('click', async ()=>{
    // This SQL is user-editable free text. Generated Link Satellite repairs
    // can contain a narrowly-scoped DROP COLUMN, and any destructive statement
    // still requires explicit confirmation before execution.
    const destr = destructiveSqlKeywords(targetDeltaSql);
    if (destr.length){
      const kinds = [...new Set(destr)].join(', ');
      if (!confirm(`This SQL contains ${destr.length} destructive statement keyword(s) (${kinds}).\n\nReview the listed obsolete columns carefully. Execute against the target?`)) return;
    }
    await runSqlAgainstTarget(targetDeltaSql, 'Incremental DDL');
    runTargetDiff(); // re-diff so the panel reflects the now-updated target
  });
}

// Translate raw Postgres permission errors into something the person can
// actually act on, instead of a bare "permission denied".
function explainTargetSqlError(message){
  const m = String(message || '');
  let hint = '';
  const schemaDenied = m.match(/permission denied for schema (\w+)/i);
  const roleMissing = m.match(/role "([\w]+)" does not exist/i);
  const notOwner = m.match(/must be owner of schema (\w+)/i);
  if (/lock timeout|canceling statement due to lock/i.test(m)){
    return m + ' — something else holds a lock on these tables (a running engine load, the scheduler, or an abandoned session). Stop the engine / disable the scheduler and retry; to find the blocker, run this using a PostgreSQL account that can view active sessions: SELECT pid, state, pg_blocking_pids(pid), left(query,80) FROM pg_stat_activity WHERE datname = current_database();';
  }
  if (/statement timeout/i.test(m)){
    return m + ' — the script ran longer than 120s. Check the target database load and retry.';
  }
  if (schemaDenied || notOwner){
    const schema = (schemaDenied || notOwner)[1];
    hint = ` — schema "${schema}" is owned by another user. Run this using the schema owner or another PostgreSQL account allowed to change ownership: ALTER SCHEMA ${schema} OWNER TO ${schema};`;
  } else if (roleMissing){
    hint = ` — the required Data Vault users are missing from this database server. Use Set up metadata on the Export & Deploy page, or run start.sh up --build from the command line.`;
  }
  return m + hint;
}

function explainBootstrapError(r){
  const msg = r.error || `Target setup failed at step: ${r.step||'?'}.`;
  if (/password authentication failed for user/i.test(msg)){
    return msg + ' — check the Target username and password on the Connections step. That PostgreSQL account must be allowed to create the target database, users and schemas.';
  }
  if (/connection to server at "postgres"/i.test(msg)){
    return msg + ' — the engine settings still pointed at the internal service. They have been saved again; run target setup once more.';
  }
  if (/could not translate host name|connection refused|timeout expired/i.test(msg)){
    return msg + ' — the target setup runs inside a container, so "localhost" refers to the container itself. Use the database server\'s hostname or IP address (or host.docker.internal for a database on this machine).';
  }
  return msg;
}

async function executeSqlAgainstTarget(sql, options={}){
  if (state.externalTables.enabled && !options.allowExternalLocalDdl && /(?:CREATE|ALTER)\s+FOREIGN\s+TABLE|CREATE\s+EXTENSION[\s\S]*?jdbc_fdw/i.test(String(sql||''))){
    throw new Error('External core tables must be deployed from Vault → External Data Vault tables so remote tables are verified before local FDW objects are applied.');
  }
  const v = state.vault;
  await ensureLocalServerReachable();
  const resp = await localFetch(`/api/execute-sql`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ host: v.dvHost, port: v.dvPort, database: v.dvDatabase, user: v.dvUser, password: v.dvPassword, sql }),
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Execution failed.');
  return data;
}

async function queryPostgresDatabase(database, sql, options={}){
  const v = state.vault;
  await ensureLocalServerReachable();
  const resp = await localFetch(`/api/query`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ host: v.dvHost, port: v.dvPort, database, user: v.dvUser, password: v.dvPassword, sql, role: options.role || undefined }),
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Query failed.');
  return data.rows || [];
}

function expectedDataVaultTableNames(){
  const names = [];
  const add = n => { if (n){ names.push(n); names.push(`${n}_err`); } };
  state.hubs.forEach(h=>add(hubName(h.entity)));
  state.links.forEach(l=>add(linkNameOf(l.entity)));
  state.hubSats.forEach(s=>add(satName(s.entity, s.concern)));
  state.linkSats.forEach(s=>add(lsatName(s.entity, s.concern)));
  return [...new Set(names)];
}

async function findMissingDataVaultTables(){
  const expected = expectedDataVaultTableNames();
  if (expected.length===0) return [];
  const rows = await queryTarget(`SELECT DISTINCT table_name FROM data_vault.vw_information_schema_columns_data_vault`);
  const live = new Set(rows.map(r=>String(r.table_name||'').toLowerCase()));
  return expected.filter(n=>!live.has(String(n).toLowerCase()));
}

async function runSqlAgainstTarget(sql, label){
  const v = state.vault;
  if (!confirm(`Run ${label} against ${v.dvHost}:${v.dvPort}/${v.dvDatabase}?\n\nThis executes real SQL on that database, inside a transaction — if anything fails, nothing is committed. This cannot be undone by this app.`)) return;
  try {
    await executeSqlAgainstTarget(sql);
    toast(`${label} applied to ${v.dvDatabase}.`, 'ok');
  } catch(err){
    toast(`${label} failed: ${err.message}`, 'err');
  }
}

// one-off metadata setup (start.sh's --build flag).
// (The one-off --build engine start was replaced by the deployment board's
// Set up metadata, which refreshes the engine config first and reports errors
// properly. start.sh up --external-postgres --build remains for CLI users.)

async function dockerRunHop(){
  const btn = document.getElementById('btn-docker-runhop');
  const statusEl = document.getElementById('docker-runhop-status');
  if (!await requireLicenseAccepted(()=> dockerRunHop())) return;
  if (deployBusy()){ toast('A deploy is still running — wait for it to finish before starting the engine.', 'err'); return; }

  const validation = validateModel();
  if (validation.errors.length){
    const msg = `The engine was not started because the design has ${validation.errors.length} blocking validation error(s). Open Export & Deploy to review them.`;
    statusEl.innerHTML = `<div class="ai-status err mt">${escapeHtml(msg)}</div>`;
    toast(msg, 'err');
    return;
  }
  if (engineModeInvalid()){
    const msg = 'The bundled sakila demo source only runs with the internal Postgres target (start.sh rejects --demo with --external-postgres). Switch the target to "Postgres Internal", or the source away from "MySQL Demo".';
    statusEl.innerHTML = `<div class="ai-status err mt" style="align-items:flex-start;"><span>${escapeHtml(msg)}</span></div>`;
    toast('Invalid run mode — see details.', 'err');
    return;
  }
  const sourceDriverSpec=jdbcDriverSpec(state.vault.dialect);
  if (sourceDriverSpec){
    try {
      const drv = await checkJdbcDrivers();
      if (!drv[sourceDriverSpec.statusField]){
        statusEl.innerHTML = `<div class="ai-status err mt" style="align-items:flex-start;"><span>No ${escapeHtml(sourceDriverSpec.label)} jar found in <span class="mono">jdbc-drivers/</span> — the engine cannot read this source without it. Fetch it from Connections, then start again.</span></div>`;
        toast(`${sourceDriverSpec.label} missing — engine not started.`, 'err');
        return;
      }
    } catch(err){
      statusEl.innerHTML = `<div class="ai-status err mt">Could not verify the source JDBC driver: ${escapeHtml(err.message)}</div>`;
      return;
    }
  }

  btn.disabled = true; btn.textContent = 'Checking…';
  statusEl.innerHTML = `<div class="ai-status busy mt"><span class="dot"></span>Checking the generated Data Vault DDL against the target tables and columns…</div>`;
  try {
    const expected = parseGeneratedDdlObjects(buildDataVaultDdl()).filter(o=>o.schema==='data_vault');
    const liveRows = await queryTarget(`SELECT table_schema, table_name, column_name, data_type, character_maximum_length, numeric_precision, numeric_scale, udt_name FROM information_schema.columns WHERE lower(table_schema)='data_vault'`);
    const delta = computeTargetDelta(expected, liveRows);
    if (delta.missingTables.length || delta.missingColumns.length || delta.obsoleteColumns.length){
      const count = delta.missingTables.length + delta.missingColumns.length + delta.obsoleteColumns.length;
      const preview = [
        ...delta.missingTables.slice(0,10).map(x=>`missing table ${x.schema}.${x.name}`),
        ...delta.missingColumns.slice(0,10).map(x=>`missing column ${x.schema}.${x.table}.${x.column}`),
        ...delta.obsoleteColumns.slice(0,10).map(x=>`obsolete Link Satellite column ${x.schema}.${x.table}.${x.column}`),
      ].slice(0,20).join('\n');
      const apply = confirm(`${count} Data Vault object/column change(s) are required before the engine can run:\n\n${preview}${count>20?`\n…plus ${count-20} more`:''}\n\nApply the incremental DDL now?`);
      if (!apply){
        statusEl.innerHTML = `<div class="ai-status err mt">The engine was not started because the physical Data Vault schema is out of date.</div>`;
        return;
      }
      btn.textContent = 'Applying DDL…';
      statusEl.innerHTML = `<div class="ai-status busy mt"><span class="dot"></span>Applying required Data Vault schema changes…</div>`;
      await executeSqlAgainstTarget(buildIncrementalSql(delta));
    }

    const useBuild = false; // metadata setup runs from the deployment board, never bundled into engine start
    if (!confirm(`Start the data vault engine now?\n\nRun mode: ${engineModeLabel()}${useBuild ? '\nIncluding first-time target setup (--build) — this can take several minutes.' : ''}`)) return;

    btn.textContent = 'Applying current design…';
    statusEl.innerHTML = `<div class="ai-status busy mt"><span class="dot"></span>Saving the current metadata workbook, source connection and engine settings…</div>`;
    await deployMappingWorkbook({ silent:true });
    await deployHopSourceConnection({ silent:true });
    await deployHopConfig({ silent:true });


    btn.textContent = 'Starting…';
    statusEl.innerHTML = `<div class="ai-status busy mt"><span class="dot"></span>Starting the data vault engine — ${escapeHtml(engineModeLabel())}${useBuild ? ' (with target setup)' : ''}…</div>`;
    await ensureLocalServerReachable();
    const resp = await localFetch(`/api/docker/run-hop`, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ mode: engineMode(), build: useBuild }) });
    const data = await resp.json();
    statusEl.innerHTML = dockerResultHtml(data, 'Starting the data vault engine');
    toast(data.ok ? 'Data vault engine starting.' : 'Could not start the data vault engine — see details.', data.ok?'ok':'err');
  } catch(err){
    statusEl.innerHTML = `<div class="ai-status err mt">${escapeHtml(err.message)}</div>`;
    toast('Could not start the data vault engine.','err');
  }
  btn.disabled = false; btn.textContent = 'Start data vault engine';
}

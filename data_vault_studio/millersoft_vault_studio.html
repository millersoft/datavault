          <div class="landing-card-icon">✎</div>
          <div class="landing-card-title">Edit existing project</div>
          <p class="landing-card-desc">Load a previously saved project file and pick up exactly where you left off.</p>
        </button>
        <button class="landing-card" id="landing-hub">
          <div class="landing-card-icon">▤</div>
          <div class="landing-card-title">Data Vault Hub</div>
          <p class="landing-card-desc">Run history, load metrics, and engine controls for a vault that's already deployed.</p>
        </button>
        <button class="landing-card" id="landing-studioplus">
          <div class="landing-card-icon">★</div>
          <div class="landing-card-title">Data Vault Studio Plus</div>
          <p class="landing-card-desc">AI-assisted reporting — connect to a deployed vault and generate SQL, an Excel workbook, and an HTML report.</p>
        </button>
      </div>
    </div>`;
  document.getElementById('landing-new').addEventListener('click', ()=> startNewProject(true));
  document.getElementById('landing-edit').addEventListener('click', ()=> document.getElementById('file-load-project').click());
  document.getElementById('landing-hub').addEventListener('click', ()=>{ appMode='dashboard'; renderAll(); });
  document.getElementById('landing-studioplus').addEventListener('click', ()=>{ appMode='studioplus'; renderAll(); });
}
</script>

<script>
/* =========================================================================
   STEP 1 — CONNECTIONS
   ========================================================================= */
// JDBC drivers are required for non-PostgreSQL sources. The same project
// jdbc-drivers/ mount is reused by the internal PostgreSQL FDW container.
function jdbcDriverSectionHtml(v){
  const spec=jdbcDriverSpec(v.dialect);
  if(!spec) return '';
  return `
      <div class="panel-head" style="margin:16px -14px 0;"><h3>${escapeHtml(spec.label)} <span class="badge-count">&nbsp;·&nbsp;required for this source</span></h3></div>
      <p class="hint mt">This JDBC driver must be present in <span class="mono">jdbc-drivers/</span> before Hop can read the external ${escapeHtml(DIALECTS[v.dialect].label)} source.</p>
      <div class="grid cols-2 mt">
        <a class="btn" href="${escapeHtml(spec.url)}" download>⬇ Download ${escapeHtml(spec.label)} ${escapeHtml(spec.version)}</a>
        <a class="btn ghost" href="${escapeHtml(spec.otherUrl)}" target="_blank" rel="noopener">Other versions ↗</a>
      </div>
      <div class="field mt">
        <label>Target folder <span class="hint">(auto-detected — override only if this project's layout differs)</span></label>
        <input type="text" id="f-jdbc-folder" value="${jdbcDriverFolder}" placeholder="${jdbcDriverFolderDetected || 'detecting… (needs the local server running)'}">
      </div>
      <button class="btn primary mt" id="btn-deploy-jdbc-driver">${jdbcDriverDeployStatus==='loading'?'Fetching & deploying…':'⬆ Fetch and deploy driver to jdbc-drivers/'}</button>
      <div id="jdbc-driver-deploy-status"></div>
      <div id="jdbc-driver-status"></div>
      ${v.dialect==='sqlserver'?'<p class="hint mt">SQL Server is always external; this action downloads only its JDBC driver and does not create or start a SQL Server container.</p>':''}
  `;
}
function mysqlJdbcDriverSectionHtml(v){ return jdbcDriverSectionHtml(v); }
async function checkJdbcDrivers(){
  const resp = await localFetch(`/api/driver-status`);
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Could not check jdbc-drivers/.');
  return data;
}
async function checkMysqlDriver(){ return checkJdbcDrivers(); }
async function refreshJdbcDriverStatus(){
  const el = document.getElementById('jdbc-driver-status');
  if (!el) return;
  const dialect=state.vault.dialect;
  const spec=jdbcDriverSpec(dialect);
  if(!spec){ el.innerHTML=''; return; }
  try {
    const data = await checkJdbcDrivers();
    const found=data[spec.statusField];
    if (found && state.externalTables.enabled && state.externalTables.remoteDialect===dialect){
      const detected=`/opt/jdbc-drivers/${found}`;
      if (!state.externalTables.jarfile || state.externalTables.jarfile.endsWith(spec.filename)) state.externalTables.jarfile=detected;
    }
    el.innerHTML = found
      ? `<div class="ai-status ok mt">Driver found: <span class="mono">&nbsp;${escapeHtml(found)}</span>&nbsp; in jdbc-drivers/.</div>`
      : `<div class="ai-status err mt">No ${escapeHtml(spec.label)} jar in <span class="mono">&nbsp;jdbc-drivers/</span>&nbsp; yet — required before the engine can read this source.</div>`;
  } catch(err){
    el.innerHTML = `<div class="ai-status err mt">Could not check jdbc-drivers/: ${escapeHtml(err.message)}</div>`;
  }
}

let targetJdbcDriverStatus = null;
let targetJdbcDriverMessage = '';
function targetJdbcDriverCheckRequired(){
  const ext=state.externalTables;
  return !!(ext.enabled && ext.remoteDialect && ext.remoteDialect!=='postgresql' && ext.remoteDialect!==state.vault.dialect);
}
function targetJdbcDriverSectionHtml(){
  const ext=state.externalTables;
  if(!targetJdbcDriverCheckRequired()) return '';
  const spec=jdbcDriverSpec(ext.remoteDialect);
  const fetch = spec ? `<button class="btn" id="btn-deploy-target-jdbc-driver">Fetch ${escapeHtml(spec.label)}</button>` : '';
  const status = targetJdbcDriverStatus==='loading'
    ? `<div class="ai-status busy mt"><span class="dot"></span>Checking ${escapeHtml(ext.jarfile||'the configured target driver')}…</div>`
    : targetJdbcDriverStatus==='ok'
      ? `<div class="ai-status ok mt">${escapeHtml(targetJdbcDriverMessage)}</div>`
      : targetJdbcDriverStatus==='error'
        ? `<div class="ai-status err mt">${escapeHtml(targetJdbcDriverMessage)}</div>` : '';
  return `
    <div class="panel" style="margin:16px 0 0;padding:14px;box-shadow:none;">
      <div class="flex-between" style="gap:12px;align-items:flex-start;">
        <div>
          <label class="mb0">Target JDBC driver</label>
          <p class="hint mb0">The source uses ${escapeHtml((DIALECTS[state.vault.dialect]||{}).label||state.vault.dialect)}, while the physical target uses ${escapeHtml((DIALECTS[ext.remoteDialect]||{}).label||ext.remoteDialect)}. Check the separate target driver mounted into the PostgreSQL FDW container.</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
          ${fetch}
          <button class="btn primary" id="btn-check-target-jdbc-driver">Check target driver</button>
        </div>
      </div>
      ${status}
    </div>`;
}
async function refreshTargetJdbcDriverStatus(){
  if(!targetJdbcDriverCheckRequired()){
    targetJdbcDriverStatus=null; targetJdbcDriverMessage=''; return;
  }
  targetJdbcDriverStatus='loading';
  const statusWrap=document.getElementById('target-jdbc-driver-wrap');
  if(statusWrap) statusWrap.innerHTML=targetJdbcDriverSectionHtml();
  try{
    const data=await localFetch('/api/driver-path-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jarfile:state.externalTables.jarfile})}).then(r=>r.json());
    if(!data.ok) throw new Error(data.error||'Could not check the target driver.');
    if(!data.exists) throw new Error(`${data.filename||state.externalTables.jarfile||'Configured jar'} was not found in jdbc-drivers/.`);
    targetJdbcDriverStatus='ok';
    targetJdbcDriverMessage=`${data.filename} is present in jdbc-drivers/ and available to the packaged PostgreSQL FDW container.`;
  }catch(err){
    targetJdbcDriverStatus='error'; targetJdbcDriverMessage=err.message;
  }
  if(activeTab==='connections'){
    const wrap=document.getElementById('target-jdbc-driver-wrap');
    if(wrap){ wrap.innerHTML=targetJdbcDriverSectionHtml(); wireTargetJdbcDriverActions(wrap); }
  }
}
function wireTargetJdbcDriverActions(root=document){
  const check=root.querySelector ? root.querySelector('#btn-check-target-jdbc-driver') : null;
  if(check) check.addEventListener('click',refreshTargetJdbcDriverStatus);
  const fetchBtn=root.querySelector ? root.querySelector('#btn-deploy-target-jdbc-driver') : null;
  if(fetchBtn) fetchBtn.addEventListener('click',()=>deployJdbcDriver('target'));
}

function sourceDialectOptionsHtml(){
  if(isDemoRuntime()) return '<option value="mysql" selected>MySQL Demo</option>';
  return ['postgresql','mysql','sqlserver'].map(k=>`<option value="${k}" ${state.vault.dialect===k?'selected':''}>${DIALECTS[k].label}</option>`).join('');
}

function renderConnections(el){
  const v=state.vault;
  const ext=state.externalTables;
  const demo=isDemoRuntime();
  const targetInternal=v.targetPreset==='internal';
  if(!targetInternal && ext.enabled) ext.enabled=false;
  if(ext.enabled) applyExternalTargetDefaults(false);

  const readOnly=demo?'readonly aria-readonly="true"':'';
  const disabled=demo?'disabled aria-disabled="true"':'';
  const sourceDialectOptions=sourceDialectOptionsHtml();
  const fdwTargetDialects=demo?['mysql']:['postgresql','mysql','sqlserver'];
  const fdwTargetDialectOptions=fdwTargetDialects.map(k=>`<option value="${k}" ${ext.remoteDialect===k?'selected':''}>${DIALECTS[k].label}</option>`).join('');
  const sourceSchemaField=v.dialect==='mysql'
    ? `<div class="field"><label>Schema</label><input type="text" value="${escapeHtml(v.srcDatabase)}" readonly><p class="hint" style="margin-top:5px;">MySQL uses the database as its schema.</p></div>`
    : `<div class="field"><label>Schema</label><input type="text" id="f-source-schema" value="${escapeHtml(v.sourceSchema||(v.dialect==='sqlserver'?'dbo':'public'))}" ${readOnly}></div>`;

  const sourcePanel=`
    <div class="panel">
      <div class="panel-head" style="margin:-18px -20px 16px;"><h3>① Source connection <span class="badge-count">&nbsp;·&nbsp;${v.name||'&lt;name&gt;'}_source</span></h3></div>
      <div class="flex-between" style="margin-bottom:14px;gap:10px;">
        <div><label class="mb0">${demo?'MySQL Demo':'Source database'}</label><p class="hint mb0">${demo?'Packaged Sakila container.':'User-defined source read by the Hop engine.'}</p></div>
        <button class="btn primary" id="btn-connect-source">${demo?'Start and connect':'Test connection'}</button>
      </div>
      <div id="src-container-status"></div>
      <div class="grid cols-3">
        <div class="field"><label>Database engine</label><select id="f-dialect" ${disabled}>${sourceDialectOptions}</select>${demo?'<p class="hint" style="margin-top:6px;">Fixed to the packaged MySQL demo.</p>':''}</div>
        <div class="field"><label>Host</label><input type="text" id="f-src-host" value="${escapeHtml(v.srcHost)}" ${readOnly}></div>
        <div class="field"><label>Port</label><input type="text" id="f-src-port" value="${escapeHtml(v.srcPort)}" ${readOnly}></div>
      </div>
      <div class="grid cols-2 mt">
        <div class="field"><label>Database</label><input type="text" id="f-src-db" value="${escapeHtml(v.srcDatabase)}" ${readOnly}></div>
        ${sourceSchemaField}
      </div>
      <div class="grid cols-2 mt">
        <div class="field"><label>Username</label><input type="text" id="f-src-user" value="${escapeHtml(v.srcUser)}" ${readOnly}></div>
        <div class="field"><label>Password</label><input type="password" id="f-srcpass" value="${escapeHtml(v.srcPassword)}" ${readOnly} autocomplete="off"></div>
      </div>
      <div id="conn-status-wrap">${renderConnStatusHtml()}</div>
      ${jdbcDriverSectionHtml(v)}
    </div>`;

  const selectedTarget=selectedDeploymentTarget();
  const targetModeField=demo
    ? `<div class="field"><label>Deployment target</label><input type="text" value="Internal PostgreSQL" readonly><p class="hint" style="margin-top:6px;">Demo mode is locked to the packaged PostgreSQL service.</p></div>`
    : `<div class="field"><label>Deployment target</label><select id="f-target-mode">
        <option value="mysql" ${selectedTarget==='mysql'?'selected':''}>MySQL</option>
        <option value="sqlserver" ${selectedTarget==='sqlserver'?'selected':''}>SQL Server</option>
        <option value="internal-postgres" ${selectedTarget==='internal-postgres'?'selected':''}>Internal PostgreSQL</option>
        <option value="postgres" ${selectedTarget==='postgres'?'selected':''}>PostgreSQL</option>
      </select><p class="hint" style="margin-top:6px;">MySQL and SQL Server keep the engine and metadata in the packaged PostgreSQL service while storing core Vault tables in the selected target.</p></div>`;

  const targetPanel=targetInternal?`
    <div class="panel">
      <div class="panel-head" style="margin:-18px -20px 16px;"><h3>② Data Vault PostgreSQL <span class="badge-count">&nbsp;·&nbsp;internal container</span></h3></div>
      ${targetModeField}
      <div class="flex-between mt" style="margin-bottom:14px;gap:10px;">
        <div><label class="mb0">Packaged PostgreSQL</label><p class="hint mb0">The engine connection and all local Vault support objects live here.</p></div>
        <button class="btn primary" id="${ext.enabled?'btn-start-fdw-postgres':'btn-connect-target'}">Start and connect${ext.enabled?' FDW image':''}</button>
      </div>
      <div id="tgt-container-status"></div>
      <div class="grid cols-4">
        <div class="field"><label>Host</label><input type="text" value="${escapeHtml(v.dvHost)}" readonly></div>
        <div class="field"><label>Port</label><input type="text" value="${escapeHtml(v.dvPort)}" readonly></div>
        <div class="field"><label>Database name</label><input type="text" id="f-dvdb" value="${escapeHtml(v.dvDatabase)}" ${demo?'readonly':''}></div>
        <div class="field"><label>Target username</label><input type="text" value="${escapeHtml(v.dvUser)}" readonly></div>
      </div>
      <div class="grid cols-2 mt"><div class="field"><label>Target password</label><input type="password" value="${escapeHtml(v.dvPassword)}" readonly autocomplete="off"></div></div>
      <div id="target-status-wrap">${renderTargetStatusHtml()}</div>
    </div>`:`
    <div class="panel">
      <div class="panel-head" style="margin:-18px -20px 16px;"><h3>② Data Vault PostgreSQL <span class="badge-count">&nbsp;·&nbsp;external server</span></h3></div>
      ${targetModeField}
      <div class="flex-between mt" style="margin-bottom:14px;gap:10px;">
        <div><label class="mb0">External PostgreSQL</label><p class="hint mb0">All staging, metadata and Data Vault objects are deployed natively to this PostgreSQL database. FDW is not offered for this target mode.</p></div>
        <button class="btn primary" id="btn-connect-target">Test connection</button>
      </div>
      <div class="grid cols-3">
        <div class="field"><label>Host</label><input type="text" id="f-dv-host" value="${escapeHtml(v.dvHost)}"></div>
        <div class="field"><label>Port</label><input type="text" id="f-dv-port" value="${escapeHtml(v.dvPort||'5432')}"></div>
        <div class="field"><label>Database name</label><input type="text" id="f-dvdb" value="${escapeHtml(v.dvDatabase)}"></div>
      </div>
      <div class="grid cols-2 mt">
        <div class="field"><label>Username</label><input type="text" id="f-dv-user" value="${escapeHtml(v.dvUser)}"></div>
        <div class="field"><label>Password</label><input type="password" id="f-dvpass" value="${escapeHtml(v.dvPassword)}" autocomplete="off"></div>
      </div>
      <div id="target-status-wrap">${renderTargetStatusHtml()}</div>
      ${externalLocalhostWarningHtml()}
    </div>`;

  let physicalTargetPanel='';
  if(ext.enabled){
    const lockSelect=demo?'disabled aria-disabled="true"':'';
    const lockInput=demo?'readonly aria-readonly="true"':'';
    const engineLabel=(DIALECTS[ext.remoteDialect]||{}).label||'External database';
    physicalTargetPanel=`
      <div class="panel">
        <div class="panel-head" style="margin:-18px -20px 16px;"><h3>③ Physical storage target <span class="badge-count">&nbsp;·&nbsp;core Vault tables</span></h3></div>
        <div class="flex-between" style="margin-bottom:14px;gap:10px;">
          <div><label class="mb0">${escapeHtml(engineLabel)} target</label><p class="hint mb0">Only the core Hub, Link, Satellite and Link Satellite tables are stored here.</p></div>
          <button class="btn primary" id="btn-connect-external-target">Test connection</button>
        </div>
        <div class="grid cols-3">
          <div class="field"><label>Database engine</label><input type="text" value="${escapeHtml(engineLabel)}" readonly></div>
          <div class="field"><label>Host from Studio</label><input type="text" id="f-external-host" value="${escapeHtml(ext.studioHost)}" ${lockInput}></div>
          <div class="field"><label>Port</label><input type="text" id="f-external-port" value="${escapeHtml(ext.studioPort)}" ${lockInput}></div>
        </div>
        <div class="grid cols-2 mt">
          <div class="field"><label>${ext.remoteDialect==='mysql'?'Database / schema':'Database'}</label><input type="text" id="f-external-db" value="${escapeHtml(ext.studioDatabase||ext.remoteDatabase)}" ${lockInput}></div>
          ${ext.remoteDialect==='mysql'
            ? `<div class="field"><label>Schema</label><input type="text" value="${escapeHtml(ext.studioDatabase||ext.remoteDatabase||'datavault')}" readonly><p class="hint" style="margin-top:5px;">MySQL uses the database as its schema.</p></div>`
            : `<div class="field"><label>Schema</label><input type="text" id="f-external-schema" value="${escapeHtml(ext.studioSchema||ext.remoteSchema||(ext.remoteDialect==='sqlserver'?'dbo':'data_vault'))}" ${lockInput}></div>`}
        </div>
        ${ext.remoteDialect==='sqlserver'?`<p class="hint mt">For JDBC FDW, this schema must match the SQL Server login's default schema because the foreign-table route uses unqualified remote table names.</p>`:''}
        <div class="grid cols-2 mt">
          <div class="field"><label>Target username</label><input type="text" id="f-external-user" value="${escapeHtml(ext.studioUser||ext.username)}" ${lockInput}></div>
          <div class="field"><label>Target password</label><input type="password" id="f-external-password" value="${escapeHtml(ext.studioPassword||ext.password)}" ${lockInput} autocomplete="off"></div>
        </div>
        <p class="hint mt">${demo?'Demo values are fixed to the packaged MySQL service and Sakila account.':'These are the physical target credentials used for target DDL, both PostgreSQL FDW user mappings, and Studio Plus defaults.'}</p>
        <div class="ai-status busy mt" style="align-items:flex-start;"><span><b>Required permissions:</b> the target account must be able to create/use <span class="mono">${escapeHtml(ext.studioDatabase||ext.remoteDatabase||'datavault')}</span>, create and alter the core tables, and read/write them.</span></div>
        <div id="target-jdbc-driver-wrap">${targetJdbcDriverSectionHtml()}</div>
        <div id="external-target-status-wrap">${renderExternalTargetStatusHtml()}</div>
      </div>`;
  }

  el.innerHTML=`
    <div class="flex-between">
      <div><h2 class="section-title">Step 1 — Connections</h2><p class="section-desc mb0">${demo?'Run the complete feature set against the locked demonstration containers.':'Configure the source and choose MySQL, SQL Server, internal PostgreSQL or PostgreSQL as the deployment target.'}</p></div>
      <span class="tag ${demo?'sat':'hub'}">${demo?'Demo mode':'Production mode'}</span>
    </div>
    <div class="panel mt">
      <div class="panel-head" style="margin:-18px -20px 16px;"><h3>Naming</h3></div>
      <div class="grid cols-3">
        <div class="field"><label>Vault short name</label><input type="text" id="f-name" value="${escapeHtml(v.name)}" placeholder="sales" ${readOnly}><p class="hint" id="f-name-warn" style="color:var(--err);margin:4px 0 0;">${identifierIssue(v.name)||''}</p></div>
        <div class="field"><label>Staging prefix</label><input type="text" id="f-prefix" value="${escapeHtml(v.prefix)}" placeholder="sales" ${readOnly}><p class="hint" id="f-prefix-warn" style="color:var(--err);margin:4px 0 0;">${identifierIssue(v.prefix)||''}</p></div>
        <div class="field"><label>Tenant ID literal</label><input type="text" id="f-tenant" value="${escapeHtml(v.tenantId)}" placeholder="SALES" ${readOnly}></div>
        <div class="field"><label>Source system code</label><input type="text" id="f-cod" value="${escapeHtml(v.srcCod)}" placeholder="SALES" ${readOnly}></div>
        <div class="field"><label>Source system description</label><input type="text" id="f-srcdesc" value="${escapeHtml(v.srcDescription)}" placeholder="sales_data" ${readOnly}></div>
      </div>
      ${demo?'<p class="hint mb0">Naming values are locked to the packaged demo project.</p>':''}
    </div>
    ${sourcePanel}
    ${targetPanel}
    ${physicalTargetPanel}
    ${ext.enabled?'<div id="ext-storage-mount" class="mt"></div>':''}
    <div class="flex-between mt"><span></span><button class="btn primary" id="btn-next-connections">Next: choose tables →</button></div>`;

  const bindValue=(id,obj,key,{mirror='',rerender=false}={})=>{
    const node=el.querySelector('#'+id); if(!node)return;
    node.addEventListener('input',e=>{obj[key]=e.target.value;if(mirror)obj[mirror]=e.target.value;if(rerender){renderAll();setActiveTabViewOnly('connections');}});
  };
  if(!demo){
    ['name','prefix','tenantId','srcCod','srcDescription'].forEach((key,i)=>bindValue(['f-name','f-prefix','f-tenant','f-cod','f-srcdesc'][i],v,key));
    bindValue('f-src-host',v,'srcHost'); bindValue('f-src-port',v,'srcPort'); bindValue('f-src-db',v,'srcDatabase');
    bindValue('f-source-schema',v,'sourceSchema'); bindValue('f-src-user',v,'srcUser'); bindValue('f-srcpass',v,'srcPassword');
    const dialect=el.querySelector('#f-dialect');
    if(dialect) dialect.addEventListener('change',e=>{
      const oldPort=DIALECTS[v.dialect]&&DIALECTS[v.dialect].defaultPort;
      v.dialect=e.target.value; v.sourcePreset='';
      if(!v.srcPort||v.srcPort===oldPort)v.srcPort=DIALECTS[v.dialect].defaultPort;
      v.sourceSchema=v.dialect==='mysql'?v.srcDatabase:(v.dialect==='sqlserver'?(v.sourceSchema==='public'?'dbo':(v.sourceSchema||'dbo')):(v.sourceSchema==='dbo'?'public':(v.sourceSchema||'public')));
      sourceConnStatus=null; discoveredSchemas=[]; targetJdbcDriverStatus=null;
      renderAll();setActiveTabViewOnly('connections');
    });
    const targetMode=el.querySelector('#f-target-mode');
    if(targetMode) targetMode.addEventListener('change',e=>{
      applyDeploymentTarget(e.target.value);
      renderAll();setActiveTabViewOnly('connections');
    });
  }

  const jdbcFolderInput=el.querySelector('#f-jdbc-folder'); if(jdbcFolderInput)jdbcFolderInput.addEventListener('input',e=>jdbcDriverFolder=e.target.value);
  const jdbcDeployBtn=el.querySelector('#btn-deploy-jdbc-driver'); if(jdbcDeployBtn)jdbcDeployBtn.addEventListener('click',()=>deployJdbcDriver('source'));
  detectDbInitPath(); refreshJdbcDriverStatus(); wireTargetJdbcDriverActions(el);

  const sourceBtn=el.querySelector('#btn-connect-source'); if(sourceBtn)sourceBtn.addEventListener('click',()=>demo?startAndConnectContainer('source'):testSourceConnection());
  const internalTargetBtn=el.querySelector('#btn-connect-target');
  if(internalTargetBtn)internalTargetBtn.addEventListener('click',()=>targetInternal?startAndConnectContainer('target'):testTargetConnection());
  const gatewayBtn=el.querySelector('#btn-start-fdw-postgres'); if(gatewayBtn)gatewayBtn.addEventListener('click',()=>startAndConnectContainer('target'));
  const extConnect=el.querySelector('#btn-connect-external-target'); if(extConnect)extConnect.addEventListener('click',testExternalTargetConnection);
  el.querySelector('#btn-next-connections').addEventListener('click',()=>navigateDesignerTab('tables'));

  bindValue('f-dvdb',v,'dvDatabase');
  if(!targetInternal){bindValue('f-dv-host',v,'dvHost');bindValue('f-dv-port',v,'dvPort');bindValue('f-dv-user',v,'dvUser');bindValue('f-dvpass',v,'dvPassword');}
  const createDbBtn=el.querySelector('#btn-create-db');if(createDbBtn)createDbBtn.addEventListener('click',createTargetDatabase);
  const createExtBtn=el.querySelector('#btn-create-external-db');if(createExtBtn)createExtBtn.addEventListener('click',createExternalTargetDatabase);

  if(ext.enabled){
    const markExternal=()=>{ext.studioConnectionOverridden=true;ext.deploymentAcknowledged=false;externalPreflightResult=null;externalDeployResult=null;externalTargetConnStatus=null;externalTargetDbExists=null;externalTargetIdentity=null;targetJdbcDriverStatus=null;};
    const bindExt=(id,key,mirror='')=>{const node=el.querySelector('#'+id);if(!node)return;node.addEventListener('input',e=>{ext[key]=e.target.value;if(mirror)ext[mirror]=e.target.value;markExternal();});};
    bindExt('f-external-host','studioHost');bindExt('f-external-port','studioPort');bindExt('f-external-db','studioDatabase','remoteDatabase');bindExt('f-external-schema','studioSchema','remoteSchema');bindExt('f-external-user','studioUser','username');bindExt('f-external-password','studioPassword','password');
    renderExternalSub(document.getElementById('ext-storage-mount'));
  }
}
</script>

<script>
/* =========================================================================
   LOCAL INTROSPECTION SERVER — PostgreSQL, MySQL & external SQL Server
   ========================================================================= */
// When the GUI is served by the companion server itself (http://127.0.0.1:8420/),
// talk to that same origin; when opened as a file:// page, default to the
// server's standard localhost port.
let localServerUrl = location.protocol.startsWith('http') ? location.origin : 'http://localhost:8420';
// Single choke-point for every companion-server call — all former
// fetch(`${localServerUrl}/api/...`) call sites route through here.
function localFetch(path, opts){
  return fetch(`${localServerUrl}${path}`, opts);
}

    }

    });

    sourceConnStatus = 'ok'; sourceConnError = '';
    toast('Connected to the source database.','ok');

    if (v.dialect==='mysql'){

      // a mismatched schema is the most common reason introspection finds
      // nothing.

          toast(`Found ${discoveredSchemas.length} schema(s): ${discoveredSchemas.join(', ')}.`, 'ok');
        }

    }

async function containerProbe(kind){
  const v = state.vault;
  if (kind==='source'){

      body: JSON.stringify({ host: v.srcHost, port: v.srcPort, database: v.srcDatabase, user: v.srcUser, password: v.srcPassword, dialect: v.dialect }),

async function startAndConnectContainer(kind){
  const service = kind==='source' ? 'mysql' : 'postgres';
  if (!await requireLicenseAccepted(()=> startAndConnectContainer(kind))) return;
  try {
    setContainerStatus(kind, 'busy', `Starting the ${service} container…`);
    const data = await localFetch(`/api/docker/start-db`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ service, fdw: service==='postgres' && state.externalTables.enabled }),
    }).then(r=>r.json());
    if (!data.ok) throw new Error(data.error || data.stderr || `Could not start ${service}.`);
    // A fresh container needs a moment before it accepts connections —
    // especially first boot, when it runs its init scripts.
    setContainerStatus(kind, 'busy', `Waiting for ${service} to accept connections…`);
    const deadline = Date.now() + 90000;
    let up = false;
    while (Date.now() < deadline){
      try { if (await containerProbe(kind)){ up = true; break; } } catch(_){}
      await new Promise(r=>setTimeout(r, 3000));
    }
    if (!up) throw new Error(`${service} started but did not accept connections within 90s — first boot can take longer while init scripts run. Try again shortly.`);
    setContainerStatus(kind, 'ok', `${service} container is up — connecting…`);
    if (kind==='source') await testSourceConnection(); else await testTargetConnection();
    setContainerStatus(kind, 'ok', `${service} container is up.`);
  } catch(err){
    setContainerStatus(kind, 'err', err.message);
    toast(`Container start failed: ${err.message}`, 'err');
  }
}

// Raw introspection fetch used by the Step 2 source-table detection action.
async function fetchIntrospection(profileColumns=false){
  const v = state.vault;
  const effectiveSchema = v.dialect==='mysql' ? v.srcDatabase : v.sourceSchema;
  const resp = await localFetch(`/api/introspect`, {
    method: 'POST', headers: { 'Content-Type':'application/json' },
    body: JSON.stringify({ host: v.srcHost, port: v.srcPort, database: v.srcDatabase, user: v.srcUser, password: v.srcPassword, schema: effectiveSchema, dialect: v.dialect, profileColumns }),
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Source table detection failed.');
  return data;
}

// Store the FK / row-count extras that ride along with introspection.
function captureSourceMeta(data){
  if (!state.sourceMeta) state.sourceMeta = { foreignKeys: [], approxRows: {} };
  if (Array.isArray(data.foreignKeys)) state.sourceMeta.foreignKeys = data.foreignKeys;
  const counts = {};
  (data.tables||[]).forEach(t=>{ if (t.approxRows!=null) counts[t.name] = t.approxRows; });
  state.sourceMeta.approxRows = counts;
}

function profileFromIntrospection(column){
  const p = column && column.profile;
  if (!p || typeof p!=='object') return null;
  return {
    totalRows:Number(p.totalRows||0),
    distinctValues:p.distinctValues==null ? null : Number(p.distinctValues||0),
    nullValues:Number(p.nullValues||0),
    blankValues:Number(p.blankValues||0),
    profiledAt:new Date().toISOString(),
    source:p.source||'infer-schema',
  };
}

function applyManualTableProfiles(table, profiles){
  if (!table || !Array.isArray(profiles)) return 0;
  let applied = 0;
  profiles.forEach(p=>{
    const col = (table.columns||[]).find(c=>c.name===p.column);
    if (!col) return;
    col.profile = {
      totalRows:Number(p.totalRows||0),
      distinctValues:Number(p.distinctValues||0),
      nullValues:Number(p.nullValues||0),
      blankValues:Number(p.blankValues||0),
      profiledAt:new Date().toISOString(),
      source:'manual',
    };
    applied++;
  });
  return applied;
}

async function introspectDatabase(){
  const v = state.vault;
  if (!['postgresql','mysql','sqlserver'].includes(v.dialect)){ toast('Source table detection supports PostgreSQL, MySQL, and external SQL Server sources.','err'); return; }
  // MySQL has no separate schema layer — "schema" there just means the
  // database itself. Compute this directly rather than trusting
  // v.sourceSchema, in case someone jumps straight to introspecting
  // without running Test & Connect first (which is what normally keeps
  // the two in sync).
  const effectiveSchema = v.dialect==='mysql' ? v.srcDatabase : v.sourceSchema;
  const btn = document.getElementById('btn-introspect');
  if (btn){ btn.disabled = true; btn.textContent = 'Detecting Source Tables…'; }
  try {
    const data = await fetchIntrospection(true);
    captureSourceMeta(data);
    let added = 0, updated = 0, viewsFound = 0, viewsAutoExcluded = 0;
    data.tables.forEach(rt=>{
      const objectType = normalizeSourceObjectType(rt.objectType);
      if (objectType==='view') viewsFound++;
      const existing = state.tables.find(t=>t.name===rt.name);
      if (existing){
        // Older saved projects predate object types and may have reporting
        // views included only because introspection treated them as tables.
        // Migrate those safely, while preserving any view that already has
        // explicit Vault objects (evidence that it was intentionally used).
        if (applyDetectedObjectType(existing, objectType)) viewsAutoExcluded++;
        // Merge by column NAME rather than replacing wholesale — hubs
        // store a column ID (pkColId) that must keep resolving after a
        // refresh, so a column that still exists by name keeps its
        // original id and only has its type/nullable/pk fields updated.
        // Only genuinely new source columns get a freshly-generated id;
        // columns removed from the source are left in place rather than
        // deleted, since deleting could orphan a hub/derivation that
        // still references them — safer to let the person remove those
        // themselves if they actually want to.
        rt.columns.forEach(rc=>{
          const existingCol = existing.columns.find(c=>c.name===rc.name);
          if (existingCol){
            existingCol.type = rc.type;
            existingCol.nullable = rc.pk ? false : rc.nullable;
            existingCol.pk = rc.pk;
            // Infer Schema automatically refreshes profiles for columns that
            // can produce a staging NOT NULL constraint. Clear a stale profile
            // when that live scan could not be completed so old counts cannot
            // silently drive new DDL.
            if (rc.pk || rc.nullable===false) existingCol.profile = profileFromIntrospection(rc);
          } else {
            existing.columns.push(Object.assign(newColumn(rc.name, rc.type), {
              nullable: rc.pk ? false : rc.nullable,
              pk: rc.pk,
              profile: profileFromIntrospection(rc),
            }));
          }
        });
        updated++;
      } else {
        const t = newTable(rt.name);
        t.objectType = objectType;
        t.included = objectType!=='view';
        if (objectType==='view') viewsAutoExcluded++;
        t.columns = rt.columns.map(c=> Object.assign(newColumn(c.name, c.type), {
          nullable: c.pk ? false : c.nullable,
          pk: c.pk,
          profile: profileFromIntrospection(c),
        }));
        state.tables.push(t);
        added++;
      }
    });
    if (viewsAutoExcluded) pruneDownstreamModel({ dropExcluded:true });
    renderAll(); setActiveTabViewOnly('tables');
    const location = v.dialect==='mysql' ? v.srcDatabase : `${v.srcDatabase}.${effectiveSchema}`;
    const tableCount = data.tables.length - viewsFound;
    const viewSummary = viewsFound ? ` and ${viewsFound} view(s)${viewsAutoExcluded?` (${viewsAutoExcluded} left unselected)`:''}` : '';
    const ps = data.profileSummary || {};
    const warningText = Array.isArray(ps.warnings) && ps.warnings.length
      ? ` Some source checks could not be completed; source nullability was retained.`
      : '';
    toast(`Detected ${tableCount} source table(s)${viewSummary} from ${location} — ${added} added, ${updated} updated.${warningText}`, ps.warnings&&ps.warnings.length ? 'err' : 'ok');
  } catch(err){
    toast('Source table detection failed: ' + err.message, 'err');
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = 'Detect Source Tables'; }
  }
}

/* =========================================================================
   SCHEMA DRIFT — re-introspect the live source and diff it against the
   current model, then merge selectively. Real vaults outlive their first
   design; this is how the model catches up with the source.
   ========================================================================= */
// Pure diff between the model's tables and a live introspection result.
// Kept side-effect-free deliberately so it can be unit tested.
function computeSchemaDiff(currentTables, liveTables){
  const diff = { newTables: [], missingTables: [], newColumns: [], missingColumns: [], changedColumns: [] };
  const liveByName = {};
  (liveTables||[]).forEach(t=>{ liveByName[t.name] = t; });
  const curByName = {};
  (currentTables||[]).forEach(t=>{ curByName[t.name] = t; });

  (liveTables||[]).forEach(lt=>{ if (!curByName[lt.name]) diff.newTables.push(lt); });
  (currentTables||[]).forEach(ct=>{
    const live = liveByName[ct.name];
    if (!live){ diff.missingTables.push(ct.name); return; }
    const liveCols = {}; live.columns.forEach(c=>{ liveCols[c.name] = c; });
    const curCols = {}; ct.columns.forEach(c=>{ curCols[c.name] = c; });
    live.columns.forEach(lc=>{ if (!curCols[lc.name]) diff.newColumns.push({ table: ct.name, column: lc }); });
    ct.columns.forEach(cc=>{
      const lc = liveCols[cc.name];
      if (!lc){ diff.missingColumns.push({ table: ct.name, column: cc.name }); return; }
      const changes = [];
      if (String(lc.type).toLowerCase() !== String(cc.type).toLowerCase()) changes.push({ field:'type', from: cc.type, to: lc.type });
      if (!!lc.nullable !== !!cc.nullable) changes.push({ field:'nullable', from: !!cc.nullable, to: !!lc.nullable });
      if (!!lc.pk !== !!cc.pk) changes.push({ field:'pk', from: !!cc.pk, to: !!lc.pk });
      if (changes.length) diff.changedColumns.push({ table: ct.name, column: cc.name, changes });
    });
  });
  return diff;
}
function schemaDiffIsEmpty(diff){
  return !diff.newTables.length && !diff.missingTables.length && !diff.newColumns.length
      && !diff.missingColumns.length && !diff.changedColumns.length;
}

// Applies the selected parts of a diff to the model. Options mirror the
// checkboxes in the drift modal. Also pure enough to unit test — it only
// touches the state passed in via the tables/model helpers.
function applySchemaDiff(diff, options){
  const applied = { tablesAdded:0, columnsAdded:0, columnsUpdated:0, columnsRemoved:0, tablesExcluded:0 };
  if (options.addTables){
    diff.newTables.forEach(lt=>{
      const t = newTable(lt.name);
      t.objectType = normalizeSourceObjectType(lt.objectType);
      t.included = !isSourceView(t);
      t.columns = lt.columns.map(c=> Object.assign(newColumn(c.name, c.type), { nullable: c.pk ? false : c.nullable, pk: c.pk }));
      state.tables.push(t);
      applied.tablesAdded++;
    });
  }
  if (options.addColumns){
    diff.newColumns.forEach(entry=>{
      const t = findIncludedTableByName(entry.table) || state.tables.find(x=>x.name===entry.table);
      if (!t) return;
      t.columns.push(Object.assign(newColumn(entry.column.name, entry.column.type), { nullable: entry.column.pk ? false : entry.column.nullable, pk: entry.column.pk }));
      applied.columnsAdded++;
    });
  }
  if (options.updateColumns){
    diff.changedColumns.forEach(entry=>{
      const t = state.tables.find(x=>x.name===entry.table);
      const c = t && t.columns.find(x=>x.name===entry.column);
      if (!c) return;
      entry.changes.forEach(ch=>{ c[ch.field] = ch.to; });
      applied.columnsUpdated++;
    });
  }
  if (options.removeColumns){
    diff.missingColumns.forEach(entry=>{
      const t = state.tables.find(x=>x.name===entry.table);
      if (!t) return;
      const col = t.columns.find(c=>c.name===entry.column);
      if (!col) return;
      t.columns = t.columns.filter(c=>c.id!==col.id);
      t.derivations = t.derivations.filter(d=>!derivationUsesColumn(d,col.name));
      applied.columnsRemoved++;
    });
  }
  if (options.excludeMissingTables){
    diff.missingTables.forEach(name=>{
      const t = state.tables.find(x=>x.name===name);
      if (t && t.included!==false){ t.included = false; applied.tablesExcluded++; }
    });
  }
  if (options.removeColumns || options.excludeMissingTables) pruneDownstreamModel({ dropExcluded:true });
  return applied;
}

let driftDiff = null;

async function runDriftCheck(){
  const v = state.vault;
  if (!['postgresql','mysql','sqlserver'].includes(v.dialect)){ toast('Drift check needs a live PostgreSQL, MySQL, or SQL Server source.','err'); return; }
  const btn = document.getElementById('btn-drift');
  if (btn){ btn.disabled = true; btn.textContent = 'Comparing…'; }
  try {
    const data = await fetchIntrospection();
    captureSourceMeta(data);
    driftDiff = computeSchemaDiff(state.tables, data.tables);
    if (schemaDiffIsEmpty(driftDiff)){
      toast('No drift — the model matches the live source schema.', 'ok');
    } else {
      renderDriftModal();
    }
  } catch(err){
    toast('Drift check failed: ' + err.message, 'err');
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = 'Compare source changes'; }
  }
}

function closeDriftModal(){
  const m = document.getElementById('drift-modal-backdrop');
  if (m) m.remove();
}

function renderDriftModal(){
  closeDriftModal();
  const d = driftDiff;
  const wrap = document.createElement('div');
  wrap.id = 'drift-modal-backdrop';
  wrap.className = 'modal-backdrop';
  const section = (title, items, html) => items.length ? `
    <div class="panel" style="margin-bottom:12px;">
      <div class="panel-head" style="margin:-18px -20px 10px;"><h3>${title} <span class="badge-count">&nbsp;·&nbsp;${items.length}</span></h3></div>
      ${html}
    </div>` : '';
  wrap.innerHTML = `
    <div class="modal-card" style="max-height:85vh;overflow:auto;">
      <div class="flex-between" style="margin-bottom:4px;">
        <h3 style="font-family:var(--font-display);font-size:15px;margin:0;">Schema drift — live source vs. this model</h3>
        <button class="btn small ghost" id="drift-close">&times;</button>
      </div>
      <p class="section-desc" style="margin-bottom:14px;">Tick what to merge into the model. Nothing is written to any database — this only updates the design.</p>

      ${section('New tables in the source', d.newTables, `
        <p class="hint mb0">${d.newTables.map(t=>`<span class="mono">${escapeHtml(t.name)}</span> (${t.columns.length} cols${normalizeSourceObjectType(t.objectType)==='view'?' · view':''})`).join(' · ')}</p>
        <label class="checkbox-row mt"><input type="checkbox" id="drift-add-tables" checked><span>Add these source objects (base tables selected; views unselected)</span></label>
      `)}
      ${section('New columns', d.newColumns, `
        <p class="hint mb0">${d.newColumns.map(e=>`<span class="mono">${escapeHtml(e.table)}.${escapeHtml(e.column.name)}</span> ${escapeHtml(e.column.type)}`).join(' · ')}</p>
        <label class="checkbox-row mt"><input type="checkbox" id="drift-add-columns" checked><span>Add these columns</span></label>
      `)}
      ${section('Changed columns', d.changedColumns, `
        <table class="data"><tr><th>Column</th><th>Change</th></tr>
        ${d.changedColumns.map(e=>`<tr><td class="mono">${escapeHtml(e.table)}.${escapeHtml(e.column)}</td><td class="mono">${e.changes.map(ch=>`${ch.field}: ${escapeHtml(String(ch.from))} → ${escapeHtml(String(ch.to))}`).join(', ')}</td></tr>`).join('')}
        </table>
        <label class="checkbox-row mt"><input type="checkbox" id="drift-update-columns" checked><span>Apply these type/nullability/PK updates</span></label>
      `)}
      ${section('Columns no longer in the source', d.missingColumns, `
        <p class="hint mb0">${d.missingColumns.map(e=>`<span class="mono">${escapeHtml(e.table)}.${escapeHtml(e.column)}</span>`).join(' · ')}</p>
        <label class="checkbox-row mt"><input type="checkbox" id="drift-remove-columns"><span>Remove them (unticked by default — this can prune hubs/satellites that reference them)</span></label>
      `)}
      ${section('Tables no longer in the source', d.missingTables, `
        <p class="hint mb0">${d.missingTables.map(n=>`<span class="mono">${escapeHtml(n)}</span>`).join(' · ')}</p>
        <label class="checkbox-row mt"><input type="checkbox" id="drift-exclude-tables"><span>Exclude them from the run (unticked by default — this can prune downstream model objects)</span></label>
      `)}

      <div class="flex-between mt">
        <button class="btn ghost" id="drift-cancel">Cancel</button>
        <button class="btn primary" id="drift-apply">Merge selected</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  const checked = id => { const el = document.getElementById(id); return !!(el && el.checked); };
  document.getElementById('drift-close').addEventListener('click', closeDriftModal);
  document.getElementById('drift-cancel').addEventListener('click', closeDriftModal);
  wrap.addEventListener('click', e=>{ if (e.target===wrap) closeDriftModal(); });
  document.getElementById('drift-apply').addEventListener('click', ()=>{
    pushUndo('schema drift merge');
    const applied = applySchemaDiff(driftDiff, {
      addTables: checked('drift-add-tables'),
      addColumns: checked('drift-add-columns'),
      updateColumns: checked('drift-update-columns'),
      removeColumns: checked('drift-remove-columns'),
      excludeMissingTables: checked('drift-exclude-tables'),
    });
    closeDriftModal();
    renderAll(); setActiveTabViewOnly('tables');
    toastUndo(`Drift merged: +${applied.tablesAdded} table(s), +${applied.columnsAdded} column(s), ${applied.columnsUpdated} updated, ${applied.columnsRemoved} removed, ${applied.tablesExcluded} excluded.`);
    // New tables/columns aren't in the vault model yet — offer to carry the
    // merge through Staging and Vault right away, instead of leaving it to
    // the "unmodelled items" banners to be noticed later.
    if (applied.tablesAdded || applied.columnsAdded) renderDriftFollowupModal(applied);
  });
}

// Post-merge follow-through: the model (hubs/links/sats/derivations) and
// therefore the DDL + metadata spreadsheet don't know about the merged
// items until they're modelled. Offer both routes.
function renderDriftFollowupModal(applied){
  const wrap = document.createElement('div');
  wrap.id = 'drift-followup-backdrop';
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal-card" style="max-width:520px;">
      <div class="flex-between" style="margin-bottom:4px;">
        <h3 style="font-family:var(--font-display);font-size:15px;margin:0;">Carry the merge into the model?</h3>
        <button class="btn small ghost" id="drift-fu-close">&times;</button>
      </div>
      <p class="section-desc" style="margin-bottom:14px;">
        ${applied.tablesAdded?`${applied.tablesAdded} new table(s)`:''}${applied.tablesAdded&&applied.columnsAdded?' and ':''}${applied.columnsAdded?`${applied.columnsAdded} new column(s)`:''}
        merged — not yet in the vault model, so not yet in the DDL or spreadsheet.
      </p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn primary" id="drift-fu-suggest">Detect Vault Tables — model automatically</button>
        <button class="btn" id="drift-fu-ai">AI Assist</button>
        <button class="btn ghost" id="drift-fu-later">Later — run an Integrity Check on the Staging or Vault step</button>
      </div>
      <p class="hint mt mb0">For a deployed vault, run "Diff against target" on the Export step afterwards.</p>
    </div>`;
  document.body.appendChild(wrap);
  const close = ()=>{ const m = document.getElementById('drift-followup-backdrop'); if (m) m.remove(); };
  document.getElementById('drift-fu-close').addEventListener('click', close);
  document.getElementById('drift-fu-later').addEventListener('click', close);
  wrap.addEventListener('click', e=>{ if (e.target===wrap) close(); });
  document.getElementById('drift-fu-suggest').addEventListener('click', ()=>{ close(); runSuggestFromKeys('tables'); });
  document.getElementById('drift-fu-ai').addEventListener('click', ()=>{ close(); openAiModal('vault'); });
}

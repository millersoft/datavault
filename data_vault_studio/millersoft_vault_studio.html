<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millersoft — Data Vault Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Millersoft brand — carried over from the existing dashboard palette */
  --brand:#7b1fa2;
  --brand-hover:#8f2bb5;
  --brand-deep:#4a2060;
  --brand-wash:#f3e6fa;
  --brand-wash-2:#f5eefa;

  --bg:#faf7fc;
  --panel:#ffffff;
  --panel-2:#f6eefb;
  --border:#e2d3ec;
  --border-soft:#ede1f4;
  --text:#1a0a1e;
  --muted:#7a6b84;
  --muted-2:#ab9bb5;

  /* Data Vault notation colors — these mark hub/link/satellite roles in
     diagrams and are NOT brand colors; they follow the conventional
     Data Vault palette (hub=amber, link=neutral, satellite=teal) so a
     modeller's existing mental map still applies. */
  --hub:#c96a12;
  --hub-dim:#faead4;
  --link:#5c5266;
  --link-dim:#eee7f2;
  --sat:#1c7fa0;
  --sat-dim:#dcf0f6;

  --err:#b3261e;
  --err-dim:#fbe4e2;
  --ok:#1e7d4f;
  --ok-dim:#e0f3e8;
  --focus:var(--brand);
  --radius:4px;
  --font-display:'Inter',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
html[data-theme="dark"]{
  --brand:#b072e8;
  --brand-hover:#c48af0;
  --brand-deep:#e6d2f5;
  --brand-wash:#2b1d3a;
  --brand-wash-2:#241a30;

  --bg:#150d1c;
  --panel:#1e1428;
  --panel-2:#251a32;
  --border:#3a2a4a;
  --border-soft:#2d2038;
  --text:#f1e9f5;
  --muted:#b6a4c2;
  --muted-2:#8a7896;

  --hub:#e2a05a;
  --hub-dim:#3a2c18;
  --link:#c3b7cd;
  --link-dim:#2c2536;
  --sat:#5cc1e6;
  --sat-dim:#12333e;

  --err:#f0857e;
  --err-dim:#3a1b1a;
  --ok:#5fd393;
  --ok-dim:#123527;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color:var(--text);font-family:var(--font-body);height:100%;}
body{
  display:flex;flex-direction:column;min-height:100vh;
  background-color:var(--bg);
  background-image:radial-gradient(circle, rgba(123,31,162,0.10) 1px, transparent 1px);
  background-size:24px 24px;
}
::selection{background:var(--brand);color:#fff;}
a{color:var(--brand);}

/* scrollbars */
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2);}

/* ---------- topbar ---------- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;border-bottom:1px solid var(--border);
  background:var(--panel);
  flex-shrink:0;
}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
.brand-mark{
  width:32px;height:32px;position:relative;flex-shrink:0;
}
.brand-mark-logo{height:34px;width:auto;display:block;}
.brand-title{font-family:var(--font-display);font-weight:800;font-size:16.5px;letter-spacing:-0.2px;color:var(--brand-deep);}
.brand-sub{font-family:var(--font-mono);font-size:10px;color:var(--muted);letter-spacing:0.4px;text-transform:uppercase;margin-top:1px;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.topbar-links{display:flex;gap:14px;align-items:center;margin-right:6px;padding-right:14px;border-right:1px solid var(--border);}
.topbar-links a{font-family:var(--font-body);font-size:12px;color:var(--muted);text-decoration:none;}
.topbar-links a:hover{color:var(--brand);text-decoration:underline;}

/* ---------- legend chips ---------- */
.legend{display:flex;gap:14px;align-items:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:5px;}
.legend .sw{width:9px;height:9px;display:inline-block;}
.sw.hub{background:var(--hub);border-radius:2px;}
.sw.link{background:var(--link);border-radius:50%;}
.sw.sat{background:var(--sat);border-radius:50%;}

/* ---------- mode switch (Designer / Dashboard) ---------- */
.mode-switch{display:flex;gap:0;padding:10px 22px 0;background:var(--panel);border-bottom:1px solid var(--border);}
.mode-btn{
  font-family:var(--font-display);font-weight:700;font-size:12.5px;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);
  padding:8px 16px;cursor:pointer;letter-spacing:.2px;
}
.mode-btn:hover{color:var(--text);}
.mode-btn.active{color:var(--brand);border-bottom-color:var(--brand);}

/* theme toggle switch */
.theme-switch{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.theme-switch-icon{font-size:12px;color:var(--muted);line-height:1;}
.theme-switch input{position:absolute;opacity:0;width:0;height:0;}
.theme-switch-track{
  position:relative;width:34px;height:18px;border-radius:999px;background:var(--border);
  border:1px solid var(--border);transition:background .15s ease;flex-shrink:0;
}
.theme-switch-thumb{
  position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;
  background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s ease;
}
.theme-switch input:checked + .theme-switch-track{background:var(--brand);border-color:var(--brand);}
.theme-switch input:checked + .theme-switch-track .theme-switch-thumb{transform:translateX(16px);}
.theme-switch input:focus-visible + .theme-switch-track{outline:2px solid var(--brand);outline-offset:2px;}

/* dashboard: health banner */
.health-chip{
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);
  border:1px solid var(--border);background:var(--panel);border-left-width:3px;
}
.health-chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}

/* dashboard: run type breakdown */
.runtype-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.runtype-label{font-size:12px;color:var(--text);width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.runtype-bar-track{flex:1;height:10px;background:var(--panel-2);border-radius:999px;overflow:hidden;}
.runtype-bar-fill{height:100%;background:var(--brand);border-radius:999px;}
.runtype-count{width:28px;text-align:right;flex-shrink:0;font-size:12px;color:var(--muted);}

/* studio plus: suggestion checkboxes */
.sp-suggestion-row{
  display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border-soft);
  border-radius:var(--radius);margin-bottom:8px;cursor:pointer;background:var(--panel);
}
.sp-suggestion-row:hover{border-color:var(--brand);}
.sp-suggestion-row input{margin-top:3px;flex-shrink:0;}

/* landing screen */
.landing-wrap{max-width:1040px;margin:0 auto;padding:56px 24px 48px;text-align:center;}
.landing-title{
  font-family:var(--font-display);font-size:36px;line-height:1.15;font-weight:800;
  letter-spacing:-1px;margin:0 0 14px;color:var(--text);
}
.landing-sub{color:var(--muted);font-size:15px;max-width:680px;margin:0 auto 38px;line-height:1.65;}
.landing-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;text-align:left;}
.landing-card{
  appearance:none;width:100%;min-height:138px;
  background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:24px;
  cursor:pointer;font-family:var(--font-body);color:var(--text);text-align:left;
  display:grid;grid-template-columns:44px minmax(0,1fr);grid-template-rows:auto 1fr;
  column-gap:16px;row-gap:7px;align-content:start;align-items:start;
  transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.landing-card:hover{
  border-color:var(--brand);background:var(--brand-wash-2);
  transform:translateY(-2px);box-shadow:0 12px 30px rgba(74,32,96,.13);
}
.landing-card:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-color:var(--brand);}
.landing-card-icon{
  grid-column:1;grid-row:1 / span 2;
  width:44px;height:44px;border-radius:9px;background:var(--brand-wash);
  display:flex;align-items:center;justify-content:center;color:var(--brand);
  font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1;
}
.landing-card-title{
  grid-column:2;font-family:var(--font-display);font-weight:750;font-size:16px;
  line-height:1.3;color:var(--text);margin:1px 0 0;
}
.landing-card-desc{grid-column:2;font-size:13px;color:var(--muted);line-height:1.55;margin:0;max-width:40ch;}
@media (max-width:820px){
  .landing-wrap{max-width:680px;padding-top:44px;}
  .landing-cards{grid-template-columns:1fr;}
}
@media (max-width:520px){
  .topbar{padding:12px 16px;}
  .topbar-links,.legend{display:none;}
  .brand-mark-logo{height:30px;}
  .brand-sub{font-size:9px!important;margin-left:4px!important;}
  .landing-wrap{padding:34px 2px 32px;}
  .landing-title{font-size:30px;letter-spacing:-.7px;}
  .landing-sub{font-size:14px;margin-bottom:28px;}
  .landing-card{min-height:0;padding:20px;grid-template-columns:40px minmax(0,1fr);column-gap:14px;}
  .landing-card-icon{width:40px;height:40px;font-size:16px;}
}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:2px;padding:0 22px;background:var(--panel);border-bottom:1px solid var(--border);
  flex-shrink:0;overflow-x:auto;
}
.tab-btn{
  font-family:var(--font-display);font-weight:600;font-size:13px;
  background:none;border:none;color:var(--muted);padding:13px 16px 11px;cursor:pointer;
  border-bottom:2px solid transparent;white-space:nowrap;letter-spacing:0.1px;
  display:flex;align-items:center;gap:7px;
}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);}
.tab-count{
  font-family:var(--font-mono);font-size:10px;background:var(--panel-2);color:var(--muted);
  padding:1px 6px;border-radius:8px;border:1px solid var(--border);
}
.tab-btn.active .tab-count{color:var(--brand);border-color:var(--brand-wash);background:var(--brand-wash);}

/* ---------- main layout ---------- */
main{flex:1;overflow:auto;padding:24px 22px 60px;max-width:1280px;width:100%;margin:0 auto;}
.view{display:none;animation:fadein .15s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:none;}}

h2.section-title{
  font-family:var(--font-display);font-size:16px;font-weight:800;margin:0 0 4px;letter-spacing:-0.2px;
  display:flex;align-items:center;gap:8px;color:var(--brand-deep);
}
.section-desc{color:var(--muted);font-size:12.5px;margin:0 0 18px;max-width:680px;line-height:1.55;}

.panel{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:16px;position:relative;
}
.panel::before, .panel::after{
  content:'';position:absolute;width:9px;height:9px;pointer-events:none;opacity:.65;
}
.panel::before{top:-1px;left:-1px;border-top:1.5px solid var(--muted-2);border-left:1.5px solid var(--muted-2);}
.panel::after{bottom:-1px;right:-1px;border-bottom:1.5px solid var(--muted-2);border-right:1.5px solid var(--muted-2);}
.panel-flush{padding:0;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.panel-head h3{font-family:var(--font-mono);font-size:11.5px;margin:0;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--brand-deep);}

.grid{display:grid;gap:14px;}
.grid>*{min-width:0;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.grid.cols-4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media (max-width:820px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}}

label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;font-family:var(--font-mono);letter-spacing:.2px;}
.field{margin-bottom:2px;}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:8px 10px;border-radius:var(--radius);font-family:var(--font-mono);font-size:12.5px;
}
textarea{font-family:var(--font-mono);resize:vertical;min-height:70px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px var(--brand-wash);}
input::placeholder,textarea::placeholder{color:var(--muted-2);}
input[readonly]{background:var(--panel-2);color:var(--brand-deep);cursor:default;}
select:disabled{background:var(--panel-2);color:var(--brand-deep);opacity:1;cursor:not-allowed;}
.hint{font-size:10.5px;color:var(--muted-2);margin-top:4px;}
.checkbox-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);}
.checkbox-row input{width:auto;accent-color:var(--brand);}
input[type=checkbox]{accent-color:var(--brand);}

/* buttons */
.btn{
  font-family:var(--font-display);font-weight:600;font-size:12.5px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  padding:8px 14px;border-radius:var(--radius);cursor:pointer;letter-spacing:.1px;
  display:inline-flex;align-items:center;gap:7px;text-decoration:none;
}
.btn:hover{border-color:var(--brand);color:var(--brand-deep);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);color:#fff;}
.btn.ghost{background:none;}
.btn.danger{color:var(--err);}
.btn.small{padding:5px 10px;font-size:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-icon{width:16px;height:16px;flex-shrink:0;}
.quick-tip{position:relative;display:inline-flex;}
.quick-tip::after{
  content:attr(data-tooltip);position:absolute;z-index:80;left:50%;bottom:calc(100% + 7px);
  transform:translate(-50%,3px);width:max-content;max-width:300px;padding:6px 8px;
  border:1px solid var(--border);border-radius:var(--radius);background:var(--brand-deep);color:#fff;
  font-family:var(--font-body);font-size:10.5px;font-weight:500;line-height:1.35;text-align:left;
  box-shadow:0 5px 18px rgba(32,15,42,.2);pointer-events:none;opacity:0;visibility:hidden;
  transition:opacity .1s ease,transform .1s ease,visibility 0s linear .1s;
}
.quick-tip:hover::after,.quick-tip:focus-within::after{
  opacity:1;visibility:visible;transform:translate(-50%,0);
  transition-delay:.12s,.12s,.12s;
}

/* tables */
table.data{width:100%;border-collapse:collapse;font-size:12px;}
table.data th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;
  color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);letter-spacing:.3px;
  background:var(--panel-2);
}
table.data td{padding:7px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
table.data tr:hover td{background:var(--brand-wash-2);}
table.data input,table.data select{padding:5px 7px;font-size:11.5px;}
.mono{font-family:var(--font-mono);}
.tag{
  font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:8px;
  border:1px solid var(--border);color:var(--muted);white-space:nowrap;
}
.tag.hub{border-color:var(--hub);color:var(--hub);background:var(--hub-dim);}
.tag.link{border-color:var(--link);color:var(--link);background:var(--link-dim);}
.tag.sat{border-color:var(--sat);color:var(--sat);background:var(--sat-dim);}
.tag.pk{border-color:var(--ok);color:var(--ok);}

/* empty state */
.empty{
  text-align:center;padding:36px 20px;color:var(--muted-2);font-size:12.5px;
  border:1px dashed var(--border);border-radius:var(--radius);
}

/* entity cards (hubs/links/sats) */
.entity-card{
  border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;
  background:var(--panel);
}
.entity-card .ehead{
  display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
  background:var(--panel-2);cursor:pointer;
}
.entity-card .ehead-left{display:flex;align-items:center;gap:10px;}
.entity-marker{width:11px;height:11px;flex-shrink:0;}
.entity-marker.hub{background:var(--hub);border-radius:2px;transform:rotate(45deg);}
.entity-marker.link{background:var(--link);border-radius:50%;}
.entity-marker.sat{background:var(--sat);border-radius:50%;}
.entity-name{font-family:var(--font-mono);font-weight:600;font-size:12.5px;color:var(--brand-deep);}
.entity-meta{font-size:11px;color:var(--muted);}
.entity-body{padding:14px;border-top:1px solid var(--border);background:var(--bg);display:none;}
.entity-body.open{display:block;}
.entity-card .ehead.open{border-bottom:1px solid var(--border);}

/* code preview */
pre.code{
  background:#20142b;border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;overflow:auto;
  max-height:420px;color:#e7d9f0;white-space:pre;
}
pre.code .kw{color:var(--sat);}

/* export file accordion rows */
.export-file-list{border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;}
.export-file-row{border-bottom:1px solid var(--border-soft);}
.export-file-row:last-child{border-bottom:none;}
.export-file-row-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;background:var(--panel);}
.export-file-row.expanded .export-file-row-head{background:var(--panel-2);}
.export-file-toggle{
  display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;
  font-family:var(--font-body);font-size:12.5px;color:var(--text);padding:2px 0;flex:1;text-align:left;
}
.export-file-caret{font-size:10px;color:var(--muted-2);width:10px;display:inline-block;}
.export-file-label{font-weight:600;}
.export-file-actions{display:flex;gap:6px;flex-shrink:0;}
.export-file-body{padding:0 12px 12px;background:var(--panel-2);}
.export-file-body-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;}
textarea.code-edit{
  width:100%;box-sizing:border-box;background:#20142b;border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;font-family:var(--font-mono);font-size:11.5px;line-height:1.6;color:#e7d9f0;
  min-height:220px;resize:vertical;white-space:pre;
}


/* compact deployment status stages */
.deploy-stage-list{
  border:1px solid var(--border-soft);border-radius:var(--radius);overflow:hidden;background:var(--panel);
}
.deploy-stage{border-bottom:1px solid var(--border-soft);background:var(--panel);}
.deploy-stage:last-child{border-bottom:none;}
.deploy-stage[open]{background:var(--panel-2);}
.deploy-stage-summary{
  display:grid;grid-template-columns:18px minmax(170px,.75fr) minmax(220px,1.4fr) auto;
  align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;background:var(--panel);
}
.deploy-stage[open] .deploy-stage-summary{background:var(--panel-2);}
.deploy-stage-summary::-webkit-details-marker{display:none;}
.deploy-stage-caret{font-size:11px;color:var(--muted-2);transition:transform .12s ease;}
.deploy-stage[open] .deploy-stage-caret{transform:rotate(90deg);}
.deploy-stage-title{font-weight:650;color:var(--text);}
.deploy-stage-summary-text{font-size:11.5px;color:var(--muted);line-height:1.35;min-width:0;}
.deploy-stage-body{border-top:1px solid var(--border-soft);background:var(--panel);}
.deploy-check{
  display:grid;grid-template-columns:20px minmax(165px,.75fr) minmax(220px,1.4fr) auto;
  align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border-soft);font-size:11.5px;
}
.deploy-check:last-child{border-bottom:none;}
.deploy-check:hover{background:var(--brand-wash-2);}
.deploy-check-icon{
  width:16px;height:16px;border:1px solid currentColor;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9px;font-weight:700;
}
.deploy-check-icon.current{color:var(--ok);}
.deploy-check-icon.stale{color:var(--hub);}
.deploy-check-icon.missing,.deploy-check-icon.fail{color:var(--err);}
.deploy-check-icon.unknown{color:var(--muted);}
.deploy-check-icon.busy{color:var(--brand);}
.deploy-check-label{font-weight:600;color:var(--text);}
.deploy-check-detail{color:var(--muted);line-height:1.35;min-width:0;overflow-wrap:anywhere;}
.deploy-check-error{color:var(--err);}

.ai-status.ok{color:var(--ok);border-color:var(--ok-dim);background:var(--ok-dim);}

/* AI modal */

  padding:6vh 20px;z-index:500;overflow:auto;

.modal-card{

.cy-detail{

<script>
/* =========================================================================
   DATA VAULT STUDIO — state
   ========================================================================= */
let uidCounter = 1;
const uid = (p) => `${p}_${(uidCounter++).toString(36)}`;

// External storage is a shipped feature. Only the four primary Data Vault
// relation families (hub/link/sat/lsat) can be external; error tables, views,
// staging and metadata remain local PostgreSQL objects.
const FEATURE_EXTERNAL_STORAGE = true;
// The Node server replaces this marker when it serves the page. Opening the
// HTML directly keeps the backward-compatible demo profile.
const STUDIO_RUNTIME_MODE = '__STUDIO_RUNTIME_MODE__' === 'demo' ? 'demo' : 'production';
function isDemoRuntime(){ return STUDIO_RUNTIME_MODE === 'demo'; }
function isProductionRuntime(){ return STUDIO_RUNTIME_MODE === 'production'; }
// Incremental staging loads remain gated. Link satellites are enabled because
// relationship attributes selected in the selected staging columns need a
// deterministic destination in the Vault model.
const FEATURE_INCREMENTAL = false;
const FEATURE_LINK_SATELLITES = true;
function applyFeatureGates(){
  const existingExternalTables = Object.assign({}, state.externalTables || {});
  state.externalTables = Object.assign({
    enabled:false, serverName:'', drivername:'', url:'', jarfile:'', querytimeout:'30', maxheapsize:'',
    username:'', password:'', remoteDialect:'postgresql', remoteDatabase:'', remoteSchema:'',
    studioHost:'', studioPort:'', studioDatabase:'', studioSchema:'', studioUser:'', studioPassword:'',
    studioConnectionOverridden:false, deploymentAcknowledged:false,
  }, existingExternalTables);
  state.externalTables.deploymentAcknowledged = false;
  if (state.externalTables.enabled) applyExternalTargetDefaults(false);
  let normalizedColumnFlags = 0;
  (state.tables||[]).forEach(t=> (t.columns||[]).forEach(c=>{
    if (typeof c.staged !== 'boolean'){ c.staged = true; normalizedColumnFlags++; }
  }));
  let normalizedTargetNames = 0;
  (state.tables||[]).forEach(t=>{
    (t.columns||[]).forEach(c=>{
      if (!c.targetName){ c.targetNameAuto = true; normalizedTargetNames++; }
    });
    ensureTableTargetNames(t);
  });
  let normalizedHubKeys = 0;
  (state.hubs||[]).forEach(h=>{
    if (!Array.isArray(h.keyColIds) || !h.keyColIds.length){
      h.keyColIds = h.pkColId ? [h.pkColId] : [];
      normalizedHubKeys++;
    }
    if (!h.pkColId && h.keyColIds.length) h.pkColId = h.keyColIds[0];
  });
  let normalizedLinkKeys = 0;
  (state.links||[]).forEach(l=>(l.hubs||[]).forEach(h=>{
    if(!Array.isArray(h.colIds)||!h.colIds.length){ h.colIds=h.colId?[h.colId]:[]; normalizedLinkKeys++; }
    if(!h.colId&&h.colIds.length) h.colId=h.colIds[0];
    if(h.role) h.role=sqlNamePart(h.role);
  }));
  let normalizedSatelliteTargets = 0;
  (state.hubSats||[]).concat(state.linkSats||[]).forEach(s=>{
    if(s.concern){ const cleanConcern=sqlNamePart(s.concern); if(cleanConcern!==s.concern){s.concern=cleanConcern;normalizedSatelliteTargets++;} }
    const t=(state.tables||[]).find(x=>x.id===s.tableId);
    (s.attrs||[]).forEach(a=>{
      const col=t&&(t.columns||[]).find(c=>c.id===a.colId);
      if(!col) return;
      const clean=targetIdentifierBase(!a.target||a.target===col.name?targetColumnName(col):a.target);
      if(clean!==a.target){a.target=clean;normalizedSatelliteTargets++;}
    });
  });
  let normalizedLoadGroups = 0;
  (state.tables||[]).forEach(t=>{
    if (t.loadGroup !== 2000){ t.loadGroup = 2000; normalizedLoadGroups++; }
  });
  if (!FEATURE_INCREMENTAL) (state.tables||[]).forEach(t=>{ t.incremental = false; t.incrementCol = ''; });
  if (!FEATURE_LINK_SATELLITES && state.linkSats && state.linkSats.length) state.linkSats = [];
  // Older/AI-generated projects may contain one business-key derivation per
  // column of a composite junction key (for example film_actor.actor_id and
  // film_actor.film_id both targeting film_actor_bk). Normalise those saved
  // projects on load/restore as soon as FK metadata is available.
  const repairedJunctionDerivations = typeof repairAllJunctionDerivations === 'function'
    ? repairAllJunctionDerivations()
    : 0;
  const repairedForeignKeyDerivations = typeof repairAllForeignKeyDerivations === 'function'
    ? repairAllForeignKeyDerivations()
    : 0;
  const repairedSatelliteDerivations = typeof repairAllSatelliteParentDerivations === 'function'
    ? repairAllSatelliteParentDerivations()
    : 0;
  return { repairedJunctionDerivations, repairedForeignKeyDerivations, repairedSatelliteDerivations, normalizedColumnFlags, normalizedTargetNames, normalizedHubKeys, normalizedLinkKeys, normalizedSatelliteTargets, normalizedLoadGroups };
}

// Packaged containers, selectable from the connection dropdowns.
// GUI/local server reach them via the HOST-mapped ports (localhost:3306 /
// localhost:5433). The hop engine runs INSIDE the compose network, so the
// generated postgres-environment.json uses the service hostnames instead
// (mysql:3306 / postgres:5432) — see buildHopEnvironmentJson.
// Fallbacks only — runtime credentials live in <project-root>/.env. Studio
// reads them for packaged presets and Apply All synchronises the selected
// source password plus native external-PostgreSQL credentials through a
// narrow allowlisted server endpoint. Internal DB_* values remain untouched.
const DEMO_SOURCE = { dialect:'mysql', srcHost:'localhost', srcPort:'3306', srcDatabase:'sakila', srcUser:'sakila', srcPassword:'sourcesecret' };
const DEMO_TARGET = { dvHost:'localhost', dvPort:'5433', dvUser:'dvuser', dvPassword:'secret' };
let envDefaults = null; // { found, mysql:{user,password}, target:{user,password} } | null
async function refreshEnvDefaults(){
  try {
    const r = await localFetch('/api/env-defaults').then(x=>x.json());
    envDefaults = (r.ok && r.found) ? r : null;
    // Demo connections are locked to the packaged services. Refresh their
    // credentials from .env, then refresh untouched FDW demo defaults too.
    if (envDefaults && typeof state !== 'undefined'){
      if (demoSourceActive()) applyDemoSource(true);
      if (demoTargetActive()) applyDemoTarget(true);
      if (state.externalTables && state.externalTables.enabled) applyExternalTargetDefaults(false);
    }
  } catch(_){ envDefaults = null; }
  return envDefaults;
}
function runtimeCredentialPayload(){
  const externalPostgres = state.vault.targetPreset !== 'internal';
  return {
    sourcePassword: String(state.vault.srcPassword || ''),
    targetPassword: externalPostgres ? String(state.vault.dvPassword || '') : '',
    targetUser: externalPostgres ? String(state.vault.dvUser || '') : '',
    externalPostgres,
  };
}
function runtimeCredentialValidationMessage(){
  const missing = [];
  if (!String(state.vault.srcPassword || '')) missing.push('source password');
  if (state.vault.targetPreset !== 'internal'){
    if (!String(state.vault.dvUser || '')) missing.push('external PostgreSQL username');
    if (!String(state.vault.dvPassword || '')) missing.push('external PostgreSQL password');
  }
  return missing.length ? `Enter the ${missing.join(', ').replace(/, ([^,]*)$/, ' and $1')} on Connections before deployment.` : '';
}
async function deployRuntimeCredentials(options = {}){
  const message = runtimeCredentialValidationMessage();
  if (message){
    if (!options.silent) toast(message, 'err');
    throw new Error(message);
  }
  const response = await localFetch('/api/env-credentials', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify(runtimeCredentialPayload()),
  });
  const data = await response.json();
  if (!data.ok) throw new Error(data.error || 'Could not update the root .env credentials.');
  if (!options.silent) toast(`Updated ${data.updated.join(', ')} in the root .env.`, 'ok');
  return data;
}
function demoSourceActive(){ return state.vault.sourcePreset === 'demo'; }
function demoTargetActive(){ return state.vault.targetPreset === 'internal'; }
function selectedDeploymentTarget(){
  if (state.vault.targetPreset !== 'internal') return 'postgres';
  if (state.externalTables.enabled && state.externalTables.remoteDialect === 'mysql') return 'mysql';
  if (state.externalTables.enabled && state.externalTables.remoteDialect === 'sqlserver') return 'sqlserver';
  return 'internal-postgres';
}
function applyDeploymentTarget(target){
  const previous = selectedDeploymentTarget();
  if (target === 'postgres'){
    if (state.vault.targetPreset === 'internal'){
      Object.assign(state.vault, { dvHost:'', dvPort:'5432', dvDatabase:state.vault.dvDatabase||'datavault', dvUser:'', dvPassword:'', vaultPassword:'' });
    }
    state.vault.targetPreset = '';
    state.externalTables.enabled = false;
  } else {
    const database = state.vault.dvDatabase || 'datavault';
    applyDemoTarget(true);
    state.vault.dvDatabase = database;
    if (target === 'mysql' || target === 'sqlserver'){
      const dialectChanged = state.externalTables.remoteDialect !== target || !state.externalTables.enabled;
      state.externalTables.enabled = true;
      applyExternalTargetDefaults(previous !== target);
      state.externalTables.remoteDialect = target;
      if (dialectChanged){
        const d = externalDialectDefaults(target);
        Object.assign(state.externalTables, {
          studioPort:d.port, remoteSchema:d.schema, studioSchema:d.schema,
          drivername:d.drivername, jarfile:d.jarfile,
          url:defaultExternalJdbcUrl(target, state.externalTables.studioHost||'external-db', d.port,
            state.externalTables.studioDatabase||state.externalTables.remoteDatabase||'datavault'),
        });
      }
    } else {
      state.externalTables.enabled = false;
    }
  }
  targetConnStatus=null; targetDbExists=null; targetRoleCheck=null;
  externalPreflightResult=null; externalDeployResult=null;
  externalTargetConnStatus=null; externalTargetDbExists=null; externalTargetIdentity=null;
  targetJdbcDriverStatus=null;
}
// Engine run mode — maps straight onto start.sh's flags:
//   demo     -> ./start.sh up --demo -d hop        (sakila + internal Postgres)
//   internal -> ./start.sh up -d hop               (internal Postgres)
//   external -> ./start.sh up --external-postgres -d hop
// start.sh rejects --demo together with --external-postgres, so the demo
// source is only valid with the internal Postgres target.
function engineMode(){
  if (state.vault.sourcePreset === 'demo' && state.vault.targetPreset === 'internal') return 'demo';
  if (state.vault.targetPreset === 'internal') return 'internal';
  return 'external';
}
function engineModeLabel(){
  return { demo: 'Demo — sakila source + internal Postgres',
           internal: 'Internal Postgres',
           external: 'External Postgres' }[engineMode()];
}
function engineModeInvalid(){
  return state.vault.sourcePreset === 'demo' && state.vault.targetPreset !== 'internal';
}
// The hop engine runs inside Docker: "localhost" typed for an EXTERNAL
// database resolves to the container itself, not this machine. The
// packaged presets are exempt — the generated config rewrites those to
// the compose service hostnames automatically.
function externalLocalhostIssues(){
  const isLocal = h => /^(localhost|127\.0\.0\.1|::1)$/i.test(String(h || '').trim());
  const out = [];
  if (state.vault.sourcePreset !== 'demo' && isLocal(state.vault.srcHost)) out.push('source');
  if (state.vault.targetPreset !== 'internal' && isLocal(state.vault.dvHost)) out.push('target');
  return out;
}
function externalLocalhostWarningHtml(){
  const issues = externalLocalhostIssues();
  if (!issues.length) return '';
  return `<div class="ai-status err mt" style="align-items:flex-start;border-color:var(--hub);color:var(--hub);"><span>The ${issues.join(' and ')} host is "localhost", but the engine runs inside Docker where localhost is the container itself. Use a real hostname/IP (or <span class="mono">host.docker.internal</span>) so the engine can reach it.</span></div>`;
}

function applyDemoSource(on){
  if (on){
    Object.assign(state.vault, DEMO_SOURCE);
    if (envDefaults && envDefaults.mysql){
      if (envDefaults.mysql.user) state.vault.srcUser = envDefaults.mysql.user;
      if (envDefaults.mysql.password) state.vault.srcPassword = envDefaults.mysql.password;
    }
    state.vault.sourcePreset = 'demo';
    state.vault.sourceSchema = 'sakila'; // MySQL: schema = database
    // The bundled demo only runs with the internal Postgres (start.sh
    // rejects --demo with --external-postgres) — pair them automatically.
    if (state.vault.targetPreset !== 'internal') applyDemoTarget(true);
    // Fill naming only where blank — never overwrite the user's own values
    if (!state.vault.name) state.vault.name = 'sak';
    if (!state.vault.prefix) state.vault.prefix = 'sak';
    if (!state.vault.tenantId) state.vault.tenantId = 'SAK';
    if (!state.vault.srcCod) state.vault.srcCod = 'SAK';
    if (!state.vault.srcDescription) state.vault.srcDescription = 'sakila';
  } else {
    Object.assign(state.vault, { srcHost:'', srcPort:'', srcDatabase:'', srcUser:'', srcPassword:'' });
    state.vault.sourcePreset = '';
    state.vault.sourceSchema = state.vault.dialect==='mysql' ? '' : state.vault.dialect==='sqlserver' ? 'dbo' : 'public';
  }
}
function applyDemoTarget(on){
  if (on){
    Object.assign(state.vault, DEMO_TARGET);
    const targetDefaults = envDefaults && envDefaults.target;
    if (targetDefaults){
      if (targetDefaults.user) state.vault.dvUser = targetDefaults.user;
      if (targetDefaults.password) state.vault.dvPassword = targetDefaults.password;
    }
    // Backward compatibility for servers from the two-password build.
    if (!state.vault.dvPassword && envDefaults && envDefaults.vault && envDefaults.vault.password){
      state.vault.dvPassword = envDefaults.vault.password;
    }
    state.vault.vaultPassword = state.vault.dvPassword;
    state.vault.targetPreset = 'internal';
    if (!state.vault.dvDatabase) state.vault.dvDatabase = 'datavault';
  } else {
    Object.assign(state.vault, { dvHost:'localhost', dvPort:'5432', dvUser:'', dvPassword:'', vaultPassword:'' });
    state.vault.targetPreset = '';
  }
}


// When the internal PostgreSQL target uses FDW, the physical core-table
// destination is configured separately below. PostgreSQL remains the Hop
// engine/gateway, while the physical target credentials are stored in
// state.externalTables and also become the Studio Plus defaults.
const JDBC_DRIVER_SPECS = {
  mysql: {
    label:'MySQL Connector/J',
    version:'9.7.0',
    filename:'mysql-connector-j-9.7.0.jar',
    url:'https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/9.7.0/mysql-connector-j-9.7.0.jar',
    otherUrl:'https://dev.mysql.com/downloads/connector/j/',
    statusField:'mysqlDriver',
    drivername:'com.mysql.cj.jdbc.Driver',
  },
  sqlserver: {
    label:'Microsoft JDBC Driver for SQL Server',
    version:'13.4.0.jre11',
    filename:'mssql-jdbc-13.4.0.jre11.jar',
    url:'https://repo1.maven.org/maven2/com/microsoft/sqlserver/mssql-jdbc/13.4.0.jre11/mssql-jdbc-13.4.0.jre11.jar',
    otherUrl:'https://learn.microsoft.com/sql/connect/jdbc/download-microsoft-jdbc-driver-for-sql-server',
    statusField:'sqlServerDriver',
    drivername:'com.microsoft.sqlserver.jdbc.SQLServerDriver',
  },
};
function jdbcDriverSpec(dialect){ return JDBC_DRIVER_SPECS[dialect] || null; }
function defaultExternalJdbcUrl(dialect, host, port, database){
  const h=host||'external-db';
  const p=port||externalDefaultPort(dialect);
  const db=database||'datavault';
  if(dialect==='mysql') return `jdbc:mysql://${h}:${p}/${db}`;
  if(dialect==='sqlserver') return `jdbc:sqlserver://${h}:${p};databaseName=${db};encrypt=true;trustServerCertificate=true`;
  return `jdbc:postgresql://${h}:${p}/${db}`;
}
function externalDialectDefaults(dialect){
  const spec=jdbcDriverSpec(dialect);
  if(dialect==='mysql') return {port:'3306',schema:'',drivername:spec.drivername,jarfile:`/opt/jdbc-drivers/${spec.filename}`};
  if(dialect==='sqlserver') return {port:'1433',schema:'dbo',drivername:spec.drivername,jarfile:`/opt/jdbc-drivers/${spec.filename}`};
  return {port:'5432',schema:'data_vault',drivername:'org.postgresql.Driver',jarfile:'/opt/jdbc-drivers/postgresql-42.7.5.jar'};
}

function externalTargetDefaults(){
  const v = state.vault;
  const demoPhysicalTarget = isDemoRuntime();
  const name = sqlNamePart(v.name || 'vault') || 'vault';
  const sourcePassword = String(v.srcPassword || (envDefaults && envDefaults.mysql && envDefaults.mysql.password) || '');
  if (demoPhysicalTarget){
    return {
      serverName: `${name}_external_srv`,
      drivername: 'com.mysql.cj.jdbc.Driver',
      url: 'jdbc:mysql://mysql:3306/datavault',
      jarfile: '/opt/jdbc-drivers/mysql-connector-j-9.7.0.jar',
      querytimeout: '30',
      maxheapsize: '512m',
      username: v.srcUser || 'sakila',
      password: sourcePassword,
      remoteDialect: 'mysql',
      remoteDatabase: 'datavault',
      remoteSchema: '',
      studioHost: v.srcHost || 'localhost',
      studioPort: v.srcPort || '3306',
      studioDatabase: 'datavault',
      studioSchema: '',
      studioUser: v.srcUser || 'sakila',
      studioPassword: sourcePassword,
    };
  }
  return {
    serverName: `${name}_external_srv`,
    drivername: '', url: '', jarfile:'', querytimeout:'30', maxheapsize:'512m',
    username:'', password:'', remoteDialect:'postgresql', remoteDatabase:'datavault', remoteSchema:'data_vault',
    studioHost:'', studioPort:'5432', studioDatabase:'datavault', studioSchema:'data_vault', studioUser:'', studioPassword:'',
  };
}

function applyExternalTargetDefaults(force=false){
  const ext = state.externalTables;
  if (!ext || !ext.enabled) return;
  const defaults = externalTargetDefaults();
  const connectionAlreadyConfigured = !!(
    ext.studioConnectionOverridden || ext.url || ext.studioHost || ext.studioUser ||
    ext.remoteDatabase || ext.username || ext.drivername || ext.jarfile
  );
  if (force || !connectionAlreadyConfigured){
    Object.assign(ext, defaults, { studioConnectionOverridden:false });
    return;
  }
  for (const [key,value] of Object.entries(defaults)){
    if (ext[key] === undefined || ext[key] === null || ext[key] === '') ext[key] = value;
  }
  if (isDemoRuntime()){
    const sharedUser = String(state.vault.srcUser || defaults.studioUser || '');
    const sharedPassword = String(state.vault.srcPassword || defaults.studioPassword || '');
    ext.studioUser = sharedUser;
    ext.studioPassword = sharedPassword;
    ext.username = sharedUser;
    ext.password = sharedPassword;
  } else {
    ext.studioUser = String(ext.studioUser || ext.username || '');
    ext.studioPassword = String(ext.studioPassword || ext.password || '');
    ext.username = ext.studioUser;
    ext.password = ext.studioPassword;
  }
}

function externalPhysicalSchemaLabel(){
  const ext=state.externalTables;
  return ext.remoteDialect==='mysql'
    ? (ext.studioDatabase||ext.remoteDatabase||'datavault')
    : (ext.studioSchema||ext.remoteSchema||(ext.remoteDialect==='sqlserver'?'dbo':'data_vault'));
}

function enforceDemoConnections(){
  applyDemoSource(true);
  applyDemoTarget(true);
}

function enforceRuntimeConnections(preferInternal=false){
  if (isDemoRuntime()){
    enforceDemoConnections();
    return;
  }

  // A project created in demo mode can be opened in production mode. Keep
  // its values, but turn the packaged Sakila preset into an ordinary editable
  // MySQL connection rather than exposing a demo-only selector.
  if (state.vault.sourcePreset === 'demo') state.vault.sourcePreset = '';

  if (state.externalTables && state.externalTables.enabled && !['mysql','sqlserver'].includes(state.externalTables.remoteDialect)) state.externalTables.enabled = false;

  if (preferInternal && state.vault.targetPreset !== 'internal'){
    applyDemoTarget(true);
  } else if (state.vault.targetPreset === 'internal'){
    const database = state.vault.dvDatabase || 'datavault';
    applyDemoTarget(true);
    state.vault.dvDatabase = database;
  } else {
    state.vault.targetPreset = '';
    if (state.externalTables && state.externalTables.enabled) state.externalTables.enabled = false;
  }
}

const DIALECTS = {
  postgresql: { label: 'PostgreSQL', defaultPort: '5432',
    // sha256() is BUILT IN since PostgreSQL 11 — deliberately not
    // digest(..., 'sha256'), which needs the pgcrypto extension installed
    // on the SOURCE database (often not possible on a read-only source).
    hash: (c, algo) => algo==='sha256'
      ? `sha256(${c}::text::bytea)`
      : `upper(md5(${c}::text))`,
    boolTypes: ['boolean','bool'], jsonTypes: ['jsonb','json','text'] },
  mysql: { label: 'MySQL', defaultPort: '3306',
    hash: (c, algo) => algo==='sha256'
      ? `UNHEX(SHA2(CAST(${c} AS CHAR), 256))`
      : `UPPER(MD5(CAST(${c} AS CHAR)))`,
    boolTypes: ['tinyint(1)','boolean','bool'], jsonTypes: ['json','text','longtext','mediumtext'] },
  sqlserver: { label: 'SQL Server', defaultPort: '1433',
    hash: (c, algo) => algo==='sha256'
      ? `HASHBYTES('SHA2_256', CONVERT(VARBINARY(MAX), CONVERT(NVARCHAR(MAX), ${c})))`
      : `UPPER(CONVERT(VARCHAR(32), HASHBYTES('MD5', CONVERT(VARBINARY(MAX), CONVERT(NVARCHAR(MAX), ${c}))), 2))`,
    boolTypes: ['bit'], jsonTypes: ['text','ntext','varchar(max)','nvarchar(max)'] },
  oracle: { label: 'Oracle', defaultPort: '1521',
    hash: (c, algo) => algo==='sha256'
      ? `STANDARD_HASH(TO_CHAR(${c}), 'SHA256')`
      : `UPPER(STANDARD_HASH(TO_CHAR(${c}), 'MD5'))`,
    boolTypes: ['number(1)','char(1)'], jsonTypes: ['clob','long'] },
};

const HASH_ALGORITHMS = {
  md5: { label: 'MD5', width: 32, sqlLabel: 'VARCHAR(32)', note: 'Widely supported, no extra extension needed on Postgres.' },
  sha256: { label: 'SHA-256', width: 64, sqlLabel: 'BYTEA (binary)', note: 'Binary SHA-256. PostgreSQL uses built-in sha256(), MySQL uses UNHEX(SHA2(...,256)), and SQL Server uses HASHBYTES over Unicode bytes. Hash key columns are stored as BYTEA in PostgreSQL staging.' },
};
// LOCKED to SHA-256 for now — the selector in the UI is shown greyed out.

function hashAlgo(){ return 'sha256'; }
function hashWidth(){ return HASH_ALGORITHMS[hashAlgo()].width; }
function hashSqlType(){ return hashAlgo()==='sha256' ? 'BYTEA' : `VARCHAR(${hashWidth()})`; }

function findTable(id){ return state.tables.find(t=>t.id===id); }
function findHub(id){ return state.hubs.find(h=>h.id===id); }
function findLink(id){ return state.links.find(l=>l.id===id); }
function findCol(table, colId){ return table ? table.columns.find(c=>c.id===colId) : null; }
function selectedValues(select){ return Array.from((select && select.selectedOptions) || []).map(o=>o.value).filter(Boolean); }

function includedTables(){
  return state.tables.filter(t=>t.included!==false);
}
function normalizeSourceObjectType(value){
  return String(value||'').toLowerCase().includes('view') ? 'view' : 'table';
}
function isSourceView(table){
  return normalizeSourceObjectType(table && table.objectType)==='view';
}
function tableHasVaultObjects(tableId){
  return state.hubs.some(h=>h.tableId===tableId)
    || state.links.some(l=>l.tableId===tableId)
    || state.hubSats.some(s=>s.tableId===tableId)
    || state.linkSats.some(s=>s.tableId===tableId);
}
function applyDetectedObjectType(table, value){
  const typeWasUnknown = !table.objectType;
  table.objectType = normalizeSourceObjectType(value);
  if (typeWasUnknown && isSourceView(table) && table.included!==false && !tableHasVaultObjects(table.id)){
    table.included = false;
    return true;
  }

}
function isColumnStaged(col){ return !!col && col.staged!==false; }

  ensureTableTargetNames(table);
  return (table.columns||[]).filter(isColumnStaged);
}

}

}
function pruneDownstreamModel(options = {}){
  // Keeps the vault model consistent with the Tables and Staging tabs. This
  // removes objects that depend on tables that were deleted/excluded or on
  // columns explicitly excluded from the selected staging columns.
  state.tables.forEach(t=>{
    t.derivations = (t.derivations||[]).filter(d=>{
      const names = derivationSourceColumns(d);
      return names.length>0 && names.every(name=>isColumnStaged((t.columns||[]).find(c=>c.name===name)));
    });
  });
  const dropTableIds = new Set(options.dropTableIds || []);
  const validTableIds = new Set(state.tables
    .filter(t => !dropTableIds.has(t.id) && (!options.dropExcluded || t.included!==false))
    .map(t => t.id));
  const before = {
    hubs: state.hubs.length,
    links: state.links.length,
    hubSats: state.hubSats.length,
    linkSats: state.linkSats.length,
  };

  state.hubs = state.hubs.filter(h=>{
    const table = findTable(h.tableId);
    return validTableIds.has(h.tableId) && hubKeyColIds(h).length>0 && hubKeyColIds(h).every(id=>!!findStagedColumn(table,id));
  });
  const validHubIds = new Set(state.hubs.map(h=>h.id));

  state.links = state.links.filter(l=>{
    const table = findTable(l.tableId);
    return validTableIds.has(l.tableId)
      && l.hubs.length >= 2
      && l.hubs.every(x => validHubIds.has(x.hubId) && linkHubColIds(x).length>0 && linkHubColIds(x).every(id=>!!findStagedColumn(table,id)));
  });
  const validLinkIds = new Set(state.links.map(l=>l.id));

  state.hubSats = state.hubSats.map(s=>{
    const table = findTable(s.tableId);
    return { ...s, attrs: (s.attrs||[]).filter(a=>!!findStagedColumn(table, a.colId)) };
  }).filter(s=> validTableIds.has(s.tableId) && validHubIds.has(s.hubId) && s.attrs.length>0);

  state.linkSats = state.linkSats.map(s=>{
    const table = findTable(s.tableId);
    return { ...s, attrs: (s.attrs||[]).filter(a=>!!findStagedColumn(table, a.colId)) };
  }).filter(s=> validTableIds.has(s.tableId) && validLinkIds.has(s.linkId) && s.attrs.length>0);

  return {
    hubs: before.hubs - state.hubs.length,
    links: before.links - state.links.length,
    hubSats: before.hubSats - state.hubSats.length,
    linkSats: before.linkSats - state.linkSats.length,
  };
}

function modelRemovalSummary(r){

  return [part(r.hubs,'hub','hubs'), part(r.links,'link','links'), part(r.hubSats,'hub satellite','hub satellites'), part(r.linkSats,'link satellite','link satellites')]

function hubName(entity){ return targetIdentifierBase(`hub_${state.vault.name}_${entity}`,'hub'); }
function hubKey(entity){ return targetIdentifierBase(`hub_${state.vault.name}_${entity}_id`,'hub_id'); }
function linkNameOf(entity){ return targetIdentifierBase(`link_${state.vault.name}_${entity}`,'link'); }
function linkKeyOf(entity){ return targetIdentifierBase(`link_${state.vault.name}_${entity}_id`,'link_id'); }
function satName(entity, concern){ return targetIdentifierBase(`sat_${state.vault.name}_${entity}${concern?'_'+concern:''}`,'satellite'); }
function lsatName(entity, concern){ return targetIdentifierBase(`lsat_${state.vault.name}_${entity}${concern?'_'+concern:''}`,'link_satellite'); }
function businessKeyColumnName(entity){ return targetIdentifierBase(`${entity}_bk`,'business_key'); }
function stableNameHash(value){
  let h = 2166136261;
  for (const ch of String(value||'')){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h>>>0).toString(36).slice(0,6);
}
function targetIdentifierBase(raw, fallback='column'){
  let base = String(raw||'').trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'');
  if (!base) base = fallback;
  if (/^[0-9]/.test(base)) base = `c_${base}`;
  if (RESERVED_SQL_WORDS.has(base)) base = `${base}_value`;
  if (typeof RESERVED_TARGET_COLUMNS!=='undefined' && RESERVED_TARGET_COLUMNS.has(base)) base = `${base}_source`;
  if (base.length>55) base = `${base.slice(0,48)}_${stableNameHash(raw)}`;
  return base;
}
function ensureTableTargetNames(table){
  if (!table) return;
  const used = new Set();
  (table.columns||[]).forEach((col,index)=>{
    let name = String(col.targetName||'').trim();
    if (!name || col.targetNameAuto!==false){
      const base = targetIdentifierBase(col.name, `column_${index+1}`);
      name = base;
      let n = 2;
      while (used.has(name)) name = `${base}_${n++}`;
      col.targetName = name;
      if (typeof col.targetNameAuto!=='boolean') col.targetNameAuto = true;
    }
    used.add(String(col.targetName).toLowerCase());
  });
}
function targetColumnName(col){
  return col ? (col.targetName || targetIdentifierBase(col.name)) : '';
}
function stagingTableName(tableName){ return targetIdentifierBase(`stg_${state.vault.prefix}_${tableName}`,'staging_table'); }
function sourceConcat(tableName){ return `${state.vault.srcDescription}.${tableName}`; }

/* toast */
function toast(msg, kind, action){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' '+kind : '');
  el.textContent = msg;
  // Optional inline action ({label, fn}) — used for "Undo" after
  // destructive operations. Action toasts linger longer.
  if (action && action.label && typeof action.fn==='function'){
    const btn = document.createElement('button');
    btn.textContent = action.label;
    btn.style.cssText = 'margin-left:10px;padding:2px 10px;border:1px solid currentColor;border-radius:4px;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;';
    btn.addEventListener('click', ()=>{ el.remove(); action.fn(); });
    el.appendChild(btn);
  }
  wrap.appendChild(el);
  const life = action ? 8000 : 3600;
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, life);
}

/* =========================================================================
   UNDO — snapshot-based, for destructive model operations (table delete,
   exclude-with-prune, column delete, AI/suggestion bulk-apply, drift merge).
   Call pushUndo('label') BEFORE mutating; offer toastUndo() after.
   ========================================================================= */
const undoStack = [];
const UNDO_LIMIT = 20;
function modelSnapshot(){
  return JSON.stringify({ state, uidCounter });
}

// Identifier hygiene — catch bad names at entry, not as a DDL error 4 steps later.
const RESERVED_SQL_WORDS = new Set(['select','from','where','table','user','order','group','join','create',
  'drop','alter','index','view','grant','primary','default','check','column','constraint','and','or','not',
  'null','case','when','then','else','end','union','all','into','values','insert','update','delete','as',
  'on','in','is','like','between','having','limit','offset','cast','current_date','current_time']);
const RESERVED_TARGET_COLUMNS = new Set(['tenant_id','load_dts','load_end_dts','record_source_id','sat_key','sat_attributes_concat','etl_err_date','etl_id_run','etl_err_noe','etl_err_desc','etl_err_col','etl_err_cod']);
function sanitizeIdentifier(raw){
  return String(raw||'').toLowerCase().replace(/[^a-z0-9_]+/g,'_').replace(/^[_0-9]+/,'');
}
function identifierIssue(name){
  if (!name) return null;
  if (RESERVED_SQL_WORDS.has(name)) return `"${name}" is a SQL reserved word — pick another name.`;
  return null;
}
function targetIdentifierIssue(name){
  if (!/^[a-z_][a-z0-9_]*$/.test(String(name||''))) return `"${name}" is not a valid target name. Use lowercase letters, numbers and underscores.`;
  if (String(name).length>63) return `"${name}" is longer than PostgreSQL's 63-character identifier limit.`;
  return identifierIssue(String(name));
}

// Fingerprint of the design (passwords excluded) — used to detect when the
// model changed after a deployment-status check, so stale results can't be applied.
function designFingerprint(){
  const c = JSON.parse(JSON.stringify(state));
  c.vault.srcPassword = ''; c.vault.dvPassword = ''; c.vault.vaultPassword = '';
  if (c.externalTables){ c.externalTables.password = ''; c.externalTables.studioPassword = ''; }
  return JSON.stringify(c);
}

// Flag destructive statements in user-editable SQL before it hits the target.
function destructiveSqlKeywords(sql){
  const noComments = String(sql||'').replace(/--[^\n]*/g,' ').replace(/\/\*[\s\S]*?\*\//g,' ');
  return (noComments.match(/\b(DROP|TRUNCATE|DELETE)\b/gi) || []).map(k=>k.toUpperCase());
}
function pushUndo(label){
  undoStack.push({ label, snapshot: modelSnapshot(), at: Date.now() });
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
}
function undoLast(){
  const entry = undoStack.pop();
  if (!entry) { toast('Nothing to undo.', 'err'); return false; }
  const parsed = JSON.parse(entry.snapshot);
  // Rebuild in place — everything else holds references to `state`.
  Object.keys(state).forEach(k=> delete state[k]);
  Object.assign(state, parsed.state);
  uidCounter = parsed.uidCounter;
  if (typeof renderAll==='function') renderAll();
  toast(`Undid: ${entry.label}.`, 'ok');
  return true;
}
function toastUndo(msg){
  toast(msg, 'ok', { label:'Undo', fn: undoLast });
}

/* =========================================================================
   Derivations — the link between "a source column" and "a computed staging
   column" (hash_<entity>_id / <entity>_bk). Hubs, links and satellites all
   read/write these per-table.
   ========================================================================= */
function derivationSourceColumns(d){
  if (d && Array.isArray(d.columns) && d.columns.length) return d.columns.slice();
  return d && d.column ? [d.column] : [];
}
function derivationUsesColumn(d, column){
  return derivationSourceColumns(d).includes(column);
}
function sameColumnList(a, b){
  return JSON.stringify(a||[])===JSON.stringify(b||[]);
}
function stableHashAlias(entity, role, columns){
  const names=(columns||[]).map(c=>typeof c==='string'?c:c&&c.name).filter(Boolean);
  const base=sqlNamePart(role || entity || (names.length===1?names[0]:'key'));
  return targetIdentifierBase(`hash_${base}_id`,'hash_key');
}

// Return the canonical Hub/role already wired to these source columns in the
// Vault model. This lets Staging and Vault share one derivation even when FK
// metadata was unavailable during source import.
function linkRelationshipForSourceColumns(table, columns){
  const names=(columns||[]).filter(Boolean);
  if(!table||!names.length) return null;
  const matches=[];
  (state.links||[]).filter(l=>l.tableId===table.id).forEach(link=>{
    (link.hubs||[]).forEach(linkHub=>{
      const cols=linkHubCols(table,linkHub).map(c=>c.name);
      if(!sameColumnList(cols,names)) return;
      const hub=findHub(linkHub.hubId);
      if(!hub) return;
      matches.push({
        entity:sqlNamePart(hub.entity),
        role:sqlNamePart(linkHub.role||linkHubRoleFromSource(table,linkHub)),
        linkId:link.id,
      });
    });
  });
  const unique=[];
  matches.forEach(m=>{
    if(!unique.some(x=>x.entity===m.entity&&x.role===m.role)) unique.push(m);
  });
  return unique.length===1?unique[0]:null;
}
function knownDerivationEntities(){
  const values=[];
  includedTables().forEach(t=>values.push(entityForTable(t.name)));
  (state.hubs||[]).forEach(h=>values.push(sqlNamePart(h.entity)));
  return Array.from(new Set(values.filter(Boolean)));
}
// When FK constraints were not imported (for example a pasted DDL), role-like
// AI labels such as billing_address/original_language can still be reconciled
// to a known source entity. Exact matches win; otherwise only one unambiguous
// suffix match is accepted.
function inferTargetEntityFromRole(entity, role, columns){
  const known=knownDerivationEntities();
  const exact=sqlNamePart(entity||'');
  if(exact&&known.includes(exact)) return exact;
  const names=(columns||[]).filter(Boolean);
  const sourceRole=names.length===1?sqlNamePart(names[0]).replace(/_id$/,''):'';
  const roleName=sqlNamePart(role||entity||sourceRole);
  const candidates=known.filter(k=>roleName===k||roleName.endsWith(`_${k}`));
  candidates.sort((a,b)=>b.length-a.length||a.localeCompare(b));
  if(candidates.length===1) return candidates[0];
  if(candidates.length>1&&candidates[0].length>candidates[1].length) return candidates[0];
  return exact||'';
}
function derivationPreferenceScore(table,d){
  const spec=derivationCanonicalSpec(table,d);
  let score=0;
  if(spec.foreignKey) score+=100;
  const link=linkRelationshipForSourceColumns(table,spec.columns);
  if(link&&link.entity===spec.entity) score+=80;
  if(knownDerivationEntities().includes(spec.entity)) score+=40;
  if(d&&d.role) score+=5;
  return score;
}
// Convert any caller (AI, deterministic suggestion, manual edit or saved
// project) to one canonical derivation shape. A declared/inferred FK decides
// the target Hub; the source-column role is stored separately and controls
// the physical hash alias. An AI role such as "original_language" must never
// become a second Hub when the FK points to "language".
function canonicalDerivationSpec(table, entity, columns, kind='hash', role=''){
  const names=(columns||[]).map(c=>typeof c==='string'?c:c&&c.name).filter(Boolean);
  const requestedKind=['hash','bk','both'].includes(kind)?kind:'hash';
  const plan=tableRelationshipPlan(table);
  const fk=plan.foreignKeyGroups.find(g=>sameColumnList(g.columns,names)) || null;

/* =========================================================================
   Staging SQL override builder (spreadsheet-spec.md pattern)
   ========================================================================= */
function sqlLiteral(s){
  // Escapes a value for safe embedding as a single-quoted SQL string literal
  // (doubles any embedded single quotes) — defense in depth against anyone
  // typing an apostrophe into a name/description field.
  return String(s || '').replace(/'/g, "''");
}

function sourceSqlIdent(name){
  // Keep common identifiers unquoted for readability, but quote unusual names
  // using the active source dialect. The override is executed against the
  // source database, not Postgres, so quoting must follow the source dialect.
  const raw = String(name || '');
  if (/^[A-Za-z_][A-Za-z0-9_$]*$/.test(raw) && !RESERVED_SQL_WORDS.has(raw.toLowerCase())) return raw;
  const dialect = state.vault.dialect || 'postgresql';
  if (dialect === 'mysql') return '`' + raw.replace(/`/g, '``') + '`';
  if (dialect === 'sqlserver') return '[' + raw.replace(/]/g, ']]') + ']';
  return '"' + raw.replace(/"/g, '""') + '"';
}
function sourceSqlCol(c){
  const name = String(c || '');
  return `src.${sourceSqlIdent(name)}`;
}
function sourceSqlQualifiedName(schema, table){
  return `${sourceSqlIdent(schema)}.${sourceSqlIdent(table)}`;
}
function sourceSqlColumnSelectItems(table){
  // Do not emit `*` here. MySQL rejects `expr, *`, and explicit source
  // columns make the staging override stable even when Hop validates SQL or
  // when a source table later gains a column.
  return stagedColumns(table)
    .filter(c => c && c.name)
    .map(c => `${sourceSqlCol(c.name)} as ${targetColumnName(c)}`);
}

function canonicalKeyPartSql(columnName){
  const col=sourceSqlCol(columnName);
  const dialect=state.vault.dialect||'postgresql';
  // Length-prefixing prevents delimiter collisions; -1 distinguishes NULL
  // from an empty string. The same ordered representation feeds both the
  // readable business key and its hash.
  if(dialect==='mysql') return `IF(${col} IS NULL, '-1:', CONCAT(CHAR_LENGTH(CAST(${col} AS CHAR)), ':', CAST(${col} AS CHAR)))`;
  if(dialect==='sqlserver') return `CASE WHEN ${col} IS NULL THEN N'-1:' ELSE CONCAT(CONVERT(NVARCHAR(20), LEN(CONVERT(NVARCHAR(MAX), ${col}) + N'#') - 1), N':', CONVERT(NVARCHAR(MAX), ${col})) END`;
  if(dialect==='oracle') return `CASE WHEN ${col} IS NULL THEN '-1:' ELSE (LENGTH(TO_CHAR(${col})) || ':' || TO_CHAR(${col})) END`;
  return `CASE WHEN ${col} IS NULL THEN '-1:' ELSE (length(${col}::text)::text || ':' || ${col}::text) END`;
}

  const parts = (columnNames||[]).map(c=>canonicalKeyPartSql(c));

  if (dialect==='mysql') return `CONCAT(${parts.join(", '|', ")})`;
  if (dialect==='sqlserver') return `CONCAT(${parts.join(", N'|', ")})`;
  return `(${parts.join(" || '|' || ")})`;
}

function buildOverride(table){
  const h = dialectCfg().hash;
  const algo = hashAlgo();
  const selectItems = [];
  // Defensive output dedup for malformed legacy/manual state. AI and key-based
  // modelling now reconcile target Hub + relationship role before insertion,
  // so normal projects reach this builder with unique aliases. Validation still
  // blocks genuinely incompatible legacy collisions.
  const emitted = new Set();
  // hash columns first, then bk columns, mirroring the spec's example ordering
  table.derivations.filter(d=>d.kind==='hash'||d.kind==='both').forEach(d=>{
    const alias = hashColumnNameForDerivation(table, d);
    if (emitted.has(alias)) return;
    emitted.add(alias);
    const inputs = derivationSourceColumns(d);
    const input = inputs.length>1 ? compositeBusinessKeySql(inputs) : sourceSqlCol(inputs[0]);
    selectItems.push(`${h(input, algo)} as ${alias}`);
  });
  table.derivations.filter(d=>d.kind==='bk'||d.kind==='both').forEach(d=>{
    const alias = businessKeyColumnName(derivationCanonicalSpec(table,d).entity);
    if (emitted.has(alias)) return;
    emitted.add(alias);
    const inputs = derivationSourceColumns(d);
    selectItems.push(`${inputs.length>1 ? compositeBusinessKeySql(inputs) : sourceSqlCol(inputs[0])} as ${alias}`);
  });
  selectItems.push(`'${sqlLiteral(state.vault.tenantId || 'TENANT')}' as tenant_id`);
  selectItems.push(...sourceSqlColumnSelectItems(table));
  return 'select\n  ' + selectItems.join(',\n  ') + `\nfrom ${sourceSqlQualifiedName(state.vault.sourceSchema, table.name)} src\nwhere 1=1`;
}

function effectiveOverride(table){
  // Respects a hand-edited override; falls back to the auto-generated one.
  return table.customOverride != null ? table.customOverride : buildOverride(table);
}

const TABS = [
  { id:'connections', label:'1 · Connections' },
  { id:'tables', label:'2 · Tables' },

  { id:'vault', label:'4 · Vault' },

let activeTab = 'connections';

function scrollPageToTop(){
  // The application scrolls inside <main>, not the document. Reset both the
  // real scroll container and the document so every explicit wizard-step
  // navigation opens at the destination heading. Repeat after the next paint
  // because the clicked footer button is removed during renderAll().
  const reset = ()=>{
    const main = document.getElementById('main');
    if (main){
      main.scrollTop = 0;
      main.scrollLeft = 0;
      if (typeof main.scrollTo === 'function') main.scrollTo(0, 0);
    }
    if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
    if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') window.scrollTo(0, 0);
  };
  reset();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(reset);
}

function navigateDesignerTab(tab){
  activeTab = tab;
  renderAll();
  scrollPageToTop();
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = TABS.map(t=>{
    let count = '';
    if (t.id==='tables') count = state.tables.length;
    if (t.id==='staging') count = state.tables.filter(t=>t.included!==false).length;
    if (t.id==='vault') count = state.hubs.length + state.links.length + state.hubSats.length + state.linkSats.length;
    return `<button class="tab-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}">
      ${t.label}${count!==''?`<span class="tab-count">${count}</span>`:''}
    </button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const nextTab = b.dataset.tab;
      if ((nextTab==='vault' || nextTab==='export') && !stagingHashColumnsReady()){
        navigateDesignerTab('staging');
        toast(stagingHashRequirementMessage(), 'err');
        return;
      }
      navigateDesignerTab(nextTab);
    });
  });
}

  const modeSwitchEl = document.getElementById('mode-switch');

    tabsEl.innerHTML = '';
    main.innerHTML = `<div id="dashboard-root"></div>`;
    renderDashboard(document.getElementById('dashboard-root'));

  }
  if (appMode==='studioplus'){
    tabsEl.style.display = 'none';
    tabsEl.innerHTML = '';
    main.innerHTML = `<div id="studioplus-root"></div>`;
    renderStudioPlus(document.getElementById('studioplus-root'));
    return;
  }
  tabsEl.style.display = '';

  main.innerHTML = `
    <div class="view ${activeTab==='connections'?'active':''}" id="view-connections"></div>
    <div class="view ${activeTab==='tables'?'active':''}" id="view-tables"></div>
    <div class="view ${activeTab==='staging'?'active':''}" id="view-staging"></div>
    <div class="view ${activeTab==='vault'?'active':''}" id="view-vault"></div>
    <div class="view ${activeTab==='export'?'active':''}" id="view-export"></div>

  if (activeTab==='staging') renderStaging(document.getElementById('view-staging'));
  if (activeTab==='vault') renderVault(document.getElementById('view-vault'));
  if (activeTab==='export') renderExport(document.getElementById('view-export'));

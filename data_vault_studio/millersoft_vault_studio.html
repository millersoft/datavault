function externalPreflightFatal(result){ return (result.checks||[]).some(c=>c.level==='fatal'); }

async function localGatewayDatabaseStatus(){
  const v=state.vault;
  const r=await localFetch('/api/db-status',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({host:v.dvHost,port:v.dvPort,database:v.dvDatabase,user:v.dvUser,password:v.dvPassword})
  });
  const data=await r.json();
  if(!data.ok)throw new Error(data.error||'Could not reach the packaged PostgreSQL gateway.');
  return data;
}

async function ensureLocalGatewayDatabase(checks){
  const v=state.vault;
  let status=await localGatewayDatabaseStatus();
  let created=false;
  if(!status.exists){
    const r=await localFetch('/api/create-database',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({host:v.dvHost,port:v.dvPort,database:v.dvDatabase,user:v.dvUser,password:v.dvPassword})
    });
    const data=await r.json();
    if(!data.ok)throw new Error(data.error||`Could not create PostgreSQL gateway database ${v.dvDatabase}.`);
    created=!!data.created;
    status=await localGatewayDatabaseStatus();
  }
  if(!status.exists)throw new Error(`PostgreSQL gateway database "${v.dvDatabase}" was not visible after creation.`);
  targetConnStatus='ok'; targetDbExists=true; targetConnError='';
  checks.push({level:'ok',label:'1 · PostgreSQL gateway database',detail:created?`created and verified ${v.dvDatabase}`:`verified existing ${v.dvDatabase}`});
  return status;
}


async function verifyPostgresRoleAssumption(role, checks, database=state.vault.dvDatabase, label=`PostgreSQL ${role} role`){
  const rows=await queryPostgresDatabase(database,
    `SELECT session_user AS login_user, current_user AS effective_user`,
    {role});
  const row=rows[0]||{};
  if(String(row.effective_user||'')!==role){
    throw new Error(`The PostgreSQL deployment login ${row.login_user||state.vault.dvUser||'(unknown)'} could not assume role ${role}.`);
  }
  if(checks)checks.push({level:'ok',label,detail:`${row.login_user||state.vault.dvUser} can SET ROLE ${role}`});
  return row;
}

async function verifyDataVaultRoleAssumption(checks, database=state.vault.dvDatabase, label='PostgreSQL data_vault role'){
  return verifyPostgresRoleAssumption('data_vault',checks,database,label);
}

async function verifyPdiMetaRoleAssumption(checks, database=state.vault.dvDatabase, label='PostgreSQL pdi_meta role'){
  return verifyPostgresRoleAssumption('pdi_meta',checks,database,label);
}

async function externalTargetDatabaseStatus(){
  return externalApi('/api/external-db-status',externalConnectionPayload());
}

async function ensureExternalTargetDatabase(checks){
  const ext=state.externalTables;
  const database=ext.studioDatabase||ext.remoteDatabase;
  let status=await externalTargetDatabaseStatus();
  let created=false;
  if(!status.exists){
    const result=await externalApi('/api/external-create-database',externalConnectionPayload());
    created=!!result.created;
    status=await externalTargetDatabaseStatus();
  }
  if(!status.exists)throw new Error(`Physical output database "${database}" was not visible after creation.`);
  externalTargetConnStatus='ok'; externalTargetDbExists=true; externalTargetConnError=''; externalTargetIdentity=status;
  checks.push({level:'ok',label:'2 · Physical output database',detail:created?`created and verified ${database}`:`verified existing ${database}`});
  return status;
}

async function verifyLocalForeignTables(){
  const names=externalCoreTableNames();
  if(!names.length)return;
  const literals=names.map(n=>`'${sqlLiteral(n)}'`).join(',');
  const rows=await queryTarget(`SELECT c.relname AS table_name, c.relkind
    FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
    WHERE n.nspname='data_vault' AND c.relname IN (${literals})`);
  const byName=new Map(rows.map(r=>[String(r.table_name).toLowerCase(),String(r.relkind)]));
  const missing=names.filter(n=>!byName.has(n.toLowerCase()));
  const wrong=names.filter(n=>byName.has(n.toLowerCase())&&byName.get(n.toLowerCase())!=='f');
  if(missing.length||wrong.length){
    const detail=[];
    if(missing.length)detail.push(`missing: ${missing.join(', ')}`);
    if(wrong.length)detail.push(`not foreign tables: ${wrong.join(', ')}`);
    throw new Error(`Local foreign-table verification failed (${detail.join('; ')}).`);
  }
}

async function localFdwInfrastructureStatus(){
  const ext=state.externalTables;
  if(!ext.serverName) return {
    extensionExists:false,
    serverExists:false,
    dataVaultMappingExists:false,
    pdiMetaMappingExists:false,
    dataVaultUsageGranted:false,
    pdiMetaUsageGranted:false,
  };
  const server=sqlLiteral(ext.serverName);
  const rows=await queryTarget(`SELECT
    EXISTS (SELECT 1 FROM pg_extension WHERE extname='jdbc_fdw') AS extension_exists,
    EXISTS (SELECT 1 FROM pg_foreign_server WHERE srvname='${server}') AS server_exists,
    EXISTS (SELECT 1 FROM pg_user_mappings WHERE srvname='${server}' AND usename='data_vault') AS data_vault_mapping_exists,
    EXISTS (SELECT 1 FROM pg_user_mappings WHERE srvname='${server}' AND usename='pdi_meta') AS pdi_meta_mapping_exists,
    COALESCE((SELECT has_server_privilege('data_vault', oid, 'USAGE') FROM pg_foreign_server WHERE srvname='${server}'), false) AS data_vault_usage_granted,
    COALESCE((SELECT has_server_privilege('pdi_meta', oid, 'USAGE') FROM pg_foreign_server WHERE srvname='${server}'), false) AS pdi_meta_usage_granted`);
  const row=rows[0]||{};
  return {
    extensionExists:row.extension_exists===true,
    serverExists:row.server_exists===true,
    dataVaultMappingExists:row.data_vault_mapping_exists===true,
    pdiMetaMappingExists:row.pdi_meta_mapping_exists===true,
    dataVaultUsageGranted:row.data_vault_usage_granted===true,
    pdiMetaUsageGranted:row.pdi_meta_usage_granted===true,
  };
}

function fdwInfrastructureMissing(status){
  const missing=[];
  if(!status.extensionExists)missing.push('jdbc_fdw extension');
  if(!status.serverExists)missing.push('foreign server');
  if(!status.dataVaultMappingExists)missing.push('data_vault user mapping');
  if(!status.pdiMetaMappingExists)missing.push('pdi_meta user mapping');
  if(!status.dataVaultUsageGranted)missing.push('data_vault server USAGE grant');
  if(!status.pdiMetaUsageGranted)missing.push('pdi_meta server USAGE grant');
  return missing;
}

async function runExternalStoragePreflight(options={}){
  const ext=state.externalTables;
  const manageBusy=!options.nested;
  if(manageBusy)externalStorageBusy=true;
  externalPreflightResult={checks:[],message:'Running preflight…'};
  if(!options.silent){renderAll();setActiveTabViewOnly('export');}
  const checks=[];
  try{
    if(!ext.enabled)checks.push({level:'fatal',label:'Feature',detail:'External storage is not enabled.'});
    if(!externalCoreTableCount())checks.push({level:'fatal',label:'Core table set',detail:'No hubs, links, satellites or link satellites exist in the model.'});
    if(!state.vault.dvHost||!state.vault.dvDatabase||!state.vault.dvUser)checks.push({level:'fatal',label:'PostgreSQL gateway',detail:'Packaged PostgreSQL host, database and login are required.'});
    if(!ext.serverName||!ext.drivername||!ext.url||!ext.jarfile)checks.push({level:'fatal',label:'FDW settings',detail:'Server name, JDBC driver class, JDBC URL and driver jar path are required.'});
    if(!ext.studioHost||!(ext.studioDatabase||ext.remoteDatabase)||!(ext.studioUser||ext.username)||!(ext.studioPassword||ext.password))checks.push({level:'fatal',label:'Physical output target',detail:'Studio host, database and the physical target username/password are required.'});
    checks.push({level:'warn',label:'Target permissions',detail:ext.remoteDialect==='sqlserver'
      ? `SQL Server account ${ext.studioUser||ext.username||'(missing)'} must be able to connect to ${ext.studioDatabase||ext.remoteDatabase||'datavault'}, create/alter tables in ${ext.studioSchema||ext.remoteSchema||'dbo'}, and SELECT/INSERT/UPDATE/DELETE those tables. Its default schema must match the selected schema.`
      : `Target account ${ext.studioUser||ext.username||'(missing)'} must have CREATE for ${ext.studioDatabase||ext.remoteDatabase||'datavault'}, table CREATE/ALTER/INDEX, and SELECT/INSERT/UPDATE/DELETE. The packaged MySQL demo bootstraps this grant when FDW mode starts; production targets remain administrator-managed.`});
    if(ext.serverName&&!externalIdentifierIsSafe(ext.serverName))checks.push({level:'fatal',label:'Foreign server name',detail:'Use a plain SQL identifier containing letters, numbers and underscores.'});
    if((ext.studioDatabase||ext.remoteDatabase)&&!externalIdentifierIsSafe(ext.studioDatabase||ext.remoteDatabase))checks.push({level:'fatal',label:'External database name',detail:'Use a plain identifier containing letters, numbers, underscores or dollar signs.'});
    if((ext.studioSchema||ext.remoteSchema)&&!externalIdentifierIsSafe(ext.studioSchema||ext.remoteSchema))checks.push({level:'fatal',label:'External schema name',detail:'Use a plain identifier containing letters, numbers, underscores or dollar signs.'});
    if(checks.some(c=>c.level==='fatal'))throw new Error('Configuration is incomplete.');
    await ensureLocalServerReachable();

    const localStatus=await localGatewayDatabaseStatus();
    checks.push({level:'ok',label:'PostgreSQL gateway connectivity',detail:`reached ${state.vault.dvHost}:${state.vault.dvPort}`});
    checks.push({level:localStatus.exists?'ok':'warn',label:'PostgreSQL gateway database',detail:localStatus.exists?`${state.vault.dvDatabase} exists`:`${state.vault.dvDatabase} does not exist yet and will be created during deployment`});

    const inspectionDatabase=localStatus.exists?state.vault.dvDatabase:'postgres';
    const local=await queryPostgresDatabase(inspectionDatabase,`SELECT current_user,
      COALESCE((SELECT rolsuper FROM pg_roles WHERE rolname=current_user),false) AS is_superuser,
      EXISTS (SELECT 1 FROM pg_available_extensions WHERE name='jdbc_fdw') AS extension_available,
      (SELECT COUNT(*) FROM pg_roles WHERE rolname IN ('data_vault','staging','pdi_meta')) AS service_roles`);
    const info=local[0]||{};
    checks.push({level:info.extension_available?'ok':'fatal',label:'jdbc_fdw extension',detail:info.extension_available?'available in the packaged image':'not present in pg_available_extensions; start/rebuild the FDW PostgreSQL gateway'});
    checks.push({level:info.is_superuser?'ok':'fatal',label:'Local deployment privilege',detail:info.is_superuser?`${info.current_user} is a superuser`:`${info.current_user||'current user'} is not a superuser`});
    checks.push({level:Number(info.service_roles)===3?'ok':'fatal',label:'Service roles',detail:Number(info.service_roles)===3?'data_vault, staging and pdi_meta roles exist':'one or more of data_vault, staging and pdi_meta roles are missing'});
    try{
      const role=await verifyDataVaultRoleAssumption(null,inspectionDatabase);
      checks.push({level:'ok',label:'PostgreSQL data_vault runtime role',detail:`${role.login_user||state.vault.dvUser} can SET ROLE data_vault`});
    }catch(err){
      checks.push({level:'fatal',label:'PostgreSQL data_vault runtime role',detail:`Cannot assume data_vault: ${err.message}`});
    }
    try{
      const role=await verifyPdiMetaRoleAssumption(null,inspectionDatabase);
      checks.push({level:'ok',label:'PostgreSQL pdi_meta runtime role',detail:`${role.login_user||state.vault.dvUser} can SET ROLE pdi_meta`});
    }catch(err){
      checks.push({level:'fatal',label:'PostgreSQL pdi_meta runtime role',detail:`Cannot assume pdi_meta: ${err.message}`});
    }

    const names=externalCoreTableNames();
    if(localStatus.exists&&names.length){
      const literals=names.map(n=>`'${sqlLiteral(n)}'`).join(',');
      const relations=await queryTarget(`SELECT c.relname AS table_name, c.relkind
        FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
        WHERE n.nspname='data_vault' AND c.relname IN (${literals})`);
      const collisions=relations.filter(r=>r.relkind!=='f');
      checks.push({level:collisions.length?'fatal':'ok',label:'Local relation collisions',detail:collisions.length?`${collisions.length} core name(s) already exist as local relations: ${collisions.map(x=>x.table_name).join(', ')}`:'no core table name is occupied by a local table or view'});
    }else{
      checks.push({level:'warn',label:'Local relation collisions',detail:'skipped until the PostgreSQL gateway database exists'});
    }

    const jar=await localFetch('/api/driver-path-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({jarfile:ext.jarfile})}).then(r=>r.json());
    checks.push({level:jar.ok&&jar.exists?'ok':'fatal',label:'JDBC driver jar',detail:jar.ok&&jar.exists?`${jar.filename} is present in jdbc-drivers/`:(jar.error||`not found for ${ext.jarfile}`)});

    const remote=await externalTargetDatabaseStatus();
    checks.push({level:'ok',label:'Physical output connectivity',detail:`reached ${ext.studioHost}:${ext.studioPort||externalDefaultPort(ext.remoteDialect)}`});
    checks.push({level:remote.exists?'ok':'warn',label:'Physical output database',detail:remote.exists?'database exists':'database does not exist yet and will be created during deployment'});
    externalPreflightResult={checks,ok:!checks.some(c=>c.level==='fatal'),localExists:!!localStatus.exists,remoteExists:!!remote.exists,message:checks.some(c=>c.level==='fatal')?'Preflight found fatal issues. Nothing was changed.':'Preflight passed. No changes were made.'};
  }catch(err){
    if(!checks.length||!checks.some(c=>c.level==='fatal'))checks.push({level:'fatal',label:'Preflight',detail:err.message});
    externalPreflightResult={checks,ok:false,message:'Preflight failed. Nothing was changed.'};
  }finally{
    if(manageBusy)externalStorageBusy=false;
    if(!options.silent){renderAll();setActiveTabViewOnly('export');}
  }
  return externalPreflightResult;
}

async function externalApi(path,payload){
  const r=await localFetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await r.json(); if(!data.ok)throw new Error(data.error||`Request failed: ${path}`); return data;
}
function explainExternalTargetError(message){
  const text=String(message||'External target operation failed.');
  if(!/access denied|command denied|permission|not allowed|denied/i.test(text)) return text;
  const ext=state.externalTables;
  const user=ext.studioUser||ext.username||'<target user>';
  const database=ext.studioDatabase||ext.remoteDatabase||'datavault';
  if(ext.remoteDialect==='sqlserver'){
    const schema=ext.studioSchema||ext.remoteSchema||'dbo';
    return `${text} Ask a SQL Server administrator to create ${database} if necessary and grant ${user} CONNECT plus CREATE TABLE and ALTER on schema ${schema}, together with SELECT, INSERT, UPDATE and DELETE on the deployed core tables.`;
  }
  if(ext.remoteDialect==='mysql') return `${text} The physical target account ${user} is also used by the JDBC FDW mappings. Ask a database administrator to create ${database} if necessary and grant this account CREATE, ALTER, INDEX, SELECT, INSERT, UPDATE and DELETE on ${database}.*.`;
  return `${text} The physical target account ${user} is also used by both JDBC FDW mappings. Ask a database administrator to create ${database} if necessary and grant it schema/table creation plus read/write access.`;
}
function remoteSchemaDdl(){
  const ext=state.externalTables, schema=ext.studioSchema||ext.remoteSchema;
  if(!schema||ext.remoteDialect==='mysql')return '';
  if(ext.remoteDialect==='postgresql')return `CREATE SCHEMA IF NOT EXISTS ${remoteQuoteIdentifier(schema,'postgresql')};`;
  if(ext.remoteDialect==='sqlserver')return `IF SCHEMA_ID(N'${sqlLiteral(schema)}') IS NULL EXEC(N'CREATE SCHEMA ${remoteQuoteIdentifier(schema,'sqlserver')}');`;
  return `CREATE SCHEMA ${schema};`;
}

async function deployExternalStorage(options={}){
  const ext=state.externalTables;
  const interactive=options.interactive!==false;
  const requireAck=options.requireAck!==false;
  const throwOnError=options.throwOnError===true;
  if(externalStorageBusy){
    const err=new Error('An external-storage deployment is already running.');
    if(throwOnError)throw err;
    return {ok:false,error:err.message};
  }
  if(requireAck&&!ext.deploymentAcknowledged){
    const err=new Error('Review and tick the external-storage deployment warning first.');
    if(throwOnError)throw err;
    toast(err.message,'err'); return {ok:false,error:err.message};
  }
  if(interactive&&!confirm(`Deploy ${externalCoreTableCount()} external core table(s) in verified order?\n\nPhysical target: ${ext.studioHost}:${ext.studioPort||externalDefaultPort(ext.remoteDialect)}/${ext.studioDatabase||ext.remoteDatabase}\nPostgreSQL gateway: ${state.vault.dvHost}:${state.vault.dvPort}/${state.vault.dvDatabase}\n\nBoth databases will be verified or created. Foreign tables are created last. The operation stops at the first failed step.`))return {ok:false,cancelled:true};

  externalStorageBusy=true;
  externalDeployResult={checks:[],message:'Deployment started…'};
  if(interactive){renderAll();setActiveTabViewOnly('export');}
  const checks=[];
  let failure=null;
  try{
    const pre=await runExternalStoragePreflight({silent:true,nested:true});
    checks.push({level:pre.ok?'ok':'fatal',label:'Preflight',detail:pre.ok?'passed again immediately before deployment':'fatal issue found; deployment refused'});
    if(externalPreflightFatal(pre))throw new Error('Preflight contains fatal issues.');
    if(!['postgresql','mysql','sqlserver'].includes(ext.remoteDialect))throw new Error(`Automatic ordered deployment is not available for ${DIALECTS[ext.remoteDialect].label}; run the remote DDL manually.`);

    await ensureLocalGatewayDatabase(checks);
    await verifyDataVaultRoleAssumption(checks,state.vault.dvDatabase,'1b · PostgreSQL data_vault role');
    await verifyPdiMetaRoleAssumption(checks,state.vault.dvDatabase,'1c · PostgreSQL pdi_meta role');
    await ensureExternalTargetDatabase(checks);
    await verifyExternalTargetUserAccess(checks);

    const payload=externalConnectionPayload(ext.studioDatabase||ext.remoteDatabase);
    const schemaSql=remoteSchemaDdl();
    if(schemaSql)await externalApi('/api/external-execute-sql',{...payload,sql:schemaSql});
    checks.push({level:'ok',label:'4 · Physical output schema',detail:ext.remoteDialect==='mysql'?`MySQL database ${ext.studioDatabase||ext.remoteDatabase} is the schema`:((ext.studioSchema||ext.remoteSchema)?`ready: ${ext.studioSchema||ext.remoteSchema}`:`default ${ext.remoteDialect==='sqlserver'?'dbo':'public'} schema selected`)});

    await externalApi('/api/external-execute-sql',{...payload,sql:buildExternalTablesDdl()});
    checks.push({level:'ok',label:'5 · Physical core tables',detail:`created or retained ${externalCoreTableCount()} Hub/Link/Sat/LSat table(s)`});

    const verify=await externalApi('/api/external-table-status',{...payload,schema:ext.studioSchema||ext.remoteSchema,tables:externalCoreTableNames()});
    if((verify.missing||[]).length)throw new Error(`Physical target verification failed; missing: ${verify.missing.join(', ')}`);
    checks.push({level:'ok',label:'6 · Physical target verification',detail:`all ${externalCoreTableCount()} core tables exist`});

    await executeSqlAgainstTarget(buildDataVaultLocalSupportDdl(),{allowExternalLocalDdl:true});
    checks.push({level:'ok',label:'7 · Local support objects',detail:'data_vault schema, *_err tables and verification view applied in PostgreSQL'});

    await executeSqlAgainstTarget(buildFdwInfrastructureDdl(),{allowExternalLocalDdl:true});
    const infrastructure=await localFdwInfrastructureStatus();
    const infrastructureMissing=fdwInfrastructureMissing(infrastructure);
    if(infrastructureMissing.length)throw new Error(`FDW infrastructure verification failed; missing: ${infrastructureMissing.join(', ')}`);
    checks.push({level:'ok',label:'8 · FDW gateway objects',detail:'jdbc_fdw extension, foreign server, data_vault and pdi_meta user mappings, and both server USAGE grants applied and verified'});

    await executeSqlAgainstTarget(buildFdwForeignTablesDdl(),{allowExternalLocalDdl:true});
    checks.push({level:'ok',label:'9 · Local foreign tables (last)',detail:`created or retained ${externalCoreTableCount()} foreign table(s) in data_vault`});

    await verifyLocalForeignTables();
    const smoke=externalCoreTableNames()[0];
    if(smoke){
      await queryTargetAsDataVault(`SELECT * FROM data_vault.${smoke} LIMIT 1`);
      await queryTargetAsPdiMeta(`SELECT * FROM data_vault.${smoke} LIMIT 1`);
    }
    checks.push({level:'ok',label:'10 · Live FDW route verification',detail:smoke?`data_vault and pdi_meta both opened data_vault.${smoke} through the physical target`:'no table selected'});

    externalDeployResult={checks,ok:true,message:'Both databases and the complete FDW route were created and verified successfully.'};
    if(interactive)toast('External Data Vault route deployed and smoke-tested.','ok');
  }catch(err){
    const explained=explainExternalTargetError(err.message);
    failure=new Error(explained);
    checks.push({level:'fatal',label:'Stopped',detail:explained});
    externalDeployResult={checks,ok:false,message:'Deployment stopped at the first failed step. Later steps were not run.'};
    if(interactive)toast(`External storage deployment stopped: ${err.message}`,'err');
  }finally{
    externalStorageBusy=false;
    if(interactive){renderAll();setActiveTabViewOnly('export');}
  }
  if(failure&&throwOnError)throw failure;
  return externalDeployResult;
}

async function applyExternalStorageWorkflow(){
  return deployExternalStorage({interactive:false,requireAck:false,throwOnError:true});
}

/* ---------------- DIAGRAM ---------------- */
function buildVaultDiagramSvg(){
  const COL = { hub:'#c96a12', hubDim:'#faead4', link:'#5c5266', linkDim:'#eee7f2', sat:'#1c7fa0', satDim:'#dcf0f6', muted:'#8a7a93' };
  const hubs = state.hubs;
  const marginX = 110;
  // Rough monospace character width estimate — used so labels never overflow
  // their node, regardless of how long an entity/vault name is.
  const textWidth = (str, fontSize) => String(str||'').length * fontSize * 0.62;

  const hubSatsByHub = {};
  state.hubSats.forEach(s=>{ (hubSatsByHub[s.hubId] = hubSatsByHub[s.hubId]||[]).push(s); });
  const linkSatsByLink = {};
  state.linkSats.forEach(s=>{ (linkSatsByLink[s.linkId] = linkSatsByLink[s.linkId]||[]).push(s); });

  const maxHubSatStack = hubs.length ? Math.max(0, ...hubs.map(h=>(hubSatsByHub[h.id]||[]).length)) : 0;
  const maxLinkSatStack = state.links.length ? Math.max(0, ...state.links.map(l=>(linkSatsByLink[l.id]||[]).length)) : 0;

  const hubY = 70 + maxHubSatStack*82;
  const linkY = hubY + 170;

  // Size every node from its own label so text never overflows the shape.
  const hubBox = {};
  hubs.forEach(h=>{ hubBox[h.id] = Math.max(140, textWidth(hubName(h.entity), 11.5) + 32); });
  const hubSatBox = {};
  state.hubSats.forEach(s=>{ hubSatBox[s.id] = Math.max(128, textWidth(satName(s.entity, s.concern), 9) + 28); });
  const linkBox = {};
  state.links.forEach(l=>{ linkBox[l.id] = Math.max(130, textWidth(linkNameOf(l.entity), 9.5) + 56); });
  const linkSatBox = {};
  state.linkSats.forEach(s=>{ linkSatBox[s.id] = Math.max(128, textWidth(lsatName(s.entity, s.concern), 9) + 28); });

  const maxHubWidth = hubs.length ? Math.max(...hubs.map(h=>hubBox[h.id])) : 140;
  const colWidth = maxHubWidth + 80;

  const hubPositions = {};
  hubs.forEach((h,i)=>{ hubPositions[h.id] = { x: marginX + i*colWidth, y: hubY }; });

  const usedBuckets = {};
  const linkPositions = {};
  state.links.forEach((l,i)=>{
    const xs = l.hubs.map(h=>hubPositions[h.hubId] && hubPositions[h.hubId].x).filter(x=>x!=null);
    let x = xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : marginX + i*colWidth;
    const bucket = Math.round(x/50)*50;
    usedBuckets[bucket] = (usedBuckets[bucket]||0) + 1;
    x += (usedBuckets[bucket]-1) * (linkBox[l.id]+20);
    linkPositions[l.id] = { x, y: linkY };
  });

  const width = Math.max(640, marginX*2 + Math.max(0, hubs.length-1)*colWidth + 180);
  const height = linkY + 90 + maxLinkSatStack*82 + 50;

  // Compute the real bounding box from every node's actual extent — a very
  // long satellite/link/hub name can push a shape's edge past the naive
  // column layout, especially for the outermost hubs.
  let minX = 0, maxX = width;
  hubs.forEach(h=>{ const p = hubPositions[h.id], w = hubBox[h.id]; minX = Math.min(minX, p.x-w/2); maxX = Math.max(maxX, p.x+w/2); });
  state.links.forEach(l=>{ const p = linkPositions[l.id], w = linkBox[l.id]; minX = Math.min(minX, p.x-w/2); maxX = Math.max(maxX, p.x+w/2); });
  hubs.forEach(h=>{ (hubSatsByHub[h.id]||[]).forEach(s=>{ const p = hubPositions[h.id], w = hubSatBox[s.id]; minX = Math.min(minX, p.x-w/2); maxX = Math.max(maxX, p.x+w/2); }); });
  state.links.forEach(l=>{ (linkSatsByLink[l.id]||[]).forEach(s=>{ const p = linkPositions[l.id], w = linkSatBox[s.id]; minX = Math.min(minX, p.x-w/2); maxX = Math.max(maxX, p.x+w/2); }); });
  const padding = 24;
  const viewX = minX - padding;
  const viewWidth = (maxX - minX) + padding*2;

  const esc = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const parts = [`<svg viewBox="${viewX} 0 ${viewWidth} ${height}" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Mono, monospace">`];

  // connector lines (drawn first, underneath nodes)
  state.links.forEach(l=>{
    const lp = linkPositions[l.id];
    l.hubs.forEach(h=>{
      const hp = hubPositions[h.hubId];
      if (hp) parts.push(`<line x1="${hp.x}" y1="${hp.y+22}" x2="${lp.x}" y2="${lp.y-20}" stroke="${COL.link}" stroke-width="1.5"/>`);
    });
  });
  hubs.forEach(h=>{
    const hp = hubPositions[h.id];
    (hubSatsByHub[h.id]||[]).forEach((s,j)=>{
      const sy = hp.y - 60 - j*82;
      parts.push(`<line x1="${hp.x}" y1="${hp.y-22}" x2="${hp.x}" y2="${sy+20}" stroke="${COL.sat}" stroke-width="1.5" stroke-dasharray="3,3"/>`);
    });
  });
  state.links.forEach(l=>{
    const lp = linkPositions[l.id];
    (linkSatsByLink[l.id]||[]).forEach((s,j)=>{
      const sy = lp.y + 60 + j*82;
      parts.push(`<line x1="${lp.x}" y1="${lp.y+20}" x2="${lp.x}" y2="${sy-20}" stroke="${COL.sat}" stroke-width="1.5" stroke-dasharray="3,3"/>`);
    });
  });

  // hub nodes
  hubs.forEach(h=>{
    const p = hubPositions[h.id];
    const table = findTable(h.tableId);
    const w = hubBox[h.id];
    parts.push(`
      <rect x="${p.x-w/2}" y="${p.y-22}" width="${w}" height="44" rx="4" fill="${COL.hubDim}" stroke="${COL.hub}" stroke-width="2"/>
      <text x="${p.x}" y="${p.y-3}" text-anchor="middle" font-size="11.5" font-weight="700" fill="${COL.hub}">${esc(hubName(h.entity))}</text>
      <text x="${p.x}" y="${p.y+13}" text-anchor="middle" font-size="9" fill="${COL.muted}">from ${esc(table?table.name:'?')}</text>
    `);
  });

  // link nodes (diamond — sized so the label always fits at its widest,
  // vertical-center cross-section)
  state.links.forEach(l=>{
    const p = linkPositions[l.id];
    const w = linkBox[l.id], hh = 44;
    const pts = `${p.x},${p.y-hh/2} ${p.x+w/2},${p.y} ${p.x},${p.y+hh/2} ${p.x-w/2},${p.y}`;
    parts.push(`
      <polygon points="${pts}" fill="${COL.linkDim}" stroke="${COL.link}" stroke-width="2"/>
      <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${COL.link}">${esc(linkNameOf(l.entity))}</text>
    `);
  });

  // hub satellite nodes
  hubs.forEach(h=>{
    const hp = hubPositions[h.id];
    (hubSatsByHub[h.id]||[]).forEach((s,j)=>{
      const sy = hp.y - 60 - j*82;
      const rx = hubSatBox[s.id]/2;
      parts.push(`
        <ellipse cx="${hp.x}" cy="${sy}" rx="${rx}" ry="21" fill="${COL.satDim}" stroke="${COL.sat}" stroke-width="2"/>
        <text x="${hp.x}" y="${sy+4}" text-anchor="middle" font-size="9" font-weight="700" fill="${COL.sat}">${esc(satName(s.entity, s.concern))}</text>
      `);
    });
  });

  // link satellite nodes
  state.links.forEach(l=>{
    const lp = linkPositions[l.id];
    (linkSatsByLink[l.id]||[]).forEach((s,j)=>{
      const sy = lp.y + 60 + j*82;
      const rx = linkSatBox[s.id]/2;
      parts.push(`
        <ellipse cx="${lp.x}" cy="${sy}" rx="${rx}" ry="21" fill="${COL.satDim}" stroke="${COL.sat}" stroke-width="2"/>
        <text x="${lp.x}" y="${sy+4}" text-anchor="middle" font-size="9" font-weight="700" fill="${COL.sat}">${esc(lsatName(s.entity, s.concern))}</text>
      `);
    });
  });

  parts.push('</svg>');
  return parts.join('');
}

/* =========================================================================
   Interactive diagram — Cytoscape.js + dagre, mirrors the drag/zoom/pan/
   hover-highlight/click-detail pattern used elsewhere. Falls back to the
   static SVG above if the CDN libraries didn't load (e.g. offline).
   ========================================================================= */
let CY = null;
let CY_LAYOUT_NAME = 'dagre';

function buildCyElements(){
  const elements = [];
  const COL = { hub:'#c96a12', hubDim:'#faead4', link:'#5c5266', linkDim:'#eee7f2', sat:'#1c7fa0', satDim:'#dcf0f6' };

  state.hubs.forEach(h=>{
    const table = findTable(h.tableId);
    elements.push({ group:'nodes', data: {
      id: 'hub_'+h.id, label: hubName(h.entity), kind:'hub',
      table: table?table.name:'?', key: hubKey(h.entity), bk: businessKeyColumnName(h.entity),
      statusSat: h.statusSat?'Yes':'No', description: h.description||'',
      col: COL.hub, colDim: COL.hubDim,
    }});
  });

  state.links.forEach(l=>{
    const table = findTable(l.tableId);
    const hubNames = l.hubs.map(h=>{ const hub=findHub(h.hubId); return hub?hubName(hub.entity):'?'; }).join(', ');
    elements.push({ group:'nodes', data: {
      id: 'link_'+l.id, label: linkNameOf(l.entity), kind:'link',
      table: table?table.name:'?', hubList: hubNames, description: l.description||'',
      col: COL.link, colDim: COL.linkDim,
    }});
    l.hubs.forEach(h=>{
      elements.push({ group:'edges', data: {
        id: 'e_lh_'+l.id+'_'+h.hubId, source:'hub_'+h.hubId, target:'link_'+l.id, kind:'link-hub', col: COL.link,
      }});
    });
  });

  state.hubSats.forEach(s=>{
    const table = findTable(s.tableId);
    const hub = findHub(s.hubId);
    elements.push({ group:'nodes', data: {
      id: 'hsat_'+s.id, label: satName(s.entity, s.concern), kind:'satellite',
      table: table?table.name:'?', parentLabel: hub?hubName(hub.entity):'?',
      attrCount: s.attrs.length, attrList: s.attrs.map(a=>a.target).join(', '),
      col: COL.sat, colDim: COL.satDim,
    }});
    elements.push({ group:'edges', data: { id:'e_hsat_'+s.id, source:'hub_'+s.hubId, target:'hsat_'+s.id, kind:'sat', col: COL.sat } });
  });

  state.linkSats.forEach(s=>{
    const table = findTable(s.tableId);
    const link = findLink(s.linkId);
    elements.push({ group:'nodes', data: {
      id: 'lsat_'+s.id, label: lsatName(s.entity, s.concern), kind:'satellite',
      table: table?table.name:'?', parentLabel: link?linkNameOf(link.entity):'?',
      attrCount: s.attrs.length, attrList: s.attrs.map(a=>a.target).join(', '),
      col: COL.sat, colDim: COL.satDim,
    }});
    elements.push({ group:'edges', data: { id:'e_lsat_'+s.id, source:'link_'+s.linkId, target:'lsat_'+s.id, kind:'sat', col: COL.sat } });
  });

  return elements;
}

function layoutOptionsFor(name){
  if (name==='cose'){
    return { name:'cose', animate:true, animationDuration:500, idealEdgeLength:130, nodeRepulsion:12000, nodeOverlap:16, gravity:0.7, padding:30, fit:true };
  }
  return { name:'dagre', rankDir:'TB', nodeSep:45, edgeSep:16, rankSep:90, animate:true, animationDuration:450, padding:30, fit:true };
}

function setCyLayout(name){
  CY_LAYOUT_NAME = name;
  ['cy-layout-dagre','cy-layout-cose'].forEach(id=>{
    const b = document.getElementById(id);
    if (b) b.classList.toggle('primary', id==='cy-layout-'+name);
  });
  if (CY) CY.layout(layoutOptionsFor(name)).run();
}

function cyFit(){ if (CY) CY.fit(undefined, 40); }

function wireCyInteractions(){
  CY.on('mouseover', 'node', e=>{
    const n = e.target, nh = n.closedNeighborhood();
    CY.elements().difference(nh).addClass('dimmed');
    nh.removeClass('dimmed').addClass('highlighted');
  });
  CY.on('mouseout', 'node', ()=>{ CY.elements().removeClass('dimmed').removeClass('highlighted'); });
  CY.on('tap', 'node', e=> showCyDetail(e.target));
  CY.on('tap', e=>{ if (e.target===CY){ closeCyDetail(); CY.elements().removeClass('dimmed').removeClass('highlighted'); } });
}

function showCyDetail(node){
  const d = node.data();
  const KIND_LABEL = { hub:'Hub', link:'Link', satellite:'Satellite' };
  const rows = [];
  if (d.kind==='hub'){
    rows.push(['Source table', d.table]);
    rows.push(['Hash key', d.key]);
    rows.push(['Business key', d.bk]);
    rows.push(['Status satellite', d.statusSat]);
    if (d.description) rows.push(['Description', d.description]);
  } else if (d.kind==='link'){
    rows.push(['Source table', d.table]);
    rows.push(['Connected hubs', d.hubList]);
    if (d.description) rows.push(['Description', d.description]);
  } else {
    rows.push(['Parent', d.parentLabel]);
    rows.push(['Source table', d.table]);
    rows.push(['Attributes', String(d.attrCount)]);
    if (d.attrList) rows.push(['Columns', d.attrList]);
  }
  const deg = node.connectedEdges().length;
  rows.push(['Connections', String(deg)]);
  const esc = escapeHtml;
  document.getElementById('cy-detail-body').innerHTML =
    `<div style="font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:${d.col}">${KIND_LABEL[d.kind]}</div>
     <div style="font-family:var(--font-mono);font-weight:700;font-size:13px;margin:2px 0 10px;color:var(--brand-deep)">${esc(d.label)}</div>
     ${rows.map(r=>`<div class="flex-between" style="margin-bottom:6px;gap:12px;"><span class="hint mb0" style="flex-shrink:0;">${esc(r[0])}</span><span class="mono" style="font-size:11px;text-align:right;">${esc(r[1])}</span></div>`).join('')}`;
  document.getElementById('cy-detail').classList.add('visible');
  CY.elements().removeClass('dimmed').removeClass('highlighted');
  const nh = node.closedNeighborhood();
  CY.elements().difference(nh).addClass('dimmed');
  nh.addClass('highlighted');
}

function closeCyDetail(){
  const el = document.getElementById('cy-detail');
  if (el) el.classList.remove('visible');
  if (CY) CY.elements().removeClass('dimmed').removeClass('highlighted');
}

function renderVaultDiagram(el){
  if (state.hubs.length===0){
    el.innerHTML = `<div class="empty">No hubs yet — build at least one hub to see the diagram.</div>`;
    return;
  }
  const cyAvailable = typeof cytoscape !== 'undefined';
  el.innerHTML = `
    <div class="panel-flush panel" style="padding:0;">
      <div class="panel-head">
        <h3>Vault diagram</h3>
        <button class="btn small" id="btn-download-diagram">⬇ Download SVG</button>
      </div>
      ${cyAvailable ? `
        <div class="cy-wrap" id="cy-wrap">
          <div id="cy"></div>
          <div class="cy-toolbar">
            <button class="btn small" id="cy-layout-dagre" title="Top-down hierarchy">Hierarchy</button>
            <button class="btn small" id="cy-layout-cose" title="Force-directed">Force</button>
            <button class="btn small" id="cy-fit" title="Reset zoom to fit">Fit</button>
          </div>
          <div class="cy-detail" id="cy-detail">
            <button class="cy-detail-close" id="cy-detail-close">&times;</button>
            <div id="cy-detail-body"></div>
          </div>
        </div>
        <p class="hint" style="padding:12px 16px 16px;margin:0;">Drag nodes to rearrange. Scroll to zoom, hover to highlight connections, click a node for details.</p>
      ` : `
        <div style="padding:20px;overflow:auto;background:var(--panel);" id="diagram-wrap"></div>
        <p class="hint" style="padding:0 16px 16px;margin:0;">Interactive view needs an internet connection to load its diagramming library — showing the static version instead.</p>
      `}
    </div>
  `;
  document.getElementById('btn-download-diagram').addEventListener('click', ()=>{
    downloadBlob(buildVaultDiagramSvg(), `${state.vault.name||'vault'}_diagram.svg`, 'image/svg+xml');
  });

  if (!cyAvailable){
    document.getElementById('diagram-wrap').innerHTML = buildVaultDiagramSvg();
    return;
  }

  if (CY){ try{ CY.destroy(); }catch(_){} CY = null; }
  CY = cytoscape({
    container: document.getElementById('cy'),
    elements: buildCyElements(),
    style: cyStyleSheet(),
    layout: layoutOptionsFor(CY_LAYOUT_NAME),
    wheelSensitivity: 0.25,
    minZoom: 0.25,
    maxZoom: 2.5,
    boxSelectionEnabled: false,
  });
  wireCyInteractions();
  document.getElementById('cy-layout-dagre').addEventListener('click', ()=> setCyLayout('dagre'));
  document.getElementById('cy-layout-cose').addEventListener('click', ()=> setCyLayout('cose'));
  document.getElementById('cy-fit').addEventListener('click', cyFit);
  document.getElementById('cy-detail-close').addEventListener('click', closeCyDetail);
  setCyLayout(CY_LAYOUT_NAME);
}

let expandedHubId = null;

function renderHubsList(el){
  if (state.hubs.length===0){ el.innerHTML = `<div class="empty">No hubs yet.</div>`; return; }
  el.innerHTML = state.hubs.map(h=>{
    const t = findTable(h.tableId);
    const keyLabel = hubKeyCols(h).map(c=>c.name).join(' + ') || '?';
    const open = expandedHubId===h.id;
    return `
    <div class="entity-card">
      <div class="ehead ${open?'open':''}" data-toggle-hub="${h.id}">
        <div class="ehead-left">
          <span class="entity-marker hub"></span>
          <span class="entity-name">${hubName(h.entity)}</span>
          <span class="entity-meta">from <span class="mono">${t?t.name:'?'}</span> · business key <span class="mono">${keyLabel}</span> ${h.statusSat?'':'· <span class="tag">no status sat</span>'}</span>
        </div>
        <button class="btn small danger" data-del-hub="${h.id}">Delete</button>
      </div>
      <div class="entity-body ${open?'open':''}" id="hub-edit-${h.id}"></div>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-toggle-hub]').forEach(head=>{
    head.addEventListener('click', e=>{
      if (e.target.closest('[data-del-hub]')) return;
      const id = head.dataset.toggleHub;
      expandedHubId = expandedHubId===id ? null : id;
      renderAll(); setActiveTabViewOnly('vault'); modelSub='hubs';
    });
  });
  el.querySelectorAll('[data-del-hub]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.delHub;
      const used = state.links.some(l=>l.hubs.some(x=>x.hubId===id)) || state.hubSats.some(s=>s.hubId===id);
      if (used && !confirm('This hub is used by a link or satellite. Delete anyway? Dependent links/satellites will also be removed.')) return;
      state.hubs = state.hubs.filter(h=>h.id!==id);
      const removed = pruneDownstreamModel({ dropExcluded:true });
      renderAll(); setActiveTabViewOnly('vault'); modelSub='hubs';
      if (removedModelCount(removed)) toast(`Removed dependent model objects: ${modelRemovalSummary(removed)}.`, 'ok');
    });
  });
  state.hubs.forEach(h=>{
    if (expandedHubId===h.id) renderHubEditForm(document.getElementById('hub-edit-'+h.id), h);
  });
}

function renderHubEditForm(el, h){

    </div>

      <button class="btn ghost small" id="edit-hub-cancel">Cancel</button>
      <button class="btn primary small" id="edit-hub-save">Save changes</button>
    </div>
  `;
  const tableSel = el.querySelector('#edit-hub-table');
  const pkSel = el.querySelector('#edit-hub-pk');
  const fillPk = ()=>{
    const t = findTable(tableSel.value);
    const current = tableSel.value===h.tableId ? new Set(hubKeyColIds(h)) : new Set(stagedColumns(t).filter(c=>c.pk).map(c=>c.id));
    pkSel.innerHTML = stagedColumns(t).map(c=>`<option value="${c.id}" ${current.has(c.id)?'selected':''}>${c.name}${c.pk?' (pk)':''}</option>`).join('') || '<option value="">no columns</option>';
  };

  el.querySelector('#edit-hub-cancel').addEventListener('click', ()=>{ expandedHubId=null; renderAll(); setActiveTabViewOnly('vault'); modelSub='hubs'; });
  el.querySelector('#edit-hub-save').addEventListener('click', ()=>{
    const entity = el.querySelector('#edit-hub-entity').value.trim();
    const tableId = tableSel.value;
    const keyColIds = selectedValues(pkSel);
    if (!entity || !tableId || !keyColIds.length){ toast('Fill in the entity name, table and at least one business key column.','err'); return; }
    if (!/^[a-z][a-z0-9_]*$/.test(entity)){ toast('Entity name should be lowercase snake_case.','err'); return; }
    if (entity!==h.entity && state.hubs.some(x=>x.entity===entity)){ toast('A hub with that entity name already exists.','err'); return; }
    const table = findTable(tableId);
    const cols = keyColIds.map(id=>findStagedColumn(table,id)).filter(Boolean);
    if (cols.length!==keyColIds.length){ toast('One or more selected business key columns are not staged.','err'); return; }

    toast(`Hub "${hubName(entity)}" updated.`,'ok');
  });
}

/* ---------------- LINKS ---------------- */
let linkDraftHubs = [];

function linkDraftRow(){ return { hubId:'', colId:'', colIds:[], role:'' }; }
function draftColumnIds(row){ return Array.isArray(row.colIds) && row.colIds.length ? row.colIds : (row.colId ? [row.colId] : []); }

function renderLinksSub(el){
  const tables = includedTables();
  if (state.hubs.length<1){
    el.innerHTML = `<div class="empty">Create at least one hub before defining a link. A self-referencing relationship may use the same hub in two different roles.</div>`;
    return;
  }
  if (tables.length===0){
    el.innerHTML = `<div class="empty">Include at least one table in the Tables tab before defining links.</div>`;
    return;
  }
  if (linkDraftHubs.length===0) linkDraftHubs = [linkDraftRow(),linkDraftRow()];
  el.innerHTML = `
    <div class="panel">
      <div class="grid cols-2">
        <div class="field"><label>Relationship name</label><input type="text" id="link-entity" placeholder="customer_order"></div>
        <div class="field"><label>Source table <span class="hint">(table containing the relationship)</span></label><select id="link-table">${tables.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></div>
      </div>
      <div class="panel-head" style="margin:14px -20px 0;"><h3>Connected hubs</h3></div>
      <p class="hint">Choose the staged source key column or columns for each role. Composite references use source-column order.</p>
      <div id="link-hub-rows"></div>
      <button class="btn small mt" id="btn-add-link-hub-row">+ Add another hub (3+ way link)</button>
      <div class="mt"><button class="btn primary" id="btn-add-link">+ Add link</button></div>
    </div>
    <div id="links-list"></div>
  `;
  renderLinkHubRows(el);
  el.querySelector('#btn-add-link-hub-row').addEventListener('click', ()=>{
    linkDraftHubs.push(linkDraftRow());
    renderLinkHubRows(el);
  });
  el.querySelector('#btn-add-link').addEventListener('click', ()=>{
    const entity = el.querySelector('#link-entity').value.trim();
    const tableId = el.querySelector('#link-table').value;
    const table = findTable(tableId);
    const rows = linkDraftHubs.filter(r=>r.hubId && draftColumnIds(r).length).map(r=>Object.assign({},r,{colIds:draftColumnIds(r),colId:draftColumnIds(r)[0]}));
    if (!entity || rows.length<2){ toast('Name the link and pick at least 2 hub roles with source key columns.','err'); return; }
    if (state.links.some(l=>l.entity===entity)){ toast('A link with that name already exists.','err'); return; }
    const issue = linkHubRowsIssue(entity, table, rows);
    if (issue){ toast(issue+'.','err'); return; }
    const normalizedRows = normalizeLinkHubRows(table, rows);
    normalizedRows.forEach(r=>{
      const hub=findHub(r.hubId), cols=linkHubCols(table,r);
      ensureKeyDerivation(table, hub.entity, cols.map(c=>c.name), 'hash', r.role || linkHubRoleFromSource(table,r));
    });
    state.links.push({ id:uid('lnk'), entity, description:'', tableId, hubs:normalizedRows });

let expandedSatId = null;
let editSatAttrDraft = [];

function satAttrNames(tableId, attrs){
  const table = findTable(tableId);
  return (attrs||[]).map(a=>{
    const col = table ? findCol(table, a.colId) : null;
    return (col && col.name) || a.column || a.attribute_source_column || a.target || '';
  }).map(x=>String(x||'').trim().toLowerCase()).filter(Boolean).sort();
}
function satAttrSignature(tableId, attrs){
  return satAttrNames(tableId, attrs).join('|');
}
function satAttrLabel(tableId, attrs){
  return satAttrNames(tableId, attrs).join(', ');
}
function findDuplicateHubSatByAttrs(hubId, tableId, attrs, ignoreId){
  const sig = satAttrSignature(tableId, attrs);
  if (!sig) return null;
  return state.hubSats.find(s=>s.id!==ignoreId && s.hubId===hubId && s.tableId===tableId && satAttrSignature(s.tableId, s.attrs)===sig) || null;
}
function findDuplicateLinkSatByAttrs(linkId, tableId, attrs, ignoreId){
  const sig = satAttrSignature(tableId, attrs);
  if (!sig) return null;
  return state.linkSats.find(s=>s.id!==ignoreId && s.linkId===linkId && s.tableId===tableId && satAttrSignature(s.tableId, s.attrs)===sig) || null;
}
function satelliteDisplayName(s, kind){
  return kind==='hub' ? satName(s.entity, s.concern) : lsatName(s.entity, s.concern);
}


function findDuplicateSatelliteGroups(){
  // Catch both duplicate names/concerns and the more subtle case where two
  // differently-named satellites cover the same parent + source table +
  // attribute set, e.g. lsat_*_relationship and plain lsat_* rows.
  const groups = {};
  const add = (key, sat) => { (groups[key] = groups[key]||[]).push(sat); };
  state.hubSats.forEach(s=>{
    add(`hub-name|${s.hubId}|${s.concern||''}`, s);
    const sig = satAttrSignature(s.tableId, s.attrs);
    if (sig) add(`hub-attrs|${s.hubId}|${s.tableId}|${sig}`, s);
  });
  state.linkSats.forEach(s=>{
    add(`link-name|${s.linkId}|${s.concern||''}`, s);
    const sig = satAttrSignature(s.tableId, s.attrs);
    if (sig) add(`link-attrs|${s.linkId}|${s.tableId}|${sig}`, s);
  });
  const seen = new Set();
  return Object.values(groups).filter(g=>g.length>1).filter(g=>{
    const key = g.map(s=>s.id).sort().join('|');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function removeDuplicateSatellites(){
  const groups = findDuplicateSatelliteGroups();
  let removed = 0;
  groups.forEach(group=>{
    // Keep the last one in each group — later entries have consistently
    // been the more-refined version in cases seen so far (e.g. a
    // corrected concern name from a subsequent AI Assist run).
    const toRemove = new Set(group.slice(0, -1).map(s=>s.id));
    if (toRemove.size===0) return;
    state.hubSats = state.hubSats.filter(s=>!toRemove.has(s.id));
    state.linkSats = state.linkSats.filter(s=>!toRemove.has(s.id));
    removed += toRemove.size;
  });
  renderAll(); setActiveTabViewOnly('vault'); modelSub='satellites';
  toast(`Removed ${removed} duplicate satellite(s).`, 'ok');
}

        <button class="btn small danger" id="btn-remove-dup-sats" style="flex-shrink:0;">Remove duplicates</button>
      </div>

  if (all.length===0){ el.innerHTML = dupBanner + `<div class="empty">No satellites yet.</div>`; return; }
  el.innerHTML = dupBanner + all.map(s=>{
    const t = findTable(s.tableId);

    </div>`;
  }).join('');
  const dupBtn = el.querySelector('#btn-remove-dup-sats');
  if (dupBtn) dupBtn.addEventListener('click', ()=>{

  el.querySelectorAll('[data-toggle-sat]').forEach(head=>{

      const id = head.dataset.toggleSat;

      else {

        editSatAttrDraft = s.attrs.map(a=>({colId:a.colId, target:a.target}));
      }

  el.querySelectorAll('[data-del-sat]').forEach(b=>{

      else state.linkSats = state.linkSats.filter(s=>s.id!==id);
      renderAll(); setActiveTabViewOnly('vault'); modelSub='satellites';
    });
  });
  all.forEach(s=>{
    if (expandedSatId===s.id) renderSatEditForm(document.getElementById('sat-edit-'+s.id), s);
  });
}

function renderSatEditForm(el, s){
  const isHubSat = s.kind==='hub';
  const parentOptions = isHubSat
    ? state.hubs.map(h=>`<option value="${h.id}" ${h.id===s.hubId?'selected':''}>${hubName(h.entity)}</option>`).join('')
    : state.links.map(l=>`<option value="${l.id}" ${l.id===s.linkId?'selected':''}>${linkNameOf(l.entity)}</option>`).join('');
  el.innerHTML = `
    <div class="grid cols-3">
      <div class="field"><label>${isHubSat?'Parent hub':'Parent link'}</label><select id="edit-sat-parent">${parentOptions}</select></div>
      <div class="field"><label>Concern</label><input type="text" id="edit-sat-concern" value="${s.concern||''}" placeholder="profile"></div>
      <div class="field"><label>Source table</label><select id="edit-sat-table">${includedTables().map(t=>`<option value="${t.id}" ${t.id===s.tableId?'selected':''}>${t.name}</option>`).join('')}</select></div>
    </div>
    <div id="edit-sat-key-status" class="hint mt"></div>
    <div class="panel-head" style="margin:14px -20px 0;"><h3>Attributes</h3></div>
    <div id="edit-sat-attr-rows"></div>
    <button class="btn small mt" id="btn-edit-add-attr-row">+ Add attribute</button>
    <div class="flex-between mt">
      <button class="btn ghost small" id="edit-sat-cancel">Cancel</button>
      <button class="btn primary small" id="edit-sat-save">Save changes</button>
    </div>
  `;
  const updateKeyStatus = ()=>{
    const table = findTable(el.querySelector('#edit-sat-table').value);
    const parentId = el.querySelector('#edit-sat-parent').value;
    const statusEl = el.querySelector('#edit-sat-key-status');
    if (!table || !parentId){ statusEl.textContent=''; return; }
    if (isHubSat){
      const hub = findHub(parentId);
      statusEl.innerHTML = tableHasHubHashOnTable(table, hub)
        ? `<span style="color:var(--ok)">${hashColumnNameForHub(table,hub)} available</span>`
        : `<span style="color:var(--err)">no hash key for "${hub.entity}" on this table</span>`;
    } else {
      const link = findLink(parentId);
      const ok = link.hubs.every(h=>tableHasLinkHubHash(table, h, link));
      statusEl.innerHTML = ok ? `<span style="color:var(--ok)">all hub keys available</span>` : `<span style="color:var(--err)">missing one or more hub hash keys</span>`;
    }
  };
  el.querySelector('#edit-sat-table').addEventListener('change', ()=>{ updateKeyStatus(); renderEditSatAttrRows(el); });
  el.querySelector('#edit-sat-parent').addEventListener('change', updateKeyStatus);
  updateKeyStatus();
  renderEditSatAttrRows(el);
  el.querySelector('#btn-edit-add-attr-row').addEventListener('click', ()=>{
    editSatAttrDraft.push({colId:'', target:''});
    renderEditSatAttrRows(el);
  });
  el.querySelector('#edit-sat-cancel').addEventListener('click', ()=>{ expandedSatId=null; renderAll(); setActiveTabViewOnly('vault'); modelSub='satellites'; });
  el.querySelector('#edit-sat-save').addEventListener('click', ()=>{
    const parentId = el.querySelector('#edit-sat-parent').value;
    const concernRaw = el.querySelector('#edit-sat-concern').value.trim();
    const concern = concernRaw ? sqlNamePart(concernRaw) : '';
    const tableId = el.querySelector('#edit-sat-table').value;
    const table = findTable(tableId);
    const attrs = editSatAttrDraft.filter(a=>a.colId).map(a=>{
      const col = findCol(table, a.colId);
      return { colId:a.colId, target: targetIdentifierBase((a.target||'').trim() || targetColumnName(col)) };
    });
    if (!parentId){ toast('Pick a parent hub/link.','err'); return; }
    if (attrs.length===0){ toast('Add at least one attribute.','err'); return; }
    if (isHubSat){
      const hub = findHub(parentId);
      if (!tableHasHubHashOnTable(table, hub)){ toast(`Table "${table.name}" has no hash key derivation for "${hub.entity}".`,'err'); return; }
      const sat = state.hubSats.find(x=>x.id===s.id);
      sat.hubId = parentId; sat.entity = hub.entity; sat.concern = concern; sat.tableId = tableId; sat.attrs = attrs;
    } else {
      const link = findLink(parentId);
      const missing = link.hubs.filter(h=>!tableHasLinkHubHash(table, h, link));
      if (missing.length){ toast(`Table "${table.name}" is missing hash keys for this link's hubs.`,'err'); return; }
      const sat = state.linkSats.find(x=>x.id===s.id);
      sat.linkId = parentId; sat.entity = link.entity; sat.concern = concern; sat.tableId = tableId; sat.attrs = attrs;
    }
    expandedSatId = null;
    renderAll(); setActiveTabViewOnly('vault'); modelSub='satellites';
    toast('Satellite updated.','ok');
  });
}

function renderEditSatAttrRows(el){
  const wrap = el.querySelector('#edit-sat-attr-rows');
  const table = findTable(el.querySelector('#edit-sat-table').value);
  const cols = table ? table.columns : [];
  if (editSatAttrDraft.length===0) editSatAttrDraft.push({colId:'', target:''});
  wrap.innerHTML = editSatAttrDraft.map((a,i)=>`
    <div class="deriv-row" style="grid-template-columns:1fr 1fr auto;">
      <select data-ear="${i}" data-eaf="colId"><option value="">source column…</option>${cols.filter(isColumnStaged).map(c=>`<option value="${c.id}" ${a.colId===c.id?'selected':''}>${c.name}</option>`).join('')}</select>
      <input type="text" data-ear="${i}" data-eaf="target" placeholder="target column name (optional)" value="${a.target||''}">
      <button class="btn small danger" data-deleditar="${i}">&times;</button>
    </div>`).join('');
  wrap.querySelectorAll('select,input').forEach(s=>{
    const handler = e=>{ editSatAttrDraft[s.dataset.ear][s.dataset.eaf] = e.target.value; };
    s.addEventListener('input', handler); s.addEventListener('change', handler);
  });
  wrap.querySelectorAll('[data-deleditar]').forEach(b=>{
    b.addEventListener('click', ()=>{ editSatAttrDraft.splice(Number(b.dataset.deleditar),1); renderEditSatAttrRows(el); });
  });
}
</script>

<script>
/* =========================================================================
   AI ASSIST — contextual modal, triggered from Staging or Vault steps.
   Only ever sends table/column *schema* (names, types, nullability, PK
   flags) — never row data, never connection credentials or passwords.
   ========================================================================= */
/* Provider-agnostic AI settings. OpenAI, Anthropic, or any OpenAI-compatible
   endpoint (Ollama, LM Studio, a corporate gateway) via a custom base URL.
   Provider/model/base-URL choices persist in localStorage; the API key is
   only remembered if explicitly opted in. */
const AI_PROVIDERS = {
  openai:    { label:'OpenAI',    defaultModel:'gpt-4o',            keyPlaceholder:'sk-...' },
  anthropic: { label:'Anthropic', defaultModel:'claude-sonnet-4-5', keyPlaceholder:'sk-ant-...' },
  custom:    { label:'Custom (OpenAI-compatible)', defaultModel:'gpt-4o', keyPlaceholder:'key (or blank for local endpoints)' },
};
let aiProvider = (function(){ try { return localStorage.getItem('vaultStudioAiProvider') || 'openai'; } catch(_){ return 'openai'; } })();
if (!AI_PROVIDERS[aiProvider]) aiProvider = 'openai';
let aiModel = (function(){ try { return localStorage.getItem('vaultStudioAiModel') || AI_PROVIDERS[aiProvider].defaultModel; } catch(_){ return AI_PROVIDERS[aiProvider].defaultModel; } })();
let aiBaseUrl = (function(){ try { return localStorage.getItem('vaultStudioAiBaseUrl') || ''; } catch(_){ return ''; } })();
// Keep GPT-5 request behaviour consistent across users and modelling runs.
// This is an internal product setting rather than a user preference: changing
// it can alter latency and the shape of a proposal. Medium provides the
// product's fixed quality/latency balance; deterministic normalisation and
// validation remain the authority for coverage and physical object generation.
const AI_OPENAI_REASONING_EFFORT = 'medium';
// The API key lives in this variable only — remembered for as long as the
// tab is open, NEVER written to localStorage. (Also scrub any key a previous
// build may have persisted.)
let aiKey = '';
try { localStorage.removeItem('vaultStudioAiKey'); localStorage.removeItem('vaultStudioAiRememberKey'); } catch(_){}
function persistAiSettings(){
  try {
    localStorage.setItem('vaultStudioAiProvider', aiProvider);
    localStorage.setItem('vaultStudioAiModel', aiModel);
    localStorage.setItem('vaultStudioAiBaseUrl', aiBaseUrl);
    // Remove the preference used by v7. AI request behaviour is now fixed by
    // the product so two users cannot unknowingly request different designs.
    localStorage.removeItem('vaultStudioAiResponseSpeed');
  } catch(_){}
}

// Models (Anthropic especially) often wrap JSON in markdown fences or add a
// sentence around it — extract the outermost JSON object robustly.
function extractJsonObject(text){
  if (!text) throw new Error('No content returned from the model.');
  let t = String(text).trim();
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) t = fence[1].trim();
  try { return JSON.parse(t); } catch(_){}
  const first = t.indexOf('{'), last = t.lastIndexOf('}');
  if (first !== -1 && last > first){
    try { return JSON.parse(t.slice(first, last+1)); } catch(_){}
  }
  throw new Error('Could not parse JSON from the model response.');
}

// Models which reject an explicit temperature are remembered for the life of
// the page. This avoids paying for the same failed request on every AI action.
const aiNoTemperatureModels = new Set();
const aiNoReasoningEffortModels = new Set();
function aiModelCapabilityKey(){
  const endpoint = aiProvider==='custom' ? (aiBaseUrl || '').replace(/\/+$/,'').toLowerCase() : aiProvider;
  return `${endpoint}|${String(aiModel || '').trim().toLowerCase()}`;
}
function aiModelUsesDefaultTemperature(model){
  const m = String(model || '').trim().toLowerCase();
  // GPT-5 reasoning models reject non-default temperature values. Omit the
  // optional field up front rather than deliberately causing a 400 + retry.
  return /^gpt-5(?:[.\-]|$)/.test(m);
}
function aiModelUsesReasoningEffort(model){
  return /^gpt-5(?:[.\-]|$)/.test(String(model || '').trim().toLowerCase());
}

// One call surface for every AI feature in the app (Staging/Vault assist,
// jdbc_fdw helper, Studio Plus). Returns the parsed JSON object.
async function aiChat(rules, userMsg, temperature){
  if (!aiKey && aiProvider!=='custom'){ throw new Error(`Enter your ${AI_PROVIDERS[aiProvider].label} API key first.`); }
  if (aiProvider === 'anthropic'){
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers: {
        'Content-Type':'application/json',
        'x-api-key': aiKey,
        'anthropic-version':'2023-06-01',
        // Explicit opt-in required by Anthropic for browser-side calls —
        // the key never leaves this page except to api.anthropic.com.
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({
        model: aiModel,
        max_tokens: 8192,
        system: rules,
        messages: [{ role:'user', content: userMsg }],
        temperature: temperature!=null ? temperature : 0.2,
      }),
    });
    if (!resp.ok){ const errText = await resp.text(); throw new Error(`Anthropic API error ${resp.status}: ${errText.slice(0,300)}`); }
    const data = await resp.json();
    const content = data.content && data.content[0] && data.content[0].text;
    return extractJsonObject(content);
  }
  const base = aiProvider==='custom'
    ? (aiBaseUrl || '').replace(/\/+$/,'')
    : 'https://api.openai.com/v1';
  if (!base) throw new Error('Enter the base URL of your OpenAI-compatible endpoint (e.g. http://localhost:11434/v1).');
  const headers = Object.assign({ 'Content-Type':'application/json' }, aiKey ? { 'Authorization': `Bearer ${aiKey}` } : {});
  const body = {
    model: aiModel,
    messages: [{ role:'system', content: rules }, { role:'user', content: userMsg }],
    response_format: { type:'json_object' },
  };
  const capabilityKey = aiModelCapabilityKey();
  if (!aiModelUsesDefaultTemperature(aiModel) && !aiNoTemperatureModels.has(capabilityKey)){
    body.temperature = temperature!=null ? temperature : 0.2;
  }
  // Use one product-controlled reasoning level for every GPT-5 request.
  // Exposing this as a preference made otherwise identical modelling runs use
  // different model behaviour. Unsupported endpoints still fall back safely.
  if (aiProvider==='openai' && aiModelUsesReasoningEffort(aiModel) && !aiNoReasoningEffortModels.has(capabilityKey)){
    body.reasoning_effort = AI_OPENAI_REASONING_EFFORT;
  }
  const send = payload => fetch(`${base}/chat/completions`, {
    method:'POST', headers, body:JSON.stringify(payload),
  });
  let requestBody = Object.assign({}, body);
  let resp;
  for (let attempt=0; attempt<3; attempt++){
    resp = await send(requestBody);
    if (resp.ok) break;
    const errText = await resp.text();
    const temperatureUnsupported = resp.status===400
      && Object.prototype.hasOwnProperty.call(requestBody, 'temperature')
      && /temperature/i.test(errText)
      && /(unsupported|does not support|only the default|default\s*\(?1\)?)/i.test(errText);
    if (temperatureUnsupported){
      aiNoTemperatureModels.add(capabilityKey);
      requestBody = Object.assign({}, requestBody);
      delete requestBody.temperature;
      continue;
    }
    const reasoningUnsupported = resp.status===400
      && Object.prototype.hasOwnProperty.call(requestBody, 'reasoning_effort')
      && /reasoning[_ .-]*effort/i.test(errText)
      && /(unsupported|unknown|unrecognized|does not support|invalid)/i.test(errText);
    if (reasoningUnsupported){
      aiNoReasoningEffortModels.add(capabilityKey);
      requestBody = Object.assign({}, requestBody);
      delete requestBody.reasoning_effort;
      continue;
    }
    throw new Error(`${aiProvider==='custom'?'API':'OpenAI API'} error ${resp.status}: ${errText.slice(0,300)}`);
  }
  if (!resp || !resp.ok) throw new Error(`${aiProvider==='custom'?'API':'OpenAI API'} request failed after retrying compatible settings.`);
  const data = await resp.json();
  const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  return extractJsonObject(content);
}

// Shared provider/key/model settings UI. `prefix` keeps element ids unique
// per surface (main modal vs Studio Plus).
function aiSettingsHtml(prefix){
  return `
    <div class="grid cols-3">
      <div class="field"><label>Provider</label>
        <select id="${prefix}-ai-provider">
          ${Object.entries(AI_PROVIDERS).map(([k,p])=>`<option value="${k}" ${aiProvider===k?'selected':''}>${p.label}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>API key</label><input type="password" id="${prefix}-ai-key" value="${escapeHtml(aiKey)}" placeholder="${AI_PROVIDERS[aiProvider].keyPlaceholder}"></div>
      <div class="field"><label>Model</label><input type="text" id="${prefix}-ai-model" value="${escapeHtml(aiModel)}" placeholder="${AI_PROVIDERS[aiProvider].defaultModel}"></div>
    </div>
    ${aiProvider==='custom' ? `
    <div class="field mt"><label>Base URL <span class="hint">(OpenAI-compatible, e.g. http://localhost:11434/v1)</span></label>
      <input type="text" id="${prefix}-ai-baseurl" value="${escapeHtml(aiBaseUrl)}" placeholder="http://localhost:11434/v1"></div>` : ''}
    <p class="hint mt mb0">The key is remembered while this tab is open — never saved to disk or localStorage. Compatible model settings are selected automatically so AI Assist behaves consistently across users.</p>
  `;
}
function wireAiSettings(root, prefix, rerender){
  const providerEl = root.querySelector(`#${prefix}-ai-provider`);
  if (providerEl) providerEl.addEventListener('change', e=>{
    const prevDefault = AI_PROVIDERS[aiProvider].defaultModel;
    aiProvider = e.target.value;
    // Only swap the model if it was still the previous provider's default —
    // never clobber a hand-typed model name.
    if (!aiModel || aiModel===prevDefault) aiModel = AI_PROVIDERS[aiProvider].defaultModel;
    persistAiSettings();
    if (typeof rerender==='function') rerender();
  });
  const keyEl = root.querySelector(`#${prefix}-ai-key`);
  if (keyEl) keyEl.addEventListener('input', e=>{ aiKey = e.target.value; }); // in-memory only, never persisted
  const modelEl = root.querySelector(`#${prefix}-ai-model`);
  if (modelEl) modelEl.addEventListener('input', e=>{ aiModel = e.target.value; persistAiSettings(); });
  const baseEl = root.querySelector(`#${prefix}-ai-baseurl`);
  if (baseEl) baseEl.addEventListener('input', e=>{ aiBaseUrl = e.target.value; persistAiSettings(); });
}

let aiLog = [];
let aiModalContext = null; // 'staging' | 'vault'
let aiScope = { derivations:true, incremental:FEATURE_INCREMENTAL, hubs:true, links:true, hubSats:true, linkSats:FEATURE_LINK_SATELLITES };

function openAiModal(context){
  aiModalContext = context;
  renderAiModal();
}
function closeAiModal(){
  aiModalContext = null;
  const mount = document.getElementById('ai-modal-mount');
  if (mount) mount.innerHTML = '';
}
document.addEventListener('keydown', e=>{
  if (e.key==='Escape' && aiModalContext) closeAiModal();
});

function aiModeSwitcherHtml(){ return ''; }

function wireAiModeSwitcher(mount){
  mount.querySelectorAll('[data-ai-mode]').forEach(b=>{
    b.addEventListener('click', ()=>{ aiModalContext = b.dataset.aiMode; renderAiModal(); });
  });

function renderAiModal(){
  const mount = document.getElementById('ai-modal-mount');
  if (!mount) return;
  const isStaging = aiModalContext==='staging';
  const scopeOptions = isStaging
    ? [ ['derivations','Key derivations (hash / business key columns)'], ...(FEATURE_INCREMENTAL?[['incremental','Incremental load columns']]:[]) ]
    : [ ['hubs','Hubs'], ['links','Links'], ['hubSats','Hub satellites'], ...(FEATURE_LINK_SATELLITES?[['linkSats','Link satellites']]:[]) ];
  const readyTables = state.tables.filter(t=>t.included!==false && t.columns.length>0);

  mount.innerHTML = `
    <div class="modal-backdrop" id="ai-backdrop">
      <div class="modal-card">

          <button class="btn small ghost" id="ai-modal-close">&times;</button>
        </div>
        ${aiModeSwitcherHtml()}
        <p class="section-desc" style="margin-bottom:14px;">Scope of what's sent to the assistant: column names and types only, never row data or credentials.</p>

        <div class="panel" style="margin-bottom:12px;">
          <label>What should the AI fill in?</label>
          <div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;">

            `).join('')}
          </div>
          ${isStaging ? `
            <div class="field mt">
              <label>Hash algorithm for hub/link/satellite keys <span class="hint">(locked to SHA-256 for now)</span></label>
              <select id="ai-hashalgo" disabled title="Locked to SHA-256 for now" style="opacity:.6;cursor:not-allowed;">
                ${Object.entries(HASH_ALGORITHMS).map(([k,a])=>`<option value="${k}" ${hashAlgo()===k?'selected':''}>${a.label} — ${a.sqlLabel}</option>`).join('')}
              </select>
            </div>
          ` : ''}
        </div>

        ${aiSettingsHtml('ai')}

        <div class="hint mt">${readyTables.length} of ${state.tables.filter(t=>t.included!==false).length} included table(s) have columns defined and will be sent.</div>
        <div id="ai-status-wrap"></div>

        <div class="flex-between mt">
          <button class="btn ghost" id="ai-modal-cancel">Cancel</button>
          <button class="btn primary" id="ai-modal-run" ${readyTables.length===0?'disabled':''}>Generate</button>
        </div>

        <div class="panel mt" style="margin-bottom:0;">
          <div class="panel-head" style="margin:-18px -20px 10px;"><h3>Log</h3></div>
          <pre class="code" id="ai-log" style="max-height:180px;">${aiLog.length? aiLog.join('\n') : 'No AI runs yet.'}</pre>
        </div>
      </div>
    </div>
  `;
  mount.querySelectorAll('[data-scope]').forEach(cb=>{
    cb.addEventListener('change', e=>{ aiScope[cb.dataset.scope] = e.target.checked; });
  });
  wireAiSettings(mount, 'ai', renderAiModal);
  mount.querySelector('#ai-modal-close').addEventListener('click', closeAiModal);
  mount.querySelector('#ai-modal-cancel').addEventListener('click', closeAiModal);
  mount.querySelector('#ai-backdrop').addEventListener('click', (e)=>{ if (e.target.id==='ai-backdrop') closeAiModal(); });
  mount.querySelector('#ai-modal-run').addEventListener('click', runAiModelling);
  wireAiModeSwitcher(mount);
}

function renderFdwAiModal(mount){
  mount.innerHTML = `
    <div class="modal-backdrop" id="ai-backdrop">
      <div class="modal-card">
        <div class="flex-between" style="margin-bottom:4px;">
          <h3 style="font-family:var(--font-display);font-size:15px;margin:0;">AI Assist</h3>
          <button class="btn small ghost" id="ai-modal-close">&times;</button>

        ${aiModeSwitcherHtml()}
        <p class="section-desc" style="margin-bottom:14px;">Say what database engine you're connecting to and it'll propose the JDBC driver class and URL format. Nothing sent but this description — your actual host, database, and credentials stay local.</p>

        <div class="field">
          <label>What are you connecting to?</label>
          <textarea id="fdw-description" style="min-height:80px;" placeholder="e.g. &quot;Oracle 19c&quot;, &quot;SQL Server 2022&quot;, &quot;MySQL 8&quot;, or &quot;another PostgreSQL 16 database&quot;"></textarea>

function aiStatus(msg, kind){
  const wrap = document.getElementById('ai-status-wrap');
  if (!wrap) return;
  wrap.innerHTML = `<div class="ai-status ${kind||''}">${kind==='busy'?'<span class="dot"></span>':''}${msg}</div>`;
}

function schemaPayload(){
  // Schema only — no row data is ever available to or sent by this tool.
  const tables = state.tables.filter(t=>t.included!==false);
  const fks = effectiveForeignKeys();
  return tables.map(t=>{
    const plan = tableRelationshipPlan(t, fks);
    return {
      name: t.name,
      entity: plan.ownEntity,
      description: t.description,
      primaryKeyColumns: plan.primaryKeyColumns.map(c=>c.name),
      tableRole: plan.type,
      foreignKeys: plan.foreignKeyGroups.map(f=>({
        columns:f.columns,
        referencedTable:f.refTable,
        referencedEntity:f.refEntity,
        referencedColumns:f.refColumns,
        role:f.role,
      })),
      relationshipAttributes: plan.type==='relationship' ? plan.attributes.map(c=>c.name) : [],
      columns: stagedColumns(t).map(c=>({ name:c.name, type:c.type, nullable:c.nullable, primaryKey:c.pk })),
    };
  });
}

function buildFdwPrompt(description){
  const rules = `You are a PostgreSQL infrastructure expert helping someone configure jdbc_fdw so that Data Vault hub/link/satellite tables can be stored as foreign tables pointing at another database, reached via JDBC.

Ground truth you must follow, do not contradict it:
- jdbc_fdw (the pgspider/jdbc_fdw fork, compatible with Postgres 13-17) is NOT a packaged/bundled Postgres extension. It must be built from source, requires Java (JDK/JRE) installed on the Postgres server with a libjvm.so symlink in place, and needs the actual JDBC driver .jar file for whatever engine is being connected to.
- CREATE SERVER options for jdbc_fdw are exactly: drivername (the fully-qualified JDBC driver class name), url (the full JDBC connection URL), jarfile (absolute path to the driver .jar on the Postgres server), querytimeout (seconds, integer), and optionally maxheapsize. There are no other server options — do not invent host/port/dbname as separate server options, they belong inside the url string.
- CREATE USER MAPPING options for jdbc_fdw are exactly: username and password. Nothing else.

- Your job, given the person's description of what database engine/version they're connecting to, is to supply the correct drivername and a URL template for that JDBC driver (using placeholder host/port/dbname the person will fill in), plus install guidance specific to that engine's driver (where to get the .jar, minimum Java version if notable).

Use literal placeholder text like <host>, <port>, <database> in the url for the person to fill in — never invent real connection details.`;
  const userMsg = `What they want to connect to: ${description}\nVault name: ${state.vault.name || '(unnamed)'}`;

}

async function deployFilesToFolder(){
  if (!deployFolder && !deployFolderDetected){
    toast('Local server not reachable to auto-detect the deploy folder — enter a folder path manually, or start the server.', 'err');
    return;
  }
  const n = parseInt(deployStartNum, 10) || 4;
  const pad = num => String(num).padStart(2, '0');
  const files = {
    [`${pad(n)}-ddls.sql`]: buildCombinedDdl(),
    [`${pad(n+1)}-pdi-meta.sql`]: getExportSql('pdimeta'),
  };
  // Remote table DDL targets a DIFFERENT database entirely (possibly a
  // different engine) — it has no place in this Postgres container's own
  // init sequence, so it's deliberately left out of this numbered set.
  const statusEl = document.getElementById('deploy-status');
  try {
    const health = await localFetch(`/api/health`).catch(()=>null);
    if (!health || !health.ok) throw new Error(`Local server not reachable at ${localServerUrl} — is it running?`);
    const body = { files };
    if (deployFolder) body.folder = deployFolder; // explicit override; otherwise server defaults to its own computed db-init path
    const resp = await localFetch(`/api/deploy-files`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Deploy failed.');
    if (statusEl) statusEl.innerHTML = `<div class="ai-status ok mt" style="align-items:flex-start;"><span>Wrote ${data.written.length} file(s) to <span class="mono">${escapeHtml(data.folder)}</span>:<br>${data.written.map(escapeHtml).join('<br>')}<br><br>Postgres only runs <span class="mono">docker-entrypoint-initdb.d</span> scripts on a <b>fresh, empty data volume</b> — dropping these into an already-initialized container's local deploy folder won't run them automatically. Use "Execute" above for an already-running database, or reset the volume for a true from-scratch init.</span></div>`;
    toast(`Deployed ${data.written.length} file(s) to ${data.folder}.`, 'ok');
  } catch(err){
    if (statusEl) statusEl.innerHTML = `<div class="ai-status err mt">${escapeHtml(err.message)}</div>`;
    toast(`Deploy failed: ${err.message}`, 'err');
  }
}

async function deployJdbcDriver(context='source'){
  const targetRequest=context==='target';
  const dialect=targetRequest ? state.externalTables.remoteDialect : state.vault.dialect;
  const spec=jdbcDriverSpec(dialect);
  if (!spec){
    const message=targetRequest
      ? 'Automated target-driver download is available for MySQL and SQL Server. Configure the PostgreSQL JDBC jar path manually; Export preflight will validate it.'
      : 'The Hop PostgreSQL source driver is already bundled.';
    toast(message, 'err');
    return;
  }
  if (!jdbcDriverFolder && !jdbcDriverFolderDetected){
    toast('Local server not reachable to auto-detect jdbc-drivers/ — enter a folder path manually, or start the server.', 'err');
    return;
  }
  jdbcDriverDeployStatus = 'loading';
  if(targetRequest) targetJdbcDriverStatus='loading';
  const btn = document.getElementById(targetRequest?'btn-deploy-target-jdbc-driver':'btn-deploy-jdbc-driver');
  if (btn) btn.textContent = 'Fetching & deploying…';
  const statusEl = targetRequest ? null : document.getElementById('jdbc-driver-deploy-status');
  try {
    const health = await localFetch(`/api/health`).catch(()=>null);
    if (!health || !health.ok) throw new Error(`Local server not reachable at ${localServerUrl} — is it running?`);
    const resp = await localFetch(`/api/fetch-driver`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url:spec.url, filename:spec.filename, folder: jdbcDriverFolder || jdbcDriverFolderDetected }),
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Fetch/deploy failed.');
    jdbcDriverDeployStatus = 'ok';
    if(targetRequest){
      state.externalTables.jarfile=`/opt/jdbc-drivers/${spec.filename}`;
      targetJdbcDriverStatus='ok';
      targetJdbcDriverMessage=`${spec.filename} was written to jdbc-drivers/ and is available to the packaged PostgreSQL FDW container.`;
    } else if (statusEl) {
      statusEl.innerHTML = `<div class="ai-status ok mt" style="align-items:flex-start;"><span>Fetched and wrote <span class="mono">${escapeHtml(spec.filename)}</span> (${(data.bytes/1024/1024).toFixed(1)} MB) to <span class="mono">${escapeHtml(data.folder)}</span>.</span></div>`;
    }
    toast(`Deployed ${spec.filename} to ${data.folder}.`, 'ok');
    if(targetRequest){
      if(activeTab==='connections'){ renderAll(); setActiveTabViewOnly('connections'); }
    } else refreshJdbcDriverStatus();
  } catch(err){
    jdbcDriverDeployStatus = 'error';
    if(targetRequest){
      targetJdbcDriverStatus='error'; targetJdbcDriverMessage=err.message;
      if(activeTab==='connections'){ renderAll(); setActiveTabViewOnly('connections'); }
    } else if (statusEl) statusEl.innerHTML = `<div class="ai-status err mt">${escapeHtml(err.message)}</div>`;
    toast(`Driver deploy failed: ${err.message}`, 'err');
  }
  if (btn) btn.textContent = targetRequest?`Fetch ${spec.label}`:'⬆ Fetch and deploy driver to jdbc-drivers/';
}

    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Deploy failed.');
    if (!options.silent){
      if (statusEl) statusEl.innerHTML = `<div class="ai-status ok mt" style="align-items:flex-start;"><span>Wrote <span class="mono">${escapeHtml(data.written[0] || 'source.json')}</span> (${DIALECTS[state.vault.dialect].label}) to <span class="mono">${escapeHtml(data.folder)}</span>. Restart the engine for it to pick up the new connection.</span></div>`;
      toast(`Deployed ${DIALECTS[state.vault.dialect].label} source.json to ${data.folder}.`, 'ok');
    }
    return data;
  } catch(err){
    if (!options.silent){
      if (statusEl) statusEl.innerHTML = `<div class="ai-status err mt">${escapeHtml(err.message)}</div>`;
      toast(`Deploy failed: ${err.message}`, 'err');
    }
    if (options.silent) throw err;
    return null;
  }
}

async function deployMappingWorkbook(options = {}){
  if (!mappingsFolder && !mappingsFolderDetected){
    const msg = 'Local server not reachable to auto-detect mappings/ — enter a folder path manually, or start the server.';
    if (!options.silent){ toast(msg, 'err'); return null; }
    throw new Error(msg);
  }
  const statusEl = document.getElementById('mapping-deploy-status');
  try {
    const health = await localFetch(`/api/health`).catch(()=>null);
    if (!health || !health.ok) throw new Error(`Local server not reachable at ${localServerUrl} — is it running?`);
    const wb = buildMappingWorkbook();
    const base64 = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
    const filename = mappingWorkbookFilename();
    const body = { files: { [filename]: base64 }, encoding: 'base64', folder: mappingsFolder || mappingsFolderDetected };
    const resp = await localFetch(`/api/deploy-files`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Deploy failed.');
    if (!options.silent){
      if (statusEl) statusEl.innerHTML = `<div class="ai-status ok mt" style="align-items:flex-start;"><span>Wrote <span class="mono">${escapeHtml(data.written[0] || filename)}</span> to <span class="mono">${escapeHtml(data.folder)}</span>.</span></div>`;
      toast(`Deployed ${filename} to ${data.folder}.`, 'ok');
    }
    return data;
  } catch(err){
    if (!options.silent){
      if (statusEl) statusEl.innerHTML = `<div class="ai-status err mt">${escapeHtml(err.message)}</div>`;
      toast(`Deploy failed: ${err.message}`, 'err');
    }
    if (options.silent) throw err;
    return null;
  }
}

</script>

<script>
/* =========================================================================
   PROJECT SAVE / LOAD + INIT
   ========================================================================= */
function saveProject(){
  const includePasswords = confirm(
    'Include database passwords in the saved file?\n\n' +
    'Choose Cancel (recommended) to save without them — you\'ll just need to ' +
    're-enter passwords after loading this project back in. Choose OK only if ' +
    'you\'re storing this file somewhere you trust as much as your password manager.'
  );
  const stateCopy = JSON.parse(JSON.stringify(state));
  if (!includePasswords){
    stateCopy.vault.srcPassword = '';
    stateCopy.vault.dvPassword = '';
    stateCopy.vault.vaultPassword = '';
    if (stateCopy.externalTables){
      stateCopy.externalTables.password = '';
      stateCopy.externalTables.studioPassword = '';
    }
  }
  const payload = JSON.stringify({ state: stateCopy, uidCounter }, null, 2);
  downloadBlob(payload, `${state.vault.name||'vault'}_project.json`, 'application/json');
  lastCommittedSnapshot = modelSnapshot();
  toast(includePasswords ? 'Project saved (includes passwords — keep this file secure).' : 'Project saved without passwords.', 'ok');
}
function loadProjectFromFile(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try {
      const data = JSON.parse(e.target.result);
      if (!data.state) throw new Error('Not a Data Vault Studio project file.');
      Object.assign(state, data.state);
      if (!state.sourceMeta) state.sourceMeta = { foreignKeys: [], approxRows: {} }; // older project files predate this field
      enforceRuntimeConnections(false);
      // Builds that briefly exposed two target passwords stored the service
      // password in vaultPassword. The GUI now has one target password; prefer
      // the visible target password and fall back to the legacy value only when
      // loading a file that has no dvPassword.
      if (!state.vault.dvPassword && typeof state.vault.vaultPassword === 'string') state.vault.dvPassword = state.vault.vaultPassword;
      state.vault.vaultPassword = state.vault.dvPassword || '';
      delete state.vault.bootstrapUseTarget; delete state.vault.bootstrapUser; delete state.vault.bootstrapPassword;
      const normalized = applyFeatureGates();
      uidCounter = data.uidCounter || uidCounter;
      const removed = pruneDownstreamModel({ dropExcluded:true });
      stagingConfirmedFingerprint = '';
      expandedStagingTableId = undefined;
      lastCommittedSnapshot = modelSnapshot();
      activeTab = 'connections'; appMode = 'designer';
      renderAll();
      const notes = [];
      if (removedModelCount(removed)) notes.push(`cleaned up stale downstream model objects: ${modelRemovalSummary(removed)}`);
      if (normalized.repairedJunctionDerivations) notes.push(`repaired ${normalized.repairedJunctionDerivations} relationship-key derivation(s)`);
      if (normalized.repairedForeignKeyDerivations) notes.push(`reconciled ${normalized.repairedForeignKeyDerivations} foreign-key derivation(s)`);
      if (normalized.repairedSatelliteDerivations) notes.push(`repaired ${normalized.repairedSatelliteDerivations} satellite parent-key derivation(s)`);
      if (normalized.normalizedColumnFlags) notes.push(`defaulted ${normalized.normalizedColumnFlags} existing column(s) to included in staging`);
      if (normalized.normalizedLoadGroups) notes.push(`defaulted ${normalized.normalizedLoadGroups} staging load group(s) to 2000`);
      toast(notes.length ? `Project loaded; ${notes.join('; ')}.` : 'Project loaded.','ok');
    } catch(err){
      toast('Could not load that file: ' + err.message, 'err');
    }
  };
  reader.readAsText(file);
}

function startNewProject(skipConfirm){
  if (!skipConfirm && !confirm('Start a new project? This clears everything currently on screen — save your project first if you want to keep it.')) return;
  Object.assign(state.vault, {
    name:'', prefix:'', sourceSchema:'public', tenantId:'', dialect:'postgresql',
    sourcePreset:'', targetPreset:'',
    hashAlgorithm:'sha256',
    vaultDbName:'', vaultDescription:'', srcCod:'', srcDescription:'',
    srcHost:'', srcPort:'', srcDatabase:'', srcUser:'', srcPassword:'',
    dvHost:'localhost', dvPort:'5432', dvDatabase:'', dvUser:'', dvPassword:'', vaultPassword:'',
  });
  enforceRuntimeConnections(true);
  state.tables = []; state.hubs = []; state.links = []; state.hubSats = []; state.linkSats = [];
  state.sourceMeta = { foreignKeys: [], approxRows: {} };
  Object.assign(state.externalTables, {
    enabled:false, serverName:'', drivername:'', url:'', jarfile:'',
    querytimeout:'30', maxheapsize:'', username:'', password:'',
    remoteDialect:'postgresql', remoteDatabase:'', remoteSchema:'',
    studioHost:'', studioPort:'', studioDatabase:'', studioSchema:'', studioUser:'', studioPassword:'',
    studioConnectionOverridden:false, deploymentAcknowledged:false,
  });
  externalPreflightResult = null; externalDeployResult = null; externalStorageBusy = false;
  externalTargetConnStatus = null; externalTargetConnError = ''; externalTargetDbExists = null; externalTargetIdentity = null; externalTargetDbCreating = false;
  discoveredSchemas = []; sourceConnStatus = null; targetConnStatus = null; targetDbExists = null;
  expandedTableId = null; expandedStagingTableId = undefined; stagingConfirmedFingerprint = '';
  modelSub = 'hubs'; activeTab = 'connections'; appMode = 'designer';
  try { localStorage.removeItem('vaultStudioAutosave'); } catch(_){}
  lastCommittedSnapshot = modelSnapshot();
  renderAll();
  toast('New project started.', 'ok');
}
document.getElementById('btn-new-project').addEventListener('click', ()=> startNewProject(false));
document.getElementById('btn-save-project').addEventListener('click', saveProject);
document.getElementById('btn-load-project').addEventListener('click', ()=> document.getElementById('file-load-project').click());

function syncThemeSwitchInput(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('theme-switch-input').checked = isDark;
}
document.getElementById('theme-switch-input').addEventListener('change', e=>{
  const next = e.target.checked ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('vaultStudioTheme', next); } catch(_) {}
});
syncThemeSwitchInput();
document.getElementById('file-load-project').addEventListener('change', (e)=>{
  if (e.target.files[0]) loadProjectFromFile(e.target.files[0]);
  e.target.value = '';
});

/* =========================================================================
   AUTOSAVE & CRASH RECOVERY — the whole model used to live only in memory;
   a refresh or crash lost everything since the last manual JSON save.
   Now: every input/change event (plus a periodic safety net) snapshots
   {state, uidCounter} into localStorage, debounced. On startup, if a
   non-trivial autosave exists, offer to restore it once per snapshot.
   Passwords are stripped from autosaves — localStorage is not a vault.
   ========================================================================= */
const AUTOSAVE_KEY = 'vaultStudioAutosave';
const AUTOSAVE_DISMISS_KEY = 'vaultStudioAutosaveDismissed';
let autosaveTimer = null;
let lastAutosavedJson = '';
let lastCommittedSnapshot = modelSnapshot(); // updated on explicit save/load/new/restore

function projectIsTrivial(s){
  const noModel = s.tables.length===0 && s.hubs.length===0 && s.links.length===0
    && s.hubSats.length===0 && s.linkSats.length===0;
  if (!noModel) return false;
  if (isDemoRuntime()){
    return s.vault.name==='sak' && s.vault.prefix==='sak' && s.vault.tenantId==='SAK'
      && s.vault.srcCod==='SAK' && s.vault.srcDescription==='sakila';
  }
  return !s.vault.name && !s.vault.prefix && !s.vault.tenantId
    && !s.vault.srcCod && !s.vault.srcDescription;
}
function buildAutosavePayload(){
  const stateCopy = JSON.parse(JSON.stringify(state));
  stateCopy.vault.srcPassword = '';
  stateCopy.vault.dvPassword = '';
  stateCopy.vault.vaultPassword = '';
  if (stateCopy.externalTables){ stateCopy.externalTables.password = ''; stateCopy.externalTables.studioPassword = ''; }
  return { state: stateCopy, uidCounter, savedAt: new Date().toISOString() };
}
function writeAutosaveNow(){
  try {
    if (projectIsTrivial(state)) return;
    const payload = buildAutosavePayload();
    const json = JSON.stringify(payload);
    // Compare without the timestamp so idle tabs don't churn localStorage.
    const comparable = JSON.stringify({ state: payload.state, uidCounter: payload.uidCounter });
    if (comparable === lastAutosavedJson) return;
    localStorage.setItem(AUTOSAVE_KEY, json);
    lastAutosavedJson = comparable;
  } catch(_){ /* storage full/blocked — autosave is best-effort */ }
}
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(writeAutosaveNow, 800);
}
// Every field edit anywhere in the app (capture phase — fields are re-created
// constantly by renderAll, so a delegated listener is the only stable hook).
document.addEventListener('input', scheduleAutosave, true);
document.addEventListener('change', scheduleAutosave, true);
// Safety net for programmatic mutations that don't come from a form event
// (AI apply, suggestions, drift merges, undo).
setInterval(writeAutosaveNow, 10000);

function readAutosave(){
  try {
    const raw = localStorage.getItem(AUTOSAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.state || projectIsTrivial(parsed.state)) return null;
    return parsed;
  } catch(_){ return null; }
}
function restoreAutosave(parsed){
  Object.assign(state, parsed.state);
  if (!state.sourceMeta) state.sourceMeta = { foreignKeys: [], approxRows: {} };
  enforceRuntimeConnections(false);
  const normalized = applyFeatureGates();
  uidCounter = parsed.uidCounter || uidCounter;
  pruneDownstreamModel({ dropExcluded:true });
  stagingConfirmedFingerprint = '';
  expandedStagingTableId = undefined;
  lastCommittedSnapshot = modelSnapshot();
  activeTab = 'connections'; appMode = 'designer';
  renderAll();
  const repairs = [];
  if (normalized.repairedJunctionDerivations) repairs.push(`${normalized.repairedJunctionDerivations} relationship-key derivation(s)`);
  if (normalized.repairedForeignKeyDerivations) repairs.push(`${normalized.repairedForeignKeyDerivations} foreign-key derivation(s)`);
  if (normalized.repairedSatelliteDerivations) repairs.push(`${normalized.repairedSatelliteDerivations} satellite parent-key derivation(s)`);
  toast(`Unsaved work restored from autosave${repairs.length?`; repaired ${repairs.join(' and ')}`:''}.${isDemoRuntime()?' Demo credentials were restored automatically.':''}`, 'ok');
}
function maybeOfferAutosaveRestore(){
  const parsed = readAutosave();
  if (!parsed) return;
  let dismissed = '';
  try { dismissed = localStorage.getItem(AUTOSAVE_DISMISS_KEY) || ''; } catch(_){}
  if (dismissed === parsed.savedAt) return; // already declined this exact snapshot
  const when = parsed.savedAt ? new Date(parsed.savedAt).toLocaleString() : 'an earlier session';
  const name = parsed.state.vault.name || '(unnamed vault)';
  if (confirm(`Restore unsaved work from ${when}?\n\nProject: ${name} — ${parsed.state.tables.length} table(s), ${parsed.state.hubs.length} hub(s).\n\nCancel keeps the autosave but won't ask again for this saved version (Load project still works as usual).`)){
    restoreAutosave(parsed);
  } else {
    try { localStorage.setItem(AUTOSAVE_DISMISS_KEY, parsed.savedAt || 'dismissed'); } catch(_){}
  }
}

// Warn before closing a tab with unsaved, non-trivial changes. Autosave
// makes this recoverable anyway, but the prompt prevents the surprise.
window.addEventListener('beforeunload', (e)=>{
  writeAutosaveNow();
  if (!projectIsTrivial(state) && modelSnapshot() !== lastCommittedSnapshot){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* =========================================================================
   LICENSE — the engine stack refuses to start until the product license is
   accepted (start.sh / start.ps1 gate on a hash marker). Instead of sending
   people to a terminal, the GUI shows the license on first load and offers
   explicit acceptance; the server writes the same marker the scripts write.
   No license file / no server = nothing shown (start.sh still enforces).
   ========================================================================= */
let licenseState = null; // null = not checked | { exists, accepted, text }

async function refreshLicenseState(){
  try {
    const r = await localFetch('/api/license');
    const data = await r.json();
    licenseState = data.ok ? data : null;
  } catch(_){ licenseState = null; } // server not running — start.sh will enforce
  return licenseState;
}

function showLicenseModal(onAccepted){
  if (document.getElementById('license-modal-backdrop')) return;
  const wrap = document.createElement('div');
  wrap.id = 'license-modal-backdrop';
  wrap.className = 'modal-backdrop';
  wrap.innerHTML = `
    <div class="modal-card" style="max-height:85vh;overflow:auto;max-width:760px;">
      <h3 style="font-family:var(--font-display);font-size:15px;margin:0 0 4px;">License agreement</h3>
      <p class="section-desc" style="margin-bottom:10px;">Accept once to enable the engine and packaged containers. Recorded next to the project (same marker the start scripts write).</p>
      <pre class="mono" style="white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px;max-height:45vh;overflow:auto;font-size:12px;">${escapeHtml((licenseState && licenseState.text) || '')}</pre>
      <div id="license-modal-err"></div>
      <div class="mt" style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn ghost" id="license-decline">Not now</button>
        <button class="btn primary" id="license-accept">Accept license</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  document.getElementById('license-decline').addEventListener('click', ()=> wrap.remove());
  document.getElementById('license-accept').addEventListener('click', async ()=>{
    const btn = document.getElementById('license-accept');
    btn.disabled = true; btn.textContent = 'Accepting…';
    try {
      const r = await localFetch('/api/license-accept', { method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ accept: true }) }).then(x=>x.json());
      if (!r.ok) throw new Error(r.error || 'Could not record acceptance.');
      licenseState = Object.assign({}, licenseState, { accepted: true });
      wrap.remove();
      toast('License accepted.', 'ok');
      if (onAccepted) onAccepted();
    } catch(err){
      btn.disabled = false; btn.textContent = 'Accept license';
      document.getElementById('license-modal-err').innerHTML = `<div class="ai-status err mt">${escapeHtml(err.message)}</div>`;
    }
  });
}

// Gate for anything that starts the stack. Returns true when clear to
// proceed; otherwise opens the modal (retrying the action on acceptance).
async function requireLicenseAccepted(retry){
  await refreshLicenseState();
  if (!licenseState || !licenseState.exists || licenseState.accepted) return true;
  showLicenseModal(retry);
  return false;
}

// First-load offer: if the server is up and the license file exists but was
// never accepted, show it right away rather than at the first engine start.
(async ()=>{
  refreshEnvDefaults(); // fire-and-forget — presets re-fetch if this raced
  await refreshLicenseState();
  if (licenseState && licenseState.exists && !licenseState.accepted) showLicenseModal();
})();

renderAll();
detectDbInitPath(); // known before the person ever needs a folder path, regardless of which tab they visit first
maybeOfferAutosaveRestore();
</script>

<script>

   (inst_runs, inst_run_dv_jobs, inst_run_stg_jobs, ref_runtypes,
   ref_statuses) via the read-only /api/query endpoint. Never writes
   anything.
   ========================================================================= */
let dashboardConn = { host:'localhost', port:'5432', database:'', user:'', password:'' };
let schedulerStatus = { enabled:false, intervalMinutes:60, nextRunAt:null, lastRunAt:null, log:[] };
let schedulerBusy = false;
let schedulerPollHandle = null;
let dashboardStatus = null; // null | 'loading' | 'ok' | 'error'
let dashboardError = '';
let dashboardRuns = [];
let dashboardObjectErrors = [];
let dashboardRowsLoaded = { staging: 0, vault: 0 };
let dashboardSelectedRun = null;
let dashboardDvJobs = [];
let dashboardStgJobs = [];
let dashboardDetailStatus = null;
let dashboardVerification = {
  status: null, // null | loading | empty | complete | error
  headline: '',
  runSucceeded: false,
  findings: [],
  error: '',
};

function dashboardVerificationHtml(){
  if (dashboardVerification.status === 'loading'){
    return `<div class="ai-status busy mt"><span class="dot"></span>Verifying the latest load…</div>`;
  }
  if (dashboardVerification.status === 'empty'){
    return `<div class="empty mt">No runs recorded in pdi_meta.inst_runs yet.</div>`;
  }
  if (dashboardVerification.status === 'error'){
    return `<div class="ai-status err mt">${escapeHtml(dashboardVerification.error)}</div>`;
  }
  if (dashboardVerification.status !== 'complete') return '';
  return `
    <div class="ai-status ${dashboardVerification.runSucceeded ? 'ok':'err'} mt">${escapeHtml(dashboardVerification.headline)}</div>
    ${dashboardVerification.findings.length===0
      ? `<div class="ai-status ok mt">All checks passed — no zero-row loads, no object errors, no rows in _err tables.</div>`
      : dashboardVerification.findings.map(f=>`<div class="ai-status ${f.kind==='err'?'err':'busy'} mt" style="align-items:flex-start;"><span>${escapeHtml(f.text)}</span></div>`).join('')}
  `;
}

function updateDashboardVerificationUi(){
  const results = document.getElementById('verify-results');

  if (button){

function renderDashboard(el){

      ${engineModeInvalid() ? `<div class="ai-status err mt">The demo source only runs with the internal Postgres target — fix the Connections step before starting.</div>` : ''}
      ${externalLocalhostWarningHtml()}
      ${engineMode()==='external' ? `
      <p class="hint mt">First run against this external PostgreSQL database? Select <b>Set up metadata</b> under Export → Deployment status first.</p>` : ''}
      <div class="grid cols-2 mt" style="align-items:start;">

        </div>

          <button class="btn ghost" id="btn-engine-logs">▤ View engine logs</button>

      <button class="btn primary mt" id="btn-verify-load" ${dashboardVerification.status==='loading'?'disabled':''}>${dashboardVerification.status==='loading'?'Verifying…':'Verify latest load'}</button>
      <div id="verify-results">${dashboardVerificationHtml()}</div>
    </div>

    <div class="panel">
      <div class="panel-head" style="margin:-18px -20px 16px;"><h3>Scheduler</h3></div>
      <p class="hint">Starts the engine on a repeating interval while the local server (<span class="mono">npm start</span>) is running. Not tied to this tab; settings survive a server restart.</p>

      ${schedulerStatus.log && schedulerStatus.log.length ? `
      <table class="data mt">

        ${schedulerStatus.log.map(l=>`
          <tr>
            <td class="mono">${new Date(l.at).toLocaleString()}</td>
            <td>${l.reason==='manual'?'Manual':'Scheduled'}</td>
            <td><span class="tag" style="border-color:${l.ok?'var(--ok)':'var(--err)'};color:${l.ok?'var(--ok)':'var(--err)'};">${l.ok?'Success':'Failed'}</span>${l.error?` <span class="hint">${escapeHtml(l.error)}</span>`:''}</td>
          </tr>`).join('')}
      </table>` : ''}
    </div>

    <div id="dash-results"></div>
  `;
  document.getElementById('btn-docker-runhop').addEventListener('click', async ()=>{ await dockerRunHop(); startRunWatch(); });
  document.getElementById('btn-engine-logs').addEventListener('click', loadEngineLogs);
  bindEngineLogsRefresh();

  document.getElementById('btn-verify-load').addEventListener('click', verifyLatestLoad);
  const bindDash = (id, key) => document.getElementById(id).addEventListener('input', e=> dashboardConn[key]=e.target.value);
  bindDash('dash-host','host'); bindDash('dash-port','port'); bindDash('dash-database','database');
  bindDash('dash-user','user'); bindDash('dash-password','password');
  document.getElementById('btn-dash-load').addEventListener('click', loadDashboardMetrics);
  document.getElementById('scheduler-enabled-toggle').addEventListener('change', e=> setSchedulerConfig(
    e.target.checked ? { enabled: true, mode: engineMode() } : { enabled: false }));
  document.getElementById('scheduler-interval').addEventListener('change', e=> setSchedulerConfig({ intervalMinutes: Number(e.target.value) }));
  document.getElementById('btn-scheduler-runnow').addEventListener('click', runSchedulerNowFromHub);
  startSchedulerPolling();

  if (dashboardStatus==='error'){
    document.getElementById('dash-conn-status').innerHTML = `<div class="ai-status err mt">${escapeHtml(dashboardError)}</div>`;
  }
  if (dashboardRuns.length) renderDashboardResults(document.getElementById('dash-results'));
}

async function loadSchedulerStatus(){
  try {
    const resp = await localFetch(`/api/scheduler/status`);
    const data = await resp.json();
    if (data && data.ok) schedulerStatus = data;
  } catch(_) { /* local server not reachable — leave last-known status showing rather than erroring the whole Hub */ }
  if (appMode==='dashboard') renderAll();
}
function startSchedulerPolling(){
  if (schedulerPollHandle) return; // already polling
  loadSchedulerStatus();
  schedulerPollHandle = setInterval(loadSchedulerStatus, 10000);
}
function stopSchedulerPolling(){
  if (schedulerPollHandle){ clearInterval(schedulerPollHandle); schedulerPollHandle = null; }
}
async function setSchedulerConfig(patch){
  try {
    const resp = await localFetch(`/api/scheduler/config`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch),
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'Could not update the schedule.');
    schedulerStatus = data;
    toast(patch.enabled!=null ? (patch.enabled?'Scheduler enabled.':'Scheduler disabled.') : 'Interval updated.', 'ok');
  } catch(err){
    toast('Could not update the schedule: ' + err.message, 'err');
  }
  renderAll();
}
async function runSchedulerNowFromHub(){
  schedulerBusy = true;
  renderAll();
  try {
    const resp = await localFetch(`/api/scheduler/run-now`, { method:'POST' });
    const data = await resp.json();
    schedulerStatus = data;
    toast(data.result && data.result.ok ? 'Engine started.' : `Run failed: ${(data.result && data.result.error) || 'see log below'}`, data.result && data.result.ok ? 'ok' : 'err');
  } catch(err){
    toast('Could not reach the local server: ' + err.message, 'err');
  }
  schedulerBusy = false;
  renderAll();
}

async function dashQuery(sql){
  const resp = await localFetch(`/api/query`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ ...dashboardConn, sql }),
  });
  const data = await resp.json();
  if (!data.ok) throw new Error(data.error || 'Query failed.');
  return data.rows;
}

function engineLogsHtml(){

  if (engineLogsState.status === 'error') return `<div class="ai-status err mt">${escapeHtml(engineLogsState.error)}</div>`;

    </div>
    <pre class="code" style="max-height:320px;overflow:auto;">${escapeHtml(engineLogsState.text || '(no log output yet)')}</pre>`;
}
function bindEngineLogsRefresh(){
  const refreshBtn = document.getElementById('btn-engine-logs-refresh');
  if (refreshBtn) refreshBtn.addEventListener('click', loadEngineLogs);
}
function updateEngineLogsUi(){

  if (!wrap) return;
  wrap.innerHTML = engineLogsHtml();

}
async function loadEngineLogs(){

/* ---- RUN WATCHER — `up -d` returns the moment the container starts, so
   after starting the engine this polls pdi_meta.inst_runs until a new run
   appears and reaches a terminal status. ---- */
let runWatch = null; // { baselineMaxId, tries, handle, message, kind }
function runWatchStatusHtml(){
  if (!runWatch || !runWatch.message) return '';
  const cls = runWatch.kind==='ok' ? 'ok' : runWatch.kind==='err' ? 'err' : 'busy';
  return `<div class="ai-status ${cls} mt">${cls==='busy'?'<span class="dot"></span>':''}${escapeHtml(runWatch.message)}</div>`;
}
function updateRunWatchUi(){
  const el = document.getElementById('run-watch-status');
  if (el) el.innerHTML = runWatchStatusHtml();
}
function stopRunWatch(message, kind){
  if (runWatch && runWatch.handle) clearInterval(runWatch.handle);
  if (runWatch){ runWatch.handle = null; if (message){ runWatch.message = message; runWatch.kind = kind || 'err'; } }
  updateRunWatchUi();
}
async function startRunWatch(){
  if (!dashboardConn.database){
    toast('Set the Hub connection (database) to watch run progress.', 'err');
    return;
  }
  stopRunWatch();
  let baseline = 0;
  try {
    const rows = await dashQuery(`SELECT COALESCE(MAX(id_run),0) AS max_id FROM pdi_meta.inst_runs`);
    baseline = Number(rows[0] && rows[0].max_id || 0);
  } catch(err){
    toast(`Could not read pdi_meta.inst_runs to watch the run: ${err.message}`, 'err');
    return;
  }
  runWatch = { baselineMaxId: baseline, tries: 0, handle: null, message: 'Engine starting — waiting for a new run to appear in pdi_meta.inst_runs…', kind: 'busy' };
  updateRunWatchUi();
  runWatch.handle = setInterval(runWatchTick, 10000);
}
async function runWatchTick(){
  if (!runWatch) return;
  runWatch.tries++;
  if (runWatch.tries > 180){ stopRunWatch('Stopped watching after 30 minutes — check the engine logs.', 'err'); return; }
  try {
    const rows = await dashQuery(`
      SELECT r.id_run, r.id_status, s.description AS status_desc, r.date_start, r.duration_in_seconds, r.error_message
      FROM pdi_meta.inst_runs r
      LEFT JOIN pdi_meta.ref_statuses s ON s.id_status = r.id_status
      WHERE r.id_run > ${Number(runWatch.baselineMaxId)}
      ORDER BY r.id_run DESC LIMIT 1
    `);
    if (!rows.length){
      runWatch.message = `Engine starting — no new run yet (checked ${runWatch.tries}×, every 10s)…`;
      runWatch.kind = 'busy';
      updateRunWatchUi();
      return;
    }
    const run = rows[0];
    if (run.id_status===2){
      stopRunWatch(`Run #${run.id_run} finished successfully${run.duration_in_seconds!=null?` in ${run.duration_in_seconds}s`:''}.`, 'ok');
      toast(`Run #${run.id_run} finished successfully.`, 'ok');
      loadDashboardMetrics();
    } else if (run.id_status===3){
      stopRunWatch(`Run #${run.id_run} FAILED${run.error_message?`: ${run.error_message}`:''} — check the engine logs and run detail.`, 'err');
      toast(`Run #${run.id_run} failed.`, 'err');
      loadDashboardMetrics();
    } else {
      runWatch.message = `Run #${run.id_run} in progress (${run.status_desc || 'status '+run.id_status})…`;
      runWatch.kind = 'busy';
      updateRunWatchUi();
    }
  } catch(_){ /* transient query failure — keep polling */ }
}

/* ---- POST-RUN VERIFICATION — did the latest run actually load anything,
   and did any rows land in _err tables? Mirrors the setup skill's
   failure-diagnosis checks. ---- */
async function verifyLatestLoad(){
  if (!dashboardConn.database){
    dashboardVerification = {
      status:'error', headline:'', runSucceeded:false, findings:[],
      error:'Set the connection above (at least the database) first.',
    };
    updateDashboardVerificationUi();
    return;
  }
  dashboardVerification = { status:'loading', headline:'', runSucceeded:false, findings:[], error:'' };
  updateDashboardVerificationUi();
  try {
    const latest = await dashQuery(`
      SELECT r.id_run, r.id_status, s.description AS status_desc, r.date_start, r.duration_in_seconds, r.error_message
      FROM pdi_meta.inst_runs r
      LEFT JOIN pdi_meta.ref_statuses s ON s.id_status = r.id_status
      ORDER BY r.date_start DESC LIMIT 1
    `);
    if (!latest.length){
      dashboardVerification = { status:'empty', headline:'', runSucceeded:false, findings:[], error:'' };
      updateDashboardVerificationUi();
      return;
    }
    const run = latest[0];
    const findings = [];

    if (run.id_status===3) findings.push({ kind:'err', text:`Run #${run.id_run} FAILED${run.error_message?`: ${run.error_message}`:''}.` });

    let zeroStg = [], zeroDv = [], errDv = [];
    try {
      zeroStg = await dashQuery(`SELECT source_table_name, target_table_name FROM pdi_meta.inst_run_stg_jobs WHERE id_run = ${run.id_run} AND COALESCE(num_records_loaded,0) = 0 ORDER BY target_table_name`);
    } catch(_){}
    try {
      zeroDv = await dashQuery(`SELECT data_vault_object FROM pdi_meta.inst_run_dv_jobs WHERE id_run = ${run.id_run} AND COALESCE(num_records_loaded,0) = 0 ORDER BY data_vault_object`);
    } catch(_){}
    try {
      errDv = await dashQuery(`SELECT data_vault_object, num_errors FROM pdi_meta.inst_run_dv_jobs WHERE id_run = ${run.id_run} AND COALESCE(num_errors,0) > 0 ORDER BY num_errors DESC`);
    } catch(_){}
    if (zeroStg.length) findings.push({ kind:'warn', text:`${zeroStg.length} staging job(s) loaded ZERO rows: ${zeroStg.slice(0,10).map(j=>j.target_table_name||j.source_table_name).join(', ')}${zeroStg.length>10?'…':''}` });
    if (zeroDv.length) findings.push({ kind:'warn', text:`${zeroDv.length} vault object(s) loaded ZERO rows: ${zeroDv.slice(0,10).map(j=>j.data_vault_object).join(', ')}${zeroDv.length>10?'…':''}` });
    if (errDv.length) findings.push({ kind:'err', text:`${errDv.length} vault object(s) reported errors: ${errDv.slice(0,10).map(j=>`${j.data_vault_object} (${j.num_errors})`).join(', ')}${errDv.length>10?'…':''}` });

    // _err tables that actually contain rows. Table list from the catalog,
    // then a count per table (capped) — each count is one read-only query.
    let errTablesWithRows = [];
    try {
      const errTables = await dashQuery(`
        SELECT table_schema, table_name FROM information_schema.tables
        WHERE table_name LIKE '%\\_err' AND table_schema IN ('vault','data_vault','staging')
        ORDER BY table_schema, table_name LIMIT 60
      `);
      for (const t of errTables.slice(0, 40)){
        try {
          const c = await dashQuery(`SELECT COUNT(*) AS n FROM "${t.table_schema}"."${t.table_name}"`);
          const n = Number(c[0] && c[0].n || 0);
          if (n > 0) errTablesWithRows.push({ table: `${t.table_schema}.${t.table_name}`, rows: n });
        } catch(_){}
      }
    } catch(_){}
    if (errTablesWithRows.length) findings.push({ kind:'err', text:`${errTablesWithRows.length} _err table(s) contain rows: ${errTablesWithRows.map(t=>`${t.table} (${t.rows.toLocaleString()})`).join(', ')} — inspect these rows to see which records were rejected and why.` });

    const headline = `Run #${run.id_run} · ${run.status_desc || 'status '+run.id_status} · started ${run.date_start ? new Date(run.date_start).toLocaleString() : '—'}${run.duration_in_seconds!=null?` · ${run.duration_in_seconds}s`:''}`;
    dashboardVerification = {
      status:'complete',
      headline,
      runSucceeded: run.id_status===2,
      findings,
      error:'',
    };
    updateDashboardVerificationUi();
  } catch(err){
    dashboardVerification = {
      status:'error', headline:'', runSucceeded:false, findings:[], error:err.message,
    };
    updateDashboardVerificationUi();
  }
}

async function loadDashboardMetrics(){
  dashboardStatus = 'loading';
  document.getElementById('btn-dash-load').textContent = 'Loading…';
  try {
    const health = await localFetch(`/api/health`).catch(()=>null);
    if (!health || !health.ok) throw new Error(`Local server not reachable at ${localServerUrl} — is it running?`);
    dashboardRuns = await dashQuery(`
      SELECT r.id_run,
             CASE WHEN rt.description = 'Test Staging' THEN 'Staging' ELSE rt.description END AS run_type,
             s.description AS status_desc, r.id_status,
             r.date_start, r.date_end, r.duration_in_seconds, r.error_message
      FROM pdi_meta.inst_runs r
      JOIN pdi_meta.ref_runtypes rt ON rt.id_rtyp = r.id_rtyp
      LEFT JOIN pdi_meta.ref_statuses s ON s.id_status = r.id_status
      WHERE rt.description IN ('Data Vault', 'Test Staging')
      ORDER BY r.date_start DESC
      LIMIT 50
    `);
    // Best-effort extras — a vault with no load history yet, or an older
    // Metadata schema without these particular tables, shouldn't block the
    // core run list from showing. Each fails independently and silently.
    try {
      dashboardObjectErrors = await dashQuery(`
        WITH recent_visible_runs AS (
          SELECT r.id_run, rt.description AS run_type
          FROM pdi_meta.inst_runs r
          JOIN pdi_meta.ref_runtypes rt ON rt.id_rtyp = r.id_rtyp
          WHERE rt.description IN ('Data Vault', 'Test Staging')
          ORDER BY r.date_start DESC
          LIMIT 20
        )
        SELECT j.data_vault_object, SUM(j.num_errors) AS total_errors, COUNT(*) AS times_run, SUM(j.num_records_loaded) AS total_loaded
        FROM pdi_meta.inst_run_dv_jobs j
        JOIN recent_visible_runs r ON r.id_run = j.id_run AND r.run_type = 'Data Vault'
        GROUP BY j.data_vault_object
        HAVING SUM(j.num_errors) > 0
        ORDER BY total_errors DESC, total_loaded DESC
        LIMIT 8
      `);
    } catch(_) { dashboardObjectErrors = []; }
    try {
      const rows = await dashQuery(`
        WITH recent_visible_runs AS (
          SELECT r.id_run, rt.description AS run_type
          FROM pdi_meta.inst_runs r
          JOIN pdi_meta.ref_runtypes rt ON rt.id_rtyp = r.id_rtyp
          WHERE rt.description IN ('Data Vault', 'Test Staging')
          ORDER BY r.date_start DESC
          LIMIT 20
        )
        SELECT 'staging' AS layer, COALESCE(SUM(j.num_records_loaded),0) AS total
        FROM pdi_meta.inst_run_stg_jobs j
        JOIN recent_visible_runs r ON r.id_run = j.id_run AND r.run_type = 'Test Staging'
        UNION ALL
        SELECT 'vault' AS layer, COALESCE(SUM(j.num_records_loaded),0) AS total
        FROM pdi_meta.inst_run_dv_jobs j
        JOIN recent_visible_runs r ON r.id_run = j.id_run AND r.run_type = 'Data Vault'
      `);
      dashboardRowsLoaded = {
        staging: Number(rows.find(r=>r.layer==='staging')?.total || 0),
        vault: Number(rows.find(r=>r.layer==='vault')?.total || 0),
      };
    } catch(_) { dashboardRowsLoaded = { staging: 0, vault: 0 }; }
    dashboardStatus = 'ok'; dashboardError = '';
    dashboardSelectedRun = null; dashboardDvJobs = []; dashboardStgJobs = [];
    toast(`Loaded ${dashboardRuns.length} run(s).`, 'ok');
  } catch(err){
    dashboardStatus = 'error'; dashboardError = err.message;
    dashboardRuns = []; dashboardObjectErrors = []; dashboardRowsLoaded = { staging: 0, vault: 0 };
    toast('Could not load metrics — see details below.', 'err');
  }
  renderAll();
}

function timeAgo(dateStr){
  if (!dateStr) return null;
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diffMs/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs/24);
  return `${days}d ago`;
}

function timeUntil(dateStr){
  if (!dateStr) return null;
  const diffMs = new Date(dateStr).getTime() - Date.now();
  if (diffMs <= 0) return 'due now';
  const mins = Math.ceil(diffMs/60000);
  if (mins < 60) return `in ${mins}m`;
  const hrs = Math.floor(mins/60);
  const remMins = mins % 60;
  if (hrs < 24) return remMins ? `in ${hrs}h ${remMins}m` : `in ${hrs}h`;
  const days = Math.floor(hrs/24);
  return `in ${days}d`;
}

function renderHealthBanner(){
  const lastOk = dashboardRuns.find(r=>r.id_status===2);
  const lastErr = dashboardRuns.find(r=>r.id_status===3);
  const chip = (label, run, color) => run
    ? `<div class="health-chip" style="border-color:${color};">
         <span class="health-chip-dot" style="background:${color};"></span>
         <div>
           <div class="hint mb0">${label}</div>
           <div style="font-weight:700;">${escapeHtml(run.run_type||'—')} <span class="hint">· ${timeAgo(run.date_start)}</span></div>
         </div>
       </div>`
    : `<div class="health-chip" style="border-color:var(--border);">
         <span class="health-chip-dot" style="background:var(--muted-2);"></span>
         <div><div class="hint mb0">${label}</div><div style="font-weight:700;color:var(--muted);">None yet</div></div>
       </div>`;
  return `<div class="grid cols-2 mt">
    ${chip('Last successful run', lastOk, 'var(--ok)')}
    ${chip('Last failed run', lastErr, 'var(--err)')}
  </div>`;
}

function renderDurationChart(){
  const recent = dashboardRuns.slice(0, 20).slice().reverse(); // chronological, oldest first
  if (!recent.length) return `<div class="empty">No runs to chart yet.</div>`;
  const w = 560, h = 120, barGap = 4;
  const barW = Math.max(6, (w / recent.length) - barGap);
  const maxDur = Math.max(1, ...recent.map(r=>r.duration_in_seconds||0));
  const bars = recent.map((r,i)=>{
    const dur = r.duration_in_seconds || 0;
    const barH = Math.max(2, (dur/maxDur) * (h-20));
    const x = i * (barW+barGap);
    const y = h - barH;
    const color = statusBadgeColor(r.id_status);
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${color}" opacity="0.85"><title>Run #${r.id_run} — ${escapeHtml(r.run_type||'')} — ${dur}s — ${escapeHtml(r.status_desc||'')}</title></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:120px;display:block;">${bars}</svg>`;
}

function renderRunTypeBreakdown(){
  const counts = {};
  dashboardRuns.forEach(r=>{ const k = r.run_type||'Unknown'; counts[k] = (counts[k]||0)+1; });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  if (!entries.length) return `<div class="empty">No runs yet.</div>`;
  const max = Math.max(...entries.map(e=>e[1]));
  return entries.map(([type,count])=>`
    <div class="runtype-row">
      <span class="runtype-label">${escapeHtml(type)}</span>
      <div class="runtype-bar-track"><div class="runtype-bar-fill" style="width:${Math.round((count/max)*100)}%;"></div></div>
      <span class="mono runtype-count">${count}</span>
    </div>`).join('');
}

function statusBadgeColor(idStatus){
  if (idStatus===2) return 'var(--ok)';
  if (idStatus===3) return 'var(--err)';
  return 'var(--brand)'; // started / in progress
}

  const avgDur = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : null;
  const successRate = total ? Math.round((success/total)*100) : null;

  el.innerHTML = `
    ${renderHealthBanner()}

    <div class="grid cols-4 mt">
      <div class="panel" style="text-align:center;"><div class="hint mb0">Runs (last 50)</div><div style="font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--brand-deep);">${total}</div></div>
      <div class="panel" style="text-align:center;"><div class="hint mb0">Success rate</div><div style="font-family:var(--font-mono);font-size:24px;font-weight:700;color:${successRate==null?'var(--muted)':successRate>=90?'var(--ok)':successRate>=60?'var(--hub)':'var(--err)'};">${successRate!=null?successRate+'%':'—'}</div></div>
      <div class="panel" style="text-align:center;"><div class="hint mb0">Errored</div><div style="font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--err);">${errored}</div></div>
      <div class="panel" style="text-align:center;"><div class="hint mb0">Avg duration</div><div style="font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--brand-deep);">${avgDur!=null?avgDur+'s':'—'}</div></div>
    </div>

    <div class="grid cols-2 mt" style="align-items:start;">
      <div class="panel">
        <div class="hint mb0" style="margin-bottom:10px;">Run duration — last ${Math.min(20,total)} runs, oldest → newest</div>
        ${renderDurationChart()}
      </div>
      <div class="panel">
        <div class="hint mb0" style="margin-bottom:10px;">Runs by type</div>
        ${renderRunTypeBreakdown()}
      </div>
    </div>

    <div class="grid cols-2 mt" style="align-items:start;">
      <div class="panel">
        <div class="hint mb0" style="margin-bottom:10px;">Rows loaded — last ${Math.min(20,total)} runs</div>
        <div class="grid cols-2">
          <div style="text-align:center;"><div class="hint mb0">Staging</div><div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--sat);">${dashboardRowsLoaded.staging.toLocaleString()}</div></div>
          <div style="text-align:center;"><div class="hint mb0">Data vault</div><div style="font-family:var(--font-mono);font-size:20px;font-weight:700;color:var(--hub);">${dashboardRowsLoaded.vault.toLocaleString()}</div></div>
        </div>

async function selectDashboardRun(idRun){
  dashboardSelectedRun = idRun;
  dashboardDetailStatus = 'loading';
  renderAll();
  try {
    dashboardDvJobs = await dashQuery(`
      SELECT data_vault_object, num_records_loaded, num_errors, duration_in_seconds
      FROM pdi_meta.inst_run_dv_jobs
      WHERE id_run = ${idRun}
      ORDER BY data_vault_object
    `);
    dashboardStgJobs = await dashQuery(`
      SELECT source_table_name, target_table_name, num_records_loaded, duration_in_seconds
      FROM pdi_meta.inst_run_stg_jobs
      WHERE id_run = ${idRun}
      ORDER BY target_table_name
    `);
    dashboardDetailStatus = 'ok';
  } catch(err){
    dashboardDetailStatus = 'error';
    dashboardError = err.message;
  }
  renderAll();
}

function renderDashboardDetail(el){
  if (dashboardDetailStatus==='loading'){ el.innerHTML = `<div class="ai-status busy"><span class="dot"></span>Loading…</div>`; return; }
  if (dashboardDetailStatus==='error'){ el.innerHTML = `<div class="ai-status err">${escapeHtml(dashboardError)}</div>`; return; }
  const rows = [];
  if (dashboardStgJobs.length){
    rows.push(`<div class="hint" style="text-transform:uppercase;font-weight:600;margin-bottom:4px;">Staging</div>`);
    rows.push(`<table class="data" style="margin-bottom:14px;"><tr><th>Source</th><th>Target</th><th>Loaded</th><th>Duration</th></tr>${
      dashboardStgJobs.map(j=>`<tr><td class="mono">${escapeHtml(j.source_table_name||'—')}</td><td class="mono">${escapeHtml(j.target_table_name||'—')}</td><td class="mono">${j.num_records_loaded??'—'}</td><td class="mono">${j.duration_in_seconds!=null?j.duration_in_seconds+'s':'—'}</td></tr>`).join('')
    }</table>`);
  }
  if (dashboardDvJobs.length){
    rows.push(`<div class="hint" style="text-transform:uppercase;font-weight:600;margin-bottom:4px;">Data vault objects</div>`);
    rows.push(`<table class="data"><tr><th>Object</th><th>Loaded</th><th>Errors</th><th>Duration</th></tr>${
      dashboardDvJobs.map(j=>`<tr><td class="mono">${escapeHtml(j.data_vault_object||'—')}</td><td class="mono">${j.num_records_loaded??'—'}</td><td class="mono" style="color:${j.num_errors>0?'var(--err)':'inherit'}">${j.num_errors??0}</td><td class="mono">${j.duration_in_seconds!=null?j.duration_in_seconds+'s':'—'}</td></tr>`).join('')
    }</table>`);
  }
  el.innerHTML = rows.length ? rows.join('') : `<div class="empty">No per-object detail recorded for this run.</div>`;
}

/* =========================================================================
   DATA VAULT STUDIO PLUS — AI-assisted reporting (proof of concept)
   Connects to a deployed vault, introspects its real schema, gets AI report
   ideas to choose from, then generates: plain reporting SQL views, an Excel
   workbook (headers + an Instructions sheet with the SQL to run and paste
   back in), and a self-contained HTML report that reads that workbook.
   Deliberately does not create any new vault objects — the views are
   plain SELECTs, nothing is written back to the vault database itself.
   ========================================================================= */
let spConn = { dialect:'postgresql', host:'localhost', port:'5432', database:'', schema:'data_vault', user:'', password:'', autoDefault:true };

function studioPlusDefaultConnection(){
  if(state.externalTables.enabled){
    const ext=state.externalTables;
    const dialect=ext.remoteDialect||'postgresql';
    const database=ext.studioDatabase||ext.remoteDatabase||'';
    return {
      dialect,
      host:ext.studioHost||'localhost',
      port:String(ext.studioPort||externalDefaultPort(dialect)),
      database,
      schema:ext.studioSchema||ext.remoteSchema||(dialect==='mysql'?database:(dialect==='sqlserver'?'dbo':'data_vault')),
      user:ext.studioUser||ext.username||'',
      password:ext.studioPassword||ext.password||'',
      autoDefault:true,
    };
  }
  return {
    dialect:'postgresql',
    host:state.vault.dvHost||'localhost',
    port:String(state.vault.dvPort||'5432'),
    database:state.vault.dvDatabase||'',
    schema:'data_vault',
    user:state.vault.dvUser||'',
    password:state.vault.dvPassword||'',
    autoDefault:true,
  };
}

function spQuoteIdentifier(name){
  const value=String(name||'');
  if(spConn.dialect==='mysql') return '`'+value.replace(/`/g,'``')+'`';
  if(spConn.dialect==='sqlserver') return '['+value.replace(/]/g,']]')+']';
  return '"'+value.replace(/"/g,'""')+'"';
}
function spQualifiedTable(name){
  return `${spQuoteIdentifier(spConn.schema||spConn.database)}.${spQuoteIdentifier(name)}`;
}
let spSchemaStatus = null; // null | 'loading' | 'ok' | 'error'
let spSchemaError = '';
let spSchemaTables = []; // [{ name, columns:[{name,type}] }]
let spDashboardPlanStatus = null; // null | 'loading' | 'ok' | 'error'

let spOverrides = {};
let spViewValidation = {}; // keyed by view key -> { ok, error }

function spSectionRowHtml(s, i){
  const key = `sec:${i}`;
  const expanded = !!spExpanded[key];

  const edited = spSectionOverrides[i] != null;
  return `
    <div class="export-file-row ${expanded?'expanded':''}">
      <div class="export-file-row-head">
        <button class="export-file-toggle" data-sptoggle="${key}" aria-expanded="${expanded}">
          <span class="export-file-caret">${expanded?'▾':'▸'}</span>
          <span class="export-file-label">${escapeHtml(s.title||s.view_name)}</span>
          <span class="hint">(section · reads ${escapeHtml(s.view_name)})</span>
          ${edited ? `<span class="badge-count">edited</span>` : ''}
        </button>
      </div>

      <div class="export-file-body">

          <p class="hint mb0">${edited ? 'Edited — used in the downloaded report.' : 'Generated by the model — edit above to override it.'} Receives rows (array of row objects) and el (empty container element).</p>

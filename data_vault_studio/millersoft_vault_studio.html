<script>
/* =========================================================================
   TABLES TAB
   ========================================================================= */
function newTable(name){
  return { id: uid('tbl'), name: name||'', objectType:'table', description:'', included:true, incremental:false, incrementCol:'',
           loadGroup: 2000, columns: [], derivations: [], customOverride: null };
}
function newColumn(name, type){
  const sourceName = name||'';
  return {
    id: uid('col'),
    name: sourceName,
    targetName: sourceName ? targetIdentifierBase(sourceName) : '',
    targetNameAuto: true,
    type: type||'varchar(255)',
    nullable:true,
    pk:false,
    staged:true,
    profile:null,
  };
}

function parseCreateTable(sql){
  // Best-effort parse of `CREATE TABLE name (col type [constraints], ...)`
  const m = sql.match(/create\s+table\s+(?:if not exists\s+)?([`"\[]?[\w.]+[`"\]]?)\s*\(([\s\S]+)\)\s*;?\s*$/i);
  if (!m) return null;
  const rawName = m[1].replace(/[`"\[\]]/g,'').split('.').pop();
  const body = m[2];
  // split on commas not inside parens
  const parts = []; let depth=0, cur='';
  for (const ch of body){
    if (ch==='(') depth++;
    if (ch===')') depth--;
    if (ch===',' && depth===0){ parts.push(cur); cur=''; } else cur+=ch;
  }
  if (cur.trim()) parts.push(cur);
  const cols = [];
  const pkFromTableConstraint = [];
  parts.forEach(p=>{
    const t = p.trim();
    if (/^(primary\s+key|constraint|foreign\s+key|unique|check|key\s)/i.test(t)){
      const pkm = t.match(/primary\s+key\s*\(([^)]+)\)/i);
      if (pkm) pkm[1].split(',').forEach(c=>pkFromTableConstraint.push(c.trim().replace(/[`"\[\]]/g,'')));
      return;
    }
    const cm = t.match(/^[`"\[]?(\w+)[`"\]]?\s+([\w()., ]+?)(\s+not\s+null|\s+null|\s+primary\s+key|\s+default\s+[^,]+)*\s*$/i);
    if (cm){
      const col = newColumn(cm[1], cm[2].trim().toLowerCase());
      col.nullable = !/not\s+null/i.test(t);
      col.pk = /primary\s+key/i.test(t);
      if (col.pk) col.nullable = false;
      cols.push(col);
    }
  });
  cols.forEach(c=>{
    if (pkFromTableConstraint.includes(c.name)){
      c.pk = true;
      c.nullable = false;
    }
  });
  return { name: rawName, columns: cols };
}

let expandedTableId = null;

function parseInfoSchemaBulk(text){
  // Accepts CSV or tab-separated rows: table_name,column_name,data_type,is_nullable[,is_pk]
  // (the shape produced by a quick information_schema.columns export)
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim());
  if (lines.length===0) return null;
  let start = 0;
  const first = lines[0].toLowerCase();
  if (first.includes('table_name') && first.includes('column_name')) start = 1; // skip header row
  const sep = lines[0].includes('\t') ? '\t' : ',';
  const byTable = {};
  for (let i=start;i<lines.length;i++){
    const parts = lines[i].split(sep).map(s=>s.trim().replace(/^"|"$/g,''));
    if (parts.length<3) continue;
    const [tableName, colName, dataType, isNullable, isPk] = parts;
    if (!tableName || !colName) continue;
    if (!byTable[tableName]) byTable[tableName] = [];
    const col = newColumn(colName, (dataType||'varchar(255)').toLowerCase());
    col.nullable = isNullable ? /yes|true|1/i.test(isNullable) : true;
    col.pk = isPk ? /yes|true|1/i.test(isPk) : false;
    if (col.pk) col.nullable = false;
    byTable[tableName].push(col);
  }
  return byTable;
}

function renderTables(el){
  const v = state.vault;
  const includedCount = state.tables.filter(t=>t.included!==false).length;
  const sourceTables = state.tables.filter(t=>!isSourceView(t));
  const sourceViews = state.tables.filter(isSourceView);
  const canIntrospect = ['postgresql','mysql','sqlserver'].includes(v.dialect);
  el.innerHTML = `
    <h2 class="section-title">Step 2 — Tables</h2>
    <p class="section-desc">Choose source tables for this run. Views are detected separately and left unselected unless you include one deliberately. Schema only, no row data. PK and NOT NULL columns are checked using aggregate blank/null counts.</p>

    <div class="panel" style="display:flex;align-items:center;gap:10px;">
      <span class="entity-marker sat" style="background:var(--sat);border-radius:2px;"></span>
      <span class="mono" style="font-size:12.5px;">${v.srcDatabase || '(database not set)'}${v.dialect==='mysql' ? '' : `<span style="color:var(--muted)">.${v.sourceSchema || (v.dialect==='sqlserver'?'dbo':'public')}</span>`}</span>
      <span class="hint" style="margin-left:auto;">${DIALECTS[v.dialect].label} · set on the Connections step</span>
    </div>

    <div class="panel">
      <div class="flex-between">
        <div>
          <label class="mb0">Live from the database</label>
          <p class="hint" style="margin-top:2px;">${canIntrospect ? 'Table and column list from the source connected on Step 1.' : 'PostgreSQL, MySQL, or SQL Server — switch dialect on Step 1, or add tables manually below.'}</p>
        </div>
        <span class="quick-tip" data-tooltip="Detect tables, columns, keys and nullability, with blank/null checks for constrained columns.">
          <button class="btn primary" id="btn-introspect" ${canIntrospect?'':'disabled'}>Detect Source Tables</button>
        </span>
      </div>
    </div>

    <div class="flex-between" style="margin-bottom:8px;">
      <h3 style="font-family:var(--font-display);font-size:12.5px;margin:0;text-transform:uppercase;letter-spacing:.2px;color:var(--muted);">
        Source objects in this schema <span class="badge-count">&nbsp;·&nbsp;${includedCount} of ${state.tables.length} included</span>
      </h3>
      <div>
        ${state.tables.length>0 ? `
          <button class="btn small" id="btn-select-all">Select all tables</button>
          <button class="btn small" id="btn-select-none">Select none</button>
        ` : ''}
      </div>
    </div>

    <div id="tables-list"></div>

    <div class="panel mt">
      <div class="panel-head" style="margin:-18px -20px 16px;"><h3>Manual entry <span class="badge-count">&nbsp;·&nbsp;no local server needed</span></h3></div>
      <div class="flex-between">
        <div style="flex:1;min-width:220px;">
          <label>Quick add</label>
          <input type="text" id="new-table-name" placeholder="table name, e.g. customers">
        </div>
        <button class="btn" id="btn-add-table" style="margin-top:18px;">+ Add table</button>
      </div>
      <div class="field mt">
        <label>Paste a CREATE TABLE statement <span class="hint">(review columns after parsing)</span></label>
        <textarea id="paste-ddl" placeholder="CREATE TABLE customers (id INT PRIMARY KEY, name VARCHAR(100), is_active BOOLEAN, created_at TIMESTAMP);"></textarea>
        <button class="btn small mt" id="btn-parse-ddl">Parse &amp; add table</button>
      </div>
      <div class="field mt">
        <label>Bulk-import information_schema columns <span class="hint">(CSV/TSV: table_name, column_name, data_type, is_nullable, is_pk)</span></label>
        <textarea id="paste-infoschema" placeholder="table_name,column_name,data_type,is_nullable,is_pk&#10;customers,id,int,NO,YES&#10;customers,name,varchar,YES,NO"></textarea>
        <button class="btn small mt" id="btn-parse-infoschema">Import tables</button>
      </div>
    </div>

    <div class="flex-between mt">
      <button class="btn ghost" id="btn-back-tables">← Back to connections</button>
      <button class="btn primary" id="btn-next-tables">Next: staging →</button>
    </div>
  `;

  const introspectBtn = document.getElementById('btn-introspect');
  if (introspectBtn && !introspectBtn.disabled) introspectBtn.addEventListener('click', introspectDatabase);
  const selectAllBtn = document.getElementById('btn-select-all');
  const selectNoneBtn = document.getElementById('btn-select-none');
  if (selectAllBtn) selectAllBtn.addEventListener('click', ()=>{
    state.tables.filter(t=>!isSourceView(t)).forEach(t=> t.included = true);
    renderAll(); setActiveTabViewOnly('tables');
  });
  if (selectNoneBtn) selectNoneBtn.addEventListener('click', ()=>{
    pushUndo('exclude all tables');
    state.tables.forEach(t=> t.included = false);
    const removed = pruneDownstreamModel({ dropExcluded:true });
    renderAll(); setActiveTabViewOnly('tables');
    if (removedModelCount(removed)) toastUndo(`Removed downstream model objects for excluded tables: ${modelRemovalSummary(removed)}.`);
  });
  document.getElementById('btn-add-table').addEventListener('click', ()=>{
    const name = document.getElementById('new-table-name').value.trim();
    if (!name){ toast('Enter a table name first.','err'); return; }
    if (state.tables.some(t=>t.name===name)){ toast('That table already exists.','err'); return; }
    const t = newTable(name);
    state.tables.push(t);
    expandedTableId = t.id;
    renderAll(); setActiveTabViewOnly('tables');
  });
  document.getElementById('new-table-name').addEventListener('keydown', e=>{
    if (e.key==='Enter') document.getElementById('btn-add-table').click();
  });
  document.getElementById('btn-parse-ddl').addEventListener('click', ()=>{
    const sql = document.getElementById('paste-ddl').value.trim();
    if (!sql){ toast('Paste a CREATE TABLE statement first.','err'); return; }
    const parsed = parseCreateTable(sql);
    if (!parsed){ toast('Could not parse that statement — check the syntax.','err'); return; }
    if (state.tables.some(t=>t.name===parsed.name)){ toast(`Table "${parsed.name}" already exists.`,'err'); return; }
    const t = newTable(parsed.name);
    t.columns = parsed.columns;
    state.tables.push(t);
    expandedTableId = t.id;
    renderAll(); setActiveTabViewOnly('tables');
    toast(`Parsed ${parsed.columns.length} columns for "${parsed.name}". Review types before continuing.`,'ok');
  });
  document.getElementById('btn-parse-infoschema').addEventListener('click', ()=>{
    const text = document.getElementById('paste-infoschema').value.trim();
    if (!text){ toast('Paste an information_schema export first.','err'); return; }
    const byTable = parseInfoSchemaBulk(text);
    if (!byTable || Object.keys(byTable).length===0){ toast('Could not find any rows to import.','err'); return; }
    let added = 0, skipped = 0;
    Object.entries(byTable).forEach(([name, cols])=>{
      if (state.tables.some(t=>t.name===name)){ skipped++; return; }
      const t = newTable(name); t.columns = cols; state.tables.push(t); added++;
    });
    renderAll(); setActiveTabViewOnly('tables');
    toast(`Imported ${added} table(s)${skipped?`, skipped ${skipped} already present`:''}.`, 'ok');
  });
  document.getElementById('btn-back-tables').addEventListener('click', ()=> navigateDesignerTab('connections'));
  document.getElementById('btn-next-tables').addEventListener('click', ()=>{
    if (state.tables.filter(t=>t.included!==false).length===0){ toast('Include at least one table before moving on.','err'); return; }
    navigateDesignerTab('staging');
  });

  renderTablesList(document.getElementById('tables-list'));
}

function setActiveTabViewOnly(tab){ activeTab = tab; }

function wireStagingColumnToggles(container, table, returnTab){
  container.querySelectorAll('[data-stage-col]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const col = findCol(table, inp.dataset.stageCol);
      if (!col) return;
      const next = e.target.checked;
      if (!next && col.pk && !confirm(`Exclude key column "${col.name}" from staging? Any dependent Hub or Link mappings will be removed.`)){
        e.target.checked = true;
        return;
      }
      pushUndo(`${next?'include':'exclude'} staging column "${col.name}" on "${table.name}"`);
      col.staged = next;
      const removed = pruneDownstreamModel({ dropExcluded:true });
      renderAll();
      setActiveTabViewOnly(returnTab || activeTab);
      if ((returnTab || activeTab)==='tables') expandedTableId = table.id;
      const extra = removedModelCount(removed) ? ` Removed ${modelRemovalSummary(removed)}.` : '';
      toastUndo(`${next?'Included':'Excluded'} ${table.name}.${col.name} ${next?'in':'from'} staging.${extra}`);
    });
  });
}

function renderTablesList(el){
  if (state.tables.length===0){
    el.innerHTML = `<div class="empty">No tables yet. Add one above to start staging it.</div>`;
    return;
  }
  const sourceTables = state.tables.filter(t=>!isSourceView(t));
  const sourceViews = state.tables.filter(isSourceView);
  const cards = tables=>tables.map(t=>{
    const open = expandedTableId===t.id;
    const included = t.included!==false;
    return `
    <div class="entity-card" style="${included?'':'opacity:.55;'}">
      <div class="ehead ${open?'open':''}" data-toggle="${t.id}">
        <div class="ehead-left">
          <label class="checkbox-row" style="margin-right:2px;" title="Include in this run" onclick="event.stopPropagation();">
            <input type="checkbox" data-include="${t.id}" ${included?'checked':''}>
          </label>
          <span class="entity-marker sat" style="background:var(--muted);border-radius:2px;"></span>
          <span class="entity-name">${t.name}</span>
          <span class="entity-meta">${t.columns.length} cols${isSourceView(t)?' · view':''}${(state.sourceMeta && state.sourceMeta.approxRows && state.sourceMeta.approxRows[t.name]!=null) ? ` · ~${Number(state.sourceMeta.approxRows[t.name]).toLocaleString()} rows` : ''} · staging → <span class="mono">${stagingTableName(t.name)}</span> ${included?'':'· <span class=\"tag\">excluded</span>'}</span>
        </div>
        <div>
          <button class="btn small danger" data-del-table="${t.id}">Delete</button>
        </div>
      </div>
      <div class="entity-body ${open?'open':''}" id="tbody-${t.id}"></div>
    </div>`;
  }).join('');
  const group = (title, subtitle, tables, included)=>`
    <div class="flex-between" style="margin:${title==='Views'?'18px':'0'} 0 8px;">
      <h3 style="font-family:var(--font-display);font-size:12.5px;margin:0;text-transform:uppercase;letter-spacing:.2px;color:var(--muted);">
        ${title} <span class="badge-count">&nbsp;·&nbsp;${included} of ${tables.length} included</span>
      </h3>
      <span class="hint">${subtitle}</span>
    </div>
    ${tables.length ? cards(tables) : `<div class="empty">No ${title.toLowerCase()} detected.</div>`}
  `;
  el.innerHTML =
    group('Base tables', 'Selected by default', sourceTables, sourceTables.filter(t=>t.included!==false).length)
    + (sourceViews.length
      ? group('Views', 'Not selected by default · include only when intentional', sourceViews, sourceViews.filter(t=>t.included!==false).length)
      : '');

  el.querySelectorAll('[data-include]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const t = findTable(cb.dataset.include);
      const wasIncluded = t.included!==false;
      if (wasIncluded && !e.target.checked) pushUndo(`exclude table "${t.name}"`);
      t.included = e.target.checked;
      const removed = (wasIncluded && t.included===false) ? pruneDownstreamModel({ dropExcluded:true }) : {hubs:0,links:0,hubSats:0,linkSats:0};
      renderAll(); setActiveTabViewOnly('tables'); expandedTableId=t.id;
      if (removedModelCount(removed)) toastUndo(`Removed downstream model objects for excluded table: ${modelRemovalSummary(removed)}.`);
    });
  });
  el.querySelectorAll('[data-toggle]').forEach(h=>{
    h.addEventListener('click', (e)=>{
      if (e.target.closest('[data-del-table]') || e.target.closest('[data-include]')) return;
      const id = h.dataset.toggle;
      expandedTableId = expandedTableId===id ? null : id;
      renderAll(); setActiveTabViewOnly('tables');
    });
  });
  el.querySelectorAll('[data-del-table]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.delTable;
      const table = findTable(id);
      if (!confirm('Delete this table? Any hubs, links or satellites sourced from it will also be removed.')) return;
      pushUndo(`delete table "${table ? table.name : id}"`);
      const removed = pruneDownstreamModel({ dropTableIds:[id] });
      state.tables = state.tables.filter(t=>t.id!==id);
      if (expandedTableId===id) expandedTableId = null;
      renderAll(); setActiveTabViewOnly('tables');
      const extra = removedModelCount(removed) ? ` Removed ${modelRemovalSummary(removed)}.` : '';
      toastUndo(`Deleted table "${table ? table.name : id}".${extra}`);
    });
  });
  state.tables.forEach(t=>{
    if (expandedTableId===t.id) renderTableDetail(document.getElementById('tbody-'+t.id), t);
  });
}

function renderTableDetail(el, t){
  el.innerHTML = `
    <div class="field"><label>Description</label><input type="text" data-tf="description" value="${t.description}"></div>

    <div class="panel-head" style="margin:16px -14px 0;"><h3>Columns <span class="badge-count">&nbsp;·&nbsp;${stagedColumns(t).length} of ${t.columns.length} staged</span></h3><button class="btn small" data-profiletable="${t.id}" title="Profile every column in this table">Profile table</button></div>
    <p class="hint">The Stage checkbox is the same setting shown on Step 3. Untick it here or in Staging to exclude that source column from the staging output and the Vault design. Staging keeps source nullability unless profiling finds blanks or nulls.</p>
    <table class="data">
      <tr><th style="width:70px">Stage</th><th>Source name</th><th>Staging name</th><th>Type</th><th style="width:70px" title="Checked means the source allows NULL">Null</th><th style="width:110px">PK</th><th></th></tr>
      ${t.columns.map(c=>{
        const showProfile = columnProfileIsUserRequested(c);
        return `
      <tr style="${isColumnStaged(c)?'':'opacity:.55;'}">
        <td><input type="checkbox" data-stage-col="${c.id}" ${isColumnStaged(c)?'checked':''}></td>
        <td><input type="text" data-col="${c.id}" data-cf="name" value="${c.name}"></td>
        <td><input type="text" data-col="${c.id}" data-cf="targetName" value="${targetColumnName(c)}" title="PostgreSQL-safe name used in staging and Vault outputs"></td>
        <td><input type="text" data-col="${c.id}" data-cf="type" value="${c.type}"></td>
        <td><input type="checkbox" data-col="${c.id}" data-cf="nullable" ${c.nullable?'checked':''} title="Source allows NULL. Profiling can relax NOT NULL for blanks or nulls."></td>
        <td><input type="checkbox" data-col="${c.id}" data-cf="pk" ${c.pk?'checked':''}></td>
        <td style="white-space:nowrap;"><button class="btn small danger" data-delcol="${c.id}">&times;</button></td>
      </tr>
      <tr style="${showProfile?'':'display:none;'}" data-profilerow="${c.id}"><td colspan="7" class="hint" data-profilecell="${c.id}" style="padding:6px 10px;">${showProfile?escapeHtml(columnProfileSummary(c)):''}</td></tr>`;
      }).join('')}
    </table>
    <button class="btn small mt" id="btn-add-col">+ Add column</button>
    <p class="hint mt">Load order${FEATURE_INCREMENTAL?', incremental settings':''} and key derivations for this table live in the <b>Staging</b> step.</p>
  `;

  el.querySelectorAll('[data-profiletable]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const columns = (t.columns||[]).map(c=>c.name).filter(Boolean);
      if (!columns.length) return;
      const originalText = b.textContent;
      b.disabled = true;
      b.textContent = 'Profiling table…';
      try {
        const v = state.vault;
        const schema = v.dialect==='mysql' ? v.srcDatabase : v.sourceSchema;
        const resp = await localFetch(`/api/profile-table`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ host:v.srcHost, port:v.srcPort, database:v.srcDatabase, user:v.srcUser, password:v.srcPassword, dialect:v.dialect, schema, table:t.name, columns }),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || 'Profile failed.');
        const applied = applyManualTableProfiles(t, data.profiles);
        expandedTableId = t.id;
        renderAll(); setActiveTabViewOnly('tables');
        toast(`Profiled ${applied} column(s) in ${t.name}.`, 'ok');
      } catch(err){
        b.disabled = false;
        b.textContent = originalText;
        toast(`Table profile failed: ${err.message}`, 'err');
      }
    });
  });

  wireStagingColumnToggles(el, t, 'tables');
  el.querySelectorAll('[data-tf]').forEach(inp=>{
    const key = inp.dataset.tf;
    inp.addEventListener('input', e=>{ t[key] = e.target.value; });
  });
  el.querySelectorAll('[data-col]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const col = findCol(t, inp.dataset.col);
      const key = inp.dataset.cf;
      const oldName = col.name;
      if (key==='targetName'){
        const clean = targetIdentifierBase(e.target.value);
        col.targetName = clean;
        col.targetNameAuto = false;
        if (e.target.value!==clean) e.target.value = clean;
      } else if (key==='pk'){
        col.pk = inp.checked;
        if (col.pk) col.nullable = false;
      } else if (key==='nullable'){
        col.nullable = inp.checked;
        if (col.nullable) col.pk = false;
      } else {
        col[key] = inp.type==='checkbox' ? inp.checked : e.target.value;
      }
      if (key==='name'){
        if (oldName!==col.name) col.profile = null;
        t.derivations.forEach(d=>{
          const names = derivationSourceColumns(d).map(name=>name===oldName ? col.name : name);
          d.column = names[0] || '';
          if (Array.isArray(d.columns)) d.columns = names;
        });
        if (col.targetNameAuto!==false){ col.targetName=''; ensureTableTargetNames(t); }
      }
      if (key==='pk' || key==='nullable' || key==='name' || key==='targetName'){ renderAll(); setActiveTabViewOnly('tables'); expandedTableId=t.id; }
    });
  });
  el.querySelectorAll('[data-delcol]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const colId = b.dataset.delcol;
      const col = findCol(t, colId);
      pushUndo(`delete column "${col ? col.name : colId}" on "${t.name}"`);
      t.columns = t.columns.filter(c=>c.id!==colId);
      t.derivations = t.derivations.filter(d=>!derivationUsesColumn(d, col&&col.name));
      const removed = pruneDownstreamModel({ dropExcluded:true });
      renderAll(); setActiveTabViewOnly('tables'); expandedTableId=t.id;
      if (removedModelCount(removed)) toastUndo(`Removed downstream model objects that referenced the deleted column: ${modelRemovalSummary(removed)}.`);
    });
  });
  el.querySelector('#btn-add-col').addEventListener('click', ()=>{
    t.columns.push(newColumn('', 'varchar(255)'));
    renderAll(); setActiveTabViewOnly('tables'); expandedTableId=t.id;
  });
}

function derivationOutputLabel(table,d){
  const names=[];
  if(d.kind==='hash'||d.kind==='both') names.push(hashColumnNameForDerivation(table,d));
  if(d.kind==='bk'||d.kind==='both') names.push(businessKeyColumnName(derivationCanonicalSpec(table,d).entity));
  return names.join(' + ');
}

function addManualKeyDerivation(table,column,entity,role,kind){
  if(!table) return {ok:false,reason:'Table not found'};
  const col=stagedColumns(table).find(c=>c.name===column);
  if(!col) return {ok:false,reason:'Pick a staged source column'};
  if(!String(entity||'').trim()) return {ok:false,reason:'Enter a target Hub'};
  repairForeignKeyDerivations(table);
  const before=(table.derivations||[]).length;
  const applied=ensureDerivationWithoutCollision(table,String(entity).trim(),column,kind,String(role||'').trim());
  if(!applied.ok) return applied;
  const reconciled=repairForeignKeyDerivations(table);
  const after=(table.derivations||[]).length;
  const derivation=(table.derivations||[]).find(d=>sameColumnList(derivationSourceColumns(d),[column])&&
    (d.kind==='hash'||d.kind==='both'||kind==='bk'))||applied.derivation;
  return {ok:true,changed:!!applied.changed||after>before||reconciled>0,added:after>before,merged:after<=before&&(!applied.changed||reconciled>0),derivation};
}
function renderDerivRows(el, t, container){
  if (t.derivations.length===0){ el.innerHTML = `<div class="hint">No derivations yet.</div>`; return; }
  el.innerHTML = `<div class="deriv-row hint" style="font-size:10px;text-transform:uppercase;"><span>Source key</span><span>Target hub</span><span>Role</span><span>Output</span><span>Type</span><span></span></div>` + t.derivations.map(d=>{
    const spec=derivationCanonicalSpec(t,d);
    return `<div class="deriv-row">
      <span class="mono" style="font-size:11.5px;">${escapeHtml(derivationSourceColumns(d).join(' + '))}</span>
      <span class="mono" style="font-size:11.5px;color:var(--sat)">${escapeHtml(spec.entity)}</span>
      <span class="mono" style="font-size:11.5px;">${escapeHtml(spec.role)}</span>
      <span class="mono" style="font-size:11px;">${escapeHtml(derivationOutputLabel(t,d))}</span>
      <span class="tag">${d.kind}</span>
      <button class="btn small danger" data-deldrv="${d.id}">&times;</button>
    </div>`;
  }).join('');
  el.querySelectorAll('[data-deldrv]').forEach(b=>{
    b.addEventListener('click', ()=>{
      t.derivations = t.derivations.filter(d=>d.id!==b.dataset.deldrv);
      renderAll(); setActiveTabViewOnly('staging');
    });
  });
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>

<script>
/* =========================================================================
   STEP 3 — STAGING
   ========================================================================= */
let expandedStagingTableId;
let stagingConfirmedFingerprint = '';

function stagingReviewFingerprint(){
  return JSON.stringify({
    hashAlgorithm: hashAlgo(),
    tables: (state.tables||[]).map(t=>({
      id:t.id,
      name:t.name,
      included:t.included!==false,
      loadGroup:2000,
      columns:(t.columns||[]).map(c=>({
        id:c.id, name:c.name, targetName:targetColumnName(c), type:c.type,
        nullable:!!c.nullable, pk:!!c.pk, staged:isColumnStaged(c),
        profile:c.profile ? {
          totalRows:Number(c.profile.totalRows||0),
          nullValues:Number(c.profile.nullValues||0),
          blankValues:Number(c.profile.blankValues||0),
        } : null,
      })),
      derivations:(t.derivations||[]).map(d=>({
        id:d.id, columns:derivationSourceColumns(d), entity:d.entity,
        role:d.role, kind:d.kind,
      })),
      customOverride:t.customOverride,
    })),
  });
}
function stagingChangesConfirmed(){
  return !!stagingConfirmedFingerprint && stagingConfirmedFingerprint===stagingReviewFingerprint();
}
function updateStagingConfirmationUi(){
  const confirmed = stagingChangesConfirmed();
  const hashColumnsReady = stagingHashColumnsReady();
  const tables = includedTables();
  const confirmBtn = document.getElementById('btn-confirm-staging');
  const nextBtn = document.getElementById('btn-next-staging');
  const status = document.getElementById('staging-confirm-status');
  if (confirmBtn){
    confirmBtn.disabled = confirmed || !hashColumnsReady;
    confirmBtn.textContent = confirmed ? 'Changes Confirmed' : 'Confirm Changes';
  }
  if (nextBtn) nextBtn.disabled = !confirmed || !hashColumnsReady;
  if (status){
    if (!tables.length){
      status.textContent = 'Include at least one source table before continuing.';
      status.style.color = 'var(--err)';
    } else if (!hashColumnsReady){
      status.textContent = stagingHashRequirementMessage();
      status.style.color = 'var(--err)';
    } else {
      status.textContent = confirmed
        ? 'Current staging changes are confirmed.'
        : 'Hash columns are ready. Review and confirm the staging changes before continuing.';
      status.style.color = confirmed ? 'var(--ok)' : 'var(--muted-2)';
    }
  }
}
function invalidateStagingConfirmation(){
  stagingConfirmedFingerprint = '';
  updateStagingConfirmationUi();
}
function confirmStagingChanges(){
  if (!stagingHashColumnsReady()) return false;
  stagingConfirmedFingerprint = stagingReviewFingerprint();
  updateStagingConfirmationUi();
  return true;
}

function renderStaging(el){
  const tables = includedTables();
  const missingHashTables = stagingTablesMissingHashColumns();
  tables.forEach(t=>{ t.loadGroup = 2000; });
  if (tables.length && expandedStagingTableId===undefined) expandedStagingTableId = tables[0].id;
  el.innerHTML = `
    <div class="flex-between">
      <div>
        <h2 class="section-title">Step 3 — Staging</h2>
        <p class="section-desc mb0">Review the source columns and detected hash keys that staging will produce. The Vault design only uses the tables and columns selected here.</p>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <span class="quick-tip" data-tooltip="Detect deterministic staging hash and business keys from the source primary and foreign keys.">
          <button class="btn primary" id="btn-suggest-keys-staging">Detect Hash Keys</button>
        </span>
        <span class="quick-tip" data-tooltip="Find included tables that still have no staging key derivations.">
          <button class="btn" id="btn-coverage-staging">Integrity Check</button>
        </span>
        <span class="quick-tip" data-tooltip="Use an AI provider to propose staging key choices for review.">
          <button class="btn" id="btn-ai-staging">AI Assist</button>
        </span>
      </div>
    </div>

    ${tables.length && missingHashTables.length ? `
      <div class="ai-status err mt">${escapeHtml(stagingHashRequirementMessage())}</div>
    ` : ''}

    <div class="panel">
      <div class="grid cols-2">
        <div class="field">
          <label>Hash algorithm for hub/link/satellite keys <span class="hint">(locked to SHA-256 for now)</span></label>
          <select id="f-hashalgo" disabled title="Locked to SHA-256 for now" style="opacity:.6;cursor:not-allowed;">
            ${Object.entries(HASH_ALGORITHMS).map(([k,a])=>`<option value="${k}" ${hashAlgo()===k?'selected':''}>${a.label} — ${a.sqlLabel}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label class="mb0">&nbsp;</label>
          <p class="hint" style="margin-top:9px;">${HASH_ALGORITHMS[hashAlgo()].note}</p>
        </div>
      </div>
      <p class="hint mt">Applies vault-wide — every <span class="mono">staging_sql_override</span> and hash key column, in staging and in the data vault DDL.</p>
    </div>

    <div class="flex-between" style="margin-bottom:8px;">
      <h3 style="font-family:var(--font-display);font-size:12.5px;margin:0;text-transform:uppercase;letter-spacing:.2px;color:var(--muted);">
        Tables in staging <span class="badge-count">&nbsp;·&nbsp;${tables.length} included</span>
      </h3>
      <button class="btn small" id="btn-deselect-staging" ${tables.length?'':'disabled'}>Deselect Tables</button>
    </div>

    ${tables.length===0 ? `<div class="empty mt">No included tables. Return to Tables to select at least one.</div>` : `<div id="staging-tables"></div>`}

    <div class="flex-between mt">
      <button class="btn ghost" id="btn-back-staging">← Back to tables</button>
      <div style="display:flex;align-items:center;gap:12px;">
        <span class="hint mb0" id="staging-confirm-status"></span>
        <button class="btn primary" id="btn-confirm-staging">Confirm Changes</button>
        <button class="btn primary" id="btn-next-staging">Next: vault model →</button>
      </div>
    </div>
  `;
  document.getElementById('btn-ai-staging').addEventListener('click', ()=> openAiModal('staging'));
  document.getElementById('btn-coverage-staging').addEventListener('click', ()=> openCoverageModal('staging'));
  document.getElementById('btn-suggest-keys-staging').addEventListener('click', ()=> runSuggestFromKeys('staging'));
  document.getElementById('btn-deselect-staging').addEventListener('click', ()=>{
    if (!tables.length) return;
    pushUndo('deselect all staging tables');
    state.tables.forEach(t=>{ t.included = false; });
    const removed = pruneDownstreamModel({ dropExcluded:true });
    expandedStagingTableId = null;
    invalidateStagingConfirmation();
    renderAll(); setActiveTabViewOnly('staging');
    const extra = removedModelCount(removed) ? ` Removed ${modelRemovalSummary(removed)}.` : '';
    toastUndo(`Deselected all staging tables.${extra}`);
  });
  document.getElementById('btn-back-staging').addEventListener('click', ()=> navigateDesignerTab('tables'));
  document.getElementById('btn-confirm-staging').addEventListener('click', ()=>{
    if (!stagingHashColumnsReady()){
      toast(stagingHashRequirementMessage(), 'err');
      updateStagingConfirmationUi();
      return;
    }
    if (confirmStagingChanges()){
      renderAll(); setActiveTabViewOnly('staging');
      toast('Staging changes confirmed.', 'ok');
    }
  });
  document.getElementById('btn-next-staging').addEventListener('click', ()=>{
    if (!stagingHashColumnsReady()){
      toast(stagingHashRequirementMessage(), 'err');
      updateStagingConfirmationUi();
      return;
    }
    if (!stagingChangesConfirmed()){
      toast('Confirm the current staging changes before continuing.', 'err');
      updateStagingConfirmationUi();
      return;
    }
    navigateDesignerTab('vault');
  });
  if (tables.length){
    const list = document.getElementById('staging-tables');
    list.innerHTML = tables.map(t=>{
      const open = expandedStagingTableId===t.id;
      return `<div class="entity-card">
        <div class="ehead ${open?'open':''}" data-staging-toggle="${t.id}">
          <div class="ehead-left">
            <label class="checkbox-row" style="margin-right:2px;" title="Include in staging" onclick="event.stopPropagation();">
              <input type="checkbox" data-staging-include="${t.id}" checked>
            </label>
            <span class="entity-marker sat"></span>
            <span class="entity-name">${escapeHtml(t.name)}</span>
            <span class="entity-meta">→ staging.<span class="mono">${escapeHtml(stagingTableName(t.name))}</span> · ${stagedColumns(t).length} of ${t.columns.length} columns · ${t.derivations.length} key derivation(s)</span>
          </div>
          <span class="entity-meta">${open?'Collapse':'Expand'}</span>
        </div>
        <div class="entity-body ${open?'open':''}" id="stg-${t.id}"></div>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-staging-toggle]').forEach(head=>{
      head.addEventListener('click', e=>{
        if (e.target.closest('[data-staging-include]')) return;
        const id = head.dataset.stagingToggle;
        expandedStagingTableId = expandedStagingTableId===id ? null : id;
        renderAll(); setActiveTabViewOnly('staging');
      });
    });
    list.querySelectorAll('[data-staging-include]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const table = findTable(cb.dataset.stagingInclude);
        if (!table || cb.checked) return;
        pushUndo(`deselect staging table "${table.name}"`);
        table.included = false;
        const removed = pruneDownstreamModel({ dropExcluded:true });
        if (expandedStagingTableId===table.id) expandedStagingTableId = null;
        invalidateStagingConfirmation();
        renderAll(); setActiveTabViewOnly('staging');
        const extra = removedModelCount(removed) ? ` Removed ${modelRemovalSummary(removed)}.` : '';
        toastUndo(`Deselected "${table.name}" from staging.${extra}`);
      });
    });
    tables.forEach(t=>{
      if (expandedStagingTableId===t.id) renderStagingTable(document.getElementById('stg-'+t.id), t);
    });
  }
  updateStagingConfirmationUi();
}

function renderStagingTable(el, t){
  // Repair safe, same-source/same-output duplicates before the person sees
  // them. Genuine conflicts (different source keys targeting one alias) stay
  // visible and are still blocked by validation.
  repairForeignKeyDerivations(t);
  const isCustom = t.customOverride != null;
  el.innerHTML = `
    ${FEATURE_INCREMENTAL ? `<div class="grid cols-2">
      <div class="field checkbox-row" style="margin-top:22px;"><input type="checkbox" data-tf="incremental" ${t.incremental?'checked':''}><span>Incremental load</span></div>
      ${t.incremental ? `<div class="field"><label>Increment date column</label><input type="text" data-tf="incrementCol" value="${t.incrementCol}"></div>` : '<div></div>'}
    </div>` : ''}

    <div class="panel-head" style="margin:0 -14px 0;"><h3>Columns included in staging <span class="badge-count">&nbsp;·&nbsp;${stagedColumns(t).length} of ${t.columns.length}</span></h3></div>
    <p class="hint">Selected by default. Untick a source column only when its data should stop before staging; doing so also removes any Hub, Link or Satellite mappings that depend on it.</p>
    <div style="max-height:220px;overflow:auto;border:1px solid var(--border);border-radius:8px;">
      <table class="data" style="margin:0;">
        <tr><th style="width:70px;">Stage</th><th>Column</th><th>Type</th><th style="width:80px;">Key</th></tr>
        ${t.columns.map(c=>`<tr style="${isColumnStaged(c)?'':'opacity:.55;'}">
          <td><input type="checkbox" data-stage-col="${c.id}" ${isColumnStaged(c)?'checked':''}></td>
          <td class="mono">${escapeHtml(c.name)}</td><td>${escapeHtml(c.type)}</td><td>${c.pk?'<span class="tag">PK</span>':''}</td>
        </tr>`).join('')}
      </table>
    </div>

    <div class="panel-head" style="margin:16px -14px 0;"><h3>Key derivations</h3></div>
    <div class="panel" style="margin:10px 0 12px;padding:12px 14px;box-shadow:none;">
      <p class="hint" style="margin:0;line-height:1.55;"><b>How business keys are identified:</b> declared primary keys are used first; foreign keys identify relationships to other business entities; and composite keys stay together in source-column order. Column-name conventions are used only when the source has no declared foreign-key constraints. Detection is deterministic, requires no AI, and remains editable before confirmation.</p>
    </div>
    <p class="hint">Detected Hubs and Links in Step 4 can add required derivations automatically. Manual entries are available for special cases and satellites sourced from a different table.</p>
    <div id="deriv-rows-${t.id}"></div>
    <div class="deriv-row mt">
      <select id="drv-col-${t.id}"><option value="">source column…</option>${stagedColumns(t).map(c=>`<option value="${c.name}">${c.name}</option>`).join('')}</select>
      <input type="text" id="drv-entity-${t.id}" placeholder="target hub, e.g. customer">
      <input type="text" id="drv-role-${t.id}" placeholder="role, e.g. billing_customer">
      <span class="hint">Output is generated</span>
      <select id="drv-kind-${t.id}"><option value="hash">hash</option><option value="bk">business key</option><option value="both">both</option></select>
      <button class="btn small" id="btn-add-drv-${t.id}">+ Add</button>
    </div>

    <div class="grid cols-2 mt">
      <div>
        <div class="panel-head" style="margin:0 0 0 0;">
          <h3>Staging SQL override</h3>
          <span class="tag ${isCustom?'sat':''}" style="text-transform:none;">${isCustom?'custom':'auto-generated'}</span>
        </div>
        <textarea id="override-text-${t.id}" class="mono" style="min-height:160px;background:#20142b;color:#e7d9f0;border-color:var(--border);">${escapeHtml(isCustom ? t.customOverride : buildOverride(t))}</textarea>
        <div class="flex-between mt">
          <p class="hint mb0">Edits here become the exported <span class="mono">staging_sql_override</span>. Column inclusion is controlled above and remains authoritative; custom SQL should still return every selected structural column and derived key alias.</p>
          <button class="btn small ${isCustom?'':'ghost'}" id="btn-reset-override-${t.id}" ${isCustom?'':'disabled'}>↺ Reset to auto</button>
        </div>
      </div>
      <div>
        <div class="panel-head" style="margin:0 0 0 0;"><h3>Staging DDL</h3></div>
        <p class="hint">Matches source nullability; profiled blanks or nulls make that staging column nullable.</p>
        <pre class="code">${escapeHtml(ddlWithHashIndexes(`staging.${stagingTableName(t.name)}`, buildStagingColumns(t)))}</pre>
      </div>
    </div>
  `;
  wireStagingColumnToggles(el, t, 'staging');
  el.querySelectorAll('[data-tf]').forEach(inp=>{
    const key = inp.dataset.tf;
    inp.addEventListener('input', e=>{
      t[key] = inp.type==='checkbox' ? inp.checked : (inp.type==='number'? Number(e.target.value): e.target.value);
      invalidateStagingConfirmation();
      if (key==='incremental'){ renderAll(); setActiveTabViewOnly('staging'); }
      else { refreshStagingPreview(el, t); }
    });
  });
  renderDerivRows(el.querySelector('#deriv-rows-'+t.id), t, el);
  el.querySelector('#btn-add-drv-'+t.id).addEventListener('click', ()=>{
    const colEl=el.querySelector('#drv-col-'+t.id);
    const entityEl=el.querySelector('#drv-entity-'+t.id);
    const roleEl=el.querySelector('#drv-role-'+t.id);
    const kindEl=el.querySelector('#drv-kind-'+t.id);
    const result=addManualKeyDerivation(t,colEl.value,entityEl.value,roleEl.value,kindEl.value);
    if(!result.ok){ toast(result.reason.endsWith('.')?result.reason:`${result.reason}.`,'err'); return; }
    invalidateStagingConfirmation();
    renderDerivRows(el.querySelector('#deriv-rows-'+t.id),t,el);
    refreshStagingPreview(el,t);
    if(result.added){
      colEl.value=''; entityEl.value=''; roleEl.value=''; kindEl.value='hash';
      toast(`Added key derivation "${derivationOutputLabel(t,result.derivation)}".`,'ok');
    } else {
      toast(`That key derivation already exists; the existing row was reused.`,'ok');
    }
  });
  const overrideTextarea = el.querySelector('#override-text-'+t.id);
  overrideTextarea.addEventListener('input', e=>{
    t.customOverride = e.target.value;
    invalidateStagingConfirmation();
    const tag = el.querySelector('.tag');
    if (tag){ tag.textContent = 'custom'; tag.classList.add('sat'); }
    const resetBtn = el.querySelector('#btn-reset-override-'+t.id);
    if (resetBtn){ resetBtn.disabled = false; resetBtn.classList.remove('ghost'); }
  });
  el.querySelector('#btn-reset-override-'+t.id).addEventListener('click', ()=>{
    t.customOverride = null;
    renderAll(); setActiveTabViewOnly('staging');
    toast('Reverted to the auto-generated override.', 'ok');
  });
}

function refreshStagingPreview(el, t){
  // Only refresh the DDL preview live — the override textarea is user-owned
  // once edited, so re-rendering it on every keystroke elsewhere would fight
  // the person typing into it.
  const isCustom = t.customOverride != null;
  if (!isCustom){
    const ta = el.querySelector('textarea[id^="override-text-"]');
    if (ta && document.activeElement !== ta) ta.value = buildOverride(t);
  }
  const pre = el.querySelector('pre.code');
  if (pre) pre.textContent = ddlWithHashIndexes(`staging.${stagingTableName(t.name)}`, buildStagingColumns(t));
}
</script>

/* ---------------- EXTERNAL STORAGE (jdbc_fdw) — configured at the end of Connections ---------------- */
let externalPreflightResult = null;
let externalDeployResult = null;
let externalStorageBusy = false;

function externalCoreTableSpecs(){
  const out = [];
  (state.hubs||[]).forEach(h=>out.push({ family:'hub', name:hubName(h.entity), columns:hubColumns(h), keyColumn:hubKey(h.entity) }));
  (state.links||[]).forEach(l=>out.push({ family:'link', name:linkNameOf(l.entity), columns:linkColumns(l), keyColumn:linkKeyOf(l.entity) }));
  (state.hubSats||[]).forEach(s=>out.push({ family:'sat', name:satName(s.entity,s.concern), columns:hubSatColumns(s), keyColumn:'sat_key' }));
  (state.linkSats||[]).forEach(s=>out.push({ family:'lsat', name:lsatName(s.entity,s.concern), columns:linkSatColumns(s), keyColumn:'sat_key' }));
  return out;
}
function externalCoreTableNames(){ return externalCoreTableSpecs().map(x=>x.name); }
function externalCoreTableCount(){ return externalCoreTableSpecs().length; }
function externalDefaultPort(dialect){ return ({postgresql:'5432',mysql:'3306',sqlserver:'1433',oracle:'1521'})[dialect] || ''; }
function externalIdentifierIsSafe(value){ return /^[a-z_][a-z0-9_$]*$/i.test(String(value||'')); }

function parseJdbcUrlDefaults(url){
  const raw = String(url||'').trim();
  let m;
  if ((m=raw.match(/^jdbc:(postgresql|mysql):\/\/([^\/:;?]+)(?::(\d+))?\/([^?;]+)(?:[?;].*)?$/i))){
    const dialect=m[1].toLowerCase()==='postgresql'?'postgresql':'mysql';
    let schema='';
    const q=raw.split('?')[1]||'';
    const params={};
    q.split('&').filter(Boolean).forEach(pair=>{ const i=pair.indexOf('='); const k=decodeURIComponent(i<0?pair:pair.slice(0,i)); const v=decodeURIComponent(i<0?'':pair.slice(i+1)); params[k]=v; });
    schema=params.currentSchema||params.current_schema||'';
    return { dialect, host:m[2], port:m[3]||externalDefaultPort(dialect), database:decodeURIComponent(m[4]), schema };
  }
  if ((m=raw.match(/^jdbc:sqlserver:\/\/([^:;]+)(?::(\d+))?(?:;.*?databaseName=([^;]+))?/i))){
    return { dialect:'sqlserver', host:m[1], port:m[2]||'1433', database:m[3]||'', schema:'dbo' };
  }
  if ((m=raw.match(/^jdbc:oracle:thin:@\/?\/?([^:;\/]+)(?::(\d+))?[\/:]([^?;]+)$/i))){
    return { dialect:'oracle', host:m[1], port:m[2]||'1521', database:m[3]||'', schema:'' };
  }
  return null;
}

function syncExternalStudioConnection(force=false){
  const ext=state.externalTables;
  if (!force && ext.studioConnectionOverridden) return;
  const parsed=parseJdbcUrlDefaults(ext.url);
  if (parsed){
    ext.remoteDialect=parsed.dialect||ext.remoteDialect;
    ext.studioHost=ext.studioHost||parsed.host||'';
    ext.studioPort=ext.studioPort||parsed.port||'';
    ext.studioDatabase=ext.studioDatabase||parsed.database||'';
    ext.studioSchema=ext.studioSchema||parsed.schema||ext.remoteSchema||'';
    ext.remoteDatabase=ext.remoteDatabase||parsed.database||'';
    ext.remoteSchema=ext.remoteSchema||parsed.schema||'';
  }
  if (isDemoRuntime()){
    ext.studioUser=String(state.vault.srcUser||'');
    ext.studioPassword=String(state.vault.srcPassword||'');
  } else {
    ext.studioUser=String(ext.studioUser||ext.username||'');
    ext.studioPassword=String(ext.studioPassword||ext.password||'');
  }
  ext.username=ext.studioUser;
  ext.password=ext.studioPassword;
}

function externalConnectionPayload(databaseOverride){
  const ext=state.externalTables;
  const targetUser=String(ext.studioUser||ext.username||'');
  const targetPassword=String(ext.studioPassword||ext.password||'');
  ext.studioUser=targetUser; ext.username=targetUser;
  ext.studioPassword=targetPassword; ext.password=targetPassword;
  return {
    dialect:ext.remoteDialect,
    host:ext.studioHost,
    port:ext.studioPort||externalDefaultPort(ext.remoteDialect),
    database:databaseOverride===undefined?ext.studioDatabase:databaseOverride,
    schema:ext.studioSchema||ext.remoteSchema,
    user:targetUser,
    password:targetPassword,
  };
}

async function verifyExternalTargetUserAccess(checks){
  const ext=state.externalTables;
  const result=await externalApi('/api/external-verify-user-access',externalConnectionPayload(ext.studioDatabase||ext.remoteDatabase));
  if(ext.remoteDialect==='sqlserver'){
    const selected=String(ext.studioSchema||ext.remoteSchema||'dbo').toLowerCase();
    const actual=String(result.defaultSchema||'').toLowerCase();
    // jdbc_fdw addresses the remote table by its unqualified local foreign
    // table name. SQL Server therefore resolves it through the mapped login's
    // default schema; a different selected schema would deploy successfully
    // but fail when Hop opens the foreign table.
    if(actual && actual!==selected){
      throw new Error(`SQL Server login ${result.currentUser||ext.studioUser||ext.username} has default schema ${result.defaultSchema}, but the physical target is configured for ${ext.studioSchema||ext.remoteSchema||'dbo'}. Use that default schema or ask an administrator to change the login user's default schema.`);
    }
  }
  checks.push({level:'ok',label:'3 · Physical target account',detail:`${result.currentUser||ext.studioUser||ext.username} opened ${ext.studioDatabase||ext.remoteDatabase}${result.defaultSchema?` with default schema ${result.defaultSchema}`:''}; this target credential will be stored in both PostgreSQL user mappings`});
}
function externalStatusHtml(result){
  if (!result) return '';
  const rows=(result.checks||[]).map(c=>`<div class="ai-status ${c.level==='ok'?'ok':c.level==='fatal'?'err':''} mt" style="align-items:flex-start;"><span><b>${escapeHtml(c.label)}:</b> ${escapeHtml(c.detail)}</span></div>`).join('');
  return rows + (result.message?`<div class="ai-status ${result.ok?'ok':'err'} mt"><span>${escapeHtml(result.message)}</span></div>`:'');
}

      <div class="grid cols-2 mt">

      <div class="panel" style="margin:16px 0 0;padding:14px;box-shadow:none;">
        <label class="mb0">Role mappings</label>
        <p class="hint">The physical target credential entered above is mapped to both PostgreSQL runtime roles.</p>
        <div class="grid cols-2">
          <div class="field"><label>Mapped target username</label><input type="text" value="${escapeHtml(ext.username)}" readonly></div>

    <div class="ai-status busy mt" style="align-items:flex-start;"><span><b>Deployment remains on Export.</b> <span class="mono">Check status</span> and <span class="mono">Apply all updates</span> create the physical target first, then configure the FDW server, role mappings and foreign-table bindings.</span></div>

    </details>
  `;

  if(!demo){
    const bind=(id,key)=>{
      const node=el.querySelector('#'+id); if(!node)return;
      node.addEventListener('input',e=>{
        ext[key]=e.target.value;
        ext.deploymentAcknowledged=false;
        externalPreflightResult=null;

        if(id==='ext-url'){

        refreshExtPreview(el);
      });
    };
    bind('ext-servername','serverName'); bind('ext-drivername','drivername');
    bind('ext-url','url'); bind('ext-jarfile','jarfile'); bind('ext-querytimeout','querytimeout'); bind('ext-maxheapsize','maxheapsize');
  }
  refreshExtPreview(el);
}
function refreshExtPreview(el){

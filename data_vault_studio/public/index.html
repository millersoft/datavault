<div id="toast-wrap"></div>

<div class="topbar">
  <a class="brand" href="https://millersoft.co/data-vault-services" target="_blank" rel="noopener" title="Millersoft — Data Vault services &amp; support">
    <img class="brand-mark-logo" src="https://millersoft.co/img/data-vault/dvs-header-image.png" alt="Millersoft" referrerpolicy="no-referrer-when-downgrade">
    <div class="brand-sub" style="margin-left:10px;">Data Vault Studio</div>
  </a>
  <div class="topbar-actions">
    <span class="topbar-links">
      <a href="https://millersoft.co/data-vault-services" target="_blank" rel="noopener">Support</a>
    </span>
    <span class="legend">
      <span><span class="sw hub"></span>hub</span>
      <span><span class="sw link"></span>link</span>
      <span><span class="sw sat"></span>satellite</span>
    </span>
    <label class="theme-switch" title="Switch between light and dark mode">
      <span class="theme-switch-icon">☼</span>
      <input type="checkbox" id="theme-switch-input">
      <span class="theme-switch-track"><span class="theme-switch-thumb"></span></span>
      <span class="theme-switch-icon">☾</span>
    </label>
    <span id="topbar-project-actions">
      <button class="btn small ghost" id="btn-new-project">New project</button>
      <button class="btn small" id="btn-save-project">Save project</button>
      <button class="btn small" id="btn-load-project">Load project</button>
      <button class="btn small" id="btn-import-hopper">Import Hopper</button>
      <input type="file" id="file-load-project" accept=".json" style="display:none;">
    </span>
  </div>
</div>

<div class="mode-switch" id="mode-switch">
  <button class="mode-btn" id="mode-home">Home</button>
  <button class="mode-btn active" id="mode-designer">Designer</button>
  <button class="mode-btn" id="mode-dashboard">Data Vault Hub</button>
  <button class="mode-btn" id="mode-studioplus">Studio Plus</button>
